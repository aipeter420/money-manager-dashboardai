 * ============================================================ */
/* ============================================================
 * DASHBOARD — one consolidated `dashboard-full` call (see apiDashboardFull_
 * in the .gs backend) instead of the 6 separate requests this used to make.
 *
 * Frontend cache (stale-while-revalidate): the last successful payload is
 * kept in DASH_CACHE. Re-opening the tab renders instantly from that cache
 * with no loading state at all, then quietly refetches in the background and
 * re-renders when the fresh data arrives — the person sees last-known numbers
 * immediately instead of a spinner every time they tap "ภาพรวม".
 * ============================================================ */
let DASH_CACHE = null;

async function renderDashboard() {
  const el = document.getElementById('tab-dashboard');
  if (DASH_CACHE) {
    renderDashboardFromData(DASH_CACHE);
  } else {
    el.innerHTML = dashboardSkeleton();
  }
  try {
    const resp = await apiGet('dashboard-full');
    if (!resp.success) throw new Error(resp.error);
    DASH_CACHE = resp.data;
    renderDashboardFromData(resp.data);
  } catch (e) {
    if (!DASH_CACHE) {
      el.innerHTML = errorBlock();
      toast('โหลดภาพรวมไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
    }
    // Otherwise: stale cached data is already on screen — leave it up rather
    // than replacing a working view with an error banner over a background
    // refresh hiccup (e.g. a flaky connection). The next tab visit retries.
  }
}

/* ============================================================
 * MONTH RANGES + BULK TRANSACTION FETCH
 * (shared by the budget detail view, month comparison, and the
 * "needs attention" card — none of these have a dedicated backend
 * endpoint, so they're computed here from the existing transactions
 * API by pulling a date range and aggregating client-side.)
 * ============================================================ */
function monthRange(offset) {
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() + offset);
  const ym = d.toISOString().slice(0, 7);
  const from = ym + '-01';
  const endD = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  const to = endD.toISOString().slice(0, 10);
  const label = d.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
  return { ym, from, to, label };
}

/** Pages through the transactions endpoint until it has everything matching params (capped for safety). */
async function fetchAllTransactions(params, maxPages) {
  maxPages = maxPages || 20;
  const pageSize = 200;
  let page = 1, all = [], total = Infinity;
  while (all.length < total && page <= maxPages) {
    const resp = await apiGet('transactions', Object.assign({}, params, { page: page, pageSize: pageSize }));
    if (!resp.success) throw new Error(resp.error || 'โหลดรายการไม่สำเร็จ');
    const items = (resp.data && resp.data.items) || [];
    all = all.concat(items);
    total = Number((resp.data && resp.data.total) || all.length);
    if (items.length === 0) break;
    page++;
  }
  return all;
}

/* ============================================================
 * BUDGET ALERT STATUS
 * 🟢 <70% ปกติ · 🟡 70–89% ใกล้เต็ม · 🔴 90–99% ต้องระวัง · ⛔ 100%+ เกินงบ
 * ============================================================ */
function budgetStatusMeta(pct) {
  pct = Number(pct) || 0;
  if (pct >= 100) return { emoji: '⛔', label: 'เกินงบ', cls: 'over' };
  if (pct >= 90) return { emoji: '🔴', label: 'ต้องระวัง', cls: 'critical' };
  if (pct >= 70) return { emoji: '🟡', label: 'ใกล้เต็ม', cls: 'warning' };
  return { emoji: '🟢', label: 'ปกติ', cls: 'normal' };
}
function budgetIconClass(cls) {
  return cls === 'over' || cls === 'critical' ? 'expense' : (cls === 'warning' ? 'warn' : 'income');
}

/* ============================================================
 * MONTH-OVER-MONTH COMPARISON — pure transform, no network call.
 * Fed from `data.comparison` in the single `dashboard-full` response.
 * ============================================================ */
function monthComparisonToView(comparisonData) {
  const cur = comparisonData.current || {}, prev = comparisonData.previous || {};
  const curByCat = cur.byCategory || {}, prevByCat = prev.byCategory || {};
  const cats = Array.from(new Set([...Object.keys(curByCat), ...Object.keys(prevByCat)]));
  const deltas = cats.map(c => {
    const c1 = Number(curByCat[c] || 0), c0 = Number(prevByCat[c] || 0);
    return { category: c, cur: c1, prev: c0, delta: c1 - c0 };
  }).sort((a, b) => b.delta - a.delta);
  return { curTotal: Number(cur.total || 0), prevTotal: Number(prev.total || 0), deltas: deltas, curLabel: cur.label || '', prevLabel: prev.label || '' };
}

function renderMonthComparisonCard(cmp) {
  const delta = cmp.curTotal - cmp.prevTotal;
  const pct = cmp.prevTotal > 0 ? Math.round(Math.abs(delta) / cmp.prevTotal * 100) : (cmp.curTotal > 0 ? 100 : 0);
  const up = delta > 0;
  const movers = cmp.deltas.filter(d => Math.abs(d.delta) > 0).slice(0, 3);
  return `
    <div class="dash-section">
      <div class="dash-section-title"><h3>📅 เปรียบเทียบเดือน</h3></div>
      <div class="cmp-grid">
        <div class="cmp-box">
          <div class="cmp-label">${escapeHtml(cmp.curLabel)}</div>
          <div class="cmp-amount">฿${fmt(cmp.curTotal)}</div>
        </div>
        <div class="cmp-box">
          <div class="cmp-label">${escapeHtml(cmp.prevLabel)}</div>
          <div class="cmp-amount" style="color:var(--muted);">฿${fmt(cmp.prevTotal)}</div>
        </div>
      </div>
      ${delta === 0 ? '' : `
      <div class="cmp-delta ${up ? 'up' : 'down'}">
        ${up ? '🔴 เพิ่มขึ้น' : '🟢 ลดลง'} ${pct}% (฿${fmt(Math.abs(delta))})
      </div>`}
      ${movers.length ? `
        <div class="dash-click-hint" style="margin:10px 0 2px;">หมวดที่เปลี่ยนแปลงมากที่สุด — แตะเพื่อดูรายการเดือนนี้</div>
        <div class="spend-list">
          ${movers.map(m => `
            <div class="attn-item" onclick="goDashboardFilter('expense','${escapeJs(m.category)}')">
              <span class="attn-icon">${m.delta > 0 ? '📈' : '📉'}</span>
              <span class="attn-text">${escapeHtml(m.category)}</span>
              <span style="font-weight:700;white-space:nowrap;color:${m.delta > 0 ? '#F2545B' : 'var(--income)'};">${m.delta > 0 ? '+' : ''}฿${fmt(m.delta)}</span>
            </div>`).join('')}
        </div>` : ''}
    </div>`;
}

/* ============================================================
 * "ต้องจัดการ" — NEEDS ATTENTION CARD — pure transform, no network call.
 * Fed from `data.attention` in the single `dashboard-full` response.
 * ============================================================ */
let LAST_DUPLICATE_GROUPS = [];

function attentionItemToUi(it) {
  let onClick = "switchTab('dashboard')";
  if (it.type === 'budget') onClick = "switchTab('budget')";
  else if (it.type === 'pending') onClick = "goDashboardFilter('','',{status:'pending'})";
  else if (it.type === 'lowBalance') onClick = "switchTab('accounts')";
  else if (it.type === 'highSpendToday') onClick = `goDashboardFilter('expense','',{dateFrom:'${escapeJs(it.date||'')}',dateTo:'${escapeJs(it.date||'')}'})`;
  else if (it.type === 'duplicate') {
    // Stash the actual groups (not JSON-embeddable in an inline onclick string)
    // so the click opens a view of exactly these transactions, instead of
    // dumping the person into the full, unfiltered transaction history.
    LAST_DUPLICATE_GROUPS = it.groups || [];
    onClick = "openDuplicatesUI()";
  }
  else if (it.type === 'debtOverdue' || it.type === 'debtDueSoon') onClick = "switchTab('debt')";
  else if (it.type === 'recurringDueSoon') onClick = "switchTab('settings')";
  return { icon: it.icon || 'ℹ️', text: escapeHtml(it.text || ''), onClick: onClick };
}

/** Shows exactly the transactions flagged as possible duplicates (same date +

  if (document.getElementById('duplicatesOverlay')) return;

        รายการในกลุ่มเดียวกันมีวันที่ จำนวนเงิน และหมวดตรงกัน — ถ้าเป็นการบันทึกซ้ำจริง ให้กด "ยกเลิก" รายการที่ซ้ำ
      </p>

  groups.forEach(g => g.forEach(t => { TX_STATE.itemsById = TX_STATE.itemsById || {}; TX_STATE.itemsById[t.ID] = t; }));

function escapeJs(s) {
  return String(s || '').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,' ');
}

function goDashboardFilter(type, search, extra) {
  extra = extra || {};
  TX_STATE.page = 1;
  TX_STATE.filters = {
    search: search || '',
    type: type || '',
    status: extra.status || '',
    dateFrom: extra.dateFrom || '',
    dateTo: extra.dateTo || ''
  };
  switchTab('transactions');
  setTimeout(() => {
    const s = document.getElementById('fSearch');
    const t = document.getElementById('fType');
    const st = document.getElementById('fStatus');
    const f = document.getElementById('fFrom');
    const to = document.getElementById('fTo');
    if (s) s.value = search || '';
    if (t) t.value = type || '';
    if (st) st.value = extra.status || '';
    if (f) f.value = extra.dateFrom || '';
    if (to) to.value = extra.dateTo || '';
    // Reveal the advanced-filter panel when we're jumping in with a status/date
    // filter already applied, so the user can see (and adjust) what's active.
    if (extra.status || extra.dateFrom || extra.dateTo) {
      const panel = document.getElementById('advancedFilters');
      const btn = document.getElementById('filterToggleBtn');
      if (panel) panel.style.display = 'flex';
      if (btn) btn.classList.add('has-active');
    }
  }, 80);
}

    const search = escapeJs(t.Category || t.Description || t.Merchant || '');
    return `
      <div class="tx-row" onclick="goDashboardFilter('${escapeJs(type)}','${search}')" style="cursor:pointer;">

          <div class="tx-date">${escapeHtml(t.TransactionDate || '')}</div>

function drawPieChartInteractive(canvasId, dataObj, type) {
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  const labels = Object.keys(dataObj || {});
  if (labels.length === 0) {
    ctx.parentElement.innerHTML = '<div class="empty" style="padding:20px;">ยังไม่มีข้อมูล</div>';
    return;
  }
  const values = labels.map(l => Number(dataObj[l]) || 0);
  const palette = ['#C7F464','#0B1220','#F2545B','#F2A93B','#4C6EF5','#22304F','#B0587E','#3E7C8C']; // lime leads, matching --mint/--blue tokens above
  STATE.charts[canvasId] = new Chart(ctx, {
    type: 'doughnut',
    data: { labels: labels, datasets: [{ data: values, backgroundColor: palette }] },
    options: {
      responsive:true,
      maintainAspectRatio:false,
      plugins:{ legend:{position:'bottom', labels:{boxWidth:10,font:{size:10}}} },
      onClick: function(evt, elements) {
        if (!elements || !elements.length) return;
        const idx = elements[0].index;
        const label = labels[idx];
        goDashboardFilter(type || '', label);
      }
    }
  });
}

  const t = (TX_STATE.itemsById || {})[txId];

  // ever having visited the "บัญชี" tab first, so fetch it if it's not there yet.

async function submitEditTx(txId) {
  const category = document.getElementById('editTxCategory').value;
  const description = document.getElementById('editTxDescription').value.trim();
  const accountSel = document.getElementById('editTxAccount');
  const newAccountId = accountSel ? accountSel.value : null;
  const btn = document.getElementById('editTxSaveBtn');
  const prevLabel = btn ? btn.textContent : '';
  if (btn) { btn.textContent = 'กำลังบันทึก...'; btn.disabled = true; }
  try {
    const changes = { Category: category, Description: description };
    if (newAccountId) changes.AccountID = newAccountId;
    const resp = await apiPost('edit-transaction', { id: txId, changes: changes });
    if (!resp.success) throw new Error(resp.error);
    toast('บันทึกการแก้ไขแล้ว', 'success');
    DASH_CACHE = null; // category/description/account feed dashboard breakdowns & balances
    TX_CACHE = {}; // cached list HTML would still show the old category/description
    BUDGET_CACHE = {}; // moving a confirmed transaction to another account can shift budget usage too
    closeEditTxUI();
    // Patch the row in place instead of re-skeletoning the whole list — only
    // a couple of fields changed, so nothing else on screen needs to move.
    const rowEl = txRowEl(txId);
    if (rowEl) {
      const catEl = rowEl.querySelector('.tx-cat');
      const descEl = rowEl.querySelector('.tx-desc');
      if (catEl) catEl.textContent = category;
      if (descEl) descEl.textContent = description || typeLabel((TX_STATE.itemsById[txId] || {}).Type);
      if (TX_STATE.itemsById[txId]) {
        TX_STATE.itemsById[txId].Category = category;
        TX_STATE.itemsById[txId].Description = description;
        if (newAccountId) TX_STATE.itemsById[txId].AccountID = newAccountId;
      }
    } else {
      loadTransactions();
    }
  } catch (e) {
    toast('แก้ไขไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
    if (btn) { btn.textContent = prevLabel; btn.disabled = false; }
  }
}

/** Rendered-list cache keyed by the exact query (filters+page), so returning
 *  to a filter/page you've already seen shows it instantly while a fresh
 *  fetch runs quietly behind it (stale-while-revalidate, same idea as
 *  DASH_CACHE). Cleared whenever a transaction is confirmed/cancelled/edited,
 *  since a cached list could otherwise show a stale status badge. */
let TX_CACHE = {};
function txCacheKey(params) {
  return JSON.stringify({ search: params.search||'', type: params.type||'', status: params.status||'', dateFrom: params.dateFrom||'', dateTo: params.dateTo||'', page: params.page });
}

async function loadTransactions() {
  const wrap = document.getElementById('txTableWrap');
  const params = Object.assign({}, TX_STATE.filters, { page: TX_STATE.page, pageSize: TX_STATE.pageSize });
  const key = txCacheKey(params);
  if (TX_CACHE[key]) {
    // Seen this exact filter+page before — show it immediately, no skeleton,
    // while the fetch below quietly confirms/refreshes it.
    wrap.innerHTML = TX_CACHE[key];
  } else {
    // Skeleton rows instead of wiping the whole panel with a spinner — every
    // filter change and page click used to trigger a full-panel loading state;
    // this only replaces the rows themselves, so the filter/search bar above
    // stays interactive and nothing else on the tab flickers.
    wrap.innerHTML = txRowsSkeleton(TX_STATE.pageSize > 6 ? 6 : TX_STATE.pageSize);
  }
  try {
    const resp = await apiGet('transactions', params);
    if (!resp.success) throw new Error(resp.error);
    const items = resp.data.items;
    TX_STATE.itemsById = {};
    items.forEach(t => { TX_STATE.itemsById[t.ID] = t; });
    if (items.length === 0) { TX_CACHE[key] = emptyState(); wrap.innerHTML = TX_CACHE[key]; return; }
    let rows = renderTxRows(items);
    const totalPages = Math.max(1, Math.ceil(resp.data.total / resp.data.pageSize));
    const html = `
      <div>${rows}</div>
      <div class="pagination">
        <button class="secondary" onclick="txPrevPage()" ${TX_STATE.page<=1?'disabled':''}>← ก่อนหน้า</button>
        <span style="align-self:center;font-size:13px;color:var(--muted);">หน้า ${TX_STATE.page} / ${totalPages}</span>
        <button class="secondary" onclick="txNextPage()" ${TX_STATE.page>=totalPages?'disabled':''}>ถัดไป →</button>
      </div>
    `;
    TX_CACHE[key] = html;
    wrap.innerHTML = html;
  } catch (e) {
    if (!TX_CACHE[key]) {
      wrap.innerHTML = errorBlock();
      toast('โหลดรายการไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
    }
    // Otherwise: stale cached rows are already on screen — leave them rather
    // than replacing a working list with an error banner over one failed refresh.
  }
}
function txPrevPage(){ if(TX_STATE.page>1){TX_STATE.page--; loadTransactions();} }
function txNextPage(){ TX_STATE.page++; loadTransactions(); }

/** Skeleton rows mirroring a real tx-row's shape, shown while a list (re)loads. */
function txRowsSkeleton(n) {
  let out = '';
  for (let i = 0; i < n; i++) {
    out += `
      <div class="tx-row" style="pointer-events:none;">
        <div class="skel skel-block" style="width:38px;height:38px;border-radius:12px;flex-shrink:0;"></div>
        <div class="tx-mid" style="gap:6px;display:flex;flex-direction:column;">
          <div class="skel skel-line" style="width:${100 + (i % 3) * 30}px;height:13px;"></div>
          <div class="skel skel-line" style="width:70px;height:11px;"></div>
        </div>
        <div class="tx-right" style="gap:6px;display:flex;flex-direction:column;align-items:flex-end;">
          <div class="skel skel-line" style="width:60px;height:13px;"></div>
          <div class="skel skel-line" style="width:80px;height:11px;"></div>
        </div>
      </div>`;
  }
  return out;
}

/** Finds a rendered row by transaction ID for in-place (optimistic) updates. */
function txRowEl(id) {
  const safe = (window.CSS && CSS.escape) ? CSS.escape(id) : id;
  return document.querySelector(`.tx-row[data-tx-id="${safe}"]`);
}

/** Fades a row out and removes it — used when an action makes a row no longer
 *  match the active filter (e.g. confirming a transaction while filtered to
 *  "รอยืนยัน"), so the list updates in place instead of a full reload. */
function removeTxRowFromView(id) {
  const rowEl = txRowEl(id);
  if (!rowEl) return;
  rowEl.style.transition = 'opacity .18s ease, max-height .18s ease .1s';
  rowEl.style.maxHeight = rowEl.offsetHeight + 'px';
  rowEl.style.overflow = 'hidden';
  requestAnimationFrame(() => { rowEl.style.opacity = '0'; rowEl.style.maxHeight = '0px'; });
  setTimeout(() => {
    rowEl.remove();
    const wrap = document.getElementById('txTableWrap');
    if (wrap && !wrap.querySelector('.tx-row')) wrap.innerHTML = emptyState();
  }, 300);
}

async function confirmTx(id) {
  const rowEl = txRowEl(id);
  // The confirm button now lives in the detail popup (openTxDetail), not on the
  // list row itself — grab it there if that's where this was triggered from.
  const btn = document.getElementById('txDetailConfirmBtn');
  if (btn) { btn.textContent = 'กำลังยืนยัน...'; btn.disabled = true; }
  try {
    let resp = await apiPost('confirm-transaction', { id: id });
    if (!resp.success && resp.error === 'กรุณาเลือกบัญชีก่อนยืนยันรายการนี้') {
      // The AI never matched a real account for this one — ask the person which
      // account it actually came out of, instead of guessing.
      if (btn) { btn.textContent = 'ยืนยัน'; btn.disabled = false; }
      const accountId = await pickAccount();
      if (!accountId) return; // they cancelled the picker
      if (btn) { btn.textContent = 'กำลังยืนยัน...'; btn.disabled = true; }
      resp = await apiPost('confirm-transaction', { id: id, accountId: accountId });
    }
    if (!resp.success) throw new Error(resp.error || 'เกิดข้อผิดพลาด');
    toast('ยืนยันรายการเรียบร้อยแล้ว', 'success');
    DASH_CACHE = null; // balances changed — don't show the dashboard's stale cached numbers next visit
    TX_CACHE = {}; // this transaction's status/badge changed — drop cached list renders
    BUDGET_CACHE = {}; // confirming/cancelling changes a category's UsedAmount/%
    if (TX_STATE.itemsById && TX_STATE.itemsById[id]) {
      TX_STATE.itemsById[id].Status = 'confirmed';
      if (resp.data && resp.data.AccountID) TX_STATE.itemsById[id].AccountID = resp.data.AccountID;
    }
    closeTxDetail();
    if (TX_STATE.filters.status === 'pending') {
      removeTxRowFromView(id);
    } else if (rowEl) {
      const badge = rowEl.querySelector('.badge');
      if (badge) { badge.className = 'badge confirmed'; badge.textContent = statusLabel('confirmed'); }
    }
  } catch (e) {
    if (btn) { btn.textContent = 'ยืนยัน'; btn.disabled = false; }
    toast('ยืนยันรายการไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  }
}

    if (!resp.success) throw new Error(resp.error || 'เกิดข้อผิดพลาด');
    toast('ยกเลิกรายการเรียบร้อยแล้ว', 'success');
    DASH_CACHE = null; // balances changed — don't show the dashboard's stale cached numbers next visit
    TX_CACHE = {}; // this transaction's status/badge changed — drop cached list renders
    BUDGET_CACHE = {}; // confirming/cancelling changes a category's UsedAmount/%
    if (TX_STATE.itemsById && TX_STATE.itemsById[id]) TX_STATE.itemsById[id].Status = 'cancelled';
    closeTxDetail();
    if (TX_STATE.filters.status && TX_STATE.filters.status !== 'cancelled') {

/** Downscales + re-encodes the photo client-side before it goes over the wire —
 *  a raw phone-camera photo can be 5-10MB, which is slow to upload and slow for
 *  the backend's AI vision call; ~1280px/JPEG-0.82 is plenty for reading a slip. */
function compressImageToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('เปิดรูปไม่สำเร็จ'));
      img.onload = () => {
        const maxDim = 1280;
        let width = img.width, height = img.height;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
        resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handleSlipUpload(inputEl) {
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;
  const statusEl = document.getElementById('ctxSlipStatus');
  statusEl.textContent = 'กำลังอ่านสลิป...';
  try {
    const { base64, mimeType } = await compressImageToBase64(file);
    const resp = await apiPost('parse-slip', { image: base64, mimeType: mimeType });
    if (!resp.success) throw new Error(resp.error || 'อ่านสลิปไม่สำเร็จ');
    CREATE_TX_STATE.slipUrl = resp.data.slipUrl || '';
    CREATE_TX_STATE.slipFileId = resp.data.slipFileId || '';
    CREATE_TX_STATE.slipRefNumber = (resp.data.ai && resp.data.ai.referenceNumber) || '';
    if (resp.data.duplicateWarning) {
      // Same slip already recorded elsewhere (e.g. sent to the LINE bot earlier) —
      // warn loudly before the person re-submits it, but still let the form fill
      // in so they can review/decide for themselves rather than being blocked.
      const dup = resp.data.duplicateWarning;
      statusEl.innerHTML = `⚠️ <strong>สลิปนี้เคยถูกบันทึกไปแล้ว</strong> (รายการ ${escapeHtml(dup.transactionId)}, ${escapeHtml(dup.date)}, ฿${fmt(dup.amount)}, สถานะ: ${escapeHtml(statusLabel(dup.status))}) — ถ้ากดบันทึกต่อจะถูกปฏิเสธ`;
      statusEl.style.color = '#F2545B';
    } else if (resp.data.parsed && resp.data.ai) {
      applySlipAiToForm(resp.data.ai);
      statusEl.textContent = '✓ อ่านสลิปสำเร็จ — กรุณาตรวจสอบข้อมูลก่อนบันทึก';
      statusEl.style.color = '';
    } else {
      const reason = resp.data.aiError ? ' — ' + resp.data.aiError : '';
      statusEl.textContent = '⚠️ แนบรูปแล้ว แต่ AI อ่านข้อมูลอัตโนมัติไม่สำเร็จ' + reason + ' กรุณาตรวจสอบ/กรอกเอง';
      statusEl.style.color = '#F59E0B';
    }
  } catch (e) {
    statusEl.textContent = '';
    toast('อ่านสลิปไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  }
}

/** AI can only read what's on the slip — for a transfer it knows this side's
 *  account at best, never which of the user's other accounts received it, so
 *  only "จากบัญชี" gets a guess; "ไปบัญชี" is always left for the user to pick. */
function guessAccountId(accountHint) {
  if (!accountHint) return '';
  const accs = STATE.accounts || [];
  let m = accs.find(a => a.AccountName === accountHint);
  if (m) return m.AccountID;
  const typeMap = { 'เงินสด': 'cash', 'ธนาคาร': 'bank', 'บัตร': 'card', 'Wallet': 'wallet' };
  const t = typeMap[accountHint];
  if (t) { m = accs.find(a => a.AccountType === t); if (m) return m.AccountID; }
  return '';
}

function applySlipAiToForm(ai) {
  if (ai.type && ['expense', 'income', 'transfer'].indexOf(ai.type) !== -1) setCreateTxType(ai.type);
  if (ai.amount) document.getElementById('ctxAmount').value = ai.amount;
  if (ai.date) document.getElementById('ctxDate').value = ai.date;
  if (ai.time) document.getElementById('ctxTime').value = ai.time;
  if (ai.description) document.getElementById('ctxDescription').value = ai.description;
  else if (ai.merchant) document.getElementById('ctxDescription').value = ai.merchant;
  if (ai.merchant) document.getElementById('ctxMerchant').value = ai.merchant;
  const guess = guessAccountId(ai.account);
  if (CREATE_TX_STATE.type === 'transfer') {
    if (guess) document.getElementById('ctxFromAccount').value = guess;
  } else {
    if (ai.category) {
      const sel = document.getElementById('ctxCategory');
      if (Array.from(sel.options).some(o => o.value === ai.category)) sel.value = ai.category;
    }
    if (guess) document.getElementById('ctxAccount').value = guess;
  }
}

async function submitCreateTx() {
  const type = CREATE_TX_STATE.type;
  const amount = Number(document.getElementById('ctxAmount').value || 0);
  const date = document.getElementById('ctxDate').value;
  const time = document.getElementById('ctxTime').value;
  const description = document.getElementById('ctxDescription').value.trim();
  const merchant = document.getElementById('ctxMerchant').value.trim();
  if (!amount || amount <= 0) { toast('กรุณาระบุจำนวนเงินให้ถูกต้อง', 'warn'); return; }

  const body = { type: type, amount: amount, date: date, time: time, description: description, merchant: merchant, slipUrl: CREATE_TX_STATE.slipUrl, slipFileId: CREATE_TX_STATE.slipFileId, slipRefNumber: CREATE_TX_STATE.slipRefNumber };
  if (type === 'transfer') {
    body.fromAccountId = document.getElementById('ctxFromAccount').value;
    body.toAccountId = document.getElementById('ctxToAccount').value;
    if (!body.fromAccountId || !body.toAccountId) { toast('กรุณาเลือกบัญชีต้นทางและปลายทาง', 'warn'); return; }
    if (body.fromAccountId === body.toAccountId) { toast('บัญชีต้นทางและปลายทางต้องไม่ใช่บัญชีเดียวกัน', 'warn'); return; }
  } else {
    body.category = document.getElementById('ctxCategory').value;
    body.accountId = document.getElementById('ctxAccount').value;
    if (!body.category) { toast('กรุณาเลือกหมวดหมู่', 'warn'); return; }
    if (!body.accountId) { toast('กรุณาเลือกบัญชี', 'warn'); return; }
  }

  const btn = document.getElementById('ctxSaveBtn');
  const prevLabel = btn.textContent;
  btn.textContent = 'กำลังบันทึก...'; btn.disabled = true;
  try {
    const resp = await apiPost('create-transaction', body);
    if (!resp.success) throw new Error(resp.error || 'บันทึกไม่สำเร็จ');

    // If they checked "ตั้งเป็นรายการประจำ", also save a recurring template —
    // this is a best-effort second call: if it fails, the transaction they
    // actually asked to save is already safely recorded, so we warn rather
    // than treating the whole save as failed.
    const isRecurringEl = document.getElementById('ctxIsRecurring');
    if (isRecurringEl && isRecurringEl.checked && type !== 'transfer') {
      const dayOfMonth = Number(document.getElementById('ctxRecurringDay').value || 0);
      if (!dayOfMonth) {
        toast('บันทึกรายการแล้ว แต่ยังไม่ได้ตั้งเป็นรายการประจำ เพราะไม่ได้ระบุวันที่รัน', 'warn');
      } else {
        try {
          const recResp = await apiPost('create-recurring', {
            name: description || body.category, type: type, amount: amount,
            category: body.category, accountId: body.accountId, dayOfMonth: dayOfMonth
          });
          if (!recResp.success) throw new Error(recResp.error);
        } catch (recErr) {
          toast('บันทึกรายการแล้ว แต่ตั้งเป็นรายการประจำไม่สำเร็จ: ' + (recErr && recErr.message ? recErr.message : recErr), 'warn');
        }
      }
    }

    toast('เพิ่มรายการเรียบร้อยแล้ว', 'success');
    DASH_CACHE = null; TX_CACHE = {}; BUDGET_CACHE = {};
    closeCreateTxUI();
    refreshVisibleTab();
  } catch (e) {
    toast('เพิ่มรายการไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
    btn.textContent = prevLabel; btn.disabled = false;
  }
}

/** Re-renders whichever tab panel is currently on screen — used after an
 *  action (like adding a transaction) that could affect several tabs' data,
 *  without refreshing tabs the person isn't even looking at. */
function refreshVisibleTab() {
  const visible = id => { const e = document.getElementById(id); return e && e.style.display !== 'none'; };
  if (visible('tab-dashboard')) renderDashboard();
  else if (visible('tab-transactions')) loadTransactions();
  else if (visible('tab-accounts')) renderAccounts();
  else if (visible('tab-budget')) renderBudget();
}

let BUDGET_STATE = { items: [], month: '' };
/** Same stale-while-revalidate idea as TX_CACHE/DASH_CACHE, keyed by month.
 *  Caches the items array alongside the HTML so openBudgetDetailByIndex's
 *  index lookups stay correct even while showing a cached render. */
let BUDGET_CACHE = {};

async function loadBudgets(month) {
  const wrap = document.getElementById('budgetList');
  const cached = BUDGET_CACHE[month];
  if (cached) {
    wrap.innerHTML = cached.html;
    BUDGET_STATE.items = cached.items;
    BUDGET_STATE.month = month;
  } else {
    wrap.innerHTML = budgetSkeleton();
  }
  try {
    const resp = await apiGet('budget', { month: month });
    if (!resp.success) throw new Error(resp.error);
    BUDGET_STATE.items = resp.data;
    BUDGET_STATE.month = month;
    if (resp.data.length === 0) {
      BUDGET_CACHE[month] = { html: emptyStateBudget(), items: [] };
      wrap.innerHTML = BUDGET_CACHE[month].html;
      return;
    }
    const html = resp.data.map((b, idx) => {
      const cat = STATE.categories.find(c => (c.CategoryID===b.CategoryID || c.CategoryName===b.CategoryID)) || {};
      const pct = Number(b.PercentageUsed || 0);
      const meta = budgetStatusMeta(pct);
      const remaining = Number(b.BudgetAmount||0) - Number(b.UsedAmount||0);
      return `
        <div class="uiv-card" style="margin-bottom:12px;cursor:pointer;" onclick="openBudgetDetailByIndex(${idx})">
          <div class="uiv-title">
            <span class="uiv-icon ${budgetIconClass(meta.cls)}"><span class="uiv-emoji">${meta.emoji}</span></span>
            <span class="uiv-title-text">${cat.Icon||''} ${cat.CategoryName||b.CategoryID}</span>
            <div class="uiv-right-group">
              <span class="uiv-percent ${pct>=70?'down':'up'}">${pct}%</span>
              <button class="icon-btn" style="width:26px;height:26px;font-size:13px;" onclick="event.stopPropagation();deleteBudgetUI('${b.BudgetID}')" title="ลบงบนี้" aria-label="ลบงบนี้">🗑️</button>
              <span class="uiv-chevron">›</span>
            </div>
          </div>
          <p class="uiv-value">฿${fmt(b.UsedAmount)} <span class="uiv-sub">/ ฿${fmt(b.BudgetAmount)} · เหลือ ฿${fmt(remaining)}</span></p>
          <div class="uiv-range"><div class="uiv-fill ${meta.cls}" style="width:${Math.min(100,pct)}%;"></div></div>
        </div>`;
    }).join('');
    BUDGET_CACHE[month] = { html: html, items: resp.data };
    wrap.innerHTML = html;
  } catch (e) {
    if (!cached) {
      wrap.innerHTML = errorBlock();
      toast('โหลดงบประมาณไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
    }
    // Otherwise: stale cached cards are already on screen — leave them up.
  }
}

async function deleteBudgetUI(budgetId) {
  const ok = await customConfirm('ลบงบนี้ใช่หรือไม่? การลบไม่กระทบธุรกรรมที่บันทึกไว้แล้ว');
  if (!ok) return;
  try {
    const resp = await apiPost('delete-budget', { budgetId: budgetId });
    if (!resp.success) throw new Error(resp.error || 'ลบไม่สำเร็จ');
    toast('ลบงบเรียบร้อยแล้ว', 'success');
    DASH_CACHE = null;
    BUDGET_CACHE = {};
    // Called from both the list (where #budgetList exists) and the detail
    // drill-down (which has replaced the whole tab) — rebuild whichever one
    // we're actually looking at.
    if (document.getElementById('budgetList')) {
      loadBudgets(BUDGET_STATE.month || new Date().toISOString().slice(0,7));
    } else {
      renderBudget();
    }
  } catch (e) {
    toast('ลบงบไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  }
}

function openBudgetDetailByIndex(idx) {
  const b = BUDGET_STATE.items[idx];
  if (!b) return;
  const cat = STATE.categories.find(c => (c.CategoryID===b.CategoryID || c.CategoryName===b.CategoryID)) || {};

/** Budget category detail: set/used/remaining/%, transaction count, latest item,
 *  and which transactions this month pushed the category's spend up the most. */
async function openBudgetDetail(b, cat) {
  const el = document.getElementById('tab-budget');
  const catName = cat.CategoryName || b.CategoryID;
  const budgetAmt = Number(b.BudgetAmount || 0);
  const used = Number(b.UsedAmount || 0);
  const remaining = budgetAmt - used;
  const pct = Number(b.PercentageUsed || 0);
  const meta = budgetStatusMeta(pct);

  // Everything about the budget itself (amounts/%/status) is already known from
  // the list we drilled in from, so it renders instantly — only the "which
  // transactions" breakdown below needs a fetch, and only that part skeletons.
  el.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="icon-btn" onclick="renderBudget()" aria-label="กลับ">←</button>
        <div style="font-weight:700;font-size:15px;">${cat.Icon||''} ${escapeHtml(catName)}</div>
      </div>

      <div class="dash-balance">
        <div class="small">งบที่ตั้งไว้ ฿${fmt(budgetAmt)}</div>
        <div class="big">฿${fmt(used)}</div>
        <div class="balance-meta">
          <span class="dash-chip">${meta.emoji} เหลือ ฿${fmt(remaining)}</span>
          <span class="dash-chip">${pct}% ของงบ</span>
          <span class="dash-chip" id="budgetTxCountChip"><span class="skel skel-line" style="width:60px;height:11px;display:inline-block;vertical-align:middle;"></span></span>
        </div>
      </div>

      <div class="uiv-card">
        <div class="uiv-title">
          <span class="uiv-icon ${budgetIconClass(meta.cls)}"><span class="uiv-emoji">${meta.emoji}</span></span>
          <span class="uiv-title-text">สถานะ: ${meta.label}</span>
        </div>
        <div class="uiv-range" style="margin-top:10px;"><div class="uiv-fill ${meta.cls}" style="width:${Math.min(100,pct)}%;"></div></div>
      </div>

      <div class="dash-section" id="budgetLatestWrap" style="display:none;">
        <div class="dash-section-title"><h3>🕐 รายการล่าสุดในหมวดนี้</h3></div>
        <div id="budgetLatestList"></div>
      </div>

      <div class="dash-section">
        <div class="dash-section-title"><h3>🔥 รายการที่ทำให้งบเพิ่มขึ้นมากที่สุด</h3></div>
        <div id="budgetTopList">${txRowsSkeleton(3)}</div>
      </div>

      <button class="danger" onclick="deleteBudgetUI('${b.BudgetID}')">🗑️ ลบงบนี้</button>
    </div>
  `;

  try {
    const cur = monthRange(0);
    const monthItems = await fetchAllTransactions({ type: 'expense', dateFrom: cur.from, dateTo: cur.to });
    const catItems = monthItems.filter(t => t.Category === catName || t.Category === b.CategoryID);
    const byDate = catItems.slice().sort((x, y) => new Date(y.TransactionDate) - new Date(x.TransactionDate));
    const byAmount = catItems.slice().sort((x, y) => Number(y.Amount||0) - Number(x.Amount||0));
    const latest = byDate[0];

    const countChip = document.getElementById('budgetTxCountChip');
    if (countChip) countChip.innerHTML = `📋 ${catItems.length} รายการเดือนนี้`;

    if (latest) {
      const latestWrap = document.getElementById('budgetLatestWrap');
      const latestList = document.getElementById('budgetLatestList');
      if (latestWrap) latestWrap.style.display = '';
      if (latestList) latestList.innerHTML = renderTxRows([latest], { compact: true });
    }

    const topList = document.getElementById('budgetTopList');
    if (topList) topList.innerHTML = byAmount.length ? renderTxRows(byAmount.slice(0, 10), { compact: true }) : emptyState();
  } catch (e) {
    const topList = document.getElementById('budgetTopList');
    if (topList) topList.innerHTML = errorBlock();
    toast('โหลดรายละเอียดงบไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  }
}

async function saveBudget() {
  const category = document.getElementById('budgetCategory').value;
  const amount = document.getElementById('budgetAmount').value;
  if (!amount) { toast('กรุณากรอกจำนวนงบ', 'warn'); return; }
  const btn = document.getElementById('saveBudgetBtn');
  const prevLabel = btn ? btn.textContent : '';
  if (btn) { btn.textContent = 'กำลังบันทึก...'; btn.disabled = true; }
  try {
    const resp = await apiPost('set-budget', { category: category, amount: Number(amount) });
    if (!resp.success) throw new Error(resp.error || 'เกิดข้อผิดพลาด');
    toast('บันทึกงบประมาณเรียบร้อยแล้ว', 'success');
    DASH_CACHE = null; // budgets feed the "ต้องจัดการ" card — don't show stale alerts next visit
    BUDGET_CACHE = {}; // amounts/used/% changed for this category
    document.getElementById('budgetAmount').value = '';
    loadBudgets(new Date().toISOString().slice(0,7));
  } catch (e) {
    toast('บันทึกงบประมาณไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  } finally {
    if (btn) { btn.textContent = prevLabel; btn.disabled = false; }
  }
}

async function renderDebt() {

async function loadDebts() {
  const wrap = document.getElementById('debtListWrap');
  try {
    const resp = await apiGet('debts');

    DEBT_ITEMS = resp.data.items || [];
    if (DEBT_ITEMS.length === 0) { wrap.innerHTML = emptyState(); return; }
    const totalRemaining = DEBT_ITEMS.filter(d => d.status !== 'paid_off').reduce((s,d) => s + d.remainingAmount, 0);

function renderDebtCard(d, idx) {
  const isPaidOff = d.status === 'paid_off';
  let dueBadge = '';
  if (!isPaidOff) {
    if (d.isOverdue) dueBadge = `<span class="uiv-percent down">🔴 เลยกำหนด</span>`;
    else if (d.isDueSoon) dueBadge = `<span class="uiv-percent down">🟡 ครบใน ${d.daysUntilDue} วัน</span>`;
    else dueBadge = `<span class="uiv-percent up">ครบกำหนด ${d.nextDueDate}</span>`;
  }
  const fillClass = isPaidOff ? 'normal' : (d.isOverdue ? 'over' : (d.isDueSoon ? 'warning' : 'normal'));
  return `
    <div class="uiv-card" style="margin-bottom:12px;cursor:pointer;${isPaidOff?'opacity:.6;':''}" onclick="openDebtDetailByIndex(${idx})">
      <div class="uiv-title">
        <span class="uiv-icon neutral"><span class="uiv-emoji">${d.icon}</span></span>
        <span class="uiv-title-text">${escapeHtml(d.name)}</span>
        <div class="uiv-right-group">
          ${isPaidOff ? '<span class="uiv-percent up">✅ จ่ายครบแล้ว</span>' : dueBadge}
          <span class="uiv-chevron">›</span>
        </div>
      </div>
      <p class="uiv-value">฿${fmt(d.remainingAmount)} <span class="uiv-sub">/ ฿${fmt(d.totalAmount)}${d.interestRate>0?' · ดอกเบี้ย '+d.interestRate+'%/ปี':''}</span></p>
      <div class="uiv-range"><div class="uiv-fill ${fillClass}" style="width:${d.percentPaid}%;"></div></div>
    </div>`;
}

async function submitPayDebt(debtId) {
  const amount = Number(document.getElementById('payDebtAmount').value || 0);
  const accountId = document.getElementById('payDebtAccount').value;
  const note = document.getElementById('payDebtNote').value.trim();
  if (!amount || amount <= 0) { toast('กรุณาระบุจำนวนเงิน', 'warn'); return; }
  const btn = document.getElementById('payDebtBtn');
  const prevLabel = btn.textContent;
  btn.textContent = 'กำลังบันทึก...'; btn.disabled = true;
  try {
    const body = { debtId: debtId, amount: amount, note: note };
    if (accountId) body.accountId = accountId;
    const resp = await apiPost('pay-debt', body);
    if (!resp.success) throw new Error(resp.error);
    toast(resp.data.paidOff ? '🎉 ชำระหนี้ครบแล้ว!' : 'บันทึกการชำระเรียบร้อยแล้ว', 'success');
    DASH_CACHE = null; TX_CACHE = {}; BUDGET_CACHE = {};
    await loadDebts();
    const updated = DEBT_ITEMS.find(x => x.id === debtId);

async function postponeDebtToNextMonth(debtId) {
  if (!confirm('เลื่อนกำหนดชำระรอบนี้ไปเดือนหน้า? (ยอดหนี้คงเหลือจะไม่เปลี่ยน)')) return;
  try {
    const resp = await apiPost('update-debt', { debtId: debtId, postponeToNextMonth: true });
    if (!resp.success) throw new Error(resp.error);
    toast('เลื่อนกำหนดชำระไปเดือนหน้าแล้ว', 'success');
    DASH_CACHE = null;
    await loadDebts();
    const updated = DEBT_ITEMS.find(x => x.id === debtId);
    if (updated) openEditDebtForm(updated.id);
  } catch (e) {
    toast('เลื่อนไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');

}

async function submitEditDebt(debtId) {
  const debtName = document.getElementById('editDebtName').value.trim();
  const remainingAmount = Number(document.getElementById('editDebtRemaining').value || 0);
  const interestRate = Number(document.getElementById('editDebtInterest').value || 0);
  const minimumPayment = Number(document.getElementById('editDebtMinPay').value || 0);
  const dueDay = Number(document.getElementById('editDebtDueDay').value || 1);
  if (!debtName) { toast('ชื่อหนี้สินห้ามว่าง', 'warn'); return; }
  const btn = document.getElementById('editDebtBtn');
  const prevLabel = btn.textContent;
  btn.textContent = 'กำลังบันทึก...'; btn.disabled = true;
  try {
    const resp = await apiPost('update-debt', { debtId: debtId, debtName: debtName, remainingAmount: remainingAmount, interestRate: interestRate, minimumPayment: minimumPayment, dueDay: dueDay });
    if (!resp.success) throw new Error(resp.error);
    toast('บันทึกการแก้ไขแล้ว', 'success');
    DASH_CACHE = null;
    await loadDebts();
    const updated = DEBT_ITEMS.find(x => x.id === debtId);
    if (updated) openDebtDetail(updated); else renderDebt();
  } catch (e) {
    toast('แก้ไขไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
    btn.textContent = prevLabel; btn.disabled = false;
  }
}

async function deleteDebtUI(debtId) {

}

async function askAIQuestion(question) {
  const input = document.getElementById('aiQuestion');
  question = String(question || (input ? input.value : '') || '').trim();

  if (!question) {
    toast('กรุณาพิมพ์คำถามก่อน', 'warn');
    if (input) input.focus();
    return;
  }

  if (input) input.value = question;

  const wrap = document.getElementById('aiResult');
  if (!wrap) return;

  // Button-level feedback in addition to the result area's own loading state,
  // so a tap on any quick-command chip visibly registers even before the
  // (localized, not full-page) result box below updates.
  const askBtn = document.getElementById('aiAskBtn');
  const prevLabel = askBtn ? askBtn.textContent : '';
  if (askBtn) { askBtn.textContent = 'กำลังคิด...'; askBtn.disabled = true; }

  wrap.innerHTML = aiThinkingHtml('กำลังประมวลผล');

  try {
    const resp = await apiGet('ai-command', { q: question });
    if (!resp.success) throw new Error(resp.error || 'AI ไม่สามารถประมวลผลได้');

    const answer = resp.data && (resp.data.answer || resp.data.analysis)
      ? (resp.data.answer || resp.data.analysis)
      : 'ไม่พบคำตอบจากระบบ';

    wrap.innerHTML = `
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px;">
        คำถาม: ${escapeHtml(question)}
      </div>
      <div class="ai-box">${escapeHtml(answer)}</div>
    `;

    toast('AI ตอบเรียบร้อยแล้ว', 'success');
  } catch (e) {
    wrap.innerHTML = errorBlock();
    toast('ถาม AI ไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  } finally {
    if (askBtn) { askBtn.textContent = prevLabel; askBtn.disabled = false; }
  }
}

async function runAiAnalysis() {
  const wrap = document.getElementById('aiResult');
  if (!wrap) return;
  const btn = document.getElementById('aiAnalysisBtn');
  const prevLabel = btn ? btn.textContent : '';
  if (btn) { btn.textContent = 'กำลังวิเคราะห์...'; btn.disabled = true; }

  wrap.innerHTML = aiThinkingHtml('กำลังวิเคราะห์');

  try {
    const resp = await apiGet('ai-analysis');

    if (btn) { btn.textContent = prevLabel; btn.disabled = false; }
  }
}

async function submitBulkReassign() {
  const reassignments = {};
  AUDIT_ITEMS.forEach((t, idx) => {
    const sel = document.getElementById('auditAcc' + idx);
    if (sel && sel.value) reassignments[t.id] = sel.value;
  });
  const count = Object.keys(reassignments).length;
  if (count === 0) { toast('ยังไม่ได้เลือกบัญชีใหม่ให้รายการไหนเลย', 'warn'); return; }
  const ok = await customConfirm(`ย้าย ${count} รายการไปบัญชีที่เลือกใช่หรือไม่? ยอดเงินของบัญชีที่เกี่ยวข้องจะถูกคำนวณใหม่ทั้งหมด`);
  if (!ok) return;
  const btn = document.getElementById('auditSubmitBtn');
  const prevLabel = btn.textContent;
  btn.textContent = 'กำลังย้าย...'; btn.disabled = true;
  try {
    const resp = await apiPost('bulk-reassign-account', { reassignments: reassignments });
    if (!resp.success) throw new Error(resp.error || 'ย้ายไม่สำเร็จ');
    const moved = resp.data.moved.filter(m => !m.error).length;
    toast(`ย้ายสำเร็จ ${moved} รายการ`, 'success');
    DASH_CACHE = null; TX_CACHE = {}; BUDGET_CACHE = {};
    runCashAudit(); // refresh — the moved items should no longer show up as suspects
  } catch (e) {
    toast('ย้ายไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
    btn.textContent = prevLabel; btn.disabled = false;
  }
}

async function loadCategoryList() {
  const wrap = document.getElementById('categoryListWrap');
  if (!wrap) return;
  try {
    await loadCategories(); // refresh STATE.categories in case this is stale
    const cats = STATE.categories || [];
    if (cats.length === 0) { wrap.innerHTML = emptyState(); return; }
    const expense = cats.filter(c => c.Type !== 'income');
    const income = cats.filter(c => c.Type === 'income');
    const renderGroup = (title, list) => `
      <div style="font-size:11px;color:var(--muted);margin:10px 0 4px;">${title}</div>
      ${list.map(c => `
        <div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--card-line);">
          <span style="flex:1;font-size:13.5px;">${c.Icon||''} ${escapeHtml(c.CategoryName)}</span>
          <button class="danger" style="padding:6px 10px;font-size:11.5px;" onclick="archiveCategoryUI('${c.CategoryID}')">🗑️ ลบ</button>
        </div>`).join('')}`;
    wrap.innerHTML = (expense.length ? renderGroup('รายจ่าย', expense) : '') + (income.length ? renderGroup('รายรับ', income) : '');
  } catch (e) {
    wrap.innerHTML = errorBlock();
    toast('โหลดหมวดหมู่ไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  }
}

function openCreateCategoryForm() {
  const wrap = document.getElementById('createCategoryFormWrap');
  wrap.innerHTML = `
    <div class="card">

        <label class="filter-date" style="flex:1;"><span>ชื่อหมวดหมู่</span><input id="newCatName" placeholder="เช่น ค่าเลี้ยงสัตว์"></label>

function setNewCategoryType(type) {
  document.querySelectorAll('[data-cattype]').forEach(b => b.classList.toggle('active', b.dataset.cattype === type));
  document.getElementById('createCategoryFormWrap').dataset.type = type;
}

async function submitCreateCategory() {
  const formWrap = document.getElementById('createCategoryFormWrap');
  const type = formWrap.dataset.type || 'expense';
  const name = document.getElementById('newCatName').value.trim();
  const icon = document.getElementById('newCatIcon').value.trim();
  if (!name) { toast('กรุณาใส่ชื่อหมวดหมู่', 'warn'); return; }
  const btn = document.getElementById('saveCategoryBtn');
  const prevLabel = btn.textContent;
  btn.textContent = 'กำลังบันทึก...'; btn.disabled = true;
  try {
    const resp = await apiPost('create-category', { categoryName: name, type: type, icon: icon });
    if (!resp.success) throw new Error(resp.error);
    toast('เพิ่มหมวดหมู่เรียบร้อยแล้ว', 'success');
    formWrap.innerHTML = '';
    await loadCategoryList();
    loadDupExclusions(); // the new category should show up there too
  } catch (e) {
    toast('เพิ่มไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
    btn.textContent = prevLabel; btn.disabled = false;
  }
}

async function archiveCategoryUI(categoryId) {
  const ok = await customConfirm('ลบหมวดหมู่นี้ใช่หรือไม่? ธุรกรรมเก่าที่เคยใช้หมวดนี้จะยังอยู่ตามปกติ แค่จะไม่มีให้เลือกอีกในรายการใหม่');
  if (!ok) return;
  try {
    const resp = await apiPost('archive-category', { categoryId: categoryId });
    if (!resp.success) throw new Error(resp.error);
    toast('ลบหมวดหมู่แล้ว', 'success');
    await loadCategoryList();
    loadDupExclusions();
  } catch (e) {
    toast('ลบไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  }
}

/* ============================================================
 * DUPLICATE-CHECK CATEGORY EXCLUSIONS
 * ============================================================ */
async function loadDupExclusions() {
  const wrap = document.getElementById('dupExclusionListWrap');
  if (!wrap) return;
  try {
    const [catResp, exclResp] = await Promise.all([
      STATE.categories && STATE.categories.length ? Promise.resolve({ success: true, data: STATE.categories }) : apiGet('categories'),
      apiGet('duplicate-exclusions')
    ]);
    if (catResp.success) STATE.categories = catResp.data;
    if (!exclResp.success) throw new Error(exclResp.error);
    const excluded = exclResp.data.excludedCategories || [];
    const cats = (STATE.categories || []).filter(c => c.Type !== 'income');
    if (cats.length === 0) { wrap.innerHTML = emptyState(); return; }
    wrap.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${cats.map(c => `
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;">
            <input type="checkbox" class="dup-excl-cb" value="${escapeHtml(c.CategoryName)}" style="width:auto;margin:0;" ${excluded.indexOf(c.CategoryName) !== -1 ? 'checked' : ''}>
            <span>${c.Icon||''} ${escapeHtml(c.CategoryName)}</span>
          </label>`).join('')}
      </div>`;
  } catch (e) {
    wrap.innerHTML = errorBlock();
    toast('โหลดรายการหมวดไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  }
}

async function saveDupExclusions() {
  const checked = Array.from(document.querySelectorAll('.dup-excl-cb:checked')).map(el => el.value);
  const btn = document.getElementById('saveDupExclusionsBtn');
  const prevLabel = btn.textContent;
  btn.textContent = 'กำลังบันทึก...'; btn.disabled = true;
  try {
    const resp = await apiPost('update-duplicate-exclusions', { excludedCategories: checked });
    if (!resp.success) throw new Error(resp.error);
    toast('บันทึกเรียบร้อยแล้ว', 'success');
    DASH_CACHE = null; // duplicate alerts on the dashboard are affected by this
  } catch (e) {
    toast('บันทึกไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  } finally {
    btn.textContent = prevLabel; btn.disabled = false;
  }
}

let RECURRING_ITEMS = [];

async function loadRecurringList() {
  const wrap = document.getElementById('recurringListWrap');
  if (!wrap) return;
  try {
    const resp = await apiGet('recurring');
    if (!resp.success) throw new Error(resp.error);
    RECURRING_ITEMS = resp.data.items || [];
    if (RECURRING_ITEMS.length === 0) { wrap.innerHTML = emptyState(); return; }
    wrap.innerHTML = RECURRING_ITEMS.map((r, idx) => renderRecurringCard(r, idx)).join('');
  } catch (e) {
    wrap.innerHTML = errorBlock();
    toast('โหลดรายการประจำไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  }
}

function renderRecurringCard(r, idx) {
  const isPaused = r.status === 'paused';
  const typeIcon = r.type === 'income' ? '💰' : '💸';
  return `
    <div class="uiv-card" style="margin-bottom:10px;${isPaused?'opacity:.55;':''}">
      <div class="uiv-title">
        <span class="uiv-icon neutral"><span class="uiv-emoji">${typeIcon}</span></span>
        <span class="uiv-title-text">${escapeHtml(r.name)}</span>
        <div class="uiv-right-group">
          <span class="uiv-percent ${isPaused?'down':'up'}">${isPaused ? '⏸ พักไว้' : 'รันวันที่ ' + r.dayOfMonth + ' (อีก ' + r.daysUntilNextRun + ' วัน)'}</span>
        </div>
      </div>
      <p class="uiv-value">${r.type==='income'?'+':'-'}฿${fmt(r.amount)} <span class="uiv-sub">${escapeHtml(r.category||'')}</span></p>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
        <button class="secondary" style="flex:1;min-width:80px;font-size:12px;padding:8px 10px;" onclick="runRecurringNowUI('${r.id}')">▶️ รันตอนนี้</button>
        <button class="secondary" style="flex:1;min-width:80px;font-size:12px;padding:8px 10px;" onclick="toggleRecurringPause('${r.id}', ${idx})">${isPaused?'▶️ เปิดใช้':'⏸ พักไว้'}</button>
        <button class="danger" style="flex:1;min-width:80px;font-size:12px;padding:8px 10px;" onclick="deleteRecurringUI('${r.id}')">🗑️ ลบ</button>
      </div>
    </div>`;
}

function setRecurringType(type) {
  document.querySelectorAll('[data-rectype]').forEach(b => b.classList.toggle('active', b.dataset.rectype === type));
  const cats = (STATE.categories || []).filter(c => type === 'income' ? c.Type === 'income' : c.Type !== 'income');
  document.getElementById('recCategory').innerHTML = cats.map(c => `<option value="${escapeHtml(c.CategoryName)}">${c.Icon||''} ${escapeHtml(c.CategoryName)}</option>`).join('');
  document.getElementById('createRecurringFormWrap').dataset.type = type;
}

async function submitCreateRecurring() {
  const formWrap = document.getElementById('createRecurringFormWrap');
  const type = formWrap.dataset.type || 'expense';
  const name = document.getElementById('recName').value.trim();
  const amount = Number(document.getElementById('recAmount').value || 0);
  const dayOfMonth = Number(document.getElementById('recDay').value || 0);
  const category = document.getElementById('recCategory').value;
  const accountId = document.getElementById('recAccount').value;
  if (!name) { toast('กรุณาใส่ชื่อรายการ', 'warn'); return; }
  if (!amount || amount <= 0) { toast('กรุณาระบุจำนวนเงินให้ถูกต้อง', 'warn'); return; }
  if (!dayOfMonth) { toast('กรุณาระบุวันที่รัน', 'warn'); return; }
  if (!accountId) { toast('กรุณาเลือกบัญชี', 'warn'); return; }
  const btn = document.getElementById('saveRecurringBtn');
  const prevLabel = btn.textContent;
  btn.textContent = 'กำลังบันทึก...'; btn.disabled = true;
  try {
    const resp = await apiPost('create-recurring', { name: name, type: type, amount: amount, dayOfMonth: dayOfMonth, category: category, accountId: accountId });
    if (!resp.success) throw new Error(resp.error);
    toast('เพิ่มรายการประจำเรียบร้อยแล้ว', 'success');
    formWrap.innerHTML = '';
    loadRecurringList();
  } catch (e) {
    toast('เพิ่มไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
    btn.textContent = prevLabel; btn.disabled = false;
  }
}

async function toggleRecurringPause(id, idx) {
  const r = RECURRING_ITEMS[idx];
  if (!r) return;
  const newStatus = r.status === 'paused' ? 'active' : 'paused';
  try {
    const resp = await apiPost('update-recurring', { id: id, status: newStatus });
    if (!resp.success) throw new Error(resp.error);
    toast(newStatus === 'paused' ? 'พักรายการนี้ไว้แล้ว' : 'เปิดใช้งานรายการนี้แล้ว', 'success');
    loadRecurringList();
  } catch (e) {
    toast('เปลี่ยนสถานะไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  }
}

async function runRecurringNowUI(id) {

async function deleteRecurringUI(id) {
  const ok = await customConfirm('ลบรายการประจำนี้ใช่หรือไม่? ธุรกรรมที่เคยสร้างไปแล้วจะยังอยู่ตามปกติ');

async function loadConfigStatus() {
  const statusWrap = document.getElementById('configStatusList');
  const fieldsWrap = document.getElementById('configEditFields');
  try {
    const resp = await apiGet('config-status');
    if (!resp.success) throw new Error(resp.error);
    const data = resp.data;
    const order = ['LINE_CHANNEL_ACCESS_TOKEN','GROQ_API_KEY','GEMINI_API_KEY','API_SECRET','TIMEZONE','SPREADSHEET_ID','DRIVE_FOLDER_ID'];

    statusWrap.innerHTML = `
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">
        <table style="min-width:420px;">
          <thead><tr><th>ค่า</th><th>สถานะ</th><th>ตัวอย่าง</th></tr></thead>
          <tbody>
            ${order.map(k => {
              const meta = CONFIG_FIELD_META[k];
              const d = data[k] || { set:false, preview:'' };
              return `<tr>
                <td>${meta.label}</td>
                <td><span class="badge ${d.set ? 'confirmed' : 'pending'}">${d.set ? 'ตั้งค่าแล้ว' : 'ยังไม่ได้ตั้งค่า'}</span></td>
                <td style="color:var(--muted);font-size:12px;">${escapeHtml(d.preview) || '-'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;

    fieldsWrap.innerHTML = order.filter(k => CONFIG_FIELD_META[k].type !== 'readonly').map(k => {
      const meta = CONFIG_FIELD_META[k];
      return `
        <label style="font-size:13px;color:var(--muted);display:block;">${meta.label}</label>
        <input id="cfg_${k}" type="${meta.type}" placeholder="เว้นว่างไว้ถ้าไม่ต้องการเปลี่ยน">
      `;
    }).join('');
  } catch (e) {
    statusWrap.innerHTML = errorBlock();
    toast('โหลดสถานะการตั้งค่าไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  }
}

async function requestPinReset() {
  const ok = await customConfirm('ขอรหัส PIN ใหม่? รหัสเดิมจะใช้ไม่ได้ทันที และรหัสใหม่จะถูกส่งไปที่ LINE ของคุณ');
  if (!ok) return;
  const btn = document.getElementById('pinResetBtn');
  const prevLabel = btn ? btn.textContent : '';
  if (btn) { btn.textContent = 'กำลังส่ง...'; btn.disabled = true; }
  try {
    const resp = await apiPost('reset-pin', {});
    if (resp.success) toast(resp.data.message || 'ส่งรหัส PIN ใหม่ไปที่ LINE ของคุณแล้ว', 'success');
    else toast(resp.error || 'เกิดข้อผิดพลาด', 'error');
  } catch (e) {
    toast('ไม่สามารถขอรหัสใหม่ได้: ' + (e && e.message ? e.message : e), 'error');
  } finally {
    if (btn) { btn.textContent = prevLabel; btn.disabled = false; }
  }
}

async function saveConfig() {
  const errEl = document.getElementById('cfgError');
  const okEl = document.getElementById('cfgSuccess');
  errEl.style.display = 'none'; okEl.style.display = 'none';

  const currentSecret = document.getElementById('cfgCurrentSecret').value.trim();
  if (!currentSecret) {
    errEl.textContent = 'กรุณากรอกรหัสยืนยัน (API Secret ปัจจุบัน)';
    errEl.style.display = 'block';
    toast('กรุณากรอกรหัสยืนยัน (API Secret ปัจจุบัน)', 'warn');
    return;
  }

  const editableKeys = ['LINE_CHANNEL_ACCESS_TOKEN','GROQ_API_KEY','GEMINI_API_KEY','API_SECRET','TIMEZONE'];
  const updates = {};
  editableKeys.forEach(k => {
    const el = document.getElementById('cfg_' + k);
    if (el && el.value.trim() !== '') updates[k] = el.value.trim();
  });
  if (Object.keys(updates).length === 0) {
    errEl.textContent = 'กรุณากรอกค่าที่ต้องการเปลี่ยนอย่างน้อย 1 รายการ';
    errEl.style.display = 'block';
    toast('กรุณากรอกค่าที่ต้องการเปลี่ยนอย่างน้อย 1 รายการ', 'warn');
    return;
  }

  const ok = await customConfirm('ยืนยันการบันทึกการตั้งค่า? หากเปลี่ยน API Secret ทุกคนจะต้อง Login ใหม่');
  if (!ok) return;

  const btn = document.getElementById('saveConfigBtn');
  const prevLabel = btn ? btn.textContent : '';
  if (btn) { btn.textContent = 'กำลังบันทึก...'; btn.disabled = true; }

  try {
    const resp = await apiPost('update-config', { currentSecret: currentSecret, updates: updates });
    if (!resp.success) {
      errEl.textContent = resp.error || 'บันทึกไม่สำเร็จ';
      errEl.style.display = 'block';
      toast(resp.error || 'บันทึกไม่สำเร็จ', 'error');
      return;
    }

    // If API_SECRET was changed, the session is invalidated server-side — log the user out locally too.
    if (resp.data.updated.indexOf('API_SECRET') !== -1) {
      toast('เปลี่ยน API Secret สำเร็จ กรุณา Login ใหม่ด้วยรหัสใหม่', 'success');
      doLogout();
      return;
    }

    okEl.textContent = '✅ บันทึกสำเร็จ: ' + resp.data.updated.join(', ');
    okEl.style.display = 'block';
    toast('บันทึกการตั้งค่าสำเร็จ: ' + resp.data.updated.join(', '), 'success');
    editableKeys.forEach(k => { const el = document.getElementById('cfg_' + k); if (el) el.value = ''; });
    document.getElementById('cfgCurrentSecret').value = '';
    loadConfigStatus();
  } catch (e) {
    errEl.textContent = 'ไม่สามารถบันทึกได้ กรุณาลองใหม่อีกครั้ง';
    errEl.style.display = 'block';
    toast('บันทึกการตั้งค่าไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  } finally {
    if (btn) { btn.textContent = prevLabel; btn.disabled = false; }
  }
}

window.addEventListener('DOMContentLoaded', () => {
  const loginScreen = document.getElementById('loginScreen');
  const app = document.getElementById('app');
  const pinEl = document.getElementById('loginPin');
  const submitBtn = document.getElementById('loginSubmitBtn');

  if (pinEl && submitBtn) {
    pinEl.addEventListener('input', () => {
      pinEl.value = pinEl.value.replace(/\D/g, '').slice(0, 6);
    });
    pinEl.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); doLogin(); }
    });
  }

  if (STATE.token && STATE.userId) {
    loginScreen.style.display = 'none';
    app.style.display = 'block';
    showApp();
  } else {
    app.style.display = 'none';
    loginScreen.style.display = 'flex';
    initGoogleSignIn();
  }
});
</script>
