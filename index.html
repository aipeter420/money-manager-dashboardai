<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Manager AI V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" defer></script>
<style>
  :root{
    --navy:#0B1220;         /* hero / dark surfaces */
    --navy-soft:#161F36;
    --ink:#10142A;          /* primary text */
    --ink-soft:#454A63;
    --bg:#F3F5F1;           /* page background — faint warm-green tint instead of blue-grey, to sit closer to the lime accent below */
    --card:#FFFFFF;
    --card-line:#E7E9F3;
    --muted:#878CA3;
    /* Reference brief: bright chartreuse + blue as the dual "data" accent (chart
       lines/bars, buttons, active states), kept deliberately distinct from the
       income/expense green-red pair below so brand color is never confused with
       a financial positive/negative signal. Variable names kept as --mint* so
       the ~45 existing usages throughout this file don't need touching. */
    --mint:#C7F464;         /* primary accent — chartreuse/lime, CTA + chart fills */
    --mint-dark:#5C7318;    /* darker olive-lime — text-on-white + hover state; ~5.35:1 contrast on white, clears AA */
    --mint-soft:#F2FBE1;
    --blue:#4C6EF5;         /* secondary data accent — reused from the existing chart palette below */
    --blue-dark:#3450C9;
    --blue-soft:#EEF1FE;
    --income:#00A97F;
    --income-soft:#E1FAF1;
    --expense:#F2545B;
    --expense-soft:#FDEAEB;
    --warn:#F2A93B;
    --warn-soft:#FEF3E2;
    --critical:#E24C3D;
    --radius-sm:14px;
    --radius:20px;
    --shadow:0 1px 2px rgba(16,20,42,.03), 0 10px 28px rgba(16,20,42,.06);
    --display:'Prompt', 'Sarabun', sans-serif;
    --sans:'Sarabun', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box;}
  html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;}
  html,body{overflow-x:hidden;width:100%;}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);}
  #app{max-width:520px;margin:0 auto;padding:0 16px 96px;}
  ::selection{background:rgba(0,200,150,.22);}

  /* ---------- Login — modern finance background ---------- */
  #loginScreen{
    min-height:100svh;display:flex;align-items:center;justify-content:center;
    padding:28px 20px;position:relative;overflow:hidden;background:#eef2f0;
    isolation:isolate;
  }
  #loginScreen::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:-2;
    background:
      radial-gradient(520px 380px at 12% 12%,rgba(199,244,100,.52),transparent 66%),
      radial-gradient(460px 360px at 92% 86%,rgba(76,110,245,.18),transparent 68%),
      linear-gradient(135deg,#f8faf8 0%,#edf3ef 48%,#e8edf7 100%);
  }
  #loginScreen::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:-1;opacity:.45;
    background-image:
      linear-gradient(rgba(11,18,32,.045) 1px,transparent 1px),
      linear-gradient(90deg,rgba(11,18,32,.045) 1px,transparent 1px);
    background-size:28px 28px;
    mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),transparent 78%);
    -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),transparent 78%);
  }
  #loginScreen .login-decor{
    position:absolute;z-index:-1;pointer-events:none;
    border-radius:999px;filter:blur(.2px);
  }
  #loginScreen .decor-a{width:210px;height:210px;left:-92px;top:18%;background:rgba(199,244,100,.28);}
  #loginScreen .decor-b{width:280px;height:280px;right:-135px;top:8%;background:rgba(76,110,245,.10);}
  #loginScreen .decor-c{width:170px;height:170px;right:8%;bottom:-88px;background:rgba(199,244,100,.22);}
  #loginScreen .login-content{position:relative;z-index:2;width:100%;max-width:390px;display:flex;flex-direction:column;align-items:center;}
  #loginScreen .brandmark{display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
  #loginScreen .brandmark .mark{
    width:58px;height:58px;border-radius:18px;background:#0B1220;display:flex;align-items:center;justify-content:center;
    box-shadow:0 14px 30px rgba(11,18,32,.18);
  }
  #loginScreen .brandmark svg{width:29px;height:29px;flex-shrink:0;}
  #loginScreen h1{
    font-family:var(--display);font-weight:800;font-size:27px;margin:0;color:#0B1220;letter-spacing:-.7px;text-align:center;
  }
  #loginScreen .tagline{color:#687386;font-size:13px;margin:7px 0 24px;text-align:center;max-width:290px;line-height:1.55;}
  #loginScreen .card{
    width:100%;max-width:370px;background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.85);border-radius:26px;
    padding:22px;box-shadow:0 22px 60px rgba(11,18,32,.12),0 2px 8px rgba(11,18,32,.04);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  #loginScreen .card > label{color:#293241;font-size:13px;font-weight:700;}
  #loginPin{
    width:100%;font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:12px;text-align:center;
    padding:16px 10px 14px;margin-top:8px;background:#f7f9fa;border:1.5px solid #dfe5e9;
    border-radius:16px;color:#0B1220;outline:none;transition:border-color .18s,box-shadow .18s,background .18s;
  }
  #loginPin::placeholder{color:#aab2bd;letter-spacing:10px;}
  #loginPin:focus{border-color:#9bc83e;background:#fff;box-shadow:0 0 0 4px rgba(199,244,100,.24);}
  #loginScreen #loginSubmitBtn, #loginScreen #loginEmailSubmitBtn, #loginScreen #registerSubmitBtn{
    width:100%;margin-top:12px;border:0;border-radius:16px;padding:15px 16px;background:#0B1220;color:#fff;
    font-size:14px;font-weight:800;box-shadow:0 10px 22px rgba(11,18,32,.16);cursor:pointer;transition:.15s;
  }
  #loginScreen #loginSubmitBtn:hover, #loginScreen #loginEmailSubmitBtn:hover, #loginScreen #registerSubmitBtn:hover{background:#17243A;}
  #loginScreen #loginSubmitBtn:active, #loginScreen #loginEmailSubmitBtn:active, #loginScreen #registerSubmitBtn:active{transform:scale(.985);}
  #loginScreen #loginSubmitBtn:disabled, #loginScreen #loginEmailSubmitBtn:disabled, #loginScreen #registerSubmitBtn:disabled{opacity:.58;cursor:not-allowed;transform:none;}
  #loginScreen .hint{font-size:12px;color:#8993a2;text-align:center;margin:15px 0 0;line-height:1.6;}
  #loginScreen .hint strong{color:#263142;}
  #loginScreen .error{border-radius:12px;margin-bottom:12px;}
  .login-mode-btn{background:rgba(255,255,255,.55);color:#454A63;border:1.3px solid rgba(16,20,42,.1);border-radius:12px;padding:9px 4px;font-size:13px;font-weight:700;}
  .login-mode-btn.active{background:#0B1220;color:#fff;border-color:#0B1220;}
  #loginEmailForm input, #loginPinForm input{width:100%;}
  #loginLoaderWrap{justify-content:center;min-height:48px;}
  #loginLoaderWrap .liquid-loader{padding:4px 0;}
  #loginLoaderWrap .loading-text{color:#566171;}
  @media (max-width:480px){
    #loginScreen{padding:20px 16px;}
    #loginScreen .card{padding:19px;border-radius:22px;}
    #loginScreen h1{font-size:25px;}
    #loginPin{font-size:26px;letter-spacing:11px;}
  }

  /* ---------- Inputs / buttons ---------- */
  input,select{
    width:100%;padding:12px 14px;border:1.5px solid var(--card-line);
    border-radius:var(--radius-sm);font-size:14.5px;margin-bottom:12px;background:var(--card);color:var(--ink);
    font-family:var(--sans);transition:border-color .15s;
  }
  input:focus,select:focus{outline:none;border-color:var(--mint);}
  input::placeholder{color:#B0B4C6;}
  select{padding:12px 30px 12px 14px;appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23878CA3'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;}
  @media (max-width:600px){
    input,select{font-size:16px;} /* stops iOS Safari from auto-zooming the page on focus */
    #loginPin{font-size:26px;letter-spacing:11px;}
  }

  button{
    cursor:pointer;border:none;border-radius:999px;padding:13px 22px;font-size:14.5px;
    font-weight:600;background:var(--mint);color:#04231A;transition:.15s ease;font-family:var(--sans);
    letter-spacing:.1px;
  }
  button:hover{background:var(--mint-dark);}
  button:active{transform:translateY(1px);}
  button.secondary{background:var(--bg);color:var(--ink-soft);border:1.3px solid var(--card-line);}
  button.secondary:hover{background:#fff;border-color:var(--mint);color:var(--mint-dark);}
  button.danger{background:var(--expense-soft);color:var(--expense);border:1.3px solid transparent;}
  button.danger:hover{background:var(--expense);color:#fff;}
  .error{color:var(--expense);font-size:13px;margin-top:-4px;margin-bottom:10px;}

  /* ---------- Add-transaction form: type segmented control + slip attach ---------- */
  button.ctx-type-btn{
    background:var(--bg);color:var(--ink-soft);border:1.3px solid var(--card-line);
    padding:10px 4px;font-size:12.5px;border-radius:12px;font-weight:600;
  }
  button.ctx-type-btn.active{background:var(--mint);color:#04231A;border-color:var(--mint);}
  .ctx-slip-label{
    display:flex;align-items:center;justify-content:center;gap:8px;
    border:1.5px dashed var(--card-line);border-radius:var(--radius-sm);
    padding:14px;cursor:pointer;font-size:13px;color:var(--ink-soft);margin-bottom:4px;
  }
  .ctx-slip-label:active{background:var(--bg);}
  .ctx-slip-label input{display:none;}

  /* ---------- Cards / surfaces ---------- */
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:14px;border:1px solid var(--card-line);}
  .card h3{font-family:var(--display);font-weight:600;}

  header.top{
    display:flex;justify-content:space-between;align-items:center;
    margin:0 0 16px;padding:20px 2px 4px;background:transparent;color:var(--ink);
  }
  header.top .greet{display:flex;flex-direction:column;gap:2px;}
  header.top .greet .hi{font-size:12.5px;color:var(--muted);}
  header.top h2{margin:0;font-size:18px;font-family:var(--display);font-weight:600;color:var(--ink);}
  header.top .user{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);}
  header.top .user button.secondary{padding:8px 14px;font-size:12.5px;border-radius:999px;}

  /* ---------- Bottom nav (fixed, app-style) ---------- */
  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;align-items:stretch;
    background:#fff;border-top:1px solid var(--card-line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 20px rgba(16,20,42,.06);
  }
  nav.tabs button{
    background:transparent;color:var(--muted);white-space:nowrap;padding:6px 4px;font-size:10.5px;
    border-radius:12px;font-weight:500;flex:1;max-width:82px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  nav.tabs button svg{width:20px;height:20px;opacity:.7;flex-shrink:0;}
  nav.tabs button:hover{color:var(--ink);background:transparent;}
  nav.tabs button.active{color:var(--mint-dark);font-weight:600;}
  nav.tabs button.active svg{opacity:1;}

  /* ---------- Balance hero (dashboard) ---------- */
  .balance-hero{
    background:linear-gradient(155deg,var(--navy) 0%,var(--navy-soft) 100%);
    border-radius:var(--radius);padding:24px 22px;margin-bottom:14px;color:#fff;position:relative;overflow:hidden;
  }
  .balance-hero::after{
    content:'';position:absolute;top:-60px;right:-40px;width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle,rgba(0,200,150,.28),transparent 70%);
  }
  .balance-hero .label{font-size:12.5px;color:#9AA3C2;margin-bottom:6px;position:relative;}
  .balance-hero .value{font-family:var(--display);font-size:32px;font-weight:600;letter-spacing:.2px;font-variant-numeric:tabular-nums;position:relative;}
  .balance-hero .split{display:flex;gap:22px;margin-top:18px;position:relative;}
  .balance-hero .split div span{display:block;}
  .balance-hero .split .k{font-size:11.5px;color:#9AA3C2;margin-bottom:3px;}
  .balance-hero .split .v{font-family:var(--display);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;}
  .balance-hero .split .v.income{color:#4EE6B8;}
  .balance-hero .split .v.expense{color:#FF9990;}

  .quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
  .qa{background:var(--card);border:1px solid var(--card-line);border-radius:var(--radius-sm);padding:12px 6px;
    display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft);
    text-align:center;cursor:pointer;font-weight:500;}
  .qa .ic{width:34px;height:34px;border-radius:11px;background:var(--mint-soft);color:var(--mint-dark);
    display:flex;align-items:center;justify-content:center;}
  .qa .ic svg{width:17px;height:17px;}
  .qa:hover{border-color:var(--mint);}

  /* ---------- Stat cards ---------- */
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}

  /* ---------- Uiverse-style stat card (by Yaya12085, re-themed) ---------- */
  .uiv-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;border:1px solid var(--card-line);}
  .uiv-card .uiv-title{display:flex;align-items:center;}
  .uiv-card .uiv-icon{position:relative;flex-shrink:0;width:1.7rem;height:1.7rem;border-radius:9999px;background:var(--mint);}
  .uiv-card .uiv-icon svg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:1rem;height:1rem;color:#fff;}
  .uiv-card .uiv-icon .uiv-emoji{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:13px;line-height:1;}
  .uiv-card .uiv-icon.income{background:var(--income);}
  .uiv-card .uiv-icon.expense{background:var(--expense);}
  .uiv-card .uiv-icon.warn{background:var(--warn);}
  .uiv-card .uiv-icon.critical{background:var(--critical);}
  .uiv-card .uiv-icon.neutral{background:var(--navy);}
  .uiv-card .uiv-title-text{margin-left:.5rem;color:var(--ink-soft);font-size:13.5px;font-weight:500;}
  .uiv-card .uiv-right-group{margin-left:auto;display:flex;align-items:center;gap:6px;}
  .uiv-card .uiv-percent{font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:2px;white-space:nowrap;}
  .uiv-card .uiv-chevron{color:var(--muted);font-size:18px;line-height:1;}
  .uiv-card .uiv-percent.up{color:var(--income);}
  .uiv-card .uiv-percent.down{color:var(--expense);}
  .uiv-card .uiv-value{margin:12px 0 10px;color:var(--ink);font-size:1.6rem;line-height:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--display);}
  .uiv-card .uiv-value .uiv-sub{font-family:var(--sans);font-size:12.5px;color:var(--muted);font-weight:500;}
  .uiv-card .uiv-range{position:relative;background:var(--bg);width:100%;height:8px;border-radius:6px;overflow:hidden;}
  .uiv-card .uiv-fill{position:absolute;top:0;left:0;height:100%;border-radius:6px;transition:width .3s ease;}
  .uiv-card .uiv-fill.income{background:var(--income);}
  .uiv-card .uiv-fill.expense{background:var(--expense);}
  .uiv-card .uiv-fill.normal{background:var(--income);}
  .uiv-card .uiv-fill.warning{background:var(--warn);}
  .uiv-card .uiv-fill.critical{background:var(--critical);}
  .uiv-card .uiv-fill.over{background:var(--expense);}

  .chart-wrap{position:relative;height:250px;margin-bottom:10px;}

  /* ---------- Transaction list (replaces table) ---------- */
  .tx-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--card-line);
    position:relative; z-index:1; background:var(--card,#fff); transition:transform .18s ease;}
  .tx-row:last-child{border-bottom:none;}
  .tx-row[onclick]{cursor:pointer;}
  .tx-row[onclick]:active{background:var(--bg);}

  /* ---------- Transaction detail popup ---------- */
  .tx-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:4px;}
  .tx-detail-grid > div{display:flex;flex-direction:column;gap:2px;}
  .tx-detail-label{font-size:11px;color:var(--muted);}
  .tx-detail-value{font-size:13.5px;font-weight:600;color:var(--ink);}
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,15,25,.5); z-index:100;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-box{
    background:#fff; border-radius:18px 18px 0 0; padding:18px; width:100%; max-width:480px;
    box-shadow:0 -6px 24px rgba(0,0,0,.15);
    max-height:85vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  @media (min-width:520px){
    .modal-overlay{align-items:center;}
    .modal-box{border-radius:18px;}
  }
  .tx-row .tx-icon{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--bg);}
  .tx-row .tx-icon.income{background:#BEF2DC;}
  .tx-row .tx-icon.expense{background:#FAD1D4;}
  .tx-row .tx-mid{flex:1;min-width:0;}
  .tx-row .tx-desc{font-size:13.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tx-row .tx-cat{font-size:12px;color:var(--muted);margin-top:2px;}
  .tx-row .tx-right{text-align:right;flex-shrink:0;}
  .tx-row .tx-date{font-size:11px;color:var(--muted);margin-top:3px;}
  .tx-row .tx-actions{display:flex;gap:6px;margin-top:6px;justify-content:flex-end;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--card-line);}
  th{color:var(--muted);font-weight:600;font-size:12px;}
  .badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1.3px solid transparent;display:inline-block;}
  .badge.confirmed{background:var(--income-soft);color:var(--income);border-color:rgba(0,169,127,.2);}
  .badge.pending{background:var(--warn-soft);color:var(--warn);border-color:rgba(242,169,59,.25);}
  .badge.cancelled{background:var(--expense-soft);color:var(--expense);border-color:rgba(242,84,91,.2);}
  .amt{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:14.5px;}
  .amt.income{color:var(--income);font-weight:600;}
  .amt.expense{color:var(--expense);font-weight:600;}

  .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .filters input,.filters select{width:auto;flex:1;min-width:110px;margin-bottom:0;}
  .filters-compact{display:flex;gap:8px;margin-bottom:8px;}
  .filters-compact input{margin-bottom:0;}
  .icon-btn{
    position:relative;
    flex:0 0 auto; width:40px; height:40px; border-radius:12px; border:1px solid var(--border);
    background:#fff; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn.has-active::after{
    content:''; position:absolute; top:5px; right:5px; width:7px; height:7px; border-radius:50%; background:var(--expense);
  }
  .adv-filters{
    flex-direction:column; gap:8px; margin-bottom:14px; padding:10px; border-radius:12px;
    background:var(--bg-2,#f6f6f9); border:1px solid var(--border);
  }
  .adv-filters-row{display:flex;gap:8px;}
  .adv-filters select,.adv-filters input{margin-bottom:0;font-size:13px;padding:8px 10px;}
  .filter-date{ display:flex; flex-direction:column; gap:3px; flex:1; min-width:110px; }
  .filter-date span{ font-size:11px; color:var(--muted); }
  .filter-date input{ margin-bottom:0; }

  /* ---------- Account cards (bank-card style) ---------- */
  .acct-card{
    border-radius:18px;padding:18px 20px;color:#fff;position:relative;overflow:hidden;min-height:110px;
    display:flex;flex-direction:column;justify-content:space-between;
    background:linear-gradient(135deg,var(--navy) 0%,#22304F 100%);
  }
  .acct-card::after{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle,rgba(0,200,150,.25),transparent 70%);}
  .acct-card .top-row{display:flex;justify-content:space-between;align-items:flex-start;position:relative;}
  .acct-card .name{font-size:12.5px;color:#C4CAE0;}
  .acct-card .bal{font-family:var(--display);font-size:20px;font-weight:600;margin-top:14px;position:relative;font-variant-numeric:tabular-nums;}

  /* ---------- Budget ---------- */
  .budget-row{margin-bottom:16px;}
  .budget-row .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;}
  .bar-bg{background:var(--bg);border-radius:10px;height:9px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:10px;transition:width .3s ease;}
  .bar-fill.normal{background:var(--income);}
  .bar-fill.warning{background:var(--warn);}
  .bar-fill.critical{background:var(--critical);}
  .bar-fill.over{background:var(--expense);}

  /* ---------- Settings list ---------- */
  .settings-list{display:flex;flex-direction:column;}
  .settings-item{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid var(--card-line);font-size:13.5px;}
  .settings-item:last-child{border-bottom:none;}
  .settings-item .k{color:var(--muted);}
  .settings-item .v{font-weight:600;color:var(--ink);}

  /* ---------- Misc states ---------- */
  .empty{text-align:center;color:var(--muted);padding:44px 10px;}
  .empty .emoji{font-size:30px;margin-bottom:10px;opacity:.8;}
  .loading{text-align:center;color:var(--muted);padding:34px;font-size:13.5px;}
  .loading::before{content:'';display:block;width:18px;height:18px;margin:0 auto 10px;border-radius:50%;
    border:2px solid var(--card-line);border-top-color:var(--mint);animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Liquid loader (by ShaikhWahid99, re-themed) ---------- */
  .liquid-loader{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 10px;font-family:var(--sans);}
  .liquid-loader .loader-track{
    position:relative;width:180px;max-width:100%;height:28px;
    background:linear-gradient(135deg,#2a2a2a,#1a1a1a);border-radius:14px;overflow:hidden;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.6), 0 1px 3px rgba(255,255,255,.1);
  }
  .liquid-loader .liquid-fill{
    position:absolute;top:2px;left:2px;height:calc(100% - 4px);
    background:linear-gradient(90deg,#00C896,#4f46e5,#7c3aed,#ec4899);
    border-radius:12px;
    animation:liquidFill 4s ease-out infinite, liquidColorShift 3s linear infinite;
    box-shadow:0 0 12px rgba(124,58,237,.35), inset 0 1px 2px rgba(255,255,255,.2);
  }
  .liquid-loader .loading-text{
    color:var(--ink-soft);font-size:13.5px;font-weight:600;letter-spacing:.3px;
    animation:liquidTextGlow 1s ease-in-out infinite;
  }
  .liquid-loader .dot{margin-left:1px;animation:liquidBlink 1.5s infinite;}
  .liquid-loader .dot:nth-of-type(1){animation-delay:0s;}
  .liquid-loader .dot:nth-of-type(2){animation-delay:.3s;}
  .liquid-loader .dot:nth-of-type(3){animation-delay:.6s;}
  .liquid-loader.compact{padding:6px 0;gap:6px;}
  .liquid-loader.compact .loader-track{width:120px;height:20px;border-radius:10px;}
  .liquid-loader.compact .liquid-fill{border-radius:8px;}
  .liquid-loader.compact .loading-text{font-size:12.5px;}
  @keyframes liquidFill{
    0%{width:4px;} 25%{width:25%;} 50%{width:50%;} 75%{width:75%;} 100%{width:calc(100% - 4px);}
  }
  @keyframes liquidColorShift{
    0%{filter:hue-rotate(0deg) brightness(1);}
    33%{filter:hue-rotate(120deg) brightness(1.1);}
    66%{filter:hue-rotate(240deg) brightness(.9);}
    100%{filter:hue-rotate(360deg) brightness(1);}
  }
  @keyframes liquidTextGlow{
    0%,100%{opacity:.7;} 50%{opacity:1;}
  }
  @keyframes liquidBlink{
    0%,50%{opacity:1;} 51%,100%{opacity:0;}
  }
  @keyframes aiThinkSoma{0%,100%{transform:scale(1);} 50%{transform:scale(1.08);}}
  .ai-think-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;}
  .ai-think-soma{transform-origin:105px 95px;animation:aiThinkSoma 1.6s ease-in-out infinite;}
  .ai-think-dot{animation:liquidTextGlow 1.6s ease-in-out infinite;}
  .ai-think-label{font-size:12.5px;color:var(--muted);}
  .slip-link{color:var(--mint-dark);text-decoration:none;font-size:12.5px;font-weight:600;}
  .pagination{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:14px;}
  .pagination button{padding:8px 14px;font-size:13px;}
  .ai-box{white-space:pre-wrap;line-height:1.75;font-size:14.5px;padding:16px 18px;background:var(--bg);
    border-radius:var(--radius-sm);}
  #aiQuestion:focus{outline:none;border-color:var(--mint);}
  #aiQuestion::placeholder{color:#B0B4C6;}
  @media(max-width:600px){
    table{font-size:12px;} th,td{padding:9px 5px;}
  }

  /* ============================================================
   * TOAST NOTIFICATIONS — replaces window.alert() everywhere.
   * Stacks top-right (top-center on mobile), auto-dismisses, tap to close early.
   * Built because native alert()/confirm() are unreliable inside LINE's in-app
   * browser (WebView) — they can silently no-op instead of showing a dialog,
   * which made buttons that relied on confirm() look "broken".
   * ============================================================ */
  #toastStack{
    position:fixed;top:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:10px;
    max-width:340px;pointer-events:none;
  }
  .toast{
    pointer-events:auto;display:flex;align-items:flex-start;gap:10px;
    background:var(--ink);color:#fff;padding:14px 16px;border-radius:var(--radius-sm);
    box-shadow:0 6px 20px rgba(24,35,56,.28);font-size:13.5px;line-height:1.5;
    border-left:4px solid var(--mint);cursor:pointer;
    animation:toastIn .25s cubic-bezier(.34,1.56,.64,1);
  }
  .toast.success{border-left-color:var(--income);}
  .toast.error{border-left-color:var(--expense);}
  .toast.warn{border-left-color:var(--warn);}
  .toast .toast-icon{font-size:17px;line-height:1;flex-shrink:0;margin-top:1px;}
  .toast .toast-msg{flex:1;word-break:break-word;}
  .toast.leaving{animation:toastOut .2s ease forwards;}
  @keyframes toastIn{from{opacity:0;transform:translateX(24px) scale(.96);}to{opacity:1;transform:translateX(0) scale(1);}}
  @keyframes toastOut{to{opacity:0;transform:translateX(24px) scale(.96);}}
  @media(max-width:600px){
    #toastStack{left:12px;right:12px;top:12px;max-width:none;align-items:stretch;}
  }

  /* ============================================================
   * CONFIRM MODAL — replaces window.confirm() everywhere.
   * ============================================================ */
  #confirmOverlay{
    position:fixed;inset:0;background:rgba(24,35,56,.45);z-index:9998;
    display:none;align-items:center;justify-content:center;padding:20px;
    animation:overlayIn .15s ease;
  }
  #confirmOverlay.open{display:flex;}
  #accountPickOverlay{
    position:fixed;inset:0;background:rgba(24,35,56,.45);z-index:9998;
    display:none;align-items:center;justify-content:center;padding:20px;
    animation:overlayIn .15s ease;
  }
  #accountPickOverlay.open{display:flex;}
  @keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
  #confirmModal{
    background:var(--card);border-radius:var(--radius);box-shadow:0 20px 50px rgba(24,35,56,.3);
    padding:24px;max-width:360px;width:100%;border-top:3px solid var(--mint);
    animation:modalIn .2s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  #confirmModal .msg{font-size:14.5px;line-height:1.6;color:var(--ink);margin-bottom:20px;white-space:pre-wrap;}
  #confirmModal .actions{display:flex;gap:10px;justify-content:flex-end;}
  #confirmModal .actions button{padding:10px 18px;}

  /* ============================================================
   * SUCCESS POPUP — brief animated confirmation (e.g. after login),
   * fades/scales out gently on its own instead of stacking like toasts.
   * ============================================================ */
  #successOverlay{
    position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;
    background:rgba(11,18,32,.55);padding:20px;
  }
  #successOverlay.show{display:flex;animation:overlayFadeIn .2s ease;}
  #successOverlay.leaving{animation:overlayFadeOut .35s ease forwards;}
  #successOverlay .box{
    background:var(--navy-soft);border:1px solid rgba(255,255,255,.08);border-radius:24px;
    padding:34px 42px;display:flex;flex-direction:column;align-items:center;gap:14px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);animation:popIn .35s cubic-bezier(.34,1.56,.64,1);
  }
  #successOverlay.leaving .box{animation:popOut .35s ease forwards;}
  #successOverlay .checkmark{width:60px;height:60px;border-radius:50%;background:var(--mint);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  #successOverlay .checkmark svg{width:30px;height:30px;}
  #successOverlay .checkmark path{stroke-dasharray:26;stroke-dashoffset:26;animation:drawCheck .45s ease .12s forwards;}
  #successOverlay .msg{color:#fff;font-family:var(--display);font-size:15px;font-weight:600;text-align:center;}
  @keyframes overlayFadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes overlayFadeOut{to{opacity:0;}}
  @keyframes popIn{from{opacity:0;transform:scale(.82);}to{opacity:1;transform:scale(1);}}
  @keyframes popOut{to{opacity:0;transform:scale(.92);}}
  @keyframes drawCheck{to{stroke-dashoffset:0;}}

/* ============================================================
 * DASHBOARD V4 INTERACTIVE UI
 * ============================================================ */
.dash-v4 { display:flex; flex-direction:column; gap:14px; }
.dash-head { display:flex; justify-content:space-between; align-items:center; gap:10px; }
.dash-head .eyebrow { font-size:12px; color:var(--muted); margin-bottom:3px; }
.dash-head .eyebrow-lg { font-size:20px; font-weight:800; color:var(--text); letter-spacing:-.4px; margin-bottom:0; }
.dash-head h2 { margin:0; font-size:23px; letter-spacing:-.4px; }
.dash-period {
  border:1px solid var(--border); background:#fff; border-radius:14px;
  padding:9px 12px; font-size:12px; color:var(--text); outline:none;
}
.dash-balance {
  position:relative; overflow:hidden; border-radius:24px; padding:20px;
  background:linear-gradient(135deg,#0B1220,#17243A);
  color:#fff; box-shadow:0 12px 30px rgba(11,18,32,.14);
}
.dash-balance .small { color:rgba(255,255,255,.68); font-size:12px; }
.dash-balance .big { font-size:34px; font-weight:800; letter-spacing:-1px; margin:3px 0 12px; }
.dash-balance .balance-meta { display:flex; gap:8px; flex-wrap:wrap; }
.dash-chip { background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.10);
  padding:7px 10px; border-radius:999px; font-size:11px; color:rgba(255,255,255,.86); }
.dash-balance:after { content:""; position:absolute; width:150px; height:150px; border-radius:50%;
  right:-70px; top:-70px; background:rgba(0,200,150,.13); }
.dash-quick { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.dash-quick .dash-action {
  border:1px solid var(--border); background:#fff; border-radius:17px; padding:12px 7px;
  text-align:center; cursor:pointer; transition:.15s; box-shadow:0 3px 12px rgba(11,18,32,.035);
}
.dash-quick .dash-action:active { transform:scale(.97); }
.dash-action .emoji { font-size:20px; display:block; margin-bottom:4px; }
.dash-action span:last-child { font-size:11px; font-weight:700; color:var(--text); }
.dash-stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.dash-stat {
  background:#fff; border:1px solid var(--border); border-radius:20px; padding:15px;
  cursor:pointer; box-shadow:0 4px 15px rgba(11,18,32,.035); transition:.15s;
}
.dash-stat:active { transform:scale(.985); }
.dash-stat .top { display:flex; justify-content:space-between; gap:8px; color:var(--muted); font-size:11px; }
.dash-stat .amount { font-size:23px; font-weight:800; margin-top:5px; letter-spacing:-.4px; }
.dash-stat .sub { font-size:10px; color:var(--muted); margin-top:2px; }
.dash-progress { height:6px; background:#eef1f5; border-radius:999px; margin-top:10px; overflow:hidden; }
.dash-progress > div { height:100%; border-radius:999px; }
.dash-section { background:#fff; border:1px solid var(--border); border-radius:20px; padding:15px; }
.dash-section-title { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
.dash-section-title h3 { margin:0; font-size:14px; }
.dash-link { color:var(--mint-dark); font-size:11px; font-weight:800; cursor:pointer; }
.dash-insight {
  background:linear-gradient(135deg,#f1fffb,#fff); border:1px solid #d7f5ec;
  border-radius:20px; padding:15px;
}
.dash-insight-title { font-weight:800; font-size:14px; margin-bottom:7px; }
.dash-insight p { margin:0; color:#526078; font-size:12px; line-height:1.65; }
.dash-insight button { margin-top:11px; }
.dash-account-list { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.dash-account {
  border:1px solid var(--border); border-radius:17px; padding:12px; cursor:pointer; background:#fff;
}
.dash-account .name { font-size:11px; color:var(--muted); }
.dash-account .bal { font-size:18px; font-weight:800; margin-top:3px; }
.dash-account .share { font-size:9px; color:var(--mint-dark); margin-top:2px; }
.dash-click-hint { font-size:10px; color:var(--muted); text-align:center; margin-top:8px; }

/* ---------- "ต้องจัดการ" attention card ---------- */

/* ---------- Skeleton loading (first-load placeholders, no cache yet) ---------- */
.skel{position:relative;overflow:hidden;background:var(--bg);border-radius:var(--radius-sm);}
.skel::after{
  content:'';position:absolute;inset:0;transform:translateX(-100%);

}

.tx-page-head{display:flex;justify-content:space-between;align-items:center;padding:10px 2px 4px;}
.tx-eyebrow{font-size:11px;color:#98A0B4;text-transform:uppercase;letter-spacing:.8px;font-weight:700;}
.tx-page-head h1{margin:2px 0 1px;font-family:var(--display);font-size:25px;line-height:1.15;font-weight:700;letter-spacing:-.45px;}
.tx-subtitle{font-size:12px;color:#9299AD;}
.tx-add-main{
  width:46px;height:46px;padding:0;border-radius:15px;display:flex;
  align-items:center;justify-content:center;background:#10182B;color:#fff;
  font-size:27px;line-height:1;box-shadow:0 8px 18px rgba(16,24,43,.15);
}
.tx-filter-card{
  background:#fff;border:1px solid #E7EAF2;border-radius:23px;
  padding:12px;box-shadow:0 8px 26px rgba(20,26,47,.055);
}
.tx-search-row{display:flex;align-items:center;gap:8px;}
.tx-search{
  height:50px;flex:1;display:flex;align-items:center;gap:8px;
  background:#F7F8FB;border:1px solid #E3E7F0;border-radius:16px;padding:0 13px;
}
.tx-search-icon{font-family:Arial,sans-serif;font-size:25px;color:#8D95AA;line-height:1;transform:rotate(-15deg);}
.tx-search input{
  border:0!important;background:transparent!important;box-shadow:none!important;
  margin:0!important;padding:0!important;width:100%;height:100%;font-size:15px;color:#141A2F;
}
.tx-search input::placeholder{color:#A5ABBC;}
.tx-icon-btn{
  position:relative;width:46px;height:46px;padding:0;border-radius:14px;
  background:#F7F8FB;color:#5E667B;border:1px solid #E2E6EF;
  display:flex;align-items:center;justify-content:center;font-size:20px;
}
.tx-icon-btn.filter-toggle.has-active{
  background:#F2FBE1;color:#587116;border-color:#D8EEB0;
}
.tx-icon-btn.filter-toggle.has-active:after{
  content:'';width:7px;height:7px;border-radius:50%;background:#F2545B;
  position:absolute;top:7px;right:7px;
}
.tx-advanced{
  margin-top:10px;padding:11px;background:#F7F8FB;
  border:1px solid #ECEEF4;border-radius:17px;
  display:flex;flex-direction:column;gap:10px;
}
.tx-filter-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.tx-filter-field,.tx-date-field{display:flex;flex-direction:column;gap:5px;min-width:0;}
.tx-filter-field span,.tx-date-field span{font-size:10.5px;color:#8E96A9;font-weight:600;padding-left:2px;}
.tx-filter-field select{
  margin:0;width:100%;height:44px;padding:0 30px 0 12px;
  border-radius:13px;font-size:14px;background:#fff;
}
.tx-date-row{
  display:grid;grid-template-columns:minmax(0,1fr) 16px minmax(0,1fr);
  align-items:end;gap:5px;
}
.tx-date-arrow{color:#A0A7B8;text-align:center;font-size:13px;padding-bottom:13px;}
.tx-date-field input{
  margin:0;width:100%;height:44px;min-width:0;padding:0 7px;
  border-radius:13px;font-size:12.5px;color:#141A2F;background:#fff;
}
.tx-date-field input[type=date]{-webkit-appearance:none;appearance:none;}
.tx-result-head{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 0;}
.tx-result-title{font-family:var(--display);font-size:15px;font-weight:700;}
.tx-clear-btn{padding:6px 8px;background:transparent;color:#587116;font-size:11px;border-radius:9px;}
.tx-list-card{
  background:#fff;border:1px solid #E7EAF2;border-radius:23px;
  padding:5px 14px;box-shadow:0 8px 26px rgba(20,26,47,.055);overflow:hidden;
}
.tx-list-card .tx-row{min-height:78px;padding:13px 2px;gap:11px;}
.tx-list-card .tx-icon{width:44px;height:44px;border-radius:14px;font-size:18px;}
.tx-list-card .tx-desc{font-size:14px;font-weight:700;}
.tx-list-card .tx-cat{font-size:11.5px;margin-top:3px;}
.tx-list-card .tx-date{font-size:10.5px;}
.tx-list-card .amt{font-size:15px;font-weight:700;}

@media(max-width:420px){
  #app{padding-left:13px!important;padding-right:13px!important;}
  .tx-page-head h1{font-size:23px;}
  .tx-filter-card{padding:10px;}
  .tx-search{height:48px;}
  .tx-icon-btn{width:44px;height:44px;}
  .tx-date-row{grid-template-columns:minmax(0,1fr) 10px minmax(0,1fr);gap:3px;}
  .tx-date-field input{font-size:11.5px;padding-left:6px;padding-right:3px;}
  .tx-list-card{padding-left:12px;padding-right:12px;}
}

<body>

<!-- ===================== CONFIG ===================== -->
<!-- GitHub Pages version: this file is served as a static index.html (not pasted into
     Apps Script), so it talks to the backend purely over fetch() using the hardcoded
     API_URL below. Apps Script (98.gs) keeps running only as the JSON API + LINE bot
     backend — set API_URL to your deployment's /exec URL before publishing. -->
<script>
  const APP_CONFIG = {
    // Hosted on GitHub Pages (static): Apps Script's <?= apiUrl ?> templating doesn't
    // run here, so this must be your deployed Web App's /exec URL, hardcoded.
    // Apps Script → Deploy → Manage deployments → copy the "Web app" URL.
    // >>> REPLACE THE LINE BELOW WITH YOUR OWN /exec URL <<<
    API_URL: "/**
 * MONEY MANAGER AI
 * LINE OA + Groq AI + Google Sheets + Drive + REST API
 * Single-file Google Apps Script backend.
 */

/* 0. GLOBAL CONSTANTS */

var TZ = 'Asia/Bangkok';

var SHEET_NAMES = {
  TX: 'Transactions',
  USERS: 'Users',
  CATEGORIES: 'Categories',
  ACCOUNTS: 'Accounts',
  BUDGETS: 'Budgets',
  SETTINGS: 'Settings',
  AI_LOGS: 'AI_Logs',
  AUDIT: 'Audit_Log',
  DAILY: 'Daily_Summary',
  SESSIONS: 'Sessions',
  DEBTS: 'Debts',
  DEBT_PAYMENTS: 'DebtPayments',
  RECURRING: 'RecurringTransactions',
  ROUTING_LOGS: 'RoutingLogs'
};

var SCHEMAS = {
  Transactions: ['ID','EventID','Timestamp','TransactionDate','TransactionTime','UserID','DisplayName','Type','Amount','Category','SubCategory','Description','Merchant','AccountID','PaymentMethod','SlipURL','SlipFileID','SlipRefNumber','Source','AIConfidence','AIResponse','Status','CreatedAt','UpdatedAt'],
  Users: ['UserID','DisplayName','PictureURL','Status','PIN','Email','PasswordHash','PasswordSalt','FirstSeen','LastSeen','TotalIncome','TotalExpense','Balance','DashboardEnabled','DuplicateCheckExcludedCategories','SpreadsheetID','CreatedAt','UpdatedAt'],
  Categories: ['CategoryID','CategoryName','Type','Icon','Status','CreatedAt','UpdatedAt'],
  Accounts: ['AccountID','UserID','AccountName','AccountType','OpeningBalance','CurrentBalance','Currency','Status','CreatedAt','UpdatedAt'],
  Budgets: ['BudgetID','UserID','Month','CategoryID','BudgetAmount','UsedAmount','RemainingAmount','PercentageUsed','Status','CreatedAt','UpdatedAt'],
  Settings: ['Key','Value','UpdatedAt'],
  AI_Logs: ['ID','Timestamp','UserID','InputType','InputText','AIResponse','ReasoningText','FinalAnswer','ParsedJSON','Confidence','Status','ErrorMessage','CreatedAt'],
  Audit_Log: ['ID','Timestamp','UserID','Action','TargetID','OldValue','NewValue','Status','Description'],
  Daily_Summary: ['Date','UserID','TotalIncome','TotalExpense','Balance','TransactionCount','TopCategory','UpdatedAt'],
  Sessions: ['Token','UserID','DisplayName','CreatedAt','ExpiresAt'],
  Debts: ['DebtID','UserID','DebtName','DebtType','TotalAmount','RemainingAmount','InterestRate','MinimumPayment','DueDay','LastPaymentDate','Status','CreatedAt','UpdatedAt'],
  DebtPayments: ['PaymentID','DebtID','UserID','Amount','TransactionID','PaymentDate','Note','CreatedAt'],
  RecurringTransactions: ['RecurringID','UserID','Name','Type','Amount','Category','AccountID','DayOfMonth','LastRunDate','Status','CreatedAt','UpdatedAt'],
  RoutingLogs: ['ID','Timestamp','UserID','InputText','Layer','Detail','CreatedAt']
};

var DEFAULT_CATEGORIES = [
  ['อาหาร','expense','🍜'], ['น้ำมัน','expense','⛽'], ['เดินทาง','expense','🚗'],
  ['ช้อปปิ้ง','expense','🛍️'], ['บิล','expense','🧾'], ['ที่พัก','expense','🏠'],
  ['สุขภาพ','expense','💊'], ['ความบันเทิง','expense','🎬'],
  ['เงินเดือน','income','💰'], ['รายได้เสริม','income','💵'],
  ['โอนเงิน','transfer','🔁'], ['อื่นๆ','both','📦']
];

var DEFAULT_ACCOUNTS = [
  ['เงินสด','cash'], ['ธนาคาร','bank'], ['Wallet','wallet'], ['บัตร','card']
];

// Shared with both buildTextParsePrompt_ and buildSlipParsePrompt_ so a slip-derived
// category can never drift from the names budgets are actually keyed by in
// updateBudgetUsage_ — a category outside this list silently never counts toward
// any budget, no matter how much was spent.
var CATEGORY_LIST_ = 'อาหาร, น้ำมัน, เดินทาง, ช้อปปิ้ง, บิล, ที่พัก, สุขภาพ, ความบันเทิง, เงินเดือน, รายได้เสริม, โอนเงิน, อื่นๆ';

/* ============================================================
 * 1. CONFIG (PropertiesService)
 * ============================================================ */
function getConfig_(key) {
  return PropertiesService.getScriptProperties().getProperty(key);
}
function setConfig_(key, value) {
  PropertiesService.getScriptProperties().setProperty(key, value);
}
function getAllConfigKeys_() {
  return ['LINE_CHANNEL_ACCESS_TOKEN','GROQ_API_KEY','GEMINI_API_KEY','API_SECRET','SPREADSHEET_ID','DRIVE_FOLDER_ID','TIMEZONE','GOOGLE_CLIENT_ID'];
}

/* ============================================================
 * 2. SPREADSHEET / SHEET HELPERS
 * ============================================================ */
function getSS_() {
  var id = getConfig_('SPREADSHEET_ID');
  if (!id) throw new Error('SPREADSHEET_ID not configured. Run setupSystem() first.');
  return SpreadsheetApp.openById(id);
}

/**
 * PHASE 2 of multi-tenant support. Returns the spreadsheet that holds a given
 * user's own data (Transactions, Accounts, Budgets, Debts, DebtPayments,
 * RecurringTransactions, AI_Logs, Daily_Summary, RoutingLogs) — falling back
 * to the shared central spreadsheet for a user who hasn't been provisioned
 * one yet (e.g. an account created before this feature existed).
 *
 * Users / Sessions / Settings / Audit_Log / Categories stay in the central
 * spreadsheet (getSS_()) always, never here — logging in has to search across
 * every user's PIN at once, and Categories is one shared list everyone picks
 * from today (apiCategories_ has no session check at all), so neither can move
 * per-user without changing what those already do.
 *
 * Cached for 30 minutes per user so the common case (a request that touches
 * several per-user sheets) doesn't re-read the central Users sheet on every
 * single call — getSS_() itself has never cached its openById() call, but this
 * one is called many times per request instead of once, so it's worth it here.
 */
function getUserSS_(userId) {
  if (!userId) return getSS_();
  var cache = CacheService.getScriptCache();
  var cacheKey = 'userss_' + userId;
  var cachedId = cache.get(cacheKey);
  if (cachedId) {
    try { return SpreadsheetApp.openById(cachedId); } catch (e) { /* stale/deleted — fall through and re-look-up below */ }
  }
  var mainSs = getSS_();
  var usersSh = mainSs.getSheetByName(SHEET_NAMES.USERS);
  var u = sheetToObjects_(usersSh).filter(function(r) { return r.UserID === userId; })[0];
  if (u && u.SpreadsheetID) {
    cache.put(cacheKey, u.SpreadsheetID, 1800);
    try { return SpreadsheetApp.openById(u.SpreadsheetID); } catch (e) { return mainSs; }
  }
  return mainSs; // not yet provisioned (legacy user) — safe fallback to the shared spreadsheet
}

function getOrCreateSheet_(ss, name) {
  var sh = ss.getSheetByName(name);
  if (!sh) sh = ss.insertSheet(name);
  return sh;
}

function ensureHeaders_(sh, headers) {
  var lastCol = sh.getLastColumn();
  var existing = lastCol > 0 ? sh.getRange(1, 1, 1, lastCol).getValues()[0] : [];
  if (existing.length === 0 || existing[0] === '') {
    sh.getRange(1, 1, 1, headers.length).setValues([headers]);
    sh.setFrozenRows(1);
    return;
  }
  // Migration: add any missing columns at the end, never remove/reorder existing ones
  var existingSet = {};
  existing.forEach(function(h, i) { if (h !== '') existingSet[h] = i; });
  var toAdd = headers.filter(function(h) { return !(h in existingSet); });
  if (toAdd.length > 0) {
    sh.getRange(1, existing.length + 1, 1, toAdd.length).setValues([toAdd]);
  }
}

/** Locks a column to plain-text formatting so Sheets stops auto-detecting
 *  values like "2026-09" as dates and silently rewriting them — see the
 *  Month-column comment in sheetToObjects_ for what that breaks downstream.
 *  Only formats rows *below* the current data (not existing rows) so it can't
 *  change how already-written cells display — safe/cheap to call every request. */
function forceColumnAsText_(sh, headerName) {
  var map = getHeaderMap_(sh);
  if (!(headerName in map)) return;
  var col = map[headerName] + 1;
  var startRow = sh.getLastRow() + 1;
  var available = sh.getMaxRows() - startRow + 1;
  if (available <= 0) return; // no blank rows left below the data to pre-format; next appendRow will just grow the sheet with default formatting
  sh.getRange(startRow, col, Math.min(Math.max(available, 1), 200), 1).setNumberFormat('@');
}

function getHeaderMap_(sh) {
  var lastCol = sh.getLastColumn();
  var headers = sh.getRange(1, 1, 1, lastCol).getValues()[0];
  var map = {};
  headers.forEach(function(h, i) { if (h !== '') map[h] = i; });
  return map;
}

function sheetToObjects_(sh) {
  var lastRow = sh.getLastRow();
  var lastCol = sh.getLastColumn();
  if (lastRow < 2) return [];
  var headers = sh.getRange(1, 1, 1, lastCol).getValues()[0];
  var data = sh.getRange(2, 1, lastRow - 1, lastCol).getValues();
  return data.map(function(row, rIdx) {
    var obj = {};
    headers.forEach(function(h, i) {
      if (h === '') return;
      var v = row[i];
      if (v instanceof Date) {
        // Google Sheets silently auto-detects a plain "yyyy-MM" string (like the
        // Budgets sheet's Month column) as a date and converts it on write — so a
        // saved budget's Month ends up stored as a real Date, not the string
        // "2026-09" the code wrote. Left as the generic branch below, that becomes
        // "2026-09-01 00:00:00", which then never matches month comparisons
        // elsewhere (apiBudget_/apiSetBudget_) — hence budgets always looking
        // empty, and every save creating a new duplicate row instead of updating.
        if (h === 'TransactionDate' || h === 'Month') v = Utilities.formatDate(v, TZ, h === 'Month' ? 'yyyy-MM' : 'yyyy-MM-dd');
        else if (h === 'TransactionTime') v = Utilities.formatDate(v, TZ, 'HH:mm');
        else v = Utilities.formatDate(v, TZ, 'yyyy-MM-dd HH:mm:ss');
      }
      obj[h] = v;
    });
    obj.__row = rIdx + 2;
    return obj;
  });
}

function appendRowObject_(sh, obj) {
  var map = getHeaderMap_(sh);
  var lastCol = sh.getLastColumn();
  var row = new Array(lastCol).fill('');
  Object.keys(obj).forEach(function(k) {
    if (k in map) row[map[k]] = obj[k];
  });
  sh.appendRow(row);
  return sh.getLastRow();
}

function updateRowObject_(sh, rowIndex, obj) {
  // Reads the row once, patches the changed fields in memory, and writes the
  // whole row back with a single setValues() call — instead of one setValue()
  // round-trip per changed field. updateRowObject_ is the write path for nearly
  // everything (accounts, budgets, transactions, users), so this one change
  // cuts a large share of the app's total Sheets API calls, not just here.
  var lastCol = sh.getLastColumn();
  var map = getHeaderMap_(sh);
  var row = sh.getRange(rowIndex, 1, 1, lastCol).getValues()[0];
  Object.keys(obj).forEach(function(k) {
    if (k in map) row[map[k]] = obj[k];
  });
  sh.getRange(rowIndex, 1, 1, lastCol).setValues([row]);
}

function nowStr_() {
  return Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd HH:mm:ss');
}

/* ============================================================
 * 3. SETUP SYSTEM — idempotent, non-destructive
 * ============================================================ */
function setupSystem() {
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var id = getConfig_('SPREADSHEET_ID');
    var ss;
    if (id) {
      try { ss = SpreadsheetApp.openById(id); }
      catch (e) { ss = SpreadsheetApp.create('Money Manager AI Database'); setConfig_('SPREADSHEET_ID', ss.getId()); }
    } else {
      ss = SpreadsheetApp.create('Money Manager AI Database');
      setConfig_('SPREADSHEET_ID', ss.getId());
    }

    Object.keys(SCHEMAS).forEach(function(name) {
      var sh = getOrCreateSheet_(ss, name);
      ensureHeaders_(sh, SCHEMAS[name]);
    });

    // remove default empty "Sheet1" if unused
    var def = ss.getSheetByName('Sheet1');
    if (def && ss.getSheets().length > 1 && def.getLastRow() === 0) {
      try { ss.deleteSheet(def); } catch (e) {}
    }

    seedCategories_(ss);
    seedAccounts_(ss);

    if (!getConfig_('TIMEZONE')) setConfig_('TIMEZONE', TZ);
    ss.setSpreadsheetTimeZone(TZ);

    // Drive folders
    ensureDriveFolders_();

    // API_SECRET is only used for the admin-only "System Configuration" panel in the
    // dashboard (regular users log in with their PIN instead) — it never needs to come
    // from an external service, so we can safely generate it automatically the first time.
    var generatedSecret = null;
    if (!getConfig_('API_SECRET')) {
      generatedSecret = generateRandomSecret_();
      setConfig_('API_SECRET', generatedSecret);
    }

    // Daily backup trigger
    ensureBackupTrigger_();
    createDailySummaryTrigger_();

    logAudit_('SYSTEM', 'SETUP', 'system', '', '', 'success', 'setupSystem executed');

    if (generatedSecret) {
      Logger.log('=====================================================');
      Logger.log('สร้าง API_SECRET ให้อัตโนมัติ (ใช้เฉพาะแก้ "ตั้งค่าระบบ" ใน Dashboard เท่านั้น ไม่ใช่รหัส Login ปกติ):');
      Logger.log(generatedSecret);
      Logger.log('ดูอีกครั้งได้จากเมนู Money Manager AI → 🔑 Check Configuration');
      Logger.log('=====================================================');
      try {
        SpreadsheetApp.getUi().alert(
          'ตั้งค่าเสร็จสมบูรณ์ ✅',
          'ระบบสร้าง API_SECRET ให้อัตโนมัติแล้ว:\n\n' + generatedSecret +
          '\n\nใช้รหัสนี้เฉพาะตอนแก้ "ตั้งค่าระบบ" ในแท็บ Settings ของ Dashboard เท่านั้น ' +
          '(ผู้ใช้ทั่วไป Login ด้วยรหัส PIN จาก LINE ตามปกติ ไม่เกี่ยวกับรหัสนี้)\n\n' +
          'ลืมรหัส? ดูอีกครั้งได้จากเมนู Money Manager AI → 🔑 Check Configuration',
          SpreadsheetApp.getUi().ButtonSet.OK
        );
      } catch (e) {
        // No UI context when run directly from the Apps Script editor's "Run" button —
        // the value is still visible above in the execution log (View → Logs).
      }
    }

    return { success: true, spreadsheetId: ss.getId(), spreadsheetUrl: ss.getUrl(), apiSecretGenerated: !!generatedSecret };
  } finally {
    lock.releaseLock();
  }
}

function generateRandomSecret_() {
  return Utilities.getUuid().replace(/-/g, '') + Utilities.getUuid().replace(/-/g, '').slice(0, 8);
}

function seedCategories_(ss) {
  var sh = ss.getSheetByName(SHEET_NAMES.CATEGORIES);
  var existing = sheetToObjects_(sh);
  var existingNames = {};
  existing.forEach(function(r) { existingNames[r.CategoryName] = true; });
  DEFAULT_CATEGORIES.forEach(function(c) {
    if (!existingNames[c[0]]) {
      appendRowObject_(sh, {
        CategoryID: 'CAT-' + Utilities.getUuid().slice(0, 8),
        CategoryName: c[0], Type: c[1], Icon: c[2], Status: 'active',
        CreatedAt: nowStr_(), UpdatedAt: nowStr_()
      });
    }
  });
}

function seedAccounts_(ss) {
  // default account templates are created per-user on first sighting (see ensureDefaultAccountsForUser_)
}

function ensureDriveFolders_() {
  var rootId = getConfig_('DRIVE_FOLDER_ID');
  var root;
  if (rootId) {
    try { root = DriveApp.getFolderById(rootId); } catch (e) { root = null; }
  }
  if (!root) {
    var it = DriveApp.getFoldersByName('Money Manager AI');
    root = it.hasNext() ? it.next() : DriveApp.createFolder('Money Manager AI');
    setConfig_('DRIVE_FOLDER_ID', root.getId());
  }
  getOrCreateSubfolder_(root, 'Slips');
  getOrCreateSubfolder_(root, 'Backups');
  return root;
}

function getOrCreateSubfolder_(parent, name) {
  var it = parent.getFoldersByName(name);
  return it.hasNext() ? it.next() : parent.createFolder(name);
}

function getOrCreateYearMonthFolder_(baseFolder, date) {
  var y = Utilities.formatDate(date, TZ, 'yyyy');
  var m = Utilities.formatDate(date, TZ, 'MM');
  var yFolder = getOrCreateSubfolder_(baseFolder, y);
  return getOrCreateSubfolder_(yFolder, m);
}

function ensureBackupTrigger_() {
  var triggers = ScriptApp.getProjectTriggers();
  var exists = triggers.some(function(t) { return t.getHandlerFunction() === 'createBackup'; });
  if (!exists) {
    ScriptApp.newTrigger('createBackup').timeBased().everyDays(1).atHour(2).create();
  }
}

/* ============================================================
 * 4. MENU (onOpen)
 * ============================================================ */
function onOpen() {
  SpreadsheetApp.getUi().createMenu('Money Manager AI')
    .addItem('⚙️ Setup System', 'setupSystem')
    .addItem('🔑 Check Configuration', 'checkConfiguration')
    .addItem('🧪 Test LINE', 'testLine')
    .addItem('🧪 Test Groq', 'testGroq')
    .addItem('📊 Refresh Summary', 'refreshDailySummaryUI_')
    .addItem('💾 Create Backup', 'createBackup')
    .addToUi();
}

function checkConfiguration() {
  var keys = getAllConfigKeys_();
  var report = keys.map(function(k) {
    var v = getConfig_(k);
    if (!v) return k + ': ❌ missing';
    if (k === 'API_SECRET') return k + ': ✅ ' + v + '  (ใช้เข้า "ตั้งค่าระบบ" ใน Dashboard)';
    if (k === 'TIMEZONE' || k === 'SPREADSHEET_ID' || k === 'DRIVE_FOLDER_ID') return k + ': ✅ ' + v;
    return k + ': ✅ set (' + v.slice(0, 3) + '••••' + v.slice(-4) + ')';
  }).join('\n\n');
  try {
    SpreadsheetApp.getUi().alert('Configuration Status', report, SpreadsheetApp.getUi().ButtonSet.OK);
  } catch (e) {
    // No UI context when run directly from the Apps Script editor's "Run" button —
    // print to the execution log instead (View → Logs / Executions).
    Logger.log('=== Configuration Status ===\n' + report);
  }
}

/** NOT YET MULTI-TENANT (Phase 2): this scans the central spreadsheet only,
 *  so it won't see data for any user who has been migrated to their own
 *  per-user spreadsheet. It's an admin/maintenance-only tool, not part of
 *  everyday request handling, so it's left as-is for now — would need a
 *  per-user loop (like processRecurringTransactions_) to cover everyone. */
function refreshDailySummaryUI_() {

/* ============================================================
 * 7. AUTHENTICATION / SESSION (dashboard, GitHub Pages safe)
 * ============================================================
 * The frontend never sees API_SECRET. Login exchanges the LINE UserID
 * + a one-time login code (sent to the user via LINE) OR the API_SECRET
 * (for the account owner) for a short-lived session token stored server
 * side in the Sessions sheet. All other API calls require a valid token.
 */
/**
 * PIN-only login. The PIN is generated automatically and sent to the user via LINE
 * the first time they message the bot (or on request via "ขอรหัส PIN"). No need to
 * hunt for a User ID or a shared secret — the PIN alone identifies the user.
 */
function apiLogin_(params) {
  var pin = String(params.pin || '').trim();
  if (!pin) return { success: false, error: 'กรุณากรอกรหัส PIN' };

  if (isLoginRateLimited_()) {
    return { success: false, error: 'พยายามเข้าสู่ระบบบ่อยเกินไป กรุณาลองใหม่อีกครั้งในอีกสักครู่' };
  }

  var ss = getSS_();
  var usersSh = ss.getSheetByName(SHEET_NAMES.USERS);
  var users = sheetToObjects_(usersSh);
  var user = users.filter(function(u) { return String(u.PIN) === pin; })[0];
  if (!user) {
    recordLoginAttempt_();
    return { success: false, error: 'รหัส PIN ไม่ถูกต้อง' };
  }

  var token = Utilities.getUuid();
  var sessSh = ss.getSheetByName(SHEET_NAMES.SESSIONS);
  var created = new Date();
  var expires = new Date(created.getTime() + 24 * 3600 * 1000);
  appendRowObject_(sessSh, {
    Token: token, UserID: user.UserID, DisplayName: user.DisplayName,
    CreatedAt: nowStr_(), ExpiresAt: Utilities.formatDate(expires, TZ, 'yyyy-MM-dd HH:mm:ss')
  });
  return { success: true, data: { token: token, userId: user.UserID, displayName: user.DisplayName } };
}

function recordLoginAttempt_() {
  var cache = CacheService.getScriptCache();
  var key = 'login_attempts_' + Utilities.formatDate(new Date(), TZ, 'yyyyMMddHHmm');
  var count = Number(cache.get(key) || 0) + 1;
  cache.put(key, String(count), 90);
}

function isLoginRateLimited_() {
  var cache = CacheService.getScriptCache();
  var key = 'login_attempts_' + Utilities.formatDate(new Date(), TZ, 'yyyyMMddHHmm');
  var count = Number(cache.get(key) || 0);
  return count >= 20; // max 20 failed attempts per minute, system-wide
}

/* ------------------------------------------------------------------------
 * WEB-ONLY ACCOUNTS (email + password) — for people who don't use LINE.
 * These users get 'WEB-' + uuid as their UserID instead of a LINE ID, and
 * sign in with email/password instead of the PIN LINE users get. Everything
 * downstream (session, getUserSS_, provisionUserSpreadsheet_, every api*
 * function) only ever looks at UserID, so a web-only user works identically
 * everywhere else in the app once they have a session token.
 * ------------------------------------------------------------------------ */

/** SHA-256(password + '|' + salt) as a hex string. Apps Script has no bcrypt/
 *  scrypt available, so this is the strongest built-in primitive on offer —
 *  paired with a random per-user salt (stored alongside, never reused) so two
 *  people with the same password don't get the same hash, and a lookup table
 *  built from a leaked password list can't be reused directly against this. */
function hashPassword_(password, salt) {
  var bytes = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, password + '|' + salt, Utilities.Charset.UTF_8);
  return bytes.map(function(b) {
    var v = (b < 0 ? b + 256 : b).toString(16);
    return v.length === 1 ? '0' + v : v;
  }).join('');
}

function isValidEmail_(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || '').trim());
}

/** Creates a web-only account: validates input, checks the email isn't
 *  already taken, hashes the password, writes the Users row, then provisions
 *  that user's own spreadsheet (same as a brand-new LINE user gets) and logs
 *  them straight in so there's no separate first-login step. */
function apiRegisterWeb_(params) {
  var email = String(params.email || '').trim().toLowerCase();
  var password = String(params.password || '');
  var displayName = String(params.displayName || '').trim();

  if (!isValidEmail_(email)) return { success: false, error: 'อีเมลไม่ถูกต้อง' };
  if (password.length < 8) return { success: false, error: 'รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร' };
  if (!displayName) displayName = email.split('@')[0];

  if (isLoginRateLimited_()) {
    return { success: false, error: 'มีการพยายามสมัคร/เข้าสู่ระบบบ่อยเกินไป กรุณาลองใหม่อีกครั้งในอีกสักครู่' };
  }

  var lock = LockService.getScriptLock();
  lock.waitLock(15000);
  var userId, alreadyExists = false;
  try {
    var ss = getSS_();
    var sh = ss.getSheetByName(SHEET_NAMES.USERS);
    ensureHeaders_(sh, SCHEMAS.Users);
    var rows = sheetToObjects_(sh);
    var existing = rows.filter(function(r) { return String(r.Email || '').toLowerCase() === email; })[0];
    if (existing) {
      alreadyExists = true;
    } else {
      userId = 'WEB-' + Utilities.getUuid().slice(0, 8);
      var salt = Utilities.getUuid();
      appendRowObject_(sh, {
        UserID: userId, DisplayName: displayName, Status: 'active',
        Email: email, PasswordHash: hashPassword_(password, salt), PasswordSalt: salt,
        FirstSeen: nowStr_(), LastSeen: nowStr_(),
        TotalIncome: 0, TotalExpense: 0, Balance: 0, DashboardEnabled: true,
        CreatedAt: nowStr_(), UpdatedAt: nowStr_()
      });
    }
  } finally { lock.releaseLock(); }

  if (alreadyExists) {
    recordLoginAttempt_();
    return { success: false, error: 'อีเมลนี้ถูกใช้สมัครแล้ว' };
  }

  // Same reason as ensureUserExists_: provisioning opens its own lock, so it
  // runs after this function's lock is released to avoid a self-deadlock.
  try { provisionUserSpreadsheet_(userId, displayName); }
  catch (e) { logAudit_(userId, 'PROVISION_FAILED', userId, '', String(e), 'error', 'provisionUserSpreadsheet_ threw during web registration'); }

  return apiLoginWeb_({ email: email, password: password });
}

function apiLoginWeb_(params) {
  var email = String(params.email || '').trim().toLowerCase();
  var password = String(params.password || '');
  if (!email || !password) return { success: false, error: 'กรุณากรอกอีเมลและรหัสผ่าน' };

  if (isLoginRateLimited_()) {
    return { success: false, error: 'พยายามเข้าสู่ระบบบ่อยเกินไป กรุณาลองใหม่อีกครั้งในอีกสักครู่' };
  }

  var ss = getSS_();
  var usersSh = ss.getSheetByName(SHEET_NAMES.USERS);
  ensureHeaders_(usersSh, SCHEMAS.Users);
  var users = sheetToObjects_(usersSh);
  var user = users.filter(function(u) { return String(u.Email || '').toLowerCase() === email; })[0];
  if (!user || !user.PasswordHash || hashPassword_(password, user.PasswordSalt) !== user.PasswordHash) {
    recordLoginAttempt_();
    return { success: false, error: 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' };
  }
  if (user.Status !== 'active') {
    return { success: false, error: 'บัญชีนี้ถูกระงับการใช้งาน' };
  }

  var token = Utilities.getUuid();
  var sessSh = ss.getSheetByName(SHEET_NAMES.SESSIONS);
  var created = new Date();
  var expires = new Date(created.getTime() + 24 * 3600 * 1000);
  appendRowObject_(sessSh, {
    Token: token, UserID: user.UserID, DisplayName: user.DisplayName,
    CreatedAt: nowStr_(), ExpiresAt: Utilities.formatDate(expires, TZ, 'yyyy-MM-dd HH:mm:ss')
  });
  updateRowObject_(usersSh, user.__row, { LastSeen: nowStr_(), UpdatedAt: nowStr_() });
  return { success: true, data: { token: token, userId: user.UserID, displayName: user.DisplayName } };
}

/** One request handles both "new Google sign-in" and "returning Google
 *  sign-in" — whichever the email turns out to be. The frontend's credential
 *  is a signed JWT from Google; this never trusts its contents without
 *  asking Google to confirm it first (the tokeninfo call below). That's the
 *  lightweight verification method Google documents for simple backends —
 *  https://developers.google.com/identity/sign-in/web/backend-auth — good
 *  enough here, though it has its own per-IP rate limit on Google's side, so
 *  a full JWKS-based verifier would be the next step if login volume grows. */
function apiLoginGoogle_(params) {
  var credential = String(params.credential || '').trim();
  if (!credential) return { success: false, error: 'ไม่พบข้อมูลจาก Google' };

  if (isLoginRateLimited_()) {
    return { success: false, error: 'พยายามเข้าสู่ระบบบ่อยเกินไป กรุณาลองใหม่อีกครั้งในอีกสักครู่' };
  }

  var clientId = getConfig_('GOOGLE_CLIENT_ID');
  if (!clientId) return { success: false, error: 'ระบบยังไม่ได้ตั้งค่า Google Sign-In (GOOGLE_CLIENT_ID)' };

  var payload;
  try {
    var verifyResp = UrlFetchApp.fetch('https://oauth2.googleapis.com/tokeninfo?id_token=' + encodeURIComponent(credential), { muteHttpExceptions: true });
    payload = JSON.parse(verifyResp.getContentText());
  } catch (e) {
    recordLoginAttempt_();
    return { success: false, error: 'ตรวจสอบข้อมูลจาก Google ไม่สำเร็จ' };
  }

  // aud must match OUR client ID — otherwise this is a valid Google token for
  // some other app, not proof this person authorized THIS app.
  if (!payload || payload.error_description || payload.aud !== clientId || !payload.email) {
    recordLoginAttempt_();
    return { success: false, error: 'ข้อมูลจาก Google ไม่ถูกต้องหรือหมดอายุ' };
  }
  if (payload.email_verified !== 'true' && payload.email_verified !== true) {
    return { success: false, error: 'อีเมล Google นี้ยังไม่ได้ยืนยัน' };
  }

  var email = String(payload.email).toLowerCase();
  var displayName = payload.name || email.split('@')[0];

  var lock = LockService.getScriptLock();
  lock.waitLock(15000);
  var userId, isNewUser = false;
  try {
    var ss = getSS_();
    var sh = ss.getSheetByName(SHEET_NAMES.USERS);
    ensureHeaders_(sh, SCHEMAS.Users);
    var rows = sheetToObjects_(sh);
    var user = rows.filter(function(r) { return String(r.Email || '').toLowerCase() === email; })[0];
    if (user) {
      // Same email already registered (web password signup, or a previous
      // Google sign-in) — sign into that existing account rather than making
      // a second one; one person, one UserID, one spreadsheet either way.
      userId = user.UserID;
      updateRowObject_(sh, user.__row, { LastSeen: nowStr_(), UpdatedAt: nowStr_() });
    } else {
      userId = 'GOOGLE-' + Utilities.getUuid().slice(0, 8);
      isNewUser = true;
      appendRowObject_(sh, {
        UserID: userId, DisplayName: displayName, Status: 'active', Email: email,
        // No PasswordHash/PasswordSalt — this account only ever signs in via Google.
        FirstSeen: nowStr_(), LastSeen: nowStr_(),
        TotalIncome: 0, TotalExpense: 0, Balance: 0, DashboardEnabled: true,
        CreatedAt: nowStr_(), UpdatedAt: nowStr_()
      });
    }
  } finally { lock.releaseLock(); }

  // Same reason as ensureUserExists_/apiRegisterWeb_: provisioning opens its
  // own lock, so it runs after this function's lock is released.
  if (isNewUser) {
    try { provisionUserSpreadsheet_(userId, displayName); }
    catch (e) { logAudit_(userId, 'PROVISION_FAILED', userId, '', String(e), 'error', 'provisionUserSpreadsheet_ threw during Google sign-in'); }
  }

  var token = Utilities.getUuid();
  var ss2 = getSS_();
  var sessSh = ss2.getSheetByName(SHEET_NAMES.SESSIONS);
  var created = new Date();
  var expires = new Date(created.getTime() + 24 * 3600 * 1000);
  appendRowObject_(sessSh, {
    Token: token, UserID: userId, DisplayName: displayName,
    CreatedAt: nowStr_(), ExpiresAt: Utilities.formatDate(expires, TZ, 'yyyy-MM-dd HH:mm:ss')
  });
  return { success: true, data: { token: token, userId: userId, displayName: displayName } };
}

function apiLogout_(params) {
  var token = params.token;
  if (!token) return { success: true };
  var ss = getSS_();
  var sh = ss.getSheetByName(SHEET_NAMES.SESSIONS);
  var rows = sheetToObjects_(sh);
  rows.forEach(function(r) {
    if (r.Token === token) sh.getRange(r.__row, 1).setValue('EXPIRED-' + r.Token);
  });
  return { success: true };
}

function apiResetPinFromDashboard_(session) {
  requireSession_(session);
  var newPin = resetUserPin_(session.userId);
  replyLine_(null, session.userId, '🔄 มีการขอรีเซ็ตรหัส PIN จาก Dashboard\nรหัสใหม่ของคุณคือ: ' + newPin + '\nรหัสเก่าใช้ไม่ได้อีกต่อไป');
  return { success: true, data: { message: 'ส่งรหัส PIN ใหม่ไปที่ LINE ของคุณแล้ว' } };
}

function validateSession_(token) {
  if (!token) return null;
  var ss = getSS_();
  var sh = ss.getSheetByName(SHEET_NAMES.SESSIONS);
  var rows = sheetToObjects_(sh);
  var now = new Date();
  var match = rows.filter(function(r) { return r.Token === token; })[0];
  if (!match) return null;
  var exp = new Date(match.ExpiresAt);
  if (exp < now) return null;
  return { userId: match.UserID, displayName: match.DisplayName, token: token };
}

function requireSession_(session) {
  if (!session) throw new Error('Unauthorized');
  return session;
}

/* ============================================================
 * 7B. SYSTEM CONFIGURATION — dashboard-managed (no Sheet editing needed)
 * ============================================================
 * Real values are NEVER sent to the browser — only a set/missing status
 * and a masked preview. Any change requires re-submitting the current
 * API_SECRET as a confirmation step, independent of the session token.
 */
var EDITABLE_CONFIG_KEYS_ = ['LINE_CHANNEL_ACCESS_TOKEN', 'GROQ_API_KEY', 'GEMINI_API_KEY', 'API_SECRET', 'TIMEZONE'];
var READONLY_CONFIG_KEYS_ = ['SPREADSHEET_ID', 'DRIVE_FOLDER_ID'];

function maskSecret_(value) {
  if (!value) return '';
  var v = String(value);
  if (v.length <= 6) return '••••';
  return v.slice(0, 3) + '••••' + v.slice(-4);
}

/**
 * Per-user list of categories that should never be flagged as possible
 * duplicates — for activities like trading/investing where doing the exact
 * same amount+category more than once a day is completely normal, no amount
 * of smarter heuristics (time window, matching reference numbers/accounts/
 * merchants) can fully tell "accidental resubmit" from "did it again on
 * purpose", so the person gets to just turn the check off for that category.
 */
function apiGetDuplicateExclusions_(session) {
  requireSession_(session);
  var ss = getSS_();
  var sh = ss.getSheetByName(SHEET_NAMES.USERS);
  ensureHeaders_(sh, SCHEMAS.Users);
  var user = sheetToObjects_(sh).filter(function(u) { return u.UserID === session.userId; })[0];
  var excluded = (user && user.DuplicateCheckExcludedCategories)
    ? String(user.DuplicateCheckExcludedCategories).split(',').map(function(s) { return s.trim(); }).filter(Boolean)
    : [];
  return { success: true, data: { excludedCategories: excluded } };
}

function apiUpdateDuplicateExclusions_(session, body) {
  requireSession_(session);
  var ss = getSS_();
  var sh = ss.getSheetByName(SHEET_NAMES.USERS);
  ensureHeaders_(sh, SCHEMAS.Users);
  var rows = sheetToObjects_(sh);
  var user = rows.filter(function(u) { return u.UserID === session.userId; })[0];
  if (!user) return { success: false, error: 'ไม่พบผู้ใช้' };
  var categories = Array.isArray(body.excludedCategories) ? body.excludedCategories : [];
  updateRowObject_(sh, user.__row, { DuplicateCheckExcludedCategories: categories.join(','), UpdatedAt: nowStr_() });
  return { success: true };
}

function apiConfigStatus_(session) {
  requireSession_(session);
  var data = {};
  EDITABLE_CONFIG_KEYS_.forEach(function(k) {
    var v = getConfig_(k);
    data[k] = { set: !!v, preview: k === 'TIMEZONE' ? (v || '') : maskSecret_(v), editable: true };
  });
  READONLY_CONFIG_KEYS_.forEach(function(k) {
    var v = getConfig_(k);
    data[k] = { set: !!v, preview: v || '', editable: false };
  });
  return { success: true, data: data };
}

/**
 * body: { currentSecret: 'the API_SECRET currently in effect (confirmation)',
 *         updates: { LINE_CHANNEL_ACCESS_TOKEN?, GROQ_API_KEY?, GEMINI_API_KEY?, API_SECRET?, TIMEZONE? } }
 * Only non-empty fields in `updates` are changed; leaving a field blank keeps the existing value.
 */
function apiUpdateConfig_(session, body) {
  requireSession_(session);
  var currentSecret = getConfig_('API_SECRET');
  if (!currentSecret || body.currentSecret !== currentSecret) {
    logAudit_(session.userId, 'CONFIG_UPDATE_DENIED', 'config', '', '', 'error', 'Confirmation code did not match');
    return { success: false, error: 'รหัสยืนยันไม่ถูกต้อง' };
  }
  var updates = body.updates || {};
  var changedKeys = [];
  EDITABLE_CONFIG_KEYS_.forEach(function(k) {
    var newVal = updates[k];
    if (newVal !== undefined && newVal !== null && String(newVal).trim() !== '') {
      setConfig_(k, String(newVal).trim());
      changedKeys.push(k);
    }
  });
  if (changedKeys.length === 0) return { success: false, error: 'ไม่มีการเปลี่ยนแปลง' };

  // If the API_SECRET itself changed, force everyone to log in again for safety.
  if (changedKeys.indexOf('API_SECRET') !== -1) {
    invalidateAllSessions_();
  }

  logAudit_(session.userId, 'CONFIG_UPDATE', 'config', '', changedKeys.join(','), 'success', 'Updated via dashboard settings');
  return { success: true, data: { updated: changedKeys } };
}

function invalidateAllSessions_() {
  var ss = getSS_();
  var sh = ss.getSheetByName(SHEET_NAMES.SESSIONS);
  var lastRow = sh.getLastRow();
  if (lastRow > 1) sh.getRange(2, 1, lastRow - 1, sh.getLastColumn()).clearContent();
}

/* ============================================================
 * 8. LINE WEBHOOK
 * ============================================================ */
function handleLineWebhook_(body) {
  var events = body.events || [];
  events.forEach(function(ev) {
    try { handleLineEvent_(ev); }
    catch (err) { logError_('handleLineEvent_', err); }
  });
}

function handleLineEvent_(ev) {
  Logger.log('LINE event received: ' + JSON.stringify(ev));
  var eventId = ev.webhookEventId || (ev.message && ev.message.id) || Utilities.getUuid();
  if (isDuplicateEvent_(eventId)) return;
  markEventProcessed_(eventId);

  var userId = ev.source && ev.source.userId;
  if (!userId) return;

  if (ev.type === 'follow') {
    handleFollowEvent_(userId);
    return;
  }
  ensureUserExists_(userId);

  if (ev.type === 'postback') {
    handlePostback_(userId, ev.postback.data, ev.replyToken);
    return;
  }
  if (ev.type === 'message') {
    if (ev.message.type === 'text') {
      handleTextMessage_(userId, ev.message.text, ev.replyToken, eventId);
    } else if (ev.message.type === 'image') {
      handleImageMessage_(userId, ev.message.id, ev.replyToken, eventId);
    }
  }
}

function isDuplicateEvent_(eventId) {
  var cache = CacheService.getScriptCache();
  if (cache.get('evt_' + eventId)) return true;
  var ss = getSS_();
  var sh = ss.getSheetByName(SHEET_NAMES.TX);
  var rows = sheetToObjects_(sh);
  return rows.some(function(r) { return r.EventID === eventId; });
}
function markEventProcessed_(eventId) {
  CacheService.getScriptCache().put('evt_' + eventId, '1', 21600);
}

    quickReply: {
