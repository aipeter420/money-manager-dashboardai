function generateUniquePin_() {
  var ss = getSS_();
  var sh = ss.getSheetByName(SHEET_NAMES.USERS);
  var rows = sheetToObjects_(sh);
  var existingPins = {};
  rows.forEach(function(r) { if (r.PIN) existingPins[String(r.PIN)] = true; });
  var pin;
  do {
    pin = String(Math.floor(100000 + Math.random() * 900000));
  } while (existingPins[pin]);
  return pin;
}

function getUserPin_(userId) {
  var ss = getSS_();
  var sh = ss.getSheetByName(SHEET_NAMES.USERS);
  var rows = sheetToObjects_(sh);
  var u = rows.filter(function(r) { return r.UserID === userId; })[0];
  return u ? u.PIN : '';
}

/** Returns the user's PIN, assigning one on the fly for accounts created before this feature existed. */
function ensurePinAssigned_(userId) {
  var lock = LockService.getScriptLock();
  lock.waitLock(10000);
  try {
    var ss = getSS_();
    var sh = ss.getSheetByName(SHEET_NAMES.USERS);
    var rows = sheetToObjects_(sh);
    var u = rows.filter(function(r) { return r.UserID === userId; })[0];
    if (!u) return '';
    if (u.PIN) return u.PIN;
    var pin = generateUniquePin_();
    updateRowObject_(sh, u.__row, { PIN: pin, UpdatedAt: nowStr_() });
    return pin;
  } finally { lock.releaseLock(); }
}

function resetUserPin_(userId) {
  var lock = LockService.getScriptLock();
  lock.waitLock(10000);
  try {
    var ss = getSS_();
    var sh = ss.getSheetByName(SHEET_NAMES.USERS);
    var rows = sheetToObjects_(sh);
    var u = rows.filter(function(r) { return r.UserID === userId; })[0];
    if (!u) return '';
    var pin = generateUniquePin_();
    updateRowObject_(sh, u.__row, { PIN: pin, UpdatedAt: nowStr_() });
    logAudit_(userId, 'PIN_RESET', userId, '', '', 'success', 'PIN reset via LINE/Dashboard');
    return pin;
  } finally { lock.releaseLock(); }
}

function ensureUserExists_(userId) {
  var lock = LockService.getScriptLock();
  lock.waitLock(15000);
  try {
    var ss = getSS_();
    var sh = ss.getSheetByName(SHEET_NAMES.USERS);
    var rows = sheetToObjects_(sh);
    var existing = rows.filter(function(r) { return r.UserID === userId; })[0];
    var profile = fetchLineProfile_(userId);
    var isNewUser = !existing;
    if (existing) {
      updateRowObject_(sh, existing.__row, {
        LastSeen: nowStr_(),
        DisplayName: profile.displayName || existing.DisplayName,
        PictureURL: profile.pictureUrl || existing.PictureURL,
        UpdatedAt: nowStr_()
      });
    } else {
      appendRowObject_(sh, {
        UserID: userId, DisplayName: profile.displayName || 'User',
        PictureURL: profile.pictureUrl || '', Status: 'active', PIN: generateUniquePin_(),
        FirstSeen: nowStr_(), LastSeen: nowStr_(),
        TotalIncome: 0, TotalExpense: 0, Balance: 0, DashboardEnabled: true,
        CreatedAt: nowStr_(), UpdatedAt: nowStr_()
      });
      // (no ensureDefaultAccountsForUser_ call here anymore — this user has no
      // spreadsheet yet at this point, so it would just write to the central
      // fallback. provisionUserSpreadsheet_, called below once the lock is
      // released, seeds default accounts straight into their new file instead.)
    }
  } finally { lock.releaseLock(); }

  // Provisioning opens its own lock (see provisionUserSpreadsheet_), so it runs
  // after this function's lock is released — re-entering LockService.getScriptLock()
  // from inside a lock already held by this same execution risks a self-deadlock.
  // Phase 1 only: this creates the user's dedicated spreadsheet and records its ID;
  // getSS_() still points everyone at the shared spreadsheet until Phase 2 lands.
  if (isNewUser) {
    try { provisionUserSpreadsheet_(userId, profile.displayName || 'User'); }
    catch (e) { logAudit_(userId, 'PROVISION_FAILED', userId, '', String(e), 'error', 'provisionUserSpreadsheet_ threw during signup'); }
  }
}

/**
 * PHASE 1 of multi-tenant support (see chat: "สมัครสมาชิกแล้วระบบสร้าง sheet ใหม่ให้เลย").
 * Creates a fully-structured personal spreadsheet for one user — all 14
 * SCHEMAS tabs + headers, default categories, default accounts — and records
 * its ID on that user's row in the shared Users sheet (SpreadsheetID column).
 *
 * Idempotent: a user who already has one gets that ID back, never a second file.
 *
 * IMPORTANT — this only provisions the file. getSS_() still resolves every
 * request to the single shared spreadsheet, so nothing in the app actually
 * reads or writes to this new file yet. That switch-over (Phase 2: make
 * getSS_() look up the right spreadsheet per user) is a separate, larger
 * change — this function is safe to ship and test on its own first.
 */
function provisionUserSpreadsheet_(userId, displayName) {
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var mainSs = getSS_();
    var usersSh = mainSs.getSheetByName(SHEET_NAMES.USERS);
    ensureHeaders_(usersSh, SCHEMAS.Users); // adds SpreadsheetID column if this install predates it

    var rows = sheetToObjects_(usersSh);
    var userRow = rows.filter(function(r) { return r.UserID === userId; })[0];
    if (userRow && userRow.SpreadsheetID) {
      return { success: true, spreadsheetId: userRow.SpreadsheetID, created: false };
    }

    var newSs = SpreadsheetApp.create('Money Manager AI — ' + (displayName || userId));

    Object.keys(SCHEMAS).forEach(function(sheetName) {
      var sh = getOrCreateSheet_(newSs, sheetName);
      ensureHeaders_(sh, SCHEMAS[sheetName]);
    });

    var def = newSs.getSheetByName('Sheet1');
    if (def && newSs.getSheets().length > 1 && def.getLastRow() === 0) {
      try { newSs.deleteSheet(def); } catch (e) {}
    }

    var catSh = newSs.getSheetByName(SHEET_NAMES.CATEGORIES);
    ensureHeaders_(catSh, SCHEMAS.Categories); // kept as an empty tab for schema consistency; Categories itself stays a shared central list (see getUserSS_ comment) — nothing reads this one

    var accSh = newSs.getSheetByName(SHEET_NAMES.ACCOUNTS);
    DEFAULT_ACCOUNTS.forEach(function(a) {
      appendRowObject_(accSh, {
        AccountID: 'ACC-' + Utilities.getUuid().slice(0, 8), UserID: userId,
        AccountName: a[0], AccountType: a[1], OpeningBalance: 0, CurrentBalance: 0,
        Currency: 'THB', Status: 'active', CreatedAt: nowStr_(), UpdatedAt: nowStr_()
      });
    });

    newSs.setSpreadsheetTimeZone(TZ);

    // File organization: Drive/Money Manager AI/UserSheets/<file>, same root
    // folder setupSystem() already keeps Slips/Backups in.
    try {
      var root = ensureDriveFolders_();
      var userFolder = getOrCreateSubfolder_(root, 'UserSheets');
      var file = DriveApp.getFileById(newSs.getId());
      userFolder.addFile(file);
      DriveApp.getRootFolder().removeFile(file);
    } catch (e) {
      logAudit_(userId, 'PROVISION_MOVE_FAILED', newSs.getId(), '', String(e), 'error', 'Could not move new user spreadsheet into UserSheets folder');
    }

    if (userRow) {
      updateRowObject_(usersSh, userRow.__row, { SpreadsheetID: newSs.getId(), UpdatedAt: nowStr_() });
    } else {
      // Defensive fallback — normally ensureUserExists_ has already written this
      // user's row before calling here, but don't let the new file go unrecorded
      // if this is ever called before that.
      appendRowObject_(usersSh, {
        UserID: userId, DisplayName: displayName || 'User', SpreadsheetID: newSs.getId(),
        Status: 'active', FirstSeen: nowStr_(), LastSeen: nowStr_(),
        CreatedAt: nowStr_(), UpdatedAt: nowStr_()
      });
    }

    logAudit_(userId, 'SPREADSHEET_PROVISIONED', newSs.getId(), '', '', 'success',
      'Created dedicated spreadsheet for user (Phase 1 — not yet read/written by the app)');

    return { success: true, spreadsheetId: newSs.getId(), spreadsheetUrl: newSs.getUrl(), created: true };
  } finally {
    lock.releaseLock();
  }
}

function ensureDefaultAccountsForUser_(userId) {
  var ss = getUserSS_(userId);
  var sh = ss.getSheetByName(SHEET_NAMES.ACCOUNTS);

      AccountName: a[0], AccountType: a[1], OpeningBalance: 0, CurrentBalance: 0,

    });

}

function fetchLineProfile_(userId) {
  var token = getConfig_('LINE_CHANNEL_ACCESS_TOKEN');
  if (!token) return {};
  try {
    var resp = UrlFetchApp.fetch('https://api.line.me/v2/bot/profile/' + userId, {
      headers: { Authorization: 'Bearer ' + token }, muteHttpExceptions: true
    });
    if (resp.getResponseCode() === 200) return JSON.parse(resp.getContentText());
  } catch (e) {}
  return {};
}

/**
 * Sends a LINE message. `messageOrText` can be a plain string (wrapped into a text
 * message for backward compatibility with every existing call site), a single LINE
 * message object (flex, text-with-quickReply, etc.), or an array of message objects.
 * This is the single choke point all rich UI (Flex Messages, Quick Reply) flows through.
 */
function replyLine_(replyToken, pushUserId, messageOrText) {
  var token = getConfig_('LINE_CHANNEL_ACCESS_TOKEN');
  if (!token) { logAudit_('SYSTEM', 'LINE_REPLY_SKIPPED', pushUserId || '', '', '', 'error', 'LINE_CHANNEL_ACCESS_TOKEN not configured'); return; }

  var messages;
  if (typeof messageOrText === 'string') {
    messages = [{ type: 'text', text: messageOrText }];
  } else if (Array.isArray(messageOrText)) {
    messages = messageOrText;
  } else {
    messages = [messageOrText];
  }

  var url, payload;
  if (replyToken) {
    url = 'https://api.line.me/v2/bot/message/reply';
    payload = { replyToken: replyToken, messages: messages };
  } else {
    url = 'https://api.line.me/v2/bot/message/push';
    payload = { to: pushUserId, messages: messages };
  }
  var resp = UrlFetchApp.fetch(url, {
    method: 'post', contentType: 'application/json',
    headers: { Authorization: 'Bearer ' + token },
    payload: JSON.stringify(payload), muteHttpExceptions: true
  });
  var code = resp.getResponseCode();
  if (code !== 200) {
    // LINE reply/push failed — log it so this never fails silently again.
    logAudit_(pushUserId || 'SYSTEM', 'LINE_REPLY_FAILED', replyToken || pushUserId || '',
      '', 'HTTP ' + code + ': ' + resp.getContentText(), 'error',
      'Failed to send LINE message: ' + JSON.stringify(messages).slice(0, 200));
    Logger.log('LINE reply/push failed [' + code + ']: ' + resp.getContentText());
  }
}

// 15 minutes — long enough to snap a chart and send it without re-typing "เทรด"
// each time, short enough that a forgotten mode doesn't silently eat every slip
// photo sent hours later.
var TRADE_MODE_TTL_SECONDS_ = 900;

function setTradeMode_(userId, on) {
  var cache = CacheService.getScriptCache();
  var key = 'trademode_' + userId;
  if (on) cache.put(key, '1', TRADE_MODE_TTL_SECONDS_);
  else cache.remove(key);
}

function isInTradeMode_(userId) {

}

/**
 * Records which layer actually handled a free-form text message — the regex
 * commands in handleFinanceCommand_, the AI intent classifier, the open-ended
 * question answerer, a parsed transaction, or nothing at all ('unrecognized').
 * This says nothing on its own; the point is being able to filter/pivot the
 * RoutingLogs sheet later (e.g. "how many messages this week ended up
 * 'unrecognized'", or "which Layer is regex_command actually catching vs. always
 * falling through to ai_intent") to see where real phrasing breaks the routing,
 * instead of only finding out from individual bug reports like this thread's.
 * Deliberately NOT wired into the PIN/help/edit-by-ID commands above — those are
 * exact-match utility commands with no routing ambiguity to measure.
 */
function logCommandRouting_(userId, text, layer, detail) {
  try {
    appendRowObject_(getUserSS_(userId).getSheetByName(SHEET_NAMES.ROUTING_LOGS), {
      ID: 'RT-' + Utilities.getUuid().slice(0, 8), Timestamp: nowStr_(), UserID: userId,
      InputText: text, Layer: layer, Detail: detail || '', CreatedAt: nowStr_()
    });
  } catch (e) {
    // Logging must never be able to break the actual message-handling flow.
    logError_('logCommandRouting_', e);
  }
}

/**
 * Summarizes the last 7 days of RoutingLogs for one user: a count per layer, plus
 * a few actual sample messages from the 'unrecognized' bucket — the layer counts
 * alone tell you HOW OFTEN routing fails, but not WHAT to fix; the samples are
 * literal phrasings worth turning into new regex patterns or intent examples.
 */
function formatRoutingStats_(userId) {
  var sh = getUserSS_(userId).getSheetByName(SHEET_NAMES.ROUTING_LOGS);
  var rows = sheetToObjects_(sh).filter(function(r) { return r.UserID === userId; });
  var cutoff = new Date(Date.now() - 7 * 86400000);
  var recent = rows.filter(function(r) { return new Date(String(r.Timestamp).replace(' ', 'T')) >= cutoff; });
  if (!recent.length) return '📊 สถิติคำสั่ง 7 วันล่าสุด\nยังไม่มีข้อมูล (log เพิ่งเริ่มเก็บ ต้องรอสะสมข้อมูลจากการใช้งานจริงก่อน)';

  var counts = {};
  recent.forEach(function(r) { counts[r.Layer] = (counts[r.Layer] || 0) + 1; });
  var layerLabel = {
    regex_command: '✅ regex ตรงเป๊ะ', ai_intent: '🤖 AI จัดหมวดคำสั่ง',
    ai_question: '💬 คำถามเปิด (ตอบเป็นข้อความ)', transaction_parsed: '💸 บันทึกรายการใหม่',
    unrecognized: '❌ ไม่เข้าใจเลย'
  };
  var lines = ['📊 สถิติคำสั่ง 7 วันล่าสุด (' + recent.length + ' ข้อความ)', ''];
  Object.keys(counts).sort(function(a, b) { return counts[b] - counts[a]; }).forEach(function(layer) {
    var pct = Math.round(counts[layer] / recent.length * 100);
    lines.push((layerLabel[layer] || layer) + ': ' + counts[layer] + ' (' + pct + '%)');
  });

  var unrecognizedSamples = recent.filter(function(r) { return r.Layer === 'unrecognized'; }).slice(-5);
  if (unrecognizedSamples.length) {
    lines.push('', '❌ ตัวอย่างที่ไม่เข้าใจล่าสุด:');
    unrecognizedSamples.forEach(function(r) { lines.push('• "' + r.InputText + '"'); });
  }
  return lines.join('\n');
}

/* ---------- TEXT MESSAGE HANDLING ---------- */
function handleTextMessage_(userId, text, replyToken, eventId) {
  var trimmed = (text || '').trim();

  // Chart-reading mode is a separate menu, not auto-detected per image — a normal
  // payment slip and a trading chart screenshot both arrive as plain LINE images
  // with no reliable visual tell apart from actually reading them (which would
  // mean firing a classification AI call on every single image just to route it).
  // Explicitly entering this mode is one extra text message, but zero extra AI
  // calls and zero ambiguity about which pipeline a photo goes through.
  //
  // The mode is ONE-SHOT: it only affects the very next image (cleared the moment
  // handleTradeChartImage_ starts, see below), not "however many images arrive in
  // the next 15 minutes". Earlier it stayed armed for the full 15-minute window,
  // so a slip photo sent later in that window (after the person had mentally moved
  // on) silently got swallowed as a chart-read instead of recorded as a transaction
  // — and the only way out was typing the exit phrase exactly right, which failed
  // silently on close-but-not-exact wording like "ออกจากระบบเทรด". One-shot removes
  // the need to remember to exit at all for the normal case; the 15-minute cap in
  // setTradeMode_/isInTradeMode_ now only matters as a safety net if "เทรด" was typed
  // but no image ever followed.
  if (/^(เทรด|โหมดเทรด|เข้าโหมดเทรด)$/i.test(trimmed)) {
    setTradeMode_(userId, true);
    replyLine_(replyToken, userId, {
      type: 'text',
      text: '📈 โหมดวิเคราะห์กราฟทอง (XAUUSD) — ใช้ได้กับรูปถัดไปรูปเดียว\nส่งรูปกราฟเข้ามาได้เลย จะเช็คเฟส AMD (Accumulation/Manipulation/Distribution) ก่อน แล้วเช็คเงื่อนไข ICT/SMC (Order Block / FVG / Liquidity, RR ≥ 1:1.5, London/NY Killzone) แล้วบอกจุดเข้าถ้าเข้าเงื่อนไขจริง ๆ (ต้องอยู่ในเฟส Distribution เท่านั้น) หลังจากนั้นกลับสู่โหมดบันทึกรายรับ-รายจ่ายปกติเองอัตโนมัติ ไม่ต้องพิมพ์ออก',
      quickReply: { items: [{ type: 'action', action: { type: 'message', label: '❌ ยกเลิก (ไม่ส่งรูป)', text: 'ออกจากโหมดเทรด' } }] }
    });
    return;
  }
  // Widened to also catch "ออกจากระบบเทรด" / "ยกเลิกโหมดเทรด" etc. — with the mode now
  // one-shot this is mainly for "เปลี่ยนใจ ไม่ส่งรูปแล้ว" before any image goes out.
  if (/^(ออก(จาก)?|ยกเลิก)(โหมด|ระบบ)?เทรด$/i.test(trimmed)) {
    setTradeMode_(userId, false);
    replyLine_(replyToken, userId, '↩️ ยกเลิกโหมดเทรดแล้ว กลับสู่โหมดบันทึกรายรับ-รายจ่ายปกติ ส่งรูปสลิปได้ตามปกติ');
    return;
  }

  if (/^ขอรหัส\s*pin$/i.test(trimmed) || trimmed === 'รหัส PIN' || trimmed === 'รหัสเข้าระบบ') {
    var pin = ensurePinAssigned_(userId);
    replyLine_(replyToken, userId, '🔑 รหัส PIN สำหรับเข้า Dashboard ของคุณคือ: ' + pin);
    return;
  }
  if (/^รีเซ็ต\s*pin$/i.test(trimmed) || trimmed === 'ขอรหัสใหม่') {
    var newPin = resetUserPin_(userId);
    replyLine_(replyToken, userId, '🔄 รีเซ็ตรหัส PIN แล้ว รหัสใหม่ของคุณคือ: ' + newPin + '\nรหัสเก่าใช้ไม่ได้อีกต่อไป');
    return;
  }
  if (trimmed === 'วิธีส่งสลิป') {
    replyLine_(replyToken, userId, '📷 วิธีส่งสลิป\nแค่ถ่ายรูปหรือแคปหน้าจอสลิปโอนเงิน/ใบเสร็จ แล้วส่งเข้าแชทนี้ได้เลย ระบบจะอ่านจำนวนเงินและหมวดหมู่ให้อัตโนมัติ');
    return;
  }
  if (/^สถิติ(คำสั่ง|routing)?$/i.test(trimmed)) {
    replyLine_(replyToken, userId, formatRoutingStats_(userId));
    return;
  }
  if (/^แก้รายการล่าสุด/.test(trimmed)) { replyLine_(replyToken, userId, editLatestTransactionPrompt_(userId)); return; }
  var editMatch = trimmed.match(/^แก้รายการ\s+(TX-[\w-]+)/);
  if (editMatch) { replyLine_(replyToken, userId, editByIdPrompt_(userId, editMatch[1])); return; }
  // Handles the "แก้ TX-xxx: [ข้อความใหม่]" format that describeTransactionForEdit_
  // tells people to use — previously nothing actually matched this pattern, so
  // typing it exactly as instructed just fell through to being parsed as a brand
  // new transaction (a dead-end "multi-step, then nothing happens" edit flow).
  var freeTextEditMatch = trimmed.match(/^แก้\s+(TX-[\w-]+)\s*[:：]\s*(.+)$/);
  if (freeTextEditMatch) { replyLine_(replyToken, userId, applyFreeTextEdit_(userId, freeTextEditMatch[1], freeTextEditMatch[2])); return; }
  // Natural-language finance commands are handled before transaction parsing.
  // This prevents questions such as "วันนี้มีรายจ่ายอะไรบ้าง" from being treated
  // as a new transaction.
  var commandResult = handleFinanceCommand_(userId, trimmed);
  if (commandResult !== null) {
    logCommandRouting_(userId, trimmed, 'regex_command', '');
    replyLine_(replyToken, userId, commandResult);
    return;
  }

  // The regex patterns in handleFinanceCommand_ only catch phrasings that were
  // typed out ahead of time — anything reordered, reworded, or with extra filler
  // words ("วันนี้จ่ายอะไรไปบ้างนะ") slips through. Before giving up and assuming
  // free text must be a new transaction, ask the AI itself what the user wants:
  // list something, check a balance, or actually log an expense. This is a strict
  // superset of the regex layer — if the AI isn't confident, it returns
  // intent:"unknown" and we fall through to the existing question/transaction path
  // exactly as before, so this can only add coverage, never remove it.
  var aiCommandResult = handleFinanceIntentAI_(userId, trimmed);
  if (aiCommandResult !== null) {
    replyLine_(replyToken, userId, aiCommandResult);
    return;
  }

  // If this looks like a question, send it to the finance AI before attempting
  // transaction parsing. This allows LINE users to ask normal questions such as
  // "เงินเดือนผมพอไหม", "ทำไมเดือนนี้ใช้เงินเยอะ" or "เดือนนี้เหลือเท่าไหร่".
  if (looksLikeFinanceQuestion_(trimmed)) {
    logCommandRouting_(userId, trimmed, 'ai_question', '');
    var naturalAnswerFlex = answerNaturalFinanceQuestionFlex_(userId, trimmed);
    replyLine_(replyToken, userId, naturalAnswerFlex);
    return;
  }

  var aiResult = parseTransactionText_(userId, trimmed);
  if (!aiResult) {
    logCommandRouting_(userId, trimmed, 'unrecognized', '');
    replyLine_(replyToken, userId, 'ขออภัย ไม่เข้าใจข้อความนี้ ลองพิมพ์ เช่น "กาแฟ 65" หรือ "เติมน้ำมัน 300"');
    return;
  }
  logCommandRouting_(userId, trimmed, 'transaction_parsed', aiResult.type || '');
  applyMerchantMemory_(userId, aiResult);
  var result = saveTransactionFromAI_(userId, aiResult, 'text', eventId, trimmed, null, null);
  var textReplyMsgs = aiResult._merchantMemory
    ? [{ type: 'text', text: formatMerchantMemoryNote_(aiResult._merchantMemory) }, result.message]
    : result.message;
  replyLine_(replyToken, userId, textReplyMsgs);
}

var VALID_TX_TYPES_ = ['expense', 'income', 'transfer'];

/**
 * Validates the AI's parsed JSON before it's allowed anywhere near saveTransactionFromAI_.
 * A structurally-valid JSON object with a nonsense type, a non-positive amount, or a
 * malformed date is just as unusable as no JSON at all — treat it as a parse failure
 * rather than saving a corrupted transaction (e.g. an expense of ฿0).
 */
function validateParsedTransaction_(parsed) {
  if (!parsed || typeof parsed !== 'object') return false;
  if (VALID_TX_TYPES_.indexOf(parsed.type) === -1) return false;
  var amount = Number(parsed.amount);
  if (!isFinite(amount) || amount <= 0) return false;
  if (parsed.date) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(parsed.date))) return false;
    // Safety net for the Buddhist-era-year mistake even after the prompt fix — a Thai
    // slip year (e.g. 2569 BE) leaking through un-converted would otherwise pass the
    // regex above and silently save a date ~543 years off.
    var yr = Number(String(parsed.date).slice(0, 4));
    var curYr = Number(Utilities.formatDate(new Date(), TZ, 'yyyy'));
    if (yr > curYr + 1 || yr < curYr - 5) return false;
  }
  // Do not reject transfers just because the AI cannot know which of the user's
  // own destination accounts should be selected. The web form already lets the
  // user choose the destination account after OCR. Requiring both fields here
  // made a valid transfer slip look like an AI failure.
  return true;
}

function parseTransactionText_(userId, text) {
  var prompt = buildTextParsePrompt_(text);
  var raw = callGroqChat_(prompt, false);
  var parsed = safeParseAIJson_(raw);
  var valid = validateParsedTransaction_(parsed);
  logAiCall_(userId, 'text', text, raw, parsed,
    parsed ? parsed.confidence : 0,
    valid ? 'success' : 'error',
    valid ? '' : (parsed ? 'validation failed: bad type/amount/date' : 'parse failed'));
  return valid ? parsed : null;
}

function buildTextParsePrompt_(text) {
  var today = Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd');
  return 'วันนี้คือวันที่ ' + today + ' (Asia/Bangkok).\n' +
    'วิเคราะห์ข้อความการเงินภาษาไทยต่อไปนี้และแปลงเป็น JSON เท่านั้น ห้ามมีข้อความอื่นนอก JSON ห้ามใช้ Markdown:\n' +
    'ข้อความ: "' + text + '"\n\n' +
    'รูปแบบ JSON ที่ต้องการ:\n' +
    '{"type":"expense|income|transfer","amount":number,"date":"YYYY-MM-DD","time":"HH:mm หรือ ว่าง",' +
    '"category":"string","subCategory":"string","description":"string","merchant":"string",' +
    '"account":"เงินสด|ธนาคาร|Wallet|บัตร","paymentMethod":"cash|bank|wallet|card","confidence":0.0-1.0,' +
    '"transferFromAccount":"string ว่างถ้าไม่ใช่โอน","transferToAccount":"string ว่างถ้าไม่ใช่โอน"}\n' +
    'หมวดหมู่ที่ใช้ได้: ' + CATEGORY_LIST_ + '\n' +
    'ถ้าไม่มีจำนวนเงินชัดเจนให้ confidence ต่ำ';
}

/**
 * Looks up the user's own transaction history for a Merchant name the AI just
 * read off a slip/text message ("ทันต์", "ร้านลุงหมู", ...) and, if that name has
 * shown up before, overrides the AI's freshly-guessed category, description, and
 * payment method with whichever value was used most often for that same name in
 * the past — e.g. always confirming "ทันต์" as หมวด "อาหาร", รายละเอียด "ค่าเนื้อ",
 * ช่องทาง "โอนธนาคาร" eventually makes every future transaction with merchant "ทันต์"
 * fill in the same way, without the AI having to re-guess (and possibly mis-guess)
 * any of the three from scratch every time.
 *
 * Mutates and returns `ai`. Sets ai._merchantMemory ({merchant, changes:[...]})
 * when it actually changed at least one field, so the caller can tell the user
 * why — leaves it undefined otherwise (no history for this name, or the AI
 * already agreed with history on every field).
 */
/** Strips Thai honorific titles and collapses whitespace/case, so the same
 *  person read as "นางสาว นฤมล โชครุ่ง" one morning and "นฤมล โชครุ่ง" the next
 *  still matches as the same merchant for history lookups. */
function normalizeMerchantName_(name) {
  return String(name || '').trim()
    .replace(/^(นาย|นาง|นางสาว|คุณ)\s*/, '')
    .replace(/\s+/g, ' ')
    .toLowerCase();
}

/** Classic edit-distance: minimum single-character insertions/deletions/
 *  substitutions to turn `a` into `b`. Used to tell "same name, OCR typo"
 *  apart from "actually a different name". */
function levenshteinDistance_(a, b) {
  a = String(a || ''); b = String(b || '');
  var m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  var prev = [];
  for (var j = 0; j <= n; j++) prev[j] = j;
  for (var i = 1; i <= m; i++) {
    var curr = [i];
    for (var j = 1; j <= n; j++) {
      var cost = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
      curr[j] = Math.min(curr[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost);
    }
    prev = curr;
  }
  return prev[n];
}

/** True if two already-normalized merchant names are close enough to
 *  plausibly be the same real person/shop despite a few OCR misreads (the
 *  Thai-name equivalent of "อัดสโมสร" vs "อ๊อดสโคม" vs "อิดสโดม" all being
 *  meant as the same biller). Tolerance scales with name length so short
 *  names still need to be near-exact while longer ones can absorb a couple
 *  of wrong characters. */
function isSimilarMerchant_(a, b) {
  if (!a || !b) return false;
  if (a === b) return true;
  var maxLen = Math.max(a.length, b.length);
  if (maxLen < 3) return false; // too short to safely fuzzy-match without false positives
  var allowed = Math.max(1, Math.floor(maxLen * 0.25)); // ~25% of characters can differ
  return levenshteinDistance_(a, b) <= allowed;
}

function applyMerchantMemory_(userId, ai) {
  var merchant = String((ai && ai.merchant) || '').trim();
  if (!merchant) return ai;

  var merchantKey = normalizeMerchantName_(merchant);
  var allTx = getUserTransactions_(userId).filter(function(t) { return t.Status !== 'cancelled'; });

  var history = allTx.filter(function(t) { return normalizeMerchantName_(t.Merchant) === merchantKey; });
  var matchedName = history.length ? merchant : null;

  // No exact match — look for a past merchant name close enough to be an OCR
  // misspelling of the same one, and use whichever past spelling has been
  // seen the most (a stronger signal than whichever happens to be first).
  if (!history.length) {
    var candidateCounts = {};
    allTx.forEach(function(t) {
      var name = String(t.Merchant || '').trim();
      var key = normalizeMerchantName_(name);
      if (key && isSimilarMerchant_(merchantKey, key)) {
        candidateCounts[key] = candidateCounts[key] || { name: name, count: 0 };
        candidateCounts[key].count++;
      }
    });
    var candidateKeys = Object.keys(candidateCounts);
    if (candidateKeys.length) {
      candidateKeys.sort(function(x, y) { return candidateCounts[y].count - candidateCounts[x].count; });
      var bestKey = candidateKeys[0];
      matchedName = candidateCounts[bestKey].name;
      history = allTx.filter(function(t) { return normalizeMerchantName_(t.Merchant) === bestKey; });
    }
  }

  if (!history.length) return ai;

  var changes = [];
  var fieldsToLearn = [
    // Merchant spelling first: once a spelling has been used/confirmed before,
    // reuse it instead of trusting this run's OCR again (this is what fixes
    // "same person, different misspelling every slip").
    { sheetField: 'Merchant', aiField: 'merchant', label: 'ชื่อ', formatValue: function(v) { return v; } },
    { sheetField: 'Category', aiField: 'category', label: 'หมวด', formatValue: function(v) { return v; } },
    { sheetField: 'Description', aiField: 'description', label: 'รายละเอียด', formatValue: function(v) { return v; } },
    { sheetField: 'PaymentMethod', aiField: 'paymentMethod', label: 'ช่องทางจ่าย', formatValue: paymentMethodLabel_ }
  ];
  fieldsToLearn.forEach(function(f) {
    var best = mostCommonNonEmptyValue_(history, f.sheetField);
    if (!best) return;
    var current = String(ai[f.aiField] || '').trim();
    if (current === best.value) return;
    ai[f.aiField] = best.value;
    changes.push({ label: f.label, displayValue: f.formatValue(best.value), count: best.count });
  });

  if (changes.length) {
    ai._merchantMemory = { merchant: merchant, matchedAs: (matchedName && matchedName !== merchant) ? matchedName : null, changes: changes };
    // Real history backing at least one field is at least as trustworthy as a
    // confident AI read — bump confidence so the pending card also skips the
    // quick-tap category grid (see CATEGORY_GRID_CONFIDENCE_THRESHOLD_).
    ai.confidence = Math.max(Number(ai.confidence || 0), 0.9);
  }
  return ai;
}

/** Most common non-empty value of `field` across `rows`, with its occurrence count. */
function mostCommonNonEmptyValue_(rows, field) {
  var counts = {};
  rows.forEach(function(r) {
    var v = String(r[field] || '').trim();
    if (v) counts[v] = (counts[v] || 0) + 1;
  });
  var bestValue = null, bestCount = 0;
  Object.keys(counts).forEach(function(v) {
    if (counts[v] > bestCount) { bestCount = counts[v]; bestValue = v; }
  });
  return bestValue ? { value: bestValue, count: bestCount } : null;
}

/** Maps a stored paymentMethod code ('cash'/'bank'/'wallet'/'card') to its Thai account label. */
function paymentMethodLabel_(code) {
  var match = DEFAULT_ACCOUNTS.filter(function(pair) { return pair[1] === code; })[0];
  return match ? match[0] : code;
}

/** Thai note shown alongside the transaction card when applyMerchantMemory_ changed any field. */
function formatMerchantMemoryNote_(mem) {
  var parts = mem.changes.map(function(c) {
    return c.label + ' "' + c.displayValue + '" (' + c.count + ' ครั้ง)';
  });
  var matchedNote = mem.matchedAs ? ' (เทียบใกล้เคียงกับ "' + mem.matchedAs + '" ที่เคยบันทึกไว้)' : '';
  return '🧠 จำได้ว่า "' + mem.merchant + '"' + matchedNote + ' เคยบันทึกเป็น ' + parts.join(', ') +
    ' — ใช้ข้อมูลนี้ให้อัตโนมัติ (กด "แก้ไข" ได้ถ้าไม่ตรง)';
}

/* ---------- IMAGE / SLIP HANDLING ---------- */
function handleImageMessage_(userId, messageId, replyToken, eventId) {
  if (isInTradeMode_(userId)) { handleTradeChartImage_(userId, messageId, replyToken, eventId); return; }

  var imageBlob = downloadLineImage_(messageId);
  if (!imageBlob) { replyLine_(replyToken, userId, 'ไม่สามารถดาวน์โหลดรูปได้ กรุณาลองใหม่'); return; }

  // Save the slip to Drive FIRST, unconditionally — before we ever touch the AI. That
  // way a failed/garbled AI response can never cause the image itself to be lost; only
  // the structured data extraction is best-effort.
  var driveInfo;
  try {
    driveInfo = saveSlipToDrive_(imageBlob, userId);
  } catch (e) {
    logError_('saveSlipToDrive_', e);
    replyLine_(replyToken, userId, 'ไม่สามารถบันทึกรูปสลิปได้ กรุณาลองใหม่อีกครั้ง');
    return;
  }

  var aiResult = parseSlipImage_(userId, imageBlob);
  if (!aiResult) {
    // AI couldn't read (or produced an invalid) result — the slip image is already
    // safely stored, so create an empty pending transaction that points at it instead
    // of just telling the user to re-type everything from scratch.
    var txId = createEmptyPendingTransactionForSlip_(userId, eventId, driveInfo);
    replyLine_(replyToken, userId,
      '⚠️ ไม่สามารถอ่านสลิปนี้ด้วย AI ได้ แต่บันทึกรูปไว้แล้ว (รายการ ' + txId + ')\n' +
      'กรุณาเข้า Dashboard เพื่อกรอกจำนวนเงิน/ประเภท/หมวดหมู่ด้วยตนเอง หรือพิมพ์รายการใหม่ เช่น "โอนเงิน 300 ธนาคาร"');
    return;
  }

  // Same slip submitted twice through different channels (e.g. uploaded via the
  // web dashboard earlier, then this same photo sent here) — catch it by the
  // bank's own reference number on the slip, rather than silently recording it
  // again and double-counting the balance effect.
  if (aiResult.referenceNumber) {
    var existingBySlip = findTransactionBySlipRef_(userId, aiResult.referenceNumber);
    if (existingBySlip) {
      replyLine_(replyToken, userId,
        '⚠️ สลิปนี้เคยถูกบันทึกไปแล้ว (รายการ ' + existingBySlip.ID + ', ' + existingBySlip.TransactionDate +
        ', ฿' + existingBySlip.Amount + ', สถานะ: ' + (existingBySlip.Status === 'confirmed' ? 'ยืนยันแล้ว' : existingBySlip.Status === 'pending' ? 'รอยืนยัน' : existingBySlip.Status) +
        ') ไม่ได้บันทึกซ้ำให้');
      return;
    }
  }

  applyMerchantMemory_(userId, aiResult);
  var result = saveTransactionFromAI_(userId, aiResult, 'slip', eventId, '', driveInfo.url, driveInfo.fileId);
  var imageReplyMsgs = aiResult._merchantMemory
    ? [{ type: 'text', text: formatMerchantMemoryNote_(aiResult._merchantMemory) }, result.message]
    : result.message;
  replyLine_(replyToken, userId, imageReplyMsgs);
}

/**
 * The chart-reading counterpart to the slip flow above, entered via "เทรด"/"โหมดเทรด"
 * (see setTradeMode_/isInTradeMode_). Doesn't touch the Transactions sheet at all —
 * a trade signal isn't income/expense data, so there's nothing to save; this only
 * reads the chart and replies with a signal card. Reuses downloadLineImage_ and
 * callGroqVision_ from the slip pipeline since "read an image with Groq" is the same
 * mechanic either way — only the prompt and the reply card differ.
 */
function handleTradeChartImage_(userId, messageId, replyToken, eventId) {
  // One-shot: clear immediately, before any download/AI call, so this mode can never
  // apply to more than the one image that triggered it — including if the download
  // or AI call below fails/throws.
  setTradeMode_(userId, false);

  var imageBlob = downloadLineImage_(messageId);
  if (!imageBlob) { replyLine_(replyToken, userId, 'ไม่สามารถดาวน์โหลดรูปได้ กรุณาลองใหม่'); return; }

  var base64 = Utilities.base64Encode(imageBlob.getBytes());
  var mimeType = imageBlob.getContentType() || 'image/jpeg';
  var raw, parsed, errMsg = '';
  try {
    raw = callGroqVision_(buildTradeChartPrompt_(), base64, mimeType);
    parsed = safeParseAIJson_(raw);
  } catch (e) {
    errMsg = String(e);
    logError_('handleTradeChartImage_', e);
  }

  logAiCall_(userId, 'trade-chart', '[chart image ' + messageId + ']', raw, parsed,
    parsed ? Number(parsed.confidence || 0) : 0, parsed ? 'success' : 'error', errMsg);

  if (!parsed || typeof parsed.setupValid !== 'boolean') {
    replyLine_(replyToken, userId,
      '⚠️ อ่านกราฟนี้ไม่สำเร็จ ลองส่งภาพที่เห็นแกนราคา/เวลาชัดเจนกว่านี้ หรือครอปให้เห็นทั้ง Order Block / FVG / Liquidity ที่ indicator ขีดไว้');
    return;
  }
  replyLine_(replyToken, userId, buildTradeSignalFlex_(parsed));
}

/**
 * Encodes Peter's own written XAUUSD scalping rules (1% risk/trade, 3% daily loss
 * cap, ICT/SMC structure, RR ≥ 1:1.5) as the AI's grading criteria — it's told to
 * grade the chart against these, not to freelance a setup. setupValid:false is a
 * completely normal, common answer; the AI is explicitly told not to force an
 * entry that doesn't actually meet the structural/RR rules.
 *
 * AMD gate (Accumulation/Manipulation/Distribution) runs FIRST, before the OB/FVG/RR
 * checks: the chart is classified into one of accumulation/manipulation/distribution/
 * unclear, and setupValid can only be true when the phase is "distribution" — i.e. a
 * liquidity sweep (manipulation) has already been followed by a confirmed displacement
 * out of the range. A sweep alone (manipulation, no confirmed follow-through yet) or a
 * still-ranging chart (accumulation) is explicitly not tradeable under this system.
 *
 * Session (London/New York Killzone) is reported via inKillzone/session but does
 * NOT gate setupValid — it used to be a hard blocker (rule 1 below required it),
 * which meant asking for a read outside killzone hours returned "ยังไม่เข้าเงื่อนไข"
 * with no actual analysis, even when the structure/RR were fine. Now a valid
 * structural setup is still reported as valid any time of day; being outside the
 * killzone is surfaced as a warning on the card instead (see buildTradeSignalFlex_),
 * so it's information Peter can weigh himself rather than the bot silently refusing
 * to look at the chart.
 */
function buildTradeChartPrompt_() {
  var nowUtc = Utilities.formatDate(new Date(), 'Etc/UTC', "yyyy-MM-dd'T'HH:mm'Z'");
  return 'คุณคือผู้ช่วยเช็คกราฟราคาทอง (XAUUSD) ตามระบบเทรดของผู้ใช้คนนี้โดยเฉพาะ (ICT/SMC + AMD + scalping) ' +
    'เวลาปัจจุบัน (UTC) คือ ' + nowUtc + ' ใช้ประกอบการระบุ session เท่านั้น (ไม่ใช้ตัดสิน valid/invalid) ' +
    'ถ้ากราฟไม่มีแกนเวลาให้ระบุ session:"unknown", inKillzone:false\n\n' +
    'ขั้นที่ 1 — จำแนกเฟส AMD ของกราฟนี้ก่อนเสมอ (amdPhase) ตามนิยามนี้เท่านั้น:\n' +
    '- "accumulation": ราคาเคลื่อนไหวแกว่งอยู่ในกรอบ (range) มี high/low ของกรอบพอสังเกตได้ ยังไม่มีการแหกกรอบ ยังไม่มีทิศทางชัดเจน\n' +
    '- "manipulation": ราคาเพิ่งแหกทะลุ high หรือ low ของกรอบไปกวาดสภาพคล่อง (liquidity sweep) แล้วมีทีท่าจะย้อนกลับ แต่ยังไม่เห็นแท่งเทียน/โครงสร้างยืนยันการวิ่งต่อไปในทิศตรงข้ามอย่างชัดเจน\n' +
    '- "distribution": หลังจากกวาดสภาพคล่อง (manipulation) แล้ว ราคาวิ่งออกจากกรอบเดิมไปในทิศทางเดียวอย่างชัดเจน (มักมีแท่งเทียน/แท่ง displacement ขนาดใหญ่กว่าปกติยืนยัน)\n' +
    '- "unclear": อ่านโครงสร้างราคาไม่ได้ชัดเจนพอที่จะจัดเฟส (เช่น กราฟไม่มีข้อมูลพอ)\n\n' +
    'กฎที่ใช้ตัดสิน setupValid อย่างเคร่งครัด ห้ามยืดหยุ่นเอง (session ไม่เกี่ยวกับข้อนี้):\n' +
    '0. ห้าม setupValid:true ถ้า amdPhase เป็น "accumulation", "unclear" ยังไม่มีทิศทางที่ยืนยันแล้วให้ผ่าน — ยังไม่ใช่จังหวะเข้า ให้รอ\n' +
    '   ถ้า amdPhase เป็น "manipulation" (เพิ่งกวาดสภาพคล่อง แต่ยังไม่เห็น displacement ยืนยันทิศทาง) ก็ยัง setupValid:false เช่นกัน — sweep เพียงอย่างเดียวไม่ใช่การยืนยัน ต้องรอเฟส distribution ก่อน\n' +
    '   เฉพาะกรณี amdPhase เป็น "distribution" เท่านั้นที่พิจารณาข้อ 1-2 ต่อไปได้\n' +
    '1. ต้องเห็นโครงสร้างราคาที่รองรับอย่างน้อยหนึ่งใน: Order Block (โซนแท่งเทียนสุดท้ายก่อนราคาพุ่งทะลุ), ' +
    'Fair Value Gap (ช่องว่างราคาที่ยังไม่ถูกเติมกลับ), Liquidity Sweep (ราคาแหกแนวรับ/ต้านเดิมแล้วย้อนกลับทันที) — ' +
    'ถ้ากราฟมีการขีดโซนเหล่านี้ไว้อยู่แล้ว (จาก indicator ของผู้ใช้) ให้ใช้ข้อมูลนั้นเป็นหลัก\n' +
    '2. Risk:Reward ของจุดเข้า/SL/TP ที่เหมาะสมที่สุดต้องไม่ต่ำกว่า 1:1.5 ถ้าคำนวณได้ต่ำกว่านี้ ให้ setupValid:false\n' +
    '3. ถ้าไม่เข้าเงื่อนไขข้อใดข้อหนึ่งข้างต้น (รวมข้อ 0) ให้ setupValid:false และอธิบายในเหตุผลว่าติดข้อไหน ห้ามฝืนหาจุดเข้าทั้งที่ไม่เข้าเงื่อนไข ' +
    '(setupValid:false เป็นคำตอบปกติ ไม่ต้องพยายามหาเหตุผลให้มันเข้าเงื่อนไข)\n\n' +
    'เมื่อ setupValid เป็น false ให้พยายามประมาณ "แนวราคาที่น่าสังเกต" ให้ผู้ใช้เห็นภาพเสมอ (แยกจากสัญญาณที่ยืนยันแล้วโดยสิ้นเชิง):\n' +
    '- ถ้า amdPhase เป็น "distribution" แต่แค่ติดเกณฑ์ OB/FVG ไม่ชัดหรือ RR ไม่ถึง: ให้ประมาณจุด entry/stopLoss/takeProfit แบบคร่าว ๆ จากโครงสร้างที่เห็นจริง ' +
    '(เช่น ใช้จุด sweep เป็นฐานของ SL, ใช้ swing ล่าสุดเป็นแนว TP อ้างอิง) แล้วตั้ง estimateAvailable:true — ตัวเลขนี้เป็นแค่แนวสังเกต ไม่ใช่สัญญาณยืนยัน ห้ามปัดตัวเลขให้ RR ผ่าน 1.5 ปลอม ๆ ใส่ RR จริงตามที่คำนวณได้แม้จะต่ำกว่าเกณฑ์\n' +
    '- ถ้า amdPhase เป็น "accumulation", "manipulation" หรือ "unclear" หรือกราฟไม่มีโครงสร้างพอจะประมาณอะไรได้เลย: ' +
    'ให้ estimateAvailable:false และใส่ entry/stopLoss/takeProfit/riskRewardRatio เป็น 0 ทั้งหมด\n\n' +
    'แยกต่างหาก — รายงาน session ตามความจริงเสมอ (ไม่ทำให้ setupValid เป็น false): ' +
    'inKillzone:true ถ้าเวลาปัจจุบันอยู่ในช่วง London Killzone หรือ New York Killzone, ไม่งั้น inKillzone:false\n\n' +
    'ตอบเป็น JSON เท่านั้น ห้ามมีข้อความอื่นนอก JSON ห้ามใช้ Markdown โครงสร้าง:\n' +
    '{"amdPhase":"accumulation|manipulation|distribution|unclear","setupValid":boolean,"estimateAvailable":boolean,"direction":"buy|sell|none",' +
    '"entry":number,"stopLoss":number,"takeProfit":number,' +
    '"riskRewardRatio":number,"session":"London|New York|Asian|Overlap|unknown","inKillzone":boolean,"conceptsFound":["string"],' +
    '"reason":"string (สั้น กระชับ อธิบายเฟส AMD ที่เจอ และติดเงื่อนไขไหนหรือทำไมถึงเข้าได้)","confidence":number (0.0-1.0)}';
}

/** Trade signal card — same dark FLEX_THEME_ used by every other card in this bot. */
function buildTradeSignalFlex_(sig) {
  var valid = sig.setupValid === true;
  var isBuy = sig.direction === 'buy';
  var directionColor = isBuy ? FLEX_THEME_.income : FLEX_THEME_.expense;
  var directionLabel = isBuy ? '🟢 BUY' : sig.direction === 'sell' ? '🔴 SELL' : '—';
  var outsideKillzone = valid && sig.inKillzone === false;

  var amdLabel = { accumulation: '🟡 Accumulation (สะสม — รอ)', manipulation: '🟠 Manipulation (เพิ่งกวาดสภาพคล่อง — รอยืนยัน)',
    distribution: '🔵 Distribution (พุ่งออกจากกรอบแล้ว)', unclear: '⚪ ไม่ชัดเจน' }[sig.amdPhase] || '⚪ ไม่ระบุ';

  var bodyContents = [
    { type: 'text', text: valid ? '✅ เข้าเงื่อนไข' : '❌ ยังไม่เข้าเงื่อนไข', weight: 'bold', size: 'lg',
      color: valid ? FLEX_THEME_.income : FLEX_THEME_.pending },
    { type: 'text', text: 'เฟส AMD: ' + amdLabel, size: 'xs', color: FLEX_THEME_.textDim, margin: 'xs' },
    { type: 'text', text: 'session: ' + (sig.session || 'unknown'), size: 'xs', color: FLEX_THEME_.textDim, margin: 'xs' }
  ];

  if (outsideKillzone) {
    bodyContents.push({ type: 'text', text: '⚠️ นอกช่วง London/NY Killzone ที่ระบบใช้ backtest ไว้ — โครงสร้าง/RR ผ่านเกณฑ์ แต่ความผันผวนนอกช่วงนี้อาจต่างจากที่คุ้นเคย', size: 'xxs', color: FLEX_THEME_.pending, margin: 'sm', wrap: true });
  }

  if (valid) {
    bodyContents.push({ type: 'separator', margin: 'lg', color: FLEX_THEME_.separator });
    bodyContents.push({ type: 'text', text: directionLabel + '  XAUUSD', weight: 'bold', size: 'xxl', color: directionColor, margin: 'lg' });
    bodyContents.push({
      type: 'box', layout: 'vertical', margin: 'lg', spacing: 'sm', contents: [
        flexRow_('จุดเข้า (Entry)', String(sig.entry)),
        flexRow_('Stop Loss', String(sig.stopLoss)),
        flexRow_('Take Profit', String(sig.takeProfit)),
        flexRow_('Risk:Reward', '1 : ' + Number(sig.riskRewardRatio || 0).toFixed(2))
      ]
    });
    if (sig.conceptsFound && sig.conceptsFound.length) {
      bodyContents.push({ type: 'text', text: 'พบ: ' + sig.conceptsFound.join(', '), size: 'xs', color: FLEX_THEME_.textDim, margin: 'md', wrap: true });
    }
  } else if (sig.estimateAvailable === true) {
    bodyContents.push({ type: 'separator', margin: 'lg', color: FLEX_THEME_.separator });
    bodyContents.push({ type: 'text', text: '👁️ แนวราคาที่น่าสังเกต (ประมาณการ ไม่ใช่สัญญาณยืนยัน)', weight: 'bold', size: 'sm', color: FLEX_THEME_.pending, margin: 'lg', wrap: true });
    bodyContents.push({
      type: 'box', layout: 'vertical', margin: 'md', spacing: 'sm', contents: [
        flexRow_('แนวเข้า (โดยประมาณ)', String(sig.entry)),
        flexRow_('แนว SL (โดยประมาณ)', String(sig.stopLoss)),
        flexRow_('แนว TP (โดยประมาณ)', String(sig.takeProfit)),
        flexRow_('R:R (โดยประมาณ)', '1 : ' + Number(sig.riskRewardRatio || 0).toFixed(2))
      ]
    });
    bodyContents.push({ type: 'text', text: '⚠️ ยังไม่เข้าเกณฑ์จริง (ดูเหตุผลด้านล่าง) ใช้เป็นแนวสังเกตเท่านั้น ห้ามใช้เป็นจุดเข้าออเดอร์จริง', size: 'xxs', color: FLEX_THEME_.pending, margin: 'sm', wrap: true });
  }

  bodyContents.push({ type: 'separator', margin: 'lg', color: FLEX_THEME_.separator });
  bodyContents.push({ type: 'text', text: sig.reason || '-', size: 'xs', color: FLEX_THEME_.textMain, margin: 'md', wrap: true });
  bodyContents.push({ type: 'text', text: 'AI อ่านกราฟ ไม่ใช่คำแนะนำการลงทุน ตรวจสอบก่อนเข้าออเดอร์จริงเสมอ', size: 'xxs', color: FLEX_THEME_.textDim, margin: 'md', wrap: true });

  return {
    type: 'flex',
    altText: (valid ? '✅ สัญญาณเทรดทอง: ' + directionLabel + (outsideKillzone ? ' (นอก Killzone)' : '') : '❌ กราฟยังไม่เข้าเงื่อนไข'),
    contents: {
      type: 'bubble', size: 'kilo',
      header: flexHeader_('📈 วิเคราะห์กราฟทอง XAUUSD'),
      body: { type: 'box', layout: 'vertical', backgroundColor: FLEX_THEME_.bodyBg, paddingAll: '16px', contents: bodyContents,
        borderColor: FLEX_THEME_.border, borderWidth: '1px' }
    }
  };
}

/**
 * Creates a placeholder 'pending' transaction row for a slip image the AI failed to
 * parse/validate, so the uploaded slip is always traceable to a transaction record
 * that the user (or an editor via the Dashboard) can fill in later. No balance effects
 * are applied since the transaction stays 'pending' until confirmed with real values.
 */
function createEmptyPendingTransactionForSlip_(userId, eventId, driveInfo) {
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    var ss = getUserSS_(userId);
    var txId = generateTransactionId_(userId);
    var displayName = getUserDisplayName_(userId);
    var now = new Date();
    var txSh = ss.getSheetByName(SHEET_NAMES.TX);
    appendRowObject_(txSh, {
      ID: txId, EventID: eventId || '', Timestamp: nowStr_(),
      TransactionDate: Utilities.formatDate(now, TZ, 'yyyy-MM-dd'),
      TransactionTime: Utilities.formatDate(now, TZ, 'HH:mm'),
      UserID: userId, DisplayName: displayName,
      Type: '', Amount: 0, Category: '', SubCategory: '',
      Description: '[รอกรอกข้อมูล - AI อ่านสลิปไม่สำเร็จ]', Merchant: '',
      AccountID: '', PaymentMethod: '',
      SlipURL: driveInfo.url || '', SlipFileID: driveInfo.fileId || '',
      Source: 'slip', AIConfidence: 0, AIResponse: '',
      Status: 'pending', CreatedAt: nowStr_(), UpdatedAt: nowStr_()
    });
    logAudit_(userId, 'SLIP_PARSE_FAILED', txId, '', '', 'error',
      'AI could not parse/validate slip; empty pending transaction created for manual entry');
    return txId;
  } finally { lock.releaseLock(); }
}

function downloadLineImage_(messageId) {
  var token = getConfig_('LINE_CHANNEL_ACCESS_TOKEN');
  if (!token) return null;
  try {
    var resp = UrlFetchApp.fetch('https://api-data.line.me/v2/bot/message/' + messageId + '/content', {
      headers: { Authorization: 'Bearer ' + token }, muteHttpExceptions: true
    });
    if (resp.getResponseCode() !== 200) return null;
    return resp.getBlob();
  } catch (e) { return null; }
}

function saveSlipToDrive_(blob, userId) {
  var root = ensureDriveFolders_();
  var slipsRoot = getOrCreateSubfolder_(root, 'Slips');
  var monthFolder = getOrCreateYearMonthFolder_(slipsRoot, new Date());
  var txId = generateTransactionId_(userId);
  var filename = Utilities.formatDate(new Date(), TZ, 'yyyyMMdd') + '_' + txId + '.jpg';
  blob.setName(filename);
  var file = monthFolder.createFile(blob);
  file.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);
  return { url: file.getUrl(), fileId: file.getId(), txId: txId };
}

/**
 * Reads a slip with whichever vision model is configured, in priority order:
 * Gemini Flash first (much better at Thai OCR / name spelling), falling back
 * to Groq automatically if Gemini has no key set, hits its free-tier quota
 * (429), or errors for any other reason. Groq alone is used if no Gemini
 * key is configured at all. Every attempt is logged so AI_Logs shows which
 * model actually produced each result.
 */
function parseSlipImage_(userId, blob) {
  var base64 = Utilities.base64Encode(blob.getBytes());
  var mimeType = blob.getContentType() || 'image/jpeg';
  var prompt = buildSlipParsePrompt_();

  var raw = null, usedModel = null, geminiError = null;
  if (getConfig_('GEMINI_API_KEY')) {
    try {
      raw = callGeminiVision_(prompt, base64, mimeType);
      usedModel = 'gemini';
    } catch (e) {
      geminiError = e.message;
    }
  }
  if (!raw) {
    raw = callGroqVision_(prompt, base64, mimeType);
    usedModel = 'groq' + (geminiError ? ' (gemini fallback: ' + geminiError + ')' : '');
  }

  var parsed = safeParseAIJson_(raw);
  var valid = validateParsedTransaction_(parsed);
  logAiCall_(userId, 'image', '[slip image via ' + usedModel + ']', raw, parsed,
    parsed ? parsed.confidence : 0,
    valid ? 'success' : 'error',
    valid ? '' : (parsed ? 'validation failed: bad type/amount/date' : 'parse failed'));
  return valid ? parsed : null;
}

function buildSlipParsePrompt_() {
  var today = Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd');
  return 'วันนี้คือวันที่ ' + today + ' (ค.ศ./Gregorian) อ่านสลิปโอนเงิน/ใบเสร็จในรูปนี้ และแปลงเป็น JSON เท่านั้น ห้ามมีข้อความอื่นนอก JSON ห้ามใช้ Markdown:\n' +
    '{"type":"expense|income|transfer","amount":number,"date":"YYYY-MM-DD","time":"HH:mm","category":"string",' +
    '"subCategory":"","description":"string","merchant":"string","account":"เงินสด|ธนาคาร|Wallet|บัตร",' +
    '"paymentMethod":"bank|cash|wallet|card","referenceNumber":"string","confidence":0.0-1.0}\n' +
    'referenceNumber คือเลขอ้างอิงธุรกรรมที่ธนาคาร/แอปพิมพ์ไว้บนสลิป (เช่น "รหัสอ้างอิง", "เลขที่รายการ", "Ref No.", "Transaction ID") ' +
    'ให้คัดลอกมาตรงตัวทุกตัวอักษร/ตัวเลข ถ้าไม่เจอเลยให้ใส่ค่าว่าง "" — ห้ามแต่งขึ้นเองเด็ดขาด เลขนี้ใช้เช็คว่าสลิปนี้เคยถูกบันทึกไปแล้วหรือยัง\n' +
    'amount ต้องเป็นยอดธุรกรรมเท่านั้น ห้ามใช้ยอดคงเหลือ ค่าธรรมเนียม เลขบัญชี หรือเลขอ้างอิงเป็น amount\n' +
    'สลิปไทยส่วนใหญ่พิมพ์ปีเป็น พ.ศ. (เช่น "10 ก.ย. 69" คือ พ.ศ. 2569) ' +
    'ต้องแปลงเป็น ค.ศ. เสมอก่อนใส่ใน date โดยเอาปี พ.ศ. เต็ม (เติม 25 ข้างหน้าถ้าสลิปพิมพ์แค่ 2 ตัวท้าย) แล้วลบด้วย 543 ' +

    'ห้ามเอาเลขปีบนสลิปไปใส่ใน date ตรงๆโดยไม่ลบ 543\n' +
    'category ต้องเลือกจาก list นี้เท่านั้น: ' + CATEGORY_LIST_ + ' — ถ้าเป็นการโอนให้บุคคลอื่น (ไม่ใช่ระหว่างบัญชีของเจ้าของเอง) และไม่เข้าหมวดอื่นที่ชัดเจน ให้ใช้ "อื่นๆ"\n' +
    'merchant ห้ามเว้นว่างถ้าอ่านชื่อได้: ถ้าเป็นร้านค้า/บริษัท ใช้ชื่อร้าน ถ้าเป็นการโอนให้บุคคลธรรมดา (เช่นสลิปโอนผ่าน PromptPay/บัญชีธนาคารที่ชื่อเป็นคนไม่ใช่ร้าน) ' +

    'ห้ามตัดสิน type จากแค่ชื่อในกล่องโดยไม่ดูหัวข้อและทิศทางลูกศรบนสลิปประกอบ\n' +

}

 * 9. GROQ AI CALLS
