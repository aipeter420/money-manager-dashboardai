/**
 * Wraps UrlFetchApp.fetch with retry+backoff specifically for HTTP 429 (rate limited)
 * responses from Groq. Waits 5s, then 10s, before giving up and returning the last
 * (429) response for the caller to turn into an error. Any non-429 response (success
 * or a different error) is returned immediately without waiting.
 */
function fetchGroqWithRetry_(url, options) {
  var delaysMs = [5000, 10000];
  var resp = UrlFetchApp.fetch(url, options);
  for (var i = 0; i < delaysMs.length; i++) {
    if (resp.getResponseCode() !== 429) return resp;
    Utilities.sleep(delaysMs[i]);
    resp = UrlFetchApp.fetch(url, options);
  }
  return resp;
}

function callGroqChat_(userPrompt, jsonMode) {
  var key = getConfig_('GROQ_API_KEY');
  if (!key) throw new Error('GROQ_API_KEY not configured');
  var payload = {
    // llama-3.3-70b-versatile was decommissioned by Groq (shutdown 08/16/26).
    // openai/gpt-oss-120b is Groq's current recommended production replacement
    // (see https://console.groq.com/docs/deprecations).
    model: 'openai/gpt-oss-120b',
    messages: [
      { role: 'system', content: 'You are a strict JSON-only financial data extraction assistant. Never include markdown or explanations, only raw JSON.' },
      { role: 'user', content: userPrompt }
    ],
    temperature: 0.1,
    max_completion_tokens: 300,
    // gpt-oss models only accept low/medium/high for reasoning_effort (not "none").
    // "low" is enough for this simple JSON-extraction task and keeps latency down.
    reasoning_effort: 'low'
  };
  var resp = fetchGroqWithRetry_('https://api.groq.com/openai/v1/chat/completions', {
    method: 'post', contentType: 'application/json',
    headers: { Authorization: 'Bearer ' + key },
    payload: JSON.stringify(payload), muteHttpExceptions: true
  });
  if (resp.getResponseCode() !== 200) throw new Error('Groq API error: ' + resp.getResponseCode() + ' ' + resp.getContentText());
  var data;
  try {
    data = JSON.parse(resp.getContentText());
  } catch (e) {
    throw new Error('Groq Vision returned invalid API JSON: ' + resp.getContentText().slice(0, 500));
  }
  var content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  if (!content) throw new Error('Groq Vision returned empty content');
  return content;
}

/**
 * Same as callGroqChat_ but for natural-language answers meant to be shown directly
 * to the user (LINE reply text / Flex card body) — NOT structured data extraction.
 * Uses a plain-text system prompt so the model never wraps its answer in JSON or
 * Markdown fences, which is what caused raw {"answer": "..."} blobs to leak into
 * the chat before this was split out.
 */
/**
 * Pulls a clean, human-readable sentence out of whatever the model returned —
 * even if it's valid JSON, JSON wrapped in markdown fences, or JSON that got
 * cut off mid-object because it ran into max_completion_tokens (which is what
 * was leaking raw {"answer":"...", "details": {...}} blobs, half-finished,
 * straight into the LINE chat). Falls back to a friendly Thai message rather
 * than ever showing raw JSON/braces to the user.
 */
function extractPlainAnswer_(raw) {
  if (!raw) return 'ขออภัย ไม่สามารถประมวลผลคำตอบได้ในขณะนี้';
  var text = String(raw).replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
  if (text.charAt(0) !== '{' && text.charAt(0) !== '[') return text;

  // Try a full, well-formed parse first (handles the common, non-truncated case).
  var parsed = safeParseAIJson_(text);
  if (parsed) {
    var val = parsed.answer || parsed.response || parsed.message || parsed.text;
    if (val) return String(val);
  }

  // Full parse failed — most likely truncated mid-object. Pull the "answer"
  // field out with a regex instead of requiring the whole blob to be valid JSON.
  var m = text.match(/"(?:answer|response|message|text)"\s*:\s*"((?:[^"\\]|\\.)*)/);
  if (m && m[1]) {
    return m[1].replace(/\\n/g, '\n').replace(/\\"/g, '"').replace(/\\\\/g, '\\');
  }

  // Nothing usable extracted — never show raw JSON/braces to the user.
  return 'ขออภัย ระบบประมวลผลคำตอบไม่สมบูรณ์ ลองถามใหม่อีกครั้ง';
}

function callGroqChatFree_(userPrompt) {
  var key = getConfig_('GROQ_API_KEY');
  if (!key) throw new Error('GROQ_API_KEY not configured');
  var payload = {
    model: 'openai/gpt-oss-120b',
    messages: [
      { role: 'system', content: 'คุณเป็นผู้ช่วยการเงินที่ตอบเป็นข้อความธรรมดาภาษาไทยเท่านั้น ห้ามใช้ JSON ห้ามใช้ Markdown หรือสัญลักษณ์ตกแต่งใดๆ แม้ข้อมูลที่ให้มาจะอยู่ในรูป JSON ก็ตาม คำตอบของคุณต้องเป็นประโยคพูดคุยธรรมดาเท่านั้น ห้ามขึ้นต้นด้วยเครื่องหมาย { หรือ [ เด็ดขาด ตอบสั้น กระชับ อ่านง่ายบนมือถือ' },
      { role: 'user', content: userPrompt }
    ],
    temperature: 0.2,
    max_completion_tokens: 350,
    reasoning_effort: 'low'
  };
  var resp = fetchGroqWithRetry_('https://api.groq.com/openai/v1/chat/completions', {
    method: 'post', contentType: 'application/json',
    headers: { Authorization: 'Bearer ' + key },
    payload: JSON.stringify(payload), muteHttpExceptions: true
  });
  if (resp.getResponseCode() !== 200) throw new Error('Groq API error: ' + resp.getResponseCode() + ' ' + resp.getContentText());
  var data = JSON.parse(resp.getContentText());
  var text = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  // Safety net: if the model still wraps (or truncates) the answer as JSON despite
  // instructions, extract the readable sentence instead of showing raw JSON to the user.
  return extractPlainAnswer_(text);
}

/**
 * Calls Gemini's generateContent endpoint for slip OCR. Uses Flash (fast,
 * generous free tier, strong Thai OCR). response_mime_type: 'application/json'
 * forces a raw JSON object back, same contract as callGroqVision_, so
 * parseSlipImage_ can treat both the same way downstream.
 * Throws on any non-200 (including 429 quota-exceeded) so the caller falls
 * back to Groq.
 */
function callGeminiVision_(prompt, base64Image, mimeType) {
  var key = getConfig_('GEMINI_API_KEY');
  if (!key) throw new Error('GEMINI_API_KEY not configured');
  var payload = {
    contents: [{ parts: [
      { text: prompt },
      { inline_data: { mime_type: mimeType, data: base64Image } }
    ] }],
    generationConfig: {
      temperature: 0.1,
      maxOutputTokens: 1000,
      responseMimeType: 'application/json'
    }
  };
  var url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + encodeURIComponent(key);
  var resp = UrlFetchApp.fetch(url, {
    method: 'post', contentType: 'application/json',
    payload: JSON.stringify(payload), muteHttpExceptions: true
  });
  if (resp.getResponseCode() !== 200) throw new Error('Gemini Vision API error: ' + resp.getResponseCode() + ' ' + resp.getContentText().slice(0, 300));
  var data;
  try {
    data = JSON.parse(resp.getContentText());
  } catch (e) {
    throw new Error('Gemini Vision returned invalid API JSON: ' + resp.getContentText().slice(0, 300));
  }
  var cand = data.candidates && data.candidates[0];
  var text = cand && cand.content && cand.content.parts && cand.content.parts[0] && cand.content.parts[0].text;
  if (!text) throw new Error('Gemini Vision returned empty content (finishReason: ' + (cand && cand.finishReason) + ')');
  return text;
}

function callGroqVision_(prompt, base64Image, mimeType) {
  var key = getConfig_('GROQ_API_KEY');
  if (!key) throw new Error('GROQ_API_KEY not configured');
  var payload = {
    // llama-3.2-90b-vision-preview was decommissioned by Groq back on 04/14/25.
    // qwen/qwen3.6-27b (used here previously) was ALSO discontinued by Groq without
    // notice — every vision call was 404-ing until this fix. qwen/qwen3.8-27b is the
    // current replacement. Groq still lists it as a preview model, so keep an eye on
    // https://console.groq.com/docs/deprecations if this starts erroring again.
    model: 'qwen/qwen3.8-27b',
    messages: [
      { role: 'user', content: [
        { type: 'text', text: prompt },
        { type: 'image_url', image_url: { url: 'data:' + mimeType + ';base64,' + base64Image } }
      ] }
    ],
    temperature: 0.1,
    // qwen3.6 is a reasoning model — by default it spends output tokens on a
    // <think>...</think> block before writing the actual JSON answer, which
    // was eating the whole budget and cutting the response off before any
    // JSON appeared. Turning reasoning off makes it answer directly.
    reasoning_effort: 'none',
    // Force a machine-readable object. This removes the main failure mode where
    // the vision model returns prose/markdown around the JSON.
    response_format: { type: 'json_object' },
    max_completion_tokens: 1000
  };
  var resp = fetchGroqWithRetry_('https://api.groq.com/openai/v1/chat/completions', {
    method: 'post', contentType: 'application/json',
    headers: { Authorization: 'Bearer ' + key },
    payload: JSON.stringify(payload), muteHttpExceptions: true
  });
  if (resp.getResponseCode() !== 200) throw new Error('Groq Vision API error: ' + resp.getResponseCode() + ' ' + resp.getContentText());
  var data = JSON.parse(resp.getContentText());
  return data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
}

function safeParseAIJson_(raw) {
  if (!raw) return null;
  var cleaned = raw.replace(/```json/gi, '').replace(/```/g, '').trim();
  var start = cleaned.indexOf('{');
  var end = cleaned.lastIndexOf('}');
  if (start === -1 || end === -1) return null;
  cleaned = cleaned.substring(start, end + 1);
  try { return JSON.parse(cleaned); } catch (e) { return null; }
}

/**
 * Splits a raw model response into its <think>...</think> reasoning block (if any)
 * and the remaining final answer text, so AI_Logs stores them in separate columns
 * instead of one hard-to-read blob.
 */
function splitAIReasoning_(raw) {
  if (!raw) return { reasoning: '', final: '' };
  var match = raw.match(/<think>([\s\S]*?)<\/think>/i);
  if (match) {
    var reasoning = match[1].trim();
    var final = raw.replace(match[0], '').trim();
    return { reasoning: reasoning, final: final };
  }
  return { reasoning: '', final: raw.trim() };
}

function logAiCall_(userId, inputType, inputText, aiResponse, parsed, confidence, status, errMsg) {
  var ss = getUserSS_(userId);
  var sh = ss.getSheetByName(SHEET_NAMES.AI_LOGS);
  var split = splitAIReasoning_(aiResponse);
  appendRowObject_(sh, {
    ID: 'AI-' + Utilities.getUuid().slice(0, 8), Timestamp: nowStr_(), UserID: userId,
    InputType: inputType, InputText: inputText, AIResponse: aiResponse || '',
    ReasoningText: split.reasoning, FinalAnswer: split.final,
    ParsedJSON: parsed ? JSON.stringify(parsed) : '', Confidence: confidence || 0,
    Status: status, ErrorMessage: errMsg || '', CreatedAt: nowStr_()
  });
}

/* ============================================================
 * 10. TRANSACTION CREATION (from AI result)
 * ============================================================ */
function generateTransactionId_(userId) {
  var ss = getUserSS_(userId);
  var sh = ss.getSheetByName(SHEET_NAMES.TX);
  var today = Utilities.formatDate(new Date(), TZ, 'yyyyMMdd');
  var cache = CacheService.getScriptCache();
  var lock = LockService.getScriptLock();
  lock.waitLock(10000);
  try {
    var rows = sheetToObjects_(sh);
    var todayCount = rows.filter(function(r) { return String(r.ID).indexOf('TX-' + today + '-') === 0; }).length;
    var seq = String(todayCount + 1).padStart(5, '0');
    return 'TX-' + today + '-' + seq;
  } finally { lock.releaseLock(); }
}

/* ---------- SHARED "ผู้ช่วยการเงิน AI" DARK THEME (Flex Messages) ----------
 * Every Flex card the bot sends (transaction confirm/pending, balance, AI answers)
 * shares this same titlebar + dark palette so LINE chat looks like one consistent
 * product instead of a mix of plain white cards and dark AI-answer cards.
 */
var FLEX_THEME_ = {
  headerBg: '#111827',   // slate-900
  bodyBg:   '#0b0f19',   // near-black
  border:   '#334155',   // slate-600
  textMain: '#e5e7eb',   // slate-200
  textDim:  '#94a3b8',   // slate-400
  separator:'#1f2937',   // slate-800
  income:   '#34d399',   // emerald-400
  expense:  '#f87171',   // red-400
  transfer: '#60a5fa',   // blue-400
  pending:  '#fbbf24'    // amber-400
};

// Below this AI confidence, the pending card keeps the quick category
// grid as a safety net; at or above it, we trust the read and only show
// confirm/cancel (fewer taps for the common, high-confidence case).
var CATEGORY_GRID_CONFIDENCE_THRESHOLD_ = 0.7;

function flexTrafficDot_(color) {
  return { type: 'box', layout: 'vertical', width: '8px', height: '8px', cornerRadius: '4px', backgroundColor: color, contents: [{ type: 'filler' }] };
}

/** Shared titlebar used on every themed card: label on the left, traffic-light dots on the right. */
function flexHeader_(title) {
  return {
    type: 'box', layout: 'horizontal', backgroundColor: FLEX_THEME_.headerBg, paddingAll: '10px',
    contents: [
      { type: 'text', text: title, size: 'xs', color: '#ffffff', weight: 'bold', flex: 1, gravity: 'center' },
      { type: 'box', layout: 'horizontal', spacing: 'xs', contents: [
        flexTrafficDot_('#ffbd2e'), flexTrafficDot_('#28c840'), flexTrafficDot_('#ff5f57')
      ] }
    ]
  };
}

/** Computes the user's current overall balance — shared by the transaction card and the standalone balance card. */
function computeUserBalance_(userId) {
  var txs = getActiveUserTransactions_(userId);
  var income = sumBy_(txs, 'income');
  var expense = sumBy_(txs, 'expense');
  return { income: income, expense: expense, balance: income - expense };
}

/**
 * Builds a Flex Message card summarizing a saved transaction, styled to match the
 * dark "ผู้ช่วยการเงิน AI" theme used everywhere else in the bot. Always shows the
 * user's current overall balance right on the card (no separate follow-up message
 * needed) — for 'pending' cards a "(ก่อนยืนยัน)" note makes clear this transaction's
 * amount isn't reflected in that balance yet.
 *
 * For 'pending' transactions we add inline Confirm/Cancel buttons (via postback),
 * side by side. The quick-tap category picker (2x2 grid) only appears when the
 * AI's confidence was below CATEGORY_GRID_CONFIDENCE_THRESHOLD_ — on a confident
 * read, the footer is just the two action buttons, so the common case is one tap
 * instead of choosing through a full grid first.
 */
function buildTransactionFlex_(txId, ai, status, userId) {
  var isIncome = ai.type === 'income';
  var isTransfer = ai.type === 'transfer';
  var accent = isIncome ? FLEX_THEME_.income : isTransfer ? FLEX_THEME_.transfer : FLEX_THEME_.expense;
  var typeLabel = isIncome ? 'รายรับ' : isTransfer ? 'โอนเงิน' : 'รายจ่าย';
  var typeIcon = isIncome ? '💰' : isTransfer ? '🔁' : '💸';
  var amountSign = isIncome ? '+' : isTransfer ? '' : '-';
  var amountText = Number(ai.amount || 0).toLocaleString();
  var bal = userId ? computeUserBalance_(userId) : null;

  var bodyContents = [
    {
      type: 'box', layout: 'horizontal', contents: [
        { type: 'text', text: typeIcon + ' ' + typeLabel, weight: 'bold', size: 'sm', color: FLEX_THEME_.textDim },
        { type: 'text', text: status === 'pending' ? '⚠ รอยืนยัน' : '✓ บันทึกแล้ว', size: 'xs',
          color: status === 'pending' ? FLEX_THEME_.pending : FLEX_THEME_.income, align: 'end' }
      ]
    },
    { type: 'text', text: amountSign + '฿' + amountText, weight: 'bold', size: 'xxl', color: accent, margin: 'md' },
    { type: 'separator', margin: 'lg', color: FLEX_THEME_.separator },
    {
      type: 'box', layout: 'vertical', margin: 'lg', spacing: 'sm', contents: [
        flexRow_('หมวดหมู่', ai.category || '-'),
        flexRow_('รายละเอียด', ai.description || '-'),
        flexRow_('รหัสรายการ', txId)
      ]
    }
  ];

  if (bal) {
    bodyContents.push({ type: 'separator', margin: 'lg', color: FLEX_THEME_.separator });
    bodyContents.push({
      type: 'box', layout: 'horizontal', margin: 'lg', contents: [
        { type: 'text', text: '💳 ยอดคงเหลือ' + (status === 'pending' ? ' (ก่อนยืนยัน)' : ''), size: 'xxs', color: FLEX_THEME_.textDim, flex: 3, wrap: true },
        { type: 'text', text: '฿' + Number(bal.balance).toLocaleString(), size: 'xs', color: FLEX_THEME_.textMain, flex: 2, align: 'end', weight: 'bold' }
      ]
    });
  }

  var bubble = {
    type: 'bubble',
    size: 'kilo',
    header: flexHeader_('🤖 ผู้ช่วยการเงิน AI'),
    body: {
      type: 'box', layout: 'vertical', backgroundColor: FLEX_THEME_.bodyBg, paddingAll: '16px',
      contents: bodyContents,
      borderColor: FLEX_THEME_.border, borderWidth: '1px'
    }
  };

  if (status === 'pending') {
    // Quick category picker as a 2x2 grid — one tap fixes a mis-read slip category
    // without typing, and each button gets enough width for its full Thai label
    // (4-in-a-row was clipping "ช้อปปิ้ง" / "อาหาร" down to "ช้..."/"อ...").
    // Built as a plain postback-box + text (not a native LINE 'button') so we can
    // force a bright, guaranteed-readable label color — native secondary buttons
    // let LINE pick the text color, which came out near-invisible on this dark bg.
    // Only shown when the AI wasn't confident about the read — a good read
    // doesn't need a category-correction grid, so most cards skip straight
    // to confirm/cancel (see CATEGORY_GRID_CONFIDENCE_THRESHOLD_ above).
    var confidence = Number(ai.confidence);
    var showCategoryGrid = !(confidence >= CATEGORY_GRID_CONFIDENCE_THRESHOLD_);
    var footerContents = [];

    if (showCategoryGrid) {
      var quickCategories = ['อาหาร', 'เดินทาง', 'ช้อปปิ้ง', 'อื่นๆ'];
      var catButtonBg = '#1e293b';
      var catButton = function(c) {
        return {
          type: 'box', layout: 'vertical', flex: 1, backgroundColor: catButtonBg, cornerRadius: '8px',
          paddingAll: '10px', justifyContent: 'center',
          action: { type: 'postback', label: c, data: 'action=setcat&txId=' + txId + '&cat=' + encodeURIComponent(c), displayText: 'เปลี่ยนหมวดเป็น: ' + c },
          contents: [
            { type: 'text', text: c, size: 'sm', weight: 'bold', color: '#ffffff', align: 'center', wrap: true }
          ]
        };
      };
      footerContents.push({ type: 'box', layout: 'horizontal', spacing: 'xs', contents: [catButton(quickCategories[0]), catButton(quickCategories[1])] });
      footerContents.push({ type: 'box', layout: 'horizontal', spacing: 'xs', contents: [catButton(quickCategories[2]), catButton(quickCategories[3])] });
    }

    // Confirm/cancel side-by-side instead of 3 stacked full-width rows — halves
    // the footer height on the common (high-confidence) case. "แก้ไข" is now a
    // text hint instead of its own button; the "แก้ TX-...: ..." typed-edit path
    // (editByIdPrompt_ / handled in handleTextMessage_) still works exactly as before.
    footerContents.push({
      type: 'box', layout: 'horizontal', spacing: 'sm', contents: [
        { type: 'button', style: 'primary', color: FLEX_THEME_.income, height: 'sm', flex: 2,
          action: { type: 'postback', label: '✓ ยืนยัน', data: 'action=confirm&txId=' + txId, displayText: '✓ ยืนยัน ' + txId } },
        { type: 'button', style: 'secondary', color: FLEX_THEME_.expense, height: 'sm', flex: 1,
          action: { type: 'postback', label: 'ยกเลิก', data: 'action=cancel&txId=' + txId, displayText: 'ยกเลิก ' + txId } }
      ]
    });
    footerContents.push({ type: 'text', text: 'แก้ไข: พิมพ์ "แก้ ' + txId + ': ข้อความใหม่"', size: 'xxs', color: FLEX_THEME_.textDim, align: 'center', margin: 'sm', wrap: true });

    bubble.footer = {
      type: 'box', layout: 'vertical', backgroundColor: FLEX_THEME_.bodyBg, paddingAll: '12px', spacing: 'sm',
      contents: footerContents
    };
  }

  return {
    type: 'flex',
    altText: typeIcon + ' บันทึก' + typeLabel + ' ฿' + amountText,
    contents: bubble
  };
}

/**
 * Small Flex card summarizing the user's overall balance, in the same dark theme.
 * Kept for when the user explicitly asks for their balance — the transaction card
 * itself now already shows the running balance, so this is no longer sent as an
 * automatic follow-up to every confirm (see handlePostback_).
 */
function buildBalanceFlex_(userId) {
  var bal = computeUserBalance_(userId);
  var accent = bal.balance >= 0 ? FLEX_THEME_.income : FLEX_THEME_.expense;

  return {
    type: 'flex',
    altText: '💳 ยอดคงเหลือ ฿' + Number(bal.balance).toLocaleString(),
    contents: {
      type: 'bubble', size: 'kilo',
      header: flexHeader_('🤖 ผู้ช่วยการเงิน AI'),
      body: {
        type: 'box', layout: 'vertical', backgroundColor: FLEX_THEME_.bodyBg, paddingAll: '16px',
        contents: [
          { type: 'text', text: '💳 ยอดคงเหลือล่าสุด', size: 'sm', color: FLEX_THEME_.textDim },
          { type: 'text', text: '฿' + Number(bal.balance).toLocaleString(), weight: 'bold', size: 'xxl', color: accent, margin: 'sm' },
          { type: 'separator', margin: 'lg', color: FLEX_THEME_.separator },
          { type: 'box', layout: 'vertical', margin: 'lg', spacing: 'sm', contents: [
            flexRow_('รายรับสะสม', '฿' + Number(bal.income).toLocaleString()),
            flexRow_('รายจ่ายสะสม', '฿' + Number(bal.expense).toLocaleString())
          ] }
        ],
        borderColor: FLEX_THEME_.border, borderWidth: '1px'
      }
    }
  };
}

function flexRow_(label, value) {
  return {
    type: 'box', layout: 'baseline', contents: [
      { type: 'text', text: label, size: 'sm', color: FLEX_THEME_.textDim, flex: 2 },
      { type: 'text', text: String(value), size: 'sm', color: FLEX_THEME_.textMain, flex: 5, wrap: true }
    ]
  };
}

function flexButton_(label, action, txId, color) {
  return {
    type: 'button', style: 'primary', color: color, height: 'sm',
    action: { type: 'postback', label: label, data: 'action=' + action + '&txId=' + txId, displayText: label + ' ' + txId }
  };
}

function saveTransactionFromAI_(userId, ai, source, eventId, rawText, slipUrl, slipFileId) {
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    var ss = getUserSS_(userId);
    var confidence = Number(ai.confidence || 0);
    var accountId = resolveAccountId_(userId, ai.account);
    // Slip-sourced transactions ALWAYS require explicit user confirmation before the
    // balance is touched, regardless of AI confidence — the user must tap "ยืนยัน" first.
    // Text-typed entries ("กาแฟ 65") may auto-confirm on high confidence, BUT ONLY if the
    // AI actually matched a real account name. If it couldn't (accountId === ''), we must
    // NOT guess which account to debit — that used to silently fall back to the user's
    // first account (เงินสด) and post immediately, which is how เงินสด ended up deeply
    // negative from unrelated purchases. Force pending so the user picks the account
    // themselves before any money moves.
    var status = (source === 'slip' || !accountId) ? 'pending' : (confidence >= 0.8 ? 'confirmed' : 'pending');
    var txId = generateTransactionId_(userId);
    var displayName = getUserDisplayName_(userId);
    var date = ai.date || Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd');
    var time = ai.time || Utilities.formatDate(new Date(), TZ, 'HH:mm');

    var txSh = ss.getSheetByName(SHEET_NAMES.TX);
    appendRowObject_(txSh, {
      ID: txId, EventID: eventId || '', Timestamp: nowStr_(),
      TransactionDate: date, TransactionTime: time,
      UserID: userId, DisplayName: displayName,
      Type: ai.type || 'expense', Amount: Number(ai.amount || 0),
      Category: ai.category || 'อื่นๆ', SubCategory: ai.subCategory || '',
      Description: ai.description || rawText || '', Merchant: ai.merchant || '',
      AccountID: accountId, PaymentMethod: ai.paymentMethod || '',
      SlipURL: slipUrl || '', SlipFileID: slipFileId || '', SlipRefNumber: ai.referenceNumber || '',
      Source: source, AIConfidence: confidence, AIResponse: JSON.stringify(ai),
      Status: status, CreatedAt: nowStr_(), UpdatedAt: nowStr_()
    });

    if (status === 'confirmed') {
      applyTransactionEffects_(userId, ai, accountId, 1);
    }

    var flexMsg = buildTransactionFlex_(txId, ai, status, userId);
    return { txId: txId, status: status, message: flexMsg };
  } finally { lock.releaseLock(); }
}

/**
 * Matches the AI's guessed account name to one of the user's real accounts.
 * IMPORTANT: returns '' when there's no confident match — it must NEVER guess
 * a fallback account, because that silently debits money from wherever it
 * happened to land, not from what the person actually paid with. Callers
 * (saveTransactionFromAI_) are responsible for forcing status='pending' when
 * this returns '', so the person picks the right account themselves.
 */
function resolveAccountId_(userId, accountName) {
  var ss = getUserSS_(userId);
  var sh = ss.getSheetByName(SHEET_NAMES.ACCOUNTS);
  var rows = sheetToObjects_(sh).filter(function(r) { return r.UserID === userId; });
  if (rows.length === 0) {
    ensureDefaultAccountsForUser_(userId);
    rows = sheetToObjects_(sh).filter(function(r) { return r.UserID === userId; });
  }
  var match = rows.filter(function(r) { return r.AccountName === accountName; })[0];
  return match ? match.AccountID : '';
}

function getUserDisplayName_(userId) {
  var ss = getSS_();
  var sh = ss.getSheetByName(SHEET_NAMES.USERS);
  var rows = sheetToObjects_(sh);
  var u = rows.filter(function(r) { return r.UserID === userId; })[0];
  return u ? u.DisplayName : userId;
}

/**
 * Applies balance effects to Accounts + Users sheets.
 * direction: 1 = apply, -1 = reverse (used on cancel)
 */
function applyTransactionEffects_(userId, ai, accountId, direction) {
  var ss = getUserSS_(userId);
  var amount = Number(ai.amount || 0) * direction;
  var type = ai.type || 'expense';

  var accSh = ss.getSheetByName(SHEET_NAMES.ACCOUNTS);
  var accRows = sheetToObjects_(accSh);

  if (type === 'transfer') {
    var fromAcc = accRows.filter(function(r) { return r.UserID === userId && r.AccountName === ai.transferFromAccount; })[0];
    var toAcc = accRows.filter(function(r) { return r.UserID === userId && r.AccountName === ai.transferToAccount; })[0];
    if (fromAcc) updateRowObject_(accSh, fromAcc.__row, { CurrentBalance: Number(fromAcc.CurrentBalance || 0) - amount, UpdatedAt: nowStr_() });
    if (toAcc) updateRowObject_(accSh, toAcc.__row, { CurrentBalance: Number(toAcc.CurrentBalance || 0) + amount, UpdatedAt: nowStr_() });
    return;
  }

  var acc = accRows.filter(function(r) { return r.AccountID === accountId; })[0];
  var delta = type === 'income' ? amount : -amount;
  if (acc) updateRowObject_(accSh, acc.__row, { CurrentBalance: Number(acc.CurrentBalance || 0) + delta, UpdatedAt: nowStr_() });

  // Users' running TotalIncome/TotalExpense/Balance live on the central Users
  // sheet (see getUserSS_ comment), not the per-user spreadsheet — separate
  // lookup from the Accounts one above.
  var mainSs = getSS_();
  var userSh = mainSs.getSheetByName(SHEET_NAMES.USERS);
  var userRows = sheetToObjects_(userSh);
  var u = userRows.filter(function(r) { return r.UserID === userId; })[0];
  if (u) {
    var totalIncome = Number(u.TotalIncome || 0);
    var totalExpense = Number(u.TotalExpense || 0);
    if (type === 'income') totalIncome += amount; else totalExpense += amount;
    updateRowObject_(userSh, u.__row, {
      TotalIncome: totalIncome, TotalExpense: totalExpense,
      Balance: totalIncome - totalExpense, UpdatedAt: nowStr_()
    });
  }

  if (type === 'expense') updateBudgetUsage_(userId, ai.category, amount);
}

/* ============================================================
 * 11. EDIT / CANCEL TRANSACTIONS (LINE text commands)
 * ============================================================ */
function getLatestTransaction_(userId) {
  var ss = getUserSS_(userId);
  var sh = ss.getSheetByName(SHEET_NAMES.TX);
  var rows = sheetToObjects_(sh).filter(function(r) { return r.UserID === userId && r.Status !== 'cancelled'; });
  if (rows.length === 0) return null;
  rows.sort(function(a, b) { return new Date(b.CreatedAt) - new Date(a.CreatedAt); });
  return rows[0];
}

function editLatestTransactionPrompt_(userId) {
  var tx = getLatestTransaction_(userId);
  if (!tx) return 'ไม่พบรายการล่าสุด';
  return describeTransactionForEdit_(tx);
}

function editByIdPrompt_(userId, txId) {
  var tx = findTransactionById_(userId, txId);
  if (!tx) return 'ไม่พบรายการ ' + txId;
  return describeTransactionForEdit_(tx);
}

/**
 * Handles "แก้ TX-xxxxx: ข้อความใหม่" — the format the pending-transaction card's
 * "แก้ไข" button (via describeTransactionForEdit_) tells people to type. Updates
 * category/description on the still-pending row and re-shows the card with one
 * more "✓ ยืนยัน" tap needed — instead of the old flow, where typing exactly what
 * was suggested did nothing (fell through and got parsed as a brand new
 * transaction) because nothing actually matched this format.
 */
function applyFreeTextEdit_(userId, txId, newText) {
  var tx = findTransactionById_(userId, txId);
  if (!tx) return 'ไม่พบรายการ ' + txId;
  if (tx.Status !== 'pending') {
    return tx.Status === 'confirmed'
      ? '✅ รายการนี้ยืนยันไปแล้ว แก้ไขไม่ได้อีก (' + txId + ')'
      : 'รายการนี้ถูกยกเลิกไปแล้ว แก้ไขไม่ได้ (' + txId + ')';
  }

  // Try to spot one of the known category names anywhere in what they typed —
  // e.g. "อาหาร มื้อเที่ยงกับเพื่อน" sets both category and description in one
  // message. If none matches, the whole text becomes the new description and
  // the category is left as-is (still one tap away from a fix via the card's
  // quick-category buttons).
  var categories = CATEGORY_LIST_.split(',').map(function(c) { return c.trim(); });
  var matchedCategory = categories.filter(function(c) { return newText.indexOf(c) !== -1; })[0];
  var newDescription = (matchedCategory ? newText.replace(matchedCategory, '') : newText).trim();
  if (!newDescription) newDescription = tx.Description;

  var changes = { Description: newDescription, UpdatedAt: nowStr_() };
  if (matchedCategory) changes.Category = matchedCategory;
  updateRowObject_(getUserSS_(userId).getSheetByName(SHEET_NAMES.TX), tx.__row, changes);

  return buildTransactionFlex_(tx.ID, {
    type: tx.Type, amount: tx.Amount,
    category: matchedCategory || tx.Category,
    description: newDescription
  }, 'pending', userId);
}

function describeTransactionForEdit_(tx) {
  return '📝 ข้อมูลเดิม (' + tx.ID + ')\n' +
    'ประเภท: ' + tx.Type + '\nจำนวน: ฿' + tx.Amount + '\nหมวดหมู่: ' + tx.Category +
    '\nรายละเอียด: ' + tx.Description + '\n\nกรุณาแก้ไขผ่าน Dashboard เพื่อความแม่นยำ หรือส่งข้อความใหม่พร้อมระบุ "แก้ ' + tx.ID + ': [ข้อความใหม่]"';
}

function findTransactionById_(userId, txId) {
  var ss = getUserSS_(userId);
  var sh = ss.getSheetByName(SHEET_NAMES.TX);
  var rows = sheetToObjects_(sh);
  return rows.filter(function(r) { return r.UserID === userId && r.ID === txId; })[0] || null;
}

/**
 * Looks up an existing (non-cancelled) transaction by the bank's own reference
 * number printed on a slip — used to catch the same slip being submitted twice
 * through two different channels (e.g. uploaded once via the web dashboard,
 * then the same photo sent to the LINE bot later). A reference number is far
 * more reliable for this than comparing image bytes/hashes, since re-saving,
 * screenshotting, or recompressing the same slip photo changes the file but
 * never the bank's printed reference.
 */
function findTransactionBySlipRef_(userId, refNumber) {
  if (!refNumber) return null;
  var ss = getUserSS_(userId);
  var sh = ss.getSheetByName(SHEET_NAMES.TX);
  var rows = sheetToObjects_(sh);
  return rows.filter(function(r) {
    return r.UserID === userId && r.Status !== 'cancelled' && r.SlipRefNumber && String(r.SlipRefNumber) === String(refNumber);
  })[0] || null;
}

function cancelLatestPrompt_(userId) {
  var tx = getLatestTransaction_(userId);
  if (!tx) return 'ไม่พบรายการล่าสุด';
  return '❓ ยืนยันยกเลิกรายการนี้ใช่หรือไม่?\n' + describeTransactionShort_(tx) +
    '\n\nพิมพ์ "ยืนยันยกเลิก ' + tx.ID + '" เพื่อยืนยัน';
}


/* ============================================================
 * 11A. NATURAL-LANGUAGE FINANCE COMMANDS
 * Supports questions/commands without requiring exact keywords.
 * Examples:
 *   รวมยอด
 *   รวมยอดเดือนนี้
 *   รายจ่ายวันนี้
 *   รายรับเดือนนี้
 *   ยอดคงเหลือ
 *   กรองหมวดค่าใช้จ่าย
 *   กรองหมวดค่าใช้จ่าย อาหาร
 *   ดูรายการอาหาร
 *   รายการล่าสุด
 *   ค้นหา กาแฟ
 *   ลบรายการที่แล้ว / ยืนยันลบรายการที่แล้ว
 * ============================================================ */
function handleFinanceCommand_(userId, text) {
  var q = normalizeThaiCommand_(text);
  if (!q) return null;

  // Dashboard shortcut
  if (/^(ดู|เปิด|เข้า|ไปที่)?\s*แดชบอร์ด$/.test(q) ||
      /^(ดู|เปิด|เข้า)\s*(dashboard|เว็บ|หน้าหลัก)$/i.test(q)) {
    var dashboardUrl = ScriptApp.getService().getUrl();
    return '📊 Dashboard ของคุณ\n' + dashboardUrl;
  }

  // Deletion commands: always require an explicit second confirmation.
  if (/^(ยืนยัน\s*)?(ลบ|ยกเลิก)\s*(รายการ)?\s*(ที่แล้ว|ล่าสุด)$/.test(q)) {
    if (/^ยืนยัน/.test(q)) {
      var latestConfirm = getLatestTransaction_(userId);
      if (!latestConfirm) return 'ไม่พบรายการล่าสุดที่ยังใช้งานอยู่';
      return doCancelTransaction_(userId, latestConfirm.ID);
    }
    var tx = getLatestTransaction_(userId);
    if (!tx) return 'ไม่พบรายการล่าสุดที่ยังใช้งานอยู่';
    return '❓ ต้องการลบรายการนี้ใช่หรือไม่?\n' + describeTransactionShort_(tx) +
      '\n\nหากใช่ พิมพ์ "ยืนยันลบรายการที่แล้ว"';
  }

  // Explicit existing-ID cancellation remains supported.
  var cancelId = q.match(/^ยืนยัน\s*(?:ลบ|ยกเลิก)\s*(TX-[\w-]+)$/i);
  if (cancelId) return doCancelTransaction_(userId, cancelId[1]);

  // Latest/list commands.
  if (/^(รายการล่าสุด|ดูรายการล่าสุด|รายการที่แล้ว|ดูรายการที่แล้ว)$/.test(q)) {
    return formatLatestTransactions_(userId, 5);
  }

  // Balance / totals.
  if (/^(ยอดคงเหลือ|เงินคงเหลือ|balance)$/.test(q)) {
    return formatBalance_(userId);
  }

  if (/^(รวมยอด|สรุปยอด|ยอดรวม)(วันนี้|ของวันนี้)?$/.test(q)) {
    return formatPeriodSummary_(userId, 'today', 'ทั้งหมดวันนี้');
  }
  if (/^(รวมยอด|สรุปยอด|ยอดรวม)(เดือนนี้|ของเดือนนี้)$/.test(q)) {
    return formatPeriodSummary_(userId, 'month', 'ทั้งหมดเดือนนี้');
  }
  if (/^(รวมยอด|สรุปยอด|ยอดรวม)(ทั้งหมด|ทุกเดือน)$/.test(q)) {
    return formatPeriodSummary_(userId, 'all', 'ทั้งหมด');
  }

  // "วันนี้มีรายจ่ายอะไรบ้าง" / "วันนี้มีรายรับอะไรบ้าง"
  var listTodayExpense = /^(?:วันนี้\s*)?(?:มี\s*)?(?:รายจ่าย|ค่าใช้จ่าย)(?:อะไรบ้าง|อะไร|รายการอะไรบ้าง|รายการอะไร)$/.test(q) ||
    /^วันนี้มี(?:รายการ)?(?:รายจ่าย|ค่าใช้จ่าย)(?:อะไรบ้าง|อะไร)$/.test(q);
  if (listTodayExpense) {
    return formatPeriodTypeTransactions_(userId, 'today', 'expense', '🧾 รายจ่ายวันนี้');
  }

  var listTodayIncome = /^(?:วันนี้\s*)?(?:มี\s*)?(?:รายรับ)(?:อะไรบ้าง|อะไร|รายการอะไรบ้าง|รายการอะไร)$/.test(q) ||
    /^วันนี้มี(?:รายการ)?รายรับ(?:อะไรบ้าง|อะไร)$/.test(q);
  if (listTodayIncome) {
    return formatPeriodTypeTransactions_(userId, 'today', 'income', '💰 รายรับวันนี้');
  }

  var listMonthExpense = /^(?:เดือนนี้\s*)?(?:มี\s*)?(?:รายจ่าย|ค่าใช้จ่าย)(?:อะไรบ้าง|อะไร|รายการอะไรบ้าง|รายการอะไร)$/.test(q) ||
    /^เดือนนี้มี(?:รายการ)?(?:รายจ่าย|ค่าใช้จ่าย)(?:อะไรบ้าง|อะไร)$/.test(q);
  if (listMonthExpense) {
    return formatPeriodTypeTransactions_(userId, 'month', 'expense', '🧾 รายจ่ายเดือนนี้');
  }

  var listMonthIncome = /^(?:เดือนนี้\s*)?(?:มี\s*)?(?:รายรับ)(?:อะไรบ้าง|อะไร|รายการอะไรบ้าง|รายการอะไร)$/.test(q) ||
    /^เดือนนี้มี(?:รายการ)?รายรับ(?:อะไรบ้าง|อะไร)$/.test(q);
  if (listMonthIncome) {
    return formatPeriodTypeTransactions_(userId, 'month', 'income', '💰 รายรับเดือนนี้');
  }

  // "วันนี้ใช้ไปเท่าไหร่" / "เดือนนี้ใช้ไปเท่าไหร่"
  if (/^(?:วันนี้\s*)?(?:ใช้|จ่าย|หมด)\s*(?:เงิน)?\s*(?:ไป)?\s*เท่าไหร่$/.test(q) ||
      /^วันนี้(?:ใช้|จ่าย|หมด)เงินไปเท่าไหร่$/.test(q)) {
    return formatTypeTotal_(userId, 'today', 'expense');
  }
  if (/^เดือนนี้(?:ใช้|จ่าย|หมด)\s*(?:เงิน)?\s*(?:ไป)?\s*เท่าไหร่$/.test(q)) {
    return formatTypeTotal_(userId, 'month', 'expense');
  }

  if (/^(รายจ่าย|ค่าใช้จ่าย|รวมรายจ่าย)(วันนี้|ของวันนี้)$/.test(q)) {
    return formatTypeTotal_(userId, 'today', 'expense');
  }
  if (/^(รายรับ|รวมรายรับ)(วันนี้|ของวันนี้)$/.test(q)) {
    return formatTypeTotal_(userId, 'today', 'income');
  }
  if (/^(รายจ่าย|ค่าใช้จ่าย|รวมรายจ่าย)(เดือนนี้|ของเดือนนี้)$/.test(q)) {
    return formatTypeTotal_(userId, 'month', 'expense');
  }
  if (/^(รายรับ|รวมรายรับ)(เดือนนี้|ของเดือนนี้)$/.test(q)) {
    return formatTypeTotal_(userId, 'month', 'income');
  }

  // Category filtering. "กรองหมวดค่าใช้จ่าย" => category breakdown.
  var cat = q.match(/^(?:กรอง|ดู|แสดง|สรุป)?\s*(?:หมวด|หมู่)(?:ค่าใช้จ่าย|รายจ่าย)(?:\s+(.+))?$/);
  if (cat) {
    var categoryName = cat[1] ? cleanCategoryQuery_(cat[1]) : '';
    return formatExpenseCategory_(userId, categoryName, 'month');
  }

  // Natural variants: "ค่าใช้จ่าย อาหาร", "รายจ่ายหมวดอาหาร", "ดูรายการอาหาร"
  var cat2 = q.match(/^(?:ค่าใช้จ่าย|รายจ่าย)\s+(?:หมวด\s*)?(.+)$/);
  if (cat2 && !isAmountLike_(cat2[1])) {
    return formatExpenseCategory_(userId, cleanCategoryQuery_(cat2[1]), 'month');
  }
  var cat3 = q.match(/^(?:ดู|แสดง)\s*รายการ\s+(.+)$/);
  if (cat3 && !isAmountLike_(cat3[1])) {
    return formatCategoryTransactions_(userId, cleanCategoryQuery_(cat3[1]), 'month');
  }

  // Search.
  var search = q.match(/^(?:ค้นหา|หา|ค้นรายการ)\s+(.+)$/);
  if (search) return formatSearchTransactions_(userId, cleanSearchKeyword_(search[1]));

  return null;
}

/* ============================================================
 * 8b. AI-BASED INTENT FALLBACK
 * Runs only when the regex commands in handleFinanceCommand_ above found no
 * match. Asks the AI to classify what the user wants among the same set of
 * "report" actions the regex layer supports, so reworded/reordered/typo'd
 * phrasings ("วันนี้จ่ายอะไรไปบ้างนะ", "เดือนนี้เหลือกี่บาท") still route to the
 * right report instead of silently falling through to transaction-parsing.
 * ============================================================ */

/** Every intent the AI is allowed to pick, and the handler that fulfils it. */
var FINANCE_INTENT_HANDLERS_ = {
  dashboard: function(userId) {
    return '📊 Dashboard ของคุณ\n' + ScriptApp.getService().getUrl();
  },
  balance: function(userId) {
    return formatBalance_(userId);
  },
  period_summary: function(userId, p) {
    var period = p.period === 'all' ? 'all' : p.period === 'week' ? 'week' : (p.period === 'month' ? 'month' : 'today');
    return formatPeriodSummary_(userId, period, period === 'all' ? 'ทั้งหมด' : 'ทั้งหมด' + periodLabel_(period));
  },
  list_period_type: function(userId, p) {
    var period = p.period === 'week' ? 'week' : (p.period === 'month' ? 'month' : 'today');
    var type = p.type === 'income' ? 'income' : 'expense';
    var title = (type === 'income' ? '💰 รายรับ' : '🧾 รายจ่าย') + periodLabel_(period);
    return formatPeriodTypeTransactions_(userId, period, type, title);
  },
  type_total: function(userId, p) {
    var period = p.period === 'week' ? 'week' : (p.period === 'month' ? 'month' : 'today');
    var type = p.type === 'income' ? 'income' : 'expense';
    return formatTypeTotal_(userId, period, type);
  },
  list_latest: function(userId) {
    return formatLatestTransactions_(userId, 5);
  },
  category_filter: function(userId, p) {
    var period = p.period === 'today' ? 'today' : p.period === 'week' ? 'week' : p.period === 'all' ? 'all' : 'month';
    return formatExpenseCategory_(userId, cleanCategoryQuery_(p.category || ''), period);
  },
  category_transactions: function(userId, p) {
    var period = p.period === 'today' ? 'today' : p.period === 'week' ? 'week' : p.period === 'all' ? 'all' : 'month';
    return formatCategoryTransactions_(userId, cleanCategoryQuery_(p.category || ''), period);
  },
  search: function(userId, p) {
    return p.keyword ? formatSearchTransactions_(userId, cleanSearchKeyword_(p.keyword)) : null;
  },
  cancel_last: function(userId) {
    var tx = getLatestTransaction_(userId);
    if (!tx) return 'ไม่พบรายการล่าสุดที่ยังใช้งานอยู่';
    return '❓ ต้องการลบรายการนี้ใช่หรือไม่?\n' + describeTransactionShort_(tx) +
      '\n\nหากใช่ พิมพ์ "ยืนยันลบรายการที่แล้ว"';
  }
};

/**
 * `prevContext` (see getLastReportContext_/setLastReportContext_) carries just enough
 * of the previous turn's report request — intent + type/category, deliberately never
 * the period, since period is exactly the thing a follow-up like "เอาทั้งอาทิตย์เลย"
 * is changing — so the classifier can recognize a period-only follow-up and inherit
 * everything else instead of re-guessing (or worse, defaulting to a different report
 * shape) from a one-line message with no other information in it.
 */
function buildFinanceIntentPrompt_(text, prevContext) {
  var contextBlock = '';
  if (prevContext) {
    contextBlock = '\nบริบท: ข้อความก่อนหน้าของผู้ใช้ถูกตีความเป็น intent:"' + prevContext.intent + '"' +
      (prevContext.type ? ' type:"' + prevContext.type + '"' : '') +
      (prevContext.category ? ' category:"' + prevContext.category + '"' : '') + '\n' +
      'ถ้าข้อความใหม่นี้ดูเหมือนเป็นคำสั่งต่อเนื่องที่ "แค่เปลี่ยนช่วงเวลา" (เช่น "เอาทั้งอาทิตย์เลย", "เดือนนี้บ้าง", ' +
      '"เมื่อวานล่ะ", "แล้วทั้งเดือนล่ะ") และไม่ได้ระบุ intent/type/category ใหม่ด้วยตัวเอง ให้ใช้ intent/type/category เดิมจากบริบทนี้ ' +
      'แต่เปลี่ยน period ตามข้อความใหม่ — ถ้าข้อความใหม่ดูเป็นคำถาม/คำสั่งใหม่ทั้งหมดที่ไม่เกี่ยวกับบริบทเดิม ให้ไม่ต้องสนใจบริบทนี้เลย\n';
  }
  return 'ข้อความจากผู้ใช้แอปบันทึกรายรับ-รายจ่าย (ภาษาไทย พูดกันเองในชีวิตประจำวัน อาจสะกดตก/สลับคำ):\n' +
    '"' + text + '"\n' + contextBlock + '\n' +
    'หน้าที่ของคุณคือแค่ "จัดหมวดหมู่ความต้องการ" ห้ามตอบคำถามเอง ห้ามคำนวณ ตอบเป็น JSON เท่านั้น ห้ามมี Markdown:\n' +
    '{"intent":"dashboard|balance|period_summary|list_period_type|type_total|list_latest|category_filter|category_transactions|search|cancel_last|question|transaction|unknown",' +
    '"period":"today|week|month|all หรือว่าง","type":"expense|income หรือว่าง","category":"ชื่อหมวดหมู่ถ้ามี ไม่งั้นว่าง",' +
    '"keyword":"คำค้นหาถ้ามี ไม่งั้นว่าง","confidence":0.0-1.0}\n\n' +
    'ความหมายของแต่ละ intent:\n' +
    '- dashboard: ขอลิงก์/เปิดหน้าเว็บแดชบอร์ด\n' +
    '- balance: ถามยอดเงินคงเหลือรวม\n' +
    '- period_summary: ขอสรุปยอดรวมทั้งหมด (ทั้งรายรับ+รายจ่าย) ในช่วงเวลาหนึ่ง\n' +
    '- list_period_type: ขอ "รายการ" รายจ่ายหรือรายรับในช่วงเวลาหนึ่ง (เช่น มีอะไรบ้าง)\n' +
    '- type_total: ถามยอดรวมของรายจ่ายหรือรายรับอย่างเดียวในช่วงเวลาหนึ่ง (เช่น ใช้ไปเท่าไหร่)\n' +
    '- list_latest: ขอดูรายการล่าสุด/ที่แล้ว\n' +
    '- category_filter: ขอสรุปยอดแยกตามหมวดหมู่ค่าใช้จ่าย\n' +
    '- category_transactions: ขอดูรายการของหมวดหมู่หนึ่งโดยเฉพาะ\n' +
    '- search: ถามยอดรวม/รายการของ "สิ่งของหรือคำเฉพาะ" ที่ไม่ใช่หมวดหมู่ทั่วไป เช่น "ค่าเนื้อทั้งหมดเท่าไหร่", ' +
    '"จ่ายค่าน้ำมันไปกี่บาท" ให้ตอบ intent:search และ keyword:คำนั้น (เช่น "เนื้อ", "น้ำมัน")\n' +
    '- cancel_last: ต้องการลบ/ยกเลิกรายการล่าสุด\n' +
    '- question: คำถามทั่วไปเกี่ยวกับการเงินที่ไม่ตรงข้อไหนข้างบน (เช่น เงินพอไหม ทำไมใช้เยอะ)\n' +
    '- transaction: กำลังแจ้งรายรับ-รายจ่ายใหม่ (มีจำนวนเงินที่ต้องการบันทึก)\n' +
    '- unknown: ไม่แน่ใจ\n' +
    'period "week" หมายถึงสัปดาห์นี้ (จันทร์-อาทิตย์) เช่น "ทั้งอาทิตย์", "สัปดาห์นี้", "อาทิตย์นี้"\n' +
    'ถ้าไม่มั่นใจจริง ๆ ให้ใช้ "unknown" และ confidence ต่ำ ห้ามเดามั่ว';
}

// 10 minutes — long enough to cover "บิลมีอะไรบ้าง" → "เอาทั้งอาทิตย์เลย" a few messages
// later, short enough that a period-only follow-up sent hours later (unrelated to
// what was asked that morning) doesn't wrongly inherit stale context.
var REPORT_CONTEXT_TTL_SECONDS_ = 600;

function getLastReportContext_(userId) {
  var raw = CacheService.getScriptCache().get('reportctx_' + userId);
  return raw ? JSON.parse(raw) : null;
}

function setLastReportContext_(userId, intent, p) {
  var ctx = { intent: intent, type: p.type || '', category: p.category || '' };
  CacheService.getScriptCache().put('reportctx_' + userId, JSON.stringify(ctx), REPORT_CONTEXT_TTL_SECONDS_);
}

/**
 * Classifies free-form text into one of the report/action intents above using the
 * AI, then dispatches straight to the same formatter functions the regex layer
 * uses — so the output is identical either way, only the matching is smarter.
 * Returns null (never throws) on low confidence, an "unknown"/"question"/
 * "transaction" intent, or any AI/parse failure, so the caller's existing
 * question-detection + transaction-parsing fallback still runs unchanged.
 */
function handleFinanceIntentAI_(userId, text) {
  try {
    var prevContext = getLastReportContext_(userId);
    var raw = callGroqChat_(buildFinanceIntentPrompt_(text, prevContext), true);
    var parsed = safeParseAIJson_(raw);
    if (!parsed || !parsed.intent) return null;
    if (Number(parsed.confidence || 0) < 0.6) return null;

    var handler = FINANCE_INTENT_HANDLERS_[parsed.intent];
    if (!handler) return null; // covers "question" / "transaction" / "unknown" on purpose

    var result = handler(userId, parsed);
    if (result === null || result === undefined) return null;
    setLastReportContext_(userId, parsed.intent, parsed);
    logCommandRouting_(userId, text, 'ai_intent', parsed.intent);
    return result;
  } catch (e) {
    // Network/API hiccup on the smart layer should never block the existing
    // fallback path from still working.
    logAudit_(userId, 'AI_INTENT_ERROR', '', '', String(e), 'error', 'handleFinanceIntentAI_ failed');
    return null;
  }
}

function looksLikeFinanceQuestion_(text) {
  var q = String(text || '').trim();
  if (!q) return false;
  // Explicit question punctuation or common Thai question words.
  if (/[?？]$/.test(q)) return true;
  return /(อะไรบ้าง|อะไร|เท่าไหร่|เท่าไร|กี่บาท|เหลือเท่าไหร่|เหลือเท่าไร|พอไหม|พอหรือไม่|ทำไม|ยังไง|อย่างไร|หรือไม่|ไหม|หรือเปล่า|หรือเปล่า|เยอะไหม|มากไหม|น้อยไหม)/.test(q);
}

function formatPeriodTypeTransactions_(userId, period, type, title) {
  var txs = periodFilter_(getActiveUserTransactions_(userId), period)
    .filter(function(t) { return t.Type === type; })
    .sort(function(a, b) {
      return String(b.CreatedAt || '').localeCompare(String(a.CreatedAt || ''));
    });

  if (!txs.length) return title + '\nยังไม่มีรายการในช่วงนี้';

  var total = sumBy_(txs, type);
  var lines = [title, 'รวม: ฿' + formatMoney_(total), ''];
  txs.slice(0, 20).forEach(function(t, i) {
    var desc = t.Description || t.Merchant || t.Category || 'ไม่ระบุรายละเอียด';
    var cat = t.Category ? ' • ' + t.Category : '';
    var date = t.TransactionDate ? formatDateShort_(t.TransactionDate) : '';
    lines.push((i + 1) + '. ' + desc + cat + ' — ฿' + formatMoney_(Number(t.Amount || 0)) + (date ? ' (' + date + ')' : ''));
  });

  if (txs.length > 20) {
    lines.push('', 'แสดง 20 รายการล่าสุดจากทั้งหมด ' + txs.length + ' รายการ');
  }
  return lines.join('\n');
}

function normalizeThaiCommand_(text) {
  return String(text || '').trim().replace(/[?？!！]+$/g, '').replace(/\s+/g, ' ');
}

function isAmountLike_(s) {
  return /^\d+(?:[.,]\d+)?\s*(?:บาท|บ\.|฿)?$/i.test(String(s || '').trim());
}

function cleanCategoryQuery_(s) {
  return String(s || '').trim()
    .replace(/^หมวด\s*/,'')
    .replace(/^(ค่าใช้จ่าย|รายจ่าย)\s*/,'')
    .trim();
}

/** Strips "ค่า"/"รายจ่าย" prefixes and "ทั้งหมด/รวม/เท่าไหร่/กี่บาท" suffixes off a
 *  search keyword, so "ค่าเนื้อทั้งหมดเท่าไหร่" becomes just "เนื้อ" — the bare word
 *  that actually appears in a transaction's Description/Category/Merchant. */
function cleanSearchKeyword_(s) {
  return String(s || '').trim()
    .replace(/^(ค่า|รายจ่าย|ค่าใช้จ่าย)\s*/, '')
    .replace(/\s*(ทั้งหมด|รวม)?\s*(เท่าไหร่|เท่าไร|กี่บาท)\??\s*$/, '')
    .trim();
}

function getActiveUserTransactions_(userId) {
  return getUserTransactions_(userId).filter(function(t) {
    return t.Status !== 'cancelled';
  });
}

function periodFilter_(txs, period) {
  var now = new Date();
  var today = Utilities.formatDate(now, TZ, 'yyyy-MM-dd');
  var month = Utilities.formatDate(now, TZ, 'yyyy-MM');
  if (period === 'today') {
    return txs.filter(function(t) { return String(t.TransactionDate) === today; });
  }
  if (period === 'week') {
    // Calendar week, Monday-Sunday, in the app's TZ — not just "today - 7 days".
    var dow = Number(Utilities.formatDate(now, TZ, 'u')); // 1=Mon..7=Sun
    var monday = new Date(now.getTime() - (dow - 1) * 86400000);
    var sunday = new Date(monday.getTime() + 6 * 86400000);
    var weekStart = Utilities.formatDate(monday, TZ, 'yyyy-MM-dd');
    var weekEnd = Utilities.formatDate(sunday, TZ, 'yyyy-MM-dd');
    return txs.filter(function(t) {
      var d = String(t.TransactionDate);
      return d >= weekStart && d <= weekEnd;
    });
  }
  if (period === 'month') {
    return txs.filter(function(t) { return String(t.TransactionDate).indexOf(month) === 0; });
  }
  return txs;
}

/** Thai label for a period code, shared by every formatter below so "week" reads the same everywhere. */
function periodLabel_(period) {
  return period === 'today' ? 'วันนี้' : period === 'week' ? 'สัปดาห์นี้' : period === 'month' ? 'เดือนนี้' : 'ทั้งหมด';
}

function formatPeriodSummary_(userId, period, label) {
  var txs = periodFilter_(getActiveUserTransactions_(userId), period);
  var income = sumBy_(txs, 'income');
  var expense = sumBy_(txs, 'expense');
  var transfer = sumBy_(txs, 'transfer');
  return '📊 ' + label + '\n' +
    '💰 รายรับ: ฿' + formatMoney_(income) + '\n' +
    '💸 รายจ่าย: ฿' + formatMoney_(expense) + '\n' +
    '🔁 โอนเงิน: ฿' + formatMoney_(transfer) + '\n' +
    '📈 สุทธิ: ฿' + formatMoney_(income - expense) + '\n' +
    '🧾 จำนวนรายการ: ' + txs.length + ' รายการ';
}

function formatTypeTotal_(userId, period, type) {
  var txs = periodFilter_(getActiveUserTransactions_(userId), period);
  var amount = sumBy_(txs, type);
  var label = type === 'income' ? 'รายรับ' : 'รายจ่าย';
  return (type === 'income' ? '💰 ' : '💸 ') + label + periodLabel_(period) + ': ฿' + formatMoney_(amount) +
    '\n🧾 ' + txs.filter(function(t) { return t.Type === type; }).length + ' รายการ';
}

function formatBalance_(userId) {
  var txs = getActiveUserTransactions_(userId);
  var income = sumBy_(txs, 'income');
  var expense = sumBy_(txs, 'expense');
  return '💳 ยอดคงเหลือจากรายการทั้งหมด\n' +
    '💰 รายรับสะสม: ฿' + formatMoney_(income) + '\n' +
    '💸 รายจ่ายสะสม: ฿' + formatMoney_(expense) + '\n' +
    '💵 คงเหลือ: ฿' + formatMoney_(income - expense);
}

function formatExpenseCategory_(userId, categoryName, period) {
  var txs = periodFilter_(getActiveUserTransactions_(userId), period)
    .filter(function(t) { return t.Type === 'expense'; });

  if (categoryName) {
    var matched = findCategoryName_(txs, categoryName);
    if (!matched) return 'ไม่พบหมวดค่าใช้จ่าย "' + categoryName + '" ในช่วงนี้';
    return formatCategoryTransactions_(userId, matched, period);
  }

  var groups = {};
  txs.forEach(function(t) {
    var c = t.Category || 'อื่นๆ';
    groups[c] = (groups[c] || 0) + Number(t.Amount || 0);
  });
  var names = Object.keys(groups).sort(function(a,b) { return groups[b] - groups[a]; });
  if (!names.length) return '📂 ' + periodLabel_(period) + 'ยังไม่มีรายการค่าใช้จ่าย';

  var total = sumBy_(txs, 'expense');
  var lines = ['📂 สรุปหมวดค่าใช้จ่าย' + periodLabel_(period), 'รวม: ฿' + formatMoney_(total)];
  names.forEach(function(c, i) {
    var pct = total > 0 ? Math.round(groups[c] / total * 100) : 0;
    lines.push((i + 1) + '. ' + c + ': ฿' + formatMoney_(groups[c]) + ' (' + pct + '%)');
  });
  lines.push('', '💡 ถ้าต้องการดูเฉพาะหมวด พิมพ์ เช่น "กรองหมวดค่าใช้จ่าย อาหาร"');
  return lines.join('\n');
}

function findCategoryName_(txs, query) {
  var q = String(query || '').trim().toLowerCase();
  var exact = txs.filter(function(t) { return String(t.Category || '').toLowerCase() === q; });
  if (exact.length) return exact[0].Category;
  var partial = txs.filter(function(t) { return String(t.Category || '').toLowerCase().indexOf(q) !== -1; });
  return partial.length ? partial[0].Category : null;
}

function formatCategoryTransactions_(userId, categoryName, period) {
  var txs = periodFilter_(getActiveUserTransactions_(userId), period)
    .filter(function(t) { return t.Type === 'expense'; });
  var matched = findCategoryName_(txs, categoryName);
  if (!matched) return 'ไม่พบรายการในหมวด "' + categoryName + '"';
  txs = txs.filter(function(t) { return String(t.Category || '').toLowerCase() === String(matched).toLowerCase(); });
  txs.sort(function(a,b) { return String(b.TransactionDate + ' ' + b.TransactionTime).localeCompare(String(a.TransactionDate + ' ' + a.TransactionTime)); });

  var total = sumBy_(txs, 'expense');
  var lines = ['📂 หมวด: ' + matched + ' (' + periodLabel_(period) + ')', 'รวม: ฿' + formatMoney_(total), 'จำนวน: ' + txs.length + ' รายการ', ''];
  txs.slice(0, 30).forEach(function(t) {
    lines.push('• ' + formatDateShort_(t.TransactionDate) + ' | ฿' + formatMoney_(t.Amount) + ' | ' + (t.Description || '-'));
  });
  if (txs.length > 30) lines.push('… แสดง 30 รายการล่าสุดจากทั้งหมด ' + txs.length + ' รายการ');
  return lines.join('\n');
}

function formatLatestTransactions_(userId, limit) {
  var txs = getActiveUserTransactions_(userId);
  txs.sort(function(a,b) { return String(b.CreatedAt || '').localeCompare(String(a.CreatedAt || '')); });
  if (!txs.length) return 'ยังไม่มีรายการ';
  var lines = ['🧾 รายการล่าสุด'];
  txs.slice(0, limit || 5).forEach(function(t) {
    var icon = t.Type === 'income' ? '💰' : t.Type === 'expense' ? '💸' : '🔁';
    var sign = t.Type === 'income' ? '+' : t.Type === 'expense' ? '-' : '';
    lines.push(icon + ' ' + sign + '฿' + formatMoney_(t.Amount) + ' | ' + (t.Category || '-') + ' | ' + (t.Description || '-'));
  });
  return lines.join('\n');
}

function formatSearchTransactions_(userId, query) {
  var q = String(query || '').toLowerCase();
  var txs = getActiveUserTransactions_(userId).filter(function(t) {
    return [t.Category, t.SubCategory, t.Description, t.Merchant, t.PaymentMethod]
      .some(function(v) { return String(v || '').toLowerCase().indexOf(q) !== -1; });
  });
  txs.sort(function(a,b) { return String(b.CreatedAt || '').localeCompare(String(a.CreatedAt || '')); });
  if (!txs.length) return '🔎 ไม่พบรายการที่ค้นหา: "' + query + '"';

  var totalExpense = sumBy_(txs, 'expense');
  var totalIncome = sumBy_(txs, 'income');
  var lines = ['🔎 ผลการค้นหา: ' + query, 'รายรับ: ฿' + formatMoney_(totalIncome) + ' | รายจ่าย: ฿' + formatMoney_(totalExpense)];
  txs.slice(0, 30).forEach(function(t) {
    var sign = t.Type === 'income' ? '+' : t.Type === 'expense' ? '-' : '';
    lines.push('• ' + formatDateShort_(t.TransactionDate) + ' | ' + sign + '฿' + formatMoney_(t.Amount) + ' | ' + (t.Category || '-') + ' | ' + (t.Description || '-'));
  });
  if (txs.length > 30) lines.push('… พบทั้งหมด ' + txs.length + ' รายการ แสดง 30 รายการล่าสุด');
  return lines.join('\n');
}

function formatMoney_(n) {
  return Number(n || 0).toLocaleString('th-TH', { maximumFractionDigits: 2 });
}

function formatDateShort_(dateStr) {
  var s = String(dateStr || '');
  if (!s) return '-';
  var p = s.split('-');
  return p.length === 3 ? p[2] + '/' + p[1] : s;
}

function describeTransactionShort_(tx) {
  return tx.ID + ' | ' + tx.Type + ' | ฿' + tx.Amount + ' | ' + tx.Category;
}

function doCancelTransaction_(userId, txId) {
  var tx = findTransactionById_(userId, txId);
  if (!tx) return 'ไม่พบรายการ ' + txId;
  if (tx.Status === 'cancelled') return 'รายการนี้ถูกยกเลิกไปแล้ว';
  cancelTransactionRow_(tx);
  return '✅ ยกเลิกรายการ ' + txId + ' เรียบร้อยแล้ว';
}

/** Mirrors the LINE postback's confirm branch (see handlePostback_) so the web
 *  dashboard can confirm a pending transaction too — sets Status to 'confirmed'
 *  and applies its balance/budget effects exactly once, at confirm time. */
function confirmTransactionRow_(tx, newAccountId) {
  var lock = LockService.getScriptLock();
  lock.waitLock(15000);
  try {
    var accountId = tx.AccountID || newAccountId || '';
    if (!accountId) {
      // The AI never matched a real account for this row — confirming without
      // picking one would post the expense/income with no account effect at all
      // (or, in the old code, silently onto the first account). Refuse instead.
      return { error: 'กรุณาเลือกบัญชีก่อนยืนยันรายการนี้' };
    }
    var ss = getUserSS_(tx.UserID);
    var sh = ss.getSheetByName(SHEET_NAMES.TX);
    var updates = { Status: 'confirmed', UpdatedAt: nowStr_() };
    if (!tx.AccountID && newAccountId) updates.AccountID = newAccountId;
    updateRowObject_(sh, tx.__row, updates);
    applyTransactionEffects_(tx.UserID, { type: tx.Type, amount: tx.Amount, category: tx.Category,
      transferFromAccount: getTxTransferField_(tx, 'transferFromAccount'), transferToAccount: getTxTransferField_(tx, 'transferToAccount') }, accountId, 1);
    logAudit_(tx.UserID, 'CONFIRM', tx.ID, 'pending', 'confirmed', 'success', 'Transaction confirmed from dashboard, account=' + accountId);
    return { ID: tx.ID, Status: 'confirmed', AccountID: accountId };
  } finally { lock.releaseLock(); }
}

function cancelTransactionRow_(tx) {
  var lock = LockService.getScriptLock();
  lock.waitLock(15000);
  try {
    var ss = getUserSS_(tx.UserID);
    var sh = ss.getSheetByName(SHEET_NAMES.TX);
    var oldStatus = tx.Status;
    updateRowObject_(sh, tx.__row, { Status: 'cancelled', UpdatedAt: nowStr_() });
    if (oldStatus === 'confirmed') {
      var ai = { type: tx.Type, amount: tx.Amount, category: tx.Category,
        transferFromAccount: getTxTransferField_(tx, 'transferFromAccount'), transferToAccount: getTxTransferField_(tx, 'transferToAccount') };
      applyTransactionEffects_(tx.UserID, ai, tx.AccountID, -1);
    }
    logAudit_(tx.UserID, 'CANCEL', tx.ID, oldStatus, 'cancelled', 'success', 'Transaction cancelled');
  } finally { lock.releaseLock(); }
}

function editTransactionRow_(tx, changes) {
  var lock = LockService.getScriptLock();
  lock.waitLock(15000);
  try {
    var ss = getUserSS_(tx.UserID);
    var sh = ss.getSheetByName(SHEET_NAMES.TX);
    var oldVal = JSON.stringify(tx);
    var wasConfirmed = tx.Status === 'confirmed';

    // reverse old effects if it was confirmed
    if (wasConfirmed) {
      applyTransactionEffects_(tx.UserID, { type: tx.Type, amount: tx.Amount, category: tx.Category,
        transferFromAccount: getTxTransferField_(tx, 'transferFromAccount'), transferToAccount: getTxTransferField_(tx, 'transferToAccount') }, tx.AccountID, -1);
    }

    var updated = {};
    ['Type','Amount','Category','SubCategory','Description','Merchant','AccountID','PaymentMethod','TransactionDate','TransactionTime'].forEach(function(f) {
      updated[f] = (changes[f] !== undefined && changes[f] !== null && changes[f] !== '') ? changes[f] : tx[f];
    });
    updated.UpdatedAt = nowStr_();
    updateRowObject_(sh, tx.__row, updated);

    var newAccountId = updated.AccountID;
    if (wasConfirmed || tx.Status === 'confirmed') {
      applyTransactionEffects_(tx.UserID, { type: updated.Type, amount: updated.Amount, category: updated.Category,
        transferFromAccount: getTxTransferField_(tx, 'transferFromAccount'), transferToAccount: getTxTransferField_(tx, 'transferToAccount') }, newAccountId, 1);
    }
    logAudit_(tx.UserID, 'EDIT', tx.ID, oldVal, JSON.stringify(updated), 'success', 'Transaction edited');
    return updated;
  } finally { lock.releaseLock(); }
}

/* ============================================================
 * 12. POSTBACK HANDLING
 * ============================================================ */
function handlePostback_(userId, data, replyToken) {
  var params = {};
  data.split('&').forEach(function(kv) {
    var p = kv.split('=');
    params[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
  });

  if (params.action === 'confirm' && params.txId) {
    var tx = findTransactionById_(userId, params.txId);
    if (!tx) {
      replyLine_(replyToken, userId, 'ไม่พบรายการนี้ (' + params.txId + ')');
    } else if (tx.Status === 'confirmed') {
      // Previously this branch only matched Status==='pending' and did nothing
      // at all otherwise — so confirming a transaction from the web dashboard
      // and then tapping the old "✓ ยืนยัน" button on the LINE card gave no
      // feedback whatsoever (not even an error), leaving the person unsure
      // whether anything happened. It's already confirmed either way — say so.
      replyLine_(replyToken, userId, '✅ รายการนี้ยืนยันไปแล้ว (' + tx.ID + ') อาจยืนยันจาก Dashboard หรือแชทนี้ไปก่อนหน้านี้แล้ว ยอดเงินถูกตัดไปเรียบร้อย ไม่ต้องกดซ้ำ');
    } else if (tx.Status === 'cancelled') {
      replyLine_(replyToken, userId, 'รายการนี้ถูกยกเลิกไปแล้ว ไม่สามารถยืนยันได้ (' + tx.ID + ')');
    } else if (!tx.AccountID) {
      // The AI never matched this to a real account — confirming here would
      // either post with no account effect or (in the old code) silently land
      // on the wrong account. Send them to the dashboard to pick one instead.
      replyLine_(replyToken, userId, 'รายการนี้ยังไม่รู้ว่าจ่ายจากบัญชีไหน กรุณาเลือกบัญชีที่ Dashboard ก่อนยืนยัน (' + tx.ID + ')');
    } else {
      updateRowObject_(getUserSS_(userId).getSheetByName(SHEET_NAMES.TX), tx.__row, { Status: 'confirmed', UpdatedAt: nowStr_() });
      applyTransactionEffects_(userId, { type: tx.Type, amount: tx.Amount, category: tx.Category }, tx.AccountID, 1);
      // The confirmed card itself now already shows the updated overall balance
      // (see buildTransactionFlex_), so a single themed card is enough — no more
      // separate follow-up balance card with a different plain-white style.
      replyLine_(replyToken, userId, buildTransactionFlex_(tx.ID, {
        type: tx.Type, amount: tx.Amount, category: tx.Category, description: tx.Description
      }, 'confirmed', userId));
    }
  } else if (params.action === 'cancel' && params.txId) {
    replyLine_(replyToken, userId, doCancelTransaction_(userId, params.txId));
  } else if (params.action === 'edit' && params.txId) {
    replyLine_(replyToken, userId, editByIdPrompt_(userId, params.txId));
  } else if (params.action === 'setcat' && params.txId && params.cat) {
    // Quick category correction from the pending card's category buttons — only
    // touches the row while it's still pending; balance/budget effects are applied
    // once, at confirm time, using whatever category is on the row at that point.
    var tx2 = findTransactionById_(userId, params.txId);
    if (!tx2) {
      replyLine_(replyToken, userId, 'ไม่พบรายการนี้ (' + params.txId + ')');
    } else if (tx2.Status !== 'pending') {
      // Same silent-no-op gap as the confirm branch above — tapping a category
      // button on an old card for a transaction that's since been confirmed or
      // cancelled elsewhere used to do nothing at all.
      replyLine_(replyToken, userId, tx2.Status === 'confirmed'
        ? '✅ รายการนี้ยืนยันไปแล้ว เปลี่ยนหมวดไม่ได้อีก (' + tx2.ID + ')'
        : 'รายการนี้ถูกยกเลิกไปแล้ว เปลี่ยนหมวดไม่ได้ (' + tx2.ID + ')');
    } else {
      updateRowObject_(getUserSS_(userId).getSheetByName(SHEET_NAMES.TX), tx2.__row, { Category: params.cat, UpdatedAt: nowStr_() });
      replyLine_(replyToken, userId, buildTransactionFlex_(tx2.ID, {
        type: tx2.Type, amount: tx2.Amount, category: params.cat, description: tx2.Description
      }, 'pending', userId));
    }
  }
}

/**
 * ONE-OFF REPAIR TOOL — run manually from the Apps Script editor, not from the app.
 * Lists confirmed transactions currently sitting in "เงินสด" that were NOT entered
 * manually from the dashboard (Source !== 'dashboard') — i.e. the AI guessed the
 * account, or the old resolveAccountId_ silently defaulted to it. Doesn't move any
 * money; just gives you the list to review in the Apps Script "Executions" log.
 */
/** NOT YET MULTI-TENANT (Phase 2): this scans the central spreadsheet only,
 *  so it won't see data for any user who has been migrated to their own
 *  per-user spreadsheet. It's an admin/maintenance-only tool, not part of
 *  everyday request handling, so it's left as-is for now — would need a
 *  per-user loop (like processRecurringTransactions_) to cover everyone. */
function auditCashMisassignments_() {
  var ss = getSS_();
  var accs = sheetToObjects_(ss.getSheetByName(SHEET_NAMES.ACCOUNTS));
  var txs = sheetToObjects_(ss.getSheetByName(SHEET_NAMES.TX))
    .filter(function(t) { return t.Status === 'confirmed' && t.Source !== 'dashboard'; });
  var suspects = txs.filter(function(t) {
    var acc = accs.filter(function(a) { return a.AccountID === t.AccountID; })[0];
    return acc && acc.AccountName === 'เงินสด';
  });
  suspects.forEach(function(t) {
    Logger.log(t.ID + ' | ' + t.TransactionDate + ' ' + t.TransactionTime + ' | ฿' + t.Amount +
      ' | ' + t.Category + ' | ' + t.Description + ' | source=' + t.Source + ' | aiGuess=' + getTxTransferField_(t, 'account'));
  });
  Logger.log('รวม ' + suspects.length + ' รายการที่น่าสงสัย');
  return { count: suspects.length, ids: suspects.map(function(t) { return t.ID; }) };
}

/**
 * ONE-OFF REPAIR TOOL — after reviewing auditCashMisassignments_'s output, build a
 * map of {txId: correctAccountId} for the ones that really were mis-tagged and pass
 * it here. Reuses editTransactionRow_ so balances on BOTH the old and new account are
 * corrected properly (not just added/subtracted ad hoc), then rebuilds every balance
 * from scratch as a final consistency check.
 * Example: bulkReassignAccount_({ 'TX-abc123': 'ACC-def456', 'TX-xyz789': 'ACC-def456' })
 */
/** NOT YET MULTI-TENANT (Phase 2): this scans the central spreadsheet only,
 *  so it won't see data for any user who has been migrated to their own
 *  per-user spreadsheet. It's an admin/maintenance-only tool, not part of
 *  everyday request handling, so it's left as-is for now — would need a
 *  per-user loop (like processRecurringTransactions_) to cover everyone. */
function bulkReassignAccount_(txIdToAccountId) {
  var results = [];
  Object.keys(txIdToAccountId).forEach(function(txId) {
    // txId's UserID isn't known yet, so look it up across all users first.
    var ss = getSS_();
    var row = sheetToObjects_(ss.getSheetByName(SHEET_NAMES.TX)).filter(function(t) { return t.ID === txId; })[0];
    if (!row) { results.push({ txId: txId, error: 'not found' }); return; }
    var tx = findTransactionById_(row.UserID, txId);
    editTransactionRow_(tx, { AccountID: txIdToAccountId[txId] });
    results.push({ txId: txId, movedTo: txIdToAccountId[txId] });
  });
  var rebuild = rebuildUserBalances();
  Logger.log('ย้ายบัญชีแล้ว ' + results.length + ' รายการ, rebuild: ' + JSON.stringify(rebuild));
  return { moved: results, rebuild: rebuild };
}

/** NOT YET MULTI-TENANT (Phase 2): this scans the central spreadsheet only,
 *  so it won't see data for any user who has been migrated to their own
 *  per-user spreadsheet. It's an admin/maintenance-only tool, not part of
 *  everyday request handling, so it's left as-is for now — would need a
 *  per-user loop (like processRecurringTransactions_) to cover everyone. */
function rebuildUserBalances() {
  var ss = getSS_();
  var txSh = ss.getSheetByName(SHEET_NAMES.TX);
  var accSh = ss.getSheetByName(SHEET_NAMES.ACCOUNTS);
  var userSh = ss.getSheetByName(SHEET_NAMES.USERS);
  var txs = sheetToObjects_(txSh).filter(function(t){ return t.Status === 'confirmed'; });
  var accounts = sheetToObjects_(accSh);
  var users = sheetToObjects_(userSh);
  var userTotals = {};
  var accountTotals = {};
  accounts.forEach(function(a){ accountTotals[a.AccountID] = Number(a.OpeningBalance || 0); });
  txs.forEach(function(t){
    var amount = Number(t.Amount || 0);
    if (!userTotals[t.UserID]) userTotals[t.UserID] = {income:0, expense:0};
    if (t.Type === 'income') userTotals[t.UserID].income += amount;
    if (t.Type === 'expense') userTotals[t.UserID].expense += amount;
    if (t.Type === 'transfer') {
      var fromName = getTxTransferField_(t, 'transferFromAccount');
      var toName = getTxTransferField_(t, 'transferToAccount');
      var from = accounts.filter(function(a){ return a.UserID===t.UserID && a.AccountName===fromName; })[0];
      var to = accounts.filter(function(a){ return a.UserID===t.UserID && a.AccountName===toName; })[0];
      if (from) accountTotals[from.AccountID] = Number(accountTotals[from.AccountID] || 0) - amount;
      if (to) accountTotals[to.AccountID] = Number(accountTotals[to.AccountID] || 0) + amount;
    } else if (t.AccountID) {
      accountTotals[t.AccountID] = Number(accountTotals[t.AccountID] || 0) + (t.Type === 'income' ? amount : -amount);
    }
  });
  accounts.forEach(function(a){
    updateRowObject_(accSh, a.__row, {CurrentBalance: Number(accountTotals[a.AccountID] || 0), UpdatedAt: nowStr_()});
  });
  users.forEach(function(u){
    var x = userTotals[u.UserID] || {income:0, expense:0};
    updateRowObject_(userSh, u.__row, {TotalIncome:x.income, TotalExpense:x.expense, Balance:x.income-x.expense, UpdatedAt:nowStr_()});
  });
  logAudit_('SYSTEM','REBUILD_BALANCES','system','','','success','Rebuilt account and user balances from confirmed transactions');
  return {success:true, users:users.length, accounts:accounts.length, confirmedTransactions:txs.length};
}

function validateAndRepairSystem() {

  var txs = sheetToObjects_(ss.getSheetByName(SHEET_NAMES.TX));

  return {success:true, duplicateEventIds:duplicateEventIds, badConfirmedTransactions:bad, transactionCount:txs.length};
}
