/* ============================================================
 * 13. BUDGET
 * ============================================================ */
function updateBudgetUsage_(userId, category, amount) {
  var ss = getUserSS_(userId);
  var sh = ss.getSheetByName(SHEET_NAMES.BUDGETS);
  var month = Utilities.formatDate(new Date(), TZ, 'yyyy-MM');
  var rows = sheetToObjects_(sh);
  // `category` here is the transaction's Category field. Transactions created
  // via AI (LINE text/slip) store a category NAME (e.g. "อาหาร"), but a budget
  // row's CategoryID can be either a name or an opaque code depending on how it
  // was set — the web "ตั้งงบ" dropdown uses CategoryID when the category has
  // one. A strict CategoryID===category match would silently never fire for a
  // budget keyed by ID while every transaction reports its category by name
  // (UsedAmount stays 0 forever, budgets never look "used" no matter how much
  // is spent) — so resolve both sides to the same category first, then compare.
  var catRows = sheetToObjects_(getSS_().getSheetByName(SHEET_NAMES.CATEGORIES));
  var cat = catRows.filter(function(c) { return c.CategoryID === category || c.CategoryName === category; })[0];
  var match = rows.filter(function(r) {
    if (r.UserID !== userId || r.Month !== month) return false;
    if (r.CategoryID === category) return true;
    return !!cat && (r.CategoryID === cat.CategoryID || r.CategoryID === cat.CategoryName);
  })[0];
  if (!match) return; // no budget set for this category this month
  var used = Number(match.UsedAmount || 0) + amount;
  var budgetAmount = Number(match.BudgetAmount || 0);
  var remaining = budgetAmount - used;
  var pct = budgetAmount > 0 ? Math.round((used / budgetAmount) * 100) : 0;
  var status = pct > 100 ? 'over' : pct > 90 ? 'critical' : pct > 70 ? 'warning' : 'normal';
  updateRowObject_(sh, match.__row, {
    UsedAmount: used, RemainingAmount: remaining, PercentageUsed: pct, Status: status, UpdatedAt: nowStr_()
  });
}

/** Deletes a budget row outright (as opposed to apiSetBudget_, which only ever
 *  updates-or-inserts) — needed so leftover duplicate rows from the earlier
 *  Month-format bug (before Month was normalized to "yyyy-MM" on read) can
 *  actually be cleaned up from the dashboard instead of piling up forever. */
function apiDeleteBudget_(session, body) {
  requireSession_(session);
  var ss = getUserSS_(session.userId);
  var sh = getOrCreateSheet_(ss, SHEET_NAMES.BUDGETS);
  ensureHeaders_(sh, SCHEMAS.Budgets);
  var rows = sheetToObjects_(sh);
  var match = rows.filter(function(r) { return r.BudgetID === body.budgetId && r.UserID === session.userId; })[0];
  if (!match) return { success: false, error: 'ไม่พบงบประมาณนี้' };
  sh.deleteRow(match.__row);
  return { success: true };
}

function apiSetBudget_(session, body) {
  requireSession_(session);
  var ss = getUserSS_(session.userId);
  // getOrCreateSheet_ + ensureHeaders_ (rather than a raw getSheetByName) so this
  // self-heals if the Budgets sheet was never created/headered in this spreadsheet —
  // previously a raw getSheetByName here meant a missing header row made every
  // write silently land in the wrong columns, so the budget list looked empty
  // even after "saving" successfully.
  var sh = getOrCreateSheet_(ss, SHEET_NAMES.BUDGETS);
  ensureHeaders_(sh, SCHEMAS.Budgets);
  forceColumnAsText_(sh, 'Month'); // stop Sheets from auto-converting "2026-09" into a real Date on write
  var month = body.month || Utilities.formatDate(new Date(), TZ, 'yyyy-MM');
  var rows = sheetToObjects_(sh);
  var match = rows.filter(function(r) { return r.UserID === session.userId && r.Month === month && r.CategoryID === body.category; })[0];
  var budgetAmount = Number(body.amount || 0);
  if (match) {
    var used = Number(match.UsedAmount || 0);
    updateRowObject_(sh, match.__row, {
      BudgetAmount: budgetAmount, RemainingAmount: budgetAmount - used,
      PercentageUsed: budgetAmount > 0 ? Math.round((used / budgetAmount) * 100) : 0,
      UpdatedAt: nowStr_()
    });
  } else {
    appendRowObject_(sh, {
      BudgetID: 'BUD-' + Utilities.getUuid().slice(0, 8), UserID: session.userId, Month: month,
      CategoryID: body.category, BudgetAmount: budgetAmount, UsedAmount: 0,
      RemainingAmount: budgetAmount, PercentageUsed: 0, Status: 'normal',
      CreatedAt: nowStr_(), UpdatedAt: nowStr_()
    });
  }
  return { success: true };
}

function apiBudget_(session, params) {
  requireSession_(session);
  var ss = getUserSS_(session.userId);
  var sh = getOrCreateSheet_(ss, SHEET_NAMES.BUDGETS);
  ensureHeaders_(sh, SCHEMAS.Budgets);
  var month = params.month || Utilities.formatDate(new Date(), TZ, 'yyyy-MM');
  var rows = sheetToObjects_(sh).filter(function(r) { return r.UserID === session.userId && r.Month === month; });
  return { success: true, data: rows.map(stripRowMeta_) };
}

/* ============================================================
 * 14. REST API — READ ENDPOINTS
 * ============================================================ */
function stripRowMeta_(obj) {
  var copy = {};
  Object.keys(obj).forEach(function(k) { if (k !== '__row') copy[k] = obj[k]; });
  return copy;
}

function getUserTransactions_(userId) {
  var ss = getUserSS_(userId);
  var sh = ss.getSheetByName(SHEET_NAMES.TX);
  return sheetToObjects_(sh).filter(function(r) { return r.UserID === userId; });
}

/**
 * Single consolidated call for the whole dashboard tab. Replaces what used to be
 * up to 6 separate requests (dashboard, summary, transactions, accounts,
 * month-comparison, needs-attention) — each of which re-read the Transactions
 * sheet from scratch — with one request that reads Transactions/Accounts/
 * Budgets/Categories exactly once each and derives every dashboard section
 * from that single pass.
 */
function apiDashboardFull_(session) {
  requireSession_(session);
  var ss = getUserSS_(session.userId);
  var mainSs = getSS_(); // Categories + Users totals live centrally — see getUserSS_ comment
  var now = new Date();
  var ym = Utilities.formatDate(now, TZ, 'yyyy-MM');
  var todayStr = Utilities.formatDate(now, TZ, 'yyyy-MM-dd');
  var dayOfMonth = now.getDate();
  var prevDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  var prevYm = Utilities.formatDate(prevDate, TZ, 'yyyy-MM');
  var LOW_BALANCE_THRESHOLD = 500;
  var HIGH_SPEND_DAY_MULTIPLIER = 1.5;

  var allTxs = getUserTransactions_(session.userId);
  var activeTxs = allTxs.filter(function(t) { return t.Status !== 'cancelled'; });
  var thisMonthAll = activeTxs.filter(function(t) { return String(t.TransactionDate).indexOf(ym) === 0; });
  var thisMonthExpense = thisMonthAll.filter(function(t) { return t.Type === 'expense'; });
  var prevMonthExpense = activeTxs.filter(function(t) { return t.Type === 'expense' && String(t.TransactionDate).indexOf(prevYm) === 0; });

  // --- overview numbers (was the `dashboard` action) ---
  var monthlyIncome = sumBy_(thisMonthAll, 'income');
  var monthlyExpense = sumBy_(thisMonthAll, 'expense');

  // --- category breakdown (was `summary`) ---
  var expenseByCategory = {}, incomeByCategory = {};
  thisMonthAll.forEach(function(t) {
    if (t.Type === 'expense') expenseByCategory[t.Category] = (expenseByCategory[t.Category] || 0) + Number(t.Amount || 0);
    else if (t.Type === 'income') incomeByCategory[t.Category] = (incomeByCategory[t.Category] || 0) + Number(t.Amount || 0);
  });

  // --- month-over-month comparison (was `month-comparison`) ---
  function bucketExpense(items) {
    var byCategory = {}, total = 0;
    items.forEach(function(t) {
      var amt = Number(t.Amount || 0);
      total += amt;
      byCategory[t.Category] = (byCategory[t.Category] || 0) + amt;
    });
    return { total: total, byCategory: byCategory };
  }
  var curBucket = bucketExpense(thisMonthExpense);
  var prevBucket = bucketExpense(prevMonthExpense);

  // --- recent transactions (was `transactions` page 1) ---
  var recent = allTxs.slice().sort(function(a, b) {
    return new Date(b.TransactionDate + ' ' + b.TransactionTime) - new Date(a.TransactionDate + ' ' + a.TransactionTime);
  }).slice(0, 8).map(stripRowMeta_);

  // --- accounts ---
  var accounts = sheetToObjects_(ss.getSheetByName(SHEET_NAMES.ACCOUNTS)).filter(function(a) {
    return a.UserID === session.userId && a.Status !== 'archived';
  }).map(stripRowMeta_);

  // --- budgets (for this month, self-healing sheet like apiBudget_) ---
  var budgetSh = getOrCreateSheet_(ss, SHEET_NAMES.BUDGETS);
  ensureHeaders_(budgetSh, SCHEMAS.Budgets);
  var budgets = sheetToObjects_(budgetSh).filter(function(r) { return r.UserID === session.userId && r.Month === ym; }).map(stripRowMeta_);
  var categories = sheetToObjects_(mainSs.getSheetByName(SHEET_NAMES.CATEGORIES));

  // --- "ต้องจัดการ" alerts (was `needs-attention`) ---
  var attentionItems = [];
  budgets.filter(function(b) { return Number(b.PercentageUsed || 0) >= 70; }).forEach(function(b) {
    var cat = categories.filter(function(c) { return c.CategoryID === b.CategoryID || c.CategoryName === b.CategoryID; })[0] || {};
    var pct = Number(b.PercentageUsed || 0);
    var meta = pct >= 100 ? { emoji: '⛔', label: 'เกินงบ' } : pct >= 90 ? { emoji: '🔴', label: 'ต้องระวัง' } : { emoji: '🟡', label: 'ใกล้เต็ม' };
    attentionItems.push({ type: 'budget', icon: meta.emoji, text: 'งบ' + (cat.CategoryName || b.CategoryID) + ' ' + meta.label + ' (' + pct + '%)' });
  });

  var pendingCount = allTxs.filter(function(t) { return t.Status === 'pending'; }).length;
  if (pendingCount > 0) attentionItems.push({ type: 'pending', icon: '⏳', text: 'มีรายการรอยืนยัน ' + pendingCount + ' รายการ' });

  accounts.forEach(function(a) {
    if (a.AccountType === 'card') return;
    if (Number(a.CurrentBalance || 0) < LOW_BALANCE_THRESHOLD) {
      attentionItems.push({ type: 'lowBalance', icon: '🏦', text: 'บัญชี ' + a.AccountName + ' ยอดเหลือน้อย (฿' + Number(a.CurrentBalance || 0).toLocaleString() + ')', accountId: a.AccountID });
    }
  });

  var todayTotal = thisMonthExpense.filter(function(t) { return t.TransactionDate === todayStr; }).reduce(function(s, t) { return s + Number(t.Amount || 0); }, 0);
  var priorTotal = thisMonthExpense.filter(function(t) { return t.TransactionDate !== todayStr; }).reduce(function(s, t) { return s + Number(t.Amount || 0); }, 0);
  var avgDaily = dayOfMonth > 1 ? priorTotal / (dayOfMonth - 1) : 0;
  if (avgDaily > 0 && todayTotal > avgDaily * HIGH_SPEND_DAY_MULTIPLIER) {
    attentionItems.push({
      type: 'highSpendToday', icon: '📈',
      text: 'วันนี้ใช้เงินไปแล้ว ฿' + Math.round(todayTotal).toLocaleString() + ' สูงกว่าค่าเฉลี่ยต่อวัน (฿' + Math.round(avgDaily).toLocaleString() + ')',
      date: todayStr
    });
  }

  // Duplicate detection: date+amount+category+description alone still isn't
  // enough — someone who repeats the same activity with the same generic label
  // (e.g. "เทรดทอง" logged several times a day, always the same wording) will
  // legitimately have several real transactions that match on all four fields.
  // Beyond how close together in time they happened (accidental double-submits
  // tend to land minutes apart, not hours), several other fields already on the
  // record can independently PROVE two entries are separate real transactions,
  // no matter how close in time or how identical everything else looks:
  //   - different bank slip reference numbers (each real transaction gets its own)
  //   - different AccountID (you don't pay the same real transaction from two accounts)
  //   - different Merchant names (the AI/slip identified two different payees)
  // Any one of these being different is enough to rule out a duplicate.
  var DUPLICATE_TIME_WINDOW_MIN = 30;
  function timeToMinutes_(t) {
    var parts = String(t || '0:0').split(':');
    return (Number(parts[0]) || 0) * 60 + (Number(parts[1]) || 0);
  }
  function fieldsProveDifferent_(a, b) {
    if (a.SlipRefNumber && b.SlipRefNumber && String(a.SlipRefNumber) !== String(b.SlipRefNumber)) return true;
    if (a.AccountID && b.AccountID && String(a.AccountID) !== String(b.AccountID)) return true;
    if (a.Merchant && b.Merchant && String(a.Merchant).trim() !== String(b.Merchant).trim()) return true;
    return false;
  }
  var userSh = mainSs.getSheetByName(SHEET_NAMES.USERS);
  ensureHeaders_(userSh, SCHEMAS.Users);
  var userRow = sheetToObjects_(userSh).filter(function(u) { return u.UserID === session.userId; })[0];
  var excludedCategories = (userRow && userRow.DuplicateCheckExcludedCategories)
    ? String(userRow.DuplicateCheckExcludedCategories).split(',').map(function(s) { return s.trim(); }).filter(Boolean)
    : [];
  var seen = {};
  thisMonthExpense.forEach(function(t) {
    if (excludedCategories.indexOf(t.Category) !== -1) return; // this category is exempt from duplicate checking
    var key = t.TransactionDate + '|' + t.Amount + '|' + t.Category + '|' + (t.Description || '').trim().toLowerCase();
    if (!seen[key]) seen[key] = [];
    seen[key].push(t);
  });
  // Return the actual matching transactions, not just a count, so the dashboard
  // can show exactly which items look duplicated instead of sending the person
  // to their entire transaction history to go hunting for them.
  var dupGroups = [];
  Object.keys(seen).forEach(function(key) {
    var items = seen[key].slice().sort(function(a, b) { return timeToMinutes_(a.TransactionTime) - timeToMinutes_(b.TransactionTime); });
    var cluster = [items[0]];
    for (var i = 1; i < items.length; i++) {
      var prev = items[i - 1], cur = items[i];
      var gap = timeToMinutes_(cur.TransactionTime) - timeToMinutes_(prev.TransactionTime);
      var provenDifferent = fieldsProveDifferent_(prev, cur);
      if (gap <= DUPLICATE_TIME_WINDOW_MIN && !provenDifferent) {
        cluster.push(cur);
      } else {
        if (cluster.length > 1) dupGroups.push(cluster.map(stripRowMeta_));
        cluster = [cur];
      }
    }
    if (cluster.length > 1) dupGroups.push(cluster.map(stripRowMeta_));
  });
  if (dupGroups.length > 0) {
    attentionItems.push({ type: 'duplicate', icon: '🔁', text: 'มีรายการที่อาจซ้ำกัน ' + dupGroups.length + ' คู่ (วันที่ จำนวนเงิน หมวด รายละเอียดตรงกัน และเวลาห่างกันไม่ถึง ' + DUPLICATE_TIME_WINDOW_MIN + ' นาที)', groups: dupGroups });
  }

  // --- debts (self-healing sheet like budgets) ---
  var debtSh = getOrCreateSheet_(ss, SHEET_NAMES.DEBTS);
  ensureHeaders_(debtSh, SCHEMAS.Debts);
  var debts = sheetToObjects_(debtSh).filter(function(r) { return r.UserID === session.userId; }).map(debtWithComputedFields_);
  var totalDebtRemaining = debts.filter(function(d) { return d.status !== 'paid_off'; }).reduce(function(s, d) { return s + d.remainingAmount; }, 0);
  debts.forEach(function(d) {
    if (d.isOverdue) {
      attentionItems.push({ type: 'debtOverdue', icon: '🔴', text: 'หนี้ ' + d.name + ' เลยกำหนดชำระแล้ว (เหลือ ฿' + Math.round(d.remainingAmount).toLocaleString() + ')', debtId: d.id });
    } else if (d.isDueSoon) {
      attentionItems.push({ type: 'debtDueSoon', icon: '🟡', text: 'หนี้ ' + d.name + ' ครบกำหนดใน ' + d.daysUntilDue + ' วัน (เหลือ ฿' + Math.round(d.remainingAmount).toLocaleString() + ')', debtId: d.id });
    }
  });

  // --- recurring transactions (self-healing sheet like debts/budgets) ---
  var recSh = getOrCreateSheet_(ss, SHEET_NAMES.RECURRING);
  ensureHeaders_(recSh, SCHEMAS.RecurringTransactions);
  var recurring = sheetToObjects_(recSh).filter(function(r) { return r.UserID === session.userId && r.Status === 'active'; }).map(recurringWithComputedFields_);
  recurring.filter(function(r) { return r.daysUntilNextRun >= 0 && r.daysUntilNextRun <= 2; }).forEach(function(r) {
    attentionItems.push({
      type: 'recurringDueSoon', icon: '🔁',
      text: (r.daysUntilNextRun === 0 ? 'รายการประจำ ' + r.name + ' จะรันวันนี้' : 'รายการประจำ ' + r.name + ' จะรันในอีก ' + r.daysUntilNextRun + ' วัน') + ' (฿' + Math.round(r.amount).toLocaleString() + ')'
    });
  });

  return {
    success: true,
    data: {
      overview: { monthlyIncome: monthlyIncome, monthlyExpense: monthlyExpense, balance: monthlyIncome - monthlyExpense, transactionCount: thisMonthAll.length, totalDebtRemaining: totalDebtRemaining },
      recentTransactions: recent,
      accounts: accounts,
      expenseByCategory: expenseByCategory,
      incomeByCategory: incomeByCategory,
      comparison: {
        current: { month: ym, label: thaiMonthLabel_(now), total: curBucket.total, byCategory: curBucket.byCategory },
        previous: { month: prevYm, label: thaiMonthLabel_(prevDate), total: prevBucket.total, byCategory: prevBucket.byCategory }
      },
      attention: attentionItems
    }
  };
}

function apiDashboard_(session) {
  requireSession_(session);
  var txs = getUserTransactions_(session.userId).filter(function(t) { return t.Status !== 'cancelled'; });
  var now = new Date();
  var ym = Utilities.formatDate(now, TZ, 'yyyy-MM');
  var thisMonth = txs.filter(function(t) { return String(t.TransactionDate).indexOf(ym) === 0; });
  var income = sumBy_(thisMonth, 'income');
  var expense = sumBy_(thisMonth, 'expense');
  return {
    success: true,
    data: {
      monthlyIncome: income, monthlyExpense: expense, balance: income - expense,
      transactionCount: thisMonth.length
    }
  };
}

function sumBy_(txs, type) {
  return txs.filter(function(t) { return t.Type === type; }).reduce(function(s, t) { return s + Number(t.Amount || 0); }, 0);
}

function apiTransactions_(session, params) {
  requireSession_(session);
  var txs = getUserTransactions_(session.userId);
  if (params.status) txs = txs.filter(function(t) { return t.Status === params.status; });
  if (params.type) txs = txs.filter(function(t) { return t.Type === params.type; });
  if (params.category) txs = txs.filter(function(t) { return t.Category === params.category; });
  if (params.accountId) txs = txs.filter(function(t) { return t.AccountID === params.accountId; });
  if (params.dateFrom) txs = txs.filter(function(t) { return String(t.TransactionDate) >= params.dateFrom; });
  if (params.dateTo) txs = txs.filter(function(t) { return String(t.TransactionDate) <= params.dateTo; });
  if (params.search) {
    var q = params.search.toLowerCase();
    txs = txs.filter(function(t) {
      return (String(t.Description) + String(t.Merchant) + String(t.Category)).toLowerCase().indexOf(q) !== -1;
    });
  }
  txs.sort(function(a, b) { return new Date(b.TransactionDate + ' ' + b.TransactionTime) - new Date(a.TransactionDate + ' ' + a.TransactionTime); });

  var page = Number(params.page || 1);
  var pageSize = Number(params.pageSize || 20);
  var total = txs.length;
  var start = (page - 1) * pageSize;
  var pageItems = txs.slice(start, start + pageSize).map(stripRowMeta_);

  return { success: true, data: { items: pageItems, total: total, page: page, pageSize: pageSize } };
}

function apiSummary_(session, params) {
  requireSession_(session);
  var month = (params && params.month) || Utilities.formatDate(new Date(), TZ, 'yyyy-MM');
  // Scoped to `month` (defaults to the current month) to match how the dashboard
  // labels this data ("ค่าใช้จ่ายเดือนนี้" / "หมวดที่ใช้เงินมากที่สุด") — this used to
  // sum every transaction ever recorded regardless of month, which silently made
  // those "this month" figures all-time totals instead.
  var txs = getUserTransactions_(session.userId).filter(function(t) {
    return t.Status !== 'cancelled' && String(t.TransactionDate).indexOf(month) === 0;
  });
  var byCategory = {};
  txs.forEach(function(t) {
    if (t.Type !== 'expense') return;
    byCategory[t.Category] = (byCategory[t.Category] || 0) + Number(t.Amount || 0);
  });
  var byCategoryIncome = {};
  txs.forEach(function(t) {
    if (t.Type !== 'income') return;
    byCategoryIncome[t.Category] = (byCategoryIncome[t.Category] || 0) + Number(t.Amount || 0);
  });
  return { success: true, data: { month: month, expenseByCategory: byCategory, incomeByCategory: byCategoryIncome } };
}

/**
 * Utilities.formatDate's month-name output follows the Apps Script project's
 * locale (usually English), but the rest of this app's UI is Thai — so month
 * labels shown to the user (e.g. in the dashboard's month-comparison card) are
 * built from this fixed Thai name list instead, with the year in the Buddhist
 * calendar (+543) to match how Thai users read dates elsewhere in the app.
 */
var THAI_MONTHS_ = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
function thaiMonthLabel_(date) {
  return THAI_MONTHS_[date.getMonth()] + ' ' + (date.getFullYear() + 543);
}

/**
 * Single-call month-over-month comparison for the dashboard's "เปรียบเทียบเดือน" card.
 * Reads the user's transactions once (getUserTransactions_ already scans the whole
 * sheet) and buckets them into this month vs. last month here, instead of the
 * dashboard making two separate `transactions` calls (each of which re-scans the
 * same sheet from scratch) and aggregating client-side.
 */
function apiMonthComparison_(session, params) {
  requireSession_(session);
  var now = new Date();
  var curYm = Utilities.formatDate(now, TZ, 'yyyy-MM');
  var prevDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  var prevYm = Utilities.formatDate(prevDate, TZ, 'yyyy-MM');

  var txs = getUserTransactions_(session.userId).filter(function(t) {
    return t.Status !== 'cancelled' && t.Type === 'expense';
  });

  function bucket(ym) {
    var items = txs.filter(function(t) { return String(t.TransactionDate).indexOf(ym) === 0; });
    var byCategory = {};
    var total = 0;
    items.forEach(function(t) {
      var amt = Number(t.Amount || 0);
      total += amt;
      byCategory[t.Category] = (byCategory[t.Category] || 0) + amt;
    });
    return { total: total, byCategory: byCategory };
  }

  var cur = bucket(curYm);
  var prev = bucket(prevYm);
  var curLabel = thaiMonthLabel_(now);
  var prevLabel = thaiMonthLabel_(prevDate);

  return {
    success: true,
    data: {
      current: { month: curYm, label: curLabel, total: cur.total, byCategory: cur.byCategory },
      previous: { month: prevYm, label: prevLabel, total: prev.total, byCategory: prev.byCategory }
    }
  };
}

/**
 * Single-call feed for the dashboard's "⚠️ สิ่งที่ต้องจัดการ" card. Computes every
 * alert server-side from one pass over the user's transactions/budgets/accounts,
 * instead of the dashboard making 4+ separate API calls (budget, pending
 * transactions, accounts, and a full month of transactions) and aggregating
 * client-side on every dashboard load.
 */
function apiNeedsAttention_(session, params) {
  requireSession_(session);
  var LOW_BALANCE_THRESHOLD = 500;
  var HIGH_SPEND_DAY_MULTIPLIER = 1.5;

  var now = new Date();
  var ym = Utilities.formatDate(now, TZ, 'yyyy-MM');
  var todayStr = Utilities.formatDate(now, TZ, 'yyyy-MM-dd');
  var dayOfMonth = now.getDate();

  var items = [];

  // 1) Budgets at 70%+ used
  var budgets = apiBudget_(session, { month: ym }).data;
  var mainSs = getSS_();
  var categories = sheetToObjects_(mainSs.getSheetByName(SHEET_NAMES.CATEGORIES));
  budgets.filter(function(b) { return Number(b.PercentageUsed || 0) >= 70; }).forEach(function(b) {
    var cat = categories.filter(function(c) { return c.CategoryID === b.CategoryID || c.CategoryName === b.CategoryID; })[0] || {};
    var pct = Number(b.PercentageUsed || 0);
    var meta = pct >= 100 ? { emoji: '⛔', label: 'เกินงบ' }
      : pct >= 90 ? { emoji: '🔴', label: 'ต้องระวัง' }
      : { emoji: '🟡', label: 'ใกล้เต็ม' };
    items.push({ type: 'budget', icon: meta.emoji, text: 'งบ' + (cat.CategoryName || b.CategoryID) + ' ' + meta.label + ' (' + pct + '%)' });
  });

  // 2) Pending transactions + this month's expenses in one read
  var allTxs = getUserTransactions_(session.userId);
  var pendingCount = allTxs.filter(function(t) { return t.Status === 'pending'; }).length;
  if (pendingCount > 0) {
    items.push({ type: 'pending', icon: '⏳', text: 'มีรายการรอยืนยัน ' + pendingCount + ' รายการ' });
  }

  var expenseThisMonth = allTxs.filter(function(t) {
    return t.Status !== 'cancelled' && t.Type === 'expense' && String(t.TransactionDate).indexOf(ym) === 0;
  });

  // 3) Accounts running low (cash/bank/wallet only — a card's balance can
  // legitimately sit near zero or represent a credit line, not "low funds")
  var accounts = sheetToObjects_(getUserSS_(session.userId).getSheetByName(SHEET_NAMES.ACCOUNTS)).filter(function(a) {
    return a.UserID === session.userId && a.Status !== 'archived';
  });
  accounts.forEach(function(a) {
    if (a.AccountType === 'card') return;
    if (Number(a.CurrentBalance || 0) < LOW_BALANCE_THRESHOLD) {
      items.push({ type: 'lowBalance', icon: '🏦', text: 'บัญชี ' + a.AccountName + ' ยอดเหลือน้อย (฿' + Number(a.CurrentBalance || 0).toLocaleString() + ')', accountId: a.AccountID });
    }
  });

  // 4) Today's spend vs. this month's daily average (excluding today)
  var todayTotal = expenseThisMonth.filter(function(t) { return t.TransactionDate === todayStr; })
    .reduce(function(s, t) { return s + Number(t.Amount || 0); }, 0);
  var priorTotal = expenseThisMonth.filter(function(t) { return t.TransactionDate !== todayStr; })
    .reduce(function(s, t) { return s + Number(t.Amount || 0); }, 0);
  var avgDaily = dayOfMonth > 1 ? priorTotal / (dayOfMonth - 1) : 0;
  if (avgDaily > 0 && todayTotal > avgDaily * HIGH_SPEND_DAY_MULTIPLIER) {
    items.push({
      type: 'highSpendToday', icon: '📈',
      text: 'วันนี้ใช้เงินไปแล้ว ฿' + Math.round(todayTotal).toLocaleString() + ' สูงกว่าค่าเฉลี่ยต่อวัน (฿' + Math.round(avgDaily).toLocaleString() + ')',
      date: todayStr
    });
  }

  // 5) Possible duplicate entries — same date + amount + category more than once this month
  var seen = {};
  expenseThisMonth.forEach(function(t) {
    var key = t.TransactionDate + '|' + t.Amount + '|' + t.Category;
    seen[key] = (seen[key] || 0) + 1;
  });
  var dupCount = Object.keys(seen).filter(function(k) { return seen[k] > 1; }).length;
  if (dupCount > 0) {
    items.push({ type: 'duplicate', icon: '🔁', text: 'มีรายการที่อาจซ้ำกัน ' + dupCount + ' คู่ (วันที่ จำนวนเงิน และหมวดตรงกัน)' });
  }

  return { success: true, data: { items: items } };
}

function apiDaily_(session, params) {
  requireSession_(session);
  var month = params.month || Utilities.formatDate(new Date(), TZ, 'yyyy-MM');
  var txs = getUserTransactions_(session.userId).filter(function(t) {
    return t.Status !== 'cancelled' && String(t.TransactionDate).indexOf(month) === 0;
  });
  var byDay = {};
  txs.forEach(function(t) {
    var d = t.TransactionDate;
    if (!byDay[d]) byDay[d] = { income: 0, expense: 0 };
    if (t.Type === 'income') byDay[d].income += Number(t.Amount || 0);
    if (t.Type === 'expense') byDay[d].expense += Number(t.Amount || 0);
  });
  return { success: true, data: byDay };
}

function apiMonthly_(session, params) {
  requireSession_(session);
  var txs = getUserTransactions_(session.userId).filter(function(t) { return t.Status !== 'cancelled'; });
  var byMonth = {};
  txs.forEach(function(t) {
    var m = String(t.TransactionDate).substring(0, 7);
    if (!m) return;
    if (!byMonth[m]) byMonth[m] = { income: 0, expense: 0 };
    if (t.Type === 'income') byMonth[m].income += Number(t.Amount || 0);
    if (t.Type === 'expense') byMonth[m].expense += Number(t.Amount || 0);
  });
  return { success: true, data: byMonth };
}

function apiCategories_() {
  var ss = getSS_();

/**

/**
 * Recalculates every account's CurrentBalance (and every user's totals) from
 * scratch based on OpeningBalance + confirmed transactions — ignores whatever
 * CurrentBalance currently says entirely. Fixes drift that a normal cancel/edit
 * in the app would never cause (those already reverse balances correctly) but
 * that manually deleting or editing rows directly in the Google Sheet does —
 * deleting a transaction row doesn't undo the balance change it already made,
 * since CurrentBalance is a stored running total, not a live formula.
 */
function apiRebuildBalances_(session) {
  requireSession_(session);
  var result = rebuildUserBalances();
  return { success: true, data: result };
}

function apiBulkReassignAccount_(session, body) {
  requireSession_(session);
  var reassignments = body.reassignments || {}; // { txId: accountId }
  var ss = getUserSS_(session.userId);
  var validAccountIds = {};
  sheetToObjects_(ss.getSheetByName(SHEET_NAMES.ACCOUNTS))
    .filter(function(a) { return a.UserID === session.userId; })
    .forEach(function(a) { validAccountIds[a.AccountID] = true; });

  var results = [];
  Object.keys(reassignments).forEach(function(txId) {
    var tx = findTransactionById_(session.userId, txId);
    if (!tx) { results.push({ txId: txId, error: 'ไม่พบรายการนี้' }); return; }
    var newAccountId = reassignments[txId];
    if (!validAccountIds[newAccountId]) { results.push({ txId: txId, error: 'บัญชีปลายทางไม่ถูกต้อง' }); return; }
    editTransactionRow_(tx, { AccountID: newAccountId });
    results.push({ txId: txId, movedTo: newAccountId });
  });
  var rebuild = rebuildUserBalances();
  logAudit_(session.userId, 'BULK_REASSIGN', results.length + ' transactions', '', '', 'success', 'Reassigned via dashboard audit tool');
  return { success: true, data: { moved: results, rebuild: rebuild } };
}

var ACCOUNT_TYPES_ = ['cash', 'bank', 'wallet', 'card'];

/**
 * Renames an account and/or changes its type. Only touches AccountName/AccountType —
 * CurrentBalance keeps accumulating exactly as before (renaming doesn't re-run any
 * balance math), and the AccountID never changes, so every past transaction still
 * points at the same account correctly.
 */
function apiUpdateAccount_(session, body) {
  requireSession_(session);
  if (!body.accountId) return { success: false, error: 'ต้องระบุ accountId' };
  var ss = getUserSS_(session.userId);
  var sh = ss.getSheetByName(SHEET_NAMES.ACCOUNTS);
  var rows = sheetToObjects_(sh);
  var acc = rows.filter(function(r) { return r.AccountID === body.accountId && r.UserID === session.userId; })[0];
  if (!acc) return { success: false, error: 'ไม่พบบัญชีนี้' };

  var updates = { UpdatedAt: nowStr_() };
  if (body.accountName) {
    var name = String(body.accountName).trim().slice(0, 60);
    if (!name) return { success: false, error: 'ชื่อบัญชีห้ามว่าง' };
    updates.AccountName = name;
  }
  if (body.accountType) {
    if (ACCOUNT_TYPES_.indexOf(body.accountType) === -1) return { success: false, error: 'ประเภทบัญชีไม่ถูกต้อง' };
    updates.AccountType = body.accountType;
  }
  updateRowObject_(sh, acc.__row, updates);
  logAudit_(session.userId, 'ACCOUNT_UPDATED', body.accountId, JSON.stringify({ name: acc.AccountName, type: acc.AccountType }), JSON.stringify(updates), 'success', 'Account edited from dashboard');
  return { success: true };
}

function apiCreateAccount_(session, body) {

/**
 * Archives (or restores) an account rather than deleting it — every past
 * transaction still references this AccountID, so a hard delete would either
 * orphan that history or force us to touch rows we don't need to touch. Archived
 * accounts just stop showing up in apiAccounts_'s list; their data stays intact.
 */
function apiArchiveAccount_(session, body) {
  requireSession_(session);
  if (!body.accountId) return { success: false, error: 'ต้องระบุ accountId' };
  var ss = getUserSS_(session.userId);
  var sh = ss.getSheetByName(SHEET_NAMES.ACCOUNTS);
  var rows = sheetToObjects_(sh);
  var acc = rows.filter(function(r) { return r.AccountID === body.accountId && r.UserID === session.userId; })[0];
  if (!acc) return { success: false, error: 'ไม่พบบัญชีนี้' };

  var restoring = body.restore === true || body.restore === 'true';
  if (!restoring && Number(acc.CurrentBalance || 0) !== 0) {
    // Archiving an account that still holds a nonzero balance would make that
    // money disappear from every "ยอดคงเหลือทั้งหมด" total without a trace, so we
    // block it here rather than silently losing track of real money.
    return { success: false, error: 'ต้องย้ายยอดเงินออกจนเหลือ ฿0 ก่อนถึงจะปิดบัญชีนี้ได้' };
  }
  updateRowObject_(sh, acc.__row, { Status: restoring ? 'active' : 'archived', UpdatedAt: nowStr_() });
  logAudit_(session.userId, restoring ? 'ACCOUNT_RESTORED' : 'ACCOUNT_ARCHIVED', body.accountId, acc.Status, restoring ? 'active' : 'archived', 'success', 'Account ' + (restoring ? 'restored' : 'archived') + ' from dashboard');
  return { success: true };
}

/* ============================================================
 * DEBTS
 * DueDay is a recurring day-of-month (like a credit card statement due date),
 * not a one-off date — "overdue"/"due soon" are computed relative to whichever
 * of this month's or next month's DueDay comes next, using LastPaymentDate to
 * tell whether this cycle's payment has already been made.
 * ============================================================ */
var DEBT_TYPES_ = ['loan', 'credit_card', 'personal', 'other'];
var DEBT_TYPE_ICON_ = { loan: '🏦', credit_card: '💳', personal: '🤝', other: '📄' };
var DEBT_TYPE_LABEL_ = { loan: 'สินเชื่อ', credit_card: 'บัตรเครดิต', personal: 'ยืมส่วนตัว', other: 'อื่นๆ' };

/** Next occurrence of `dueDay` on/after `from`, and how many days away it is. */
function nextDueDate_(dueDay, from) {
  dueDay = Math.min(Math.max(Number(dueDay) || 1, 1), 28); // cap at 28 so it exists in every month
  var d = new Date(from.getFullYear(), from.getMonth(), dueDay);
  if (d < from) d = new Date(from.getFullYear(), from.getMonth() + 1, dueDay);
  var daysUntil = Math.round((d - new Date(from.getFullYear(), from.getMonth(), from.getDate())) / 86400000);
  return { date: Utilities.formatDate(d, TZ, 'yyyy-MM-dd'), daysUntil: daysUntil };
}

function debtWithComputedFields_(d) {
  var now = new Date();
  var next = nextDueDate_(d.DueDay, now);
  var lastPayment = d.LastPaymentDate ? new Date(d.LastPaymentDate) : null;
  var startOfThisMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  // Overdue: this month's due day has already passed, remaining balance is
  // still > 0, and nothing's been paid since the start of this month — i.e.
  // this cycle's payment never happened.
  var thisMonthDue = new Date(now.getFullYear(), now.getMonth(), Math.min(Math.max(Number(d.DueDay) || 1, 1), 28));
  var isOverdue = Number(d.RemainingAmount || 0) > 0 && now > thisMonthDue && (!lastPayment || lastPayment < startOfThisMonth);
  var isDueSoon = !isOverdue && Number(d.RemainingAmount || 0) > 0 && next.daysUntil >= 0 && next.daysUntil <= 3;
  var total = Number(d.TotalAmount || 0);
  var remaining = Number(d.RemainingAmount || 0);
  return {
    id: d.DebtID, name: d.DebtName, type: d.DebtType,
    icon: DEBT_TYPE_ICON_[d.DebtType] || '📄', typeLabel: DEBT_TYPE_LABEL_[d.DebtType] || d.DebtType,
    totalAmount: total, remainingAmount: remaining, paidAmount: total - remaining,
    percentPaid: total > 0 ? Math.round((total - remaining) / total * 100) : 0,
    interestRate: Number(d.InterestRate || 0), minimumPayment: Number(d.MinimumPayment || 0),
    dueDay: Number(d.DueDay || 1), nextDueDate: next.date, daysUntilDue: next.daysUntil,
    lastPaymentDate: d.LastPaymentDate || '', status: d.Status, isOverdue: isOverdue, isDueSoon: isDueSoon
  };
}

function apiDebts_(session) {
  requireSession_(session);
  var ss = getUserSS_(session.userId);
  var sh = getOrCreateSheet_(ss, SHEET_NAMES.DEBTS);
  ensureHeaders_(sh, SCHEMAS.Debts);
  var rows = sheetToObjects_(sh).filter(function(r) { return r.UserID === session.userId; });
  var items = rows.map(debtWithComputedFields_).sort(function(a, b) {
    // Active debts first (overdue, then due-soon, then the rest by due date), paid-off last.
    if ((a.status === 'paid_off') !== (b.status === 'paid_off')) return a.status === 'paid_off' ? 1 : -1;
    if (a.isOverdue !== b.isOverdue) return a.isOverdue ? -1 : 1;
    if (a.isDueSoon !== b.isDueSoon) return a.isDueSoon ? -1 : 1;
    return a.daysUntilDue - b.daysUntilDue;
  });
  return { success: true, data: { items: items } };
}

function apiCreateDebt_(session, body) {
  requireSession_(session);
  var name = String(body.debtName || '').trim().slice(0, 80);
  if (!name) return { success: false, error: 'กรุณาใส่ชื่อหนี้สิน' };
  var type = body.debtType || 'other';
  if (DEBT_TYPES_.indexOf(type) === -1) return { success: false, error: 'ประเภทหนี้สินไม่ถูกต้อง' };
  var total = Number(body.totalAmount || 0);
  if (!total || total <= 0) return { success: false, error: 'กรุณาระบุยอดหนี้ทั้งหมดให้ถูกต้อง' };
  var dueDay = Math.min(Math.max(Number(body.dueDay || 1), 1), 28);

  var ss = getUserSS_(session.userId);
  var sh = getOrCreateSheet_(ss, SHEET_NAMES.DEBTS);
  ensureHeaders_(sh, SCHEMAS.Debts);
  var debtId = 'DEBT-' + Utilities.getUuid().slice(0, 8);
  appendRowObject_(sh, {
    DebtID: debtId, UserID: session.userId, DebtName: name, DebtType: type,
    TotalAmount: total, RemainingAmount: Number(body.remainingAmount != null ? body.remainingAmount : total),
    InterestRate: Number(body.interestRate || 0), MinimumPayment: Number(body.minimumPayment || 0),
    DueDay: dueDay, LastPaymentDate: '', Status: 'active', CreatedAt: nowStr_(), UpdatedAt: nowStr_()
  });
  logAudit_(session.userId, 'DEBT_CREATED', debtId, '', name, 'success', 'Debt created from dashboard');
  return { success: true, data: { debtId: debtId } };
}

function apiUpdateDebt_(session, body) {
  requireSession_(session);
  if (!body.debtId) return { success: false, error: 'ต้องระบุ debtId' };
  var ss = getUserSS_(session.userId);
  var sh = getOrCreateSheet_(ss, SHEET_NAMES.DEBTS);
  ensureHeaders_(sh, SCHEMAS.Debts);
  var rows = sheetToObjects_(sh);
  var d = rows.filter(function(r) { return r.DebtID === body.debtId && r.UserID === session.userId; })[0];
  if (!d) return { success: false, error: 'ไม่พบหนี้สินนี้' };

  var changes = { UpdatedAt: nowStr_() };
  if (body.debtName != null) changes.DebtName = String(body.debtName).trim().slice(0, 80);
  if (body.debtType != null && DEBT_TYPES_.indexOf(body.debtType) !== -1) changes.DebtType = body.debtType;
  if (body.totalAmount != null) changes.TotalAmount = Number(body.totalAmount);
  // Direct balance correction — separate from apiPayDebt_, which also records a
  // DebtPayments row and stamps LastPaymentDate. This is for fixing a wrong
  // starting balance or a manual adjustment, not for logging an actual payment.
  if (body.remainingAmount != null) changes.RemainingAmount = Math.max(0, Number(body.remainingAmount));
  if (body.interestRate != null) changes.InterestRate = Number(body.interestRate);
  if (body.minimumPayment != null) changes.MinimumPayment = Number(body.minimumPayment);
  if (body.dueDay != null) changes.DueDay = Math.min(Math.max(Number(body.dueDay), 1), 28);
  // "เลื่อนไปเดือนหน้า" — DueDay itself is a recurring day-of-month (see nextDueDate_/
  // debtWithComputedFields_ above), so it already shows next month's date once this
  // month's day has passed. This flag covers the OTHER case: pushing the due date to
  // next month PRE-EMPTIVELY, before this month's day arrives (e.g. the lender granted
  // a one-month pass). Reuses the same LastPaymentDate the "overdue" check already
  // looks at — stamping it to today marks this cycle as handled without touching
  // RemainingAmount, so it's a postponement, not a payment.
  if (body.postponeToNextMonth) changes.LastPaymentDate = Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd');
  updateRowObject_(sh, d.__row, changes);
  return { success: true };
}

function apiDeleteDebt_(session, body) {
  requireSession_(session);

  if (!d) return { success: false, error: 'ไม่พบหนี้สินนี้' };

/**
 * Records a debt payment. If accountId is given, also creates a real confirmed
 * expense transaction (category "ชำระหนี้") and deducts it from that account —
 * so paying off a debt actually moves money in the rest of the app too, instead
 * of the debt tracker being disconnected from real balances. accountId is
 * optional: leaving it out just logs the payment against the debt with no
 * matching transaction (e.g. for a payment made entirely outside this app).
 */
function apiPayDebt_(session, body) {
  requireSession_(session);
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    var amount = Number(body.amount || 0);
    if (!amount || amount <= 0) return { success: false, error: 'กรุณาระบุจำนวนเงินให้ถูกต้อง' };
    var ss = getUserSS_(session.userId);
    var debtSh = getOrCreateSheet_(ss, SHEET_NAMES.DEBTS);
    ensureHeaders_(debtSh, SCHEMAS.Debts);
    var d = sheetToObjects_(debtSh).filter(function(r) { return r.DebtID === body.debtId && r.UserID === session.userId; })[0];
    if (!d) return { success: false, error: 'ไม่พบหนี้สินนี้' };

    var newRemaining = Math.max(0, Number(d.RemainingAmount || 0) - amount);
    var today = Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd');
    updateRowObject_(debtSh, d.__row, {
      RemainingAmount: newRemaining, LastPaymentDate: today,
      Status: newRemaining <= 0 ? 'paid_off' : 'active', UpdatedAt: nowStr_()
    });

    var txId = '';
    if (body.accountId) {
      var accRows = sheetToObjects_(ss.getSheetByName(SHEET_NAMES.ACCOUNTS)).filter(function(a) { return a.UserID === session.userId; });
      var acc = accRows.filter(function(a) { return a.AccountID === body.accountId; })[0];
      if (!acc) return { success: false, error: 'ไม่พบบัญชีนี้' };
      txId = generateTransactionId_(session.userId);
      appendRowObject_(ss.getSheetByName(SHEET_NAMES.TX), {
        ID: txId, EventID: '', Timestamp: nowStr_(),
        TransactionDate: today, TransactionTime: Utilities.formatDate(new Date(), TZ, 'HH:mm'),
        UserID: session.userId, DisplayName: getUserDisplayName_(session.userId),
        Type: 'expense', Amount: amount, Category: 'ชำระหนี้', SubCategory: '',
        Description: 'ชำระ ' + d.DebtName + (body.note ? ' — ' + body.note : ''), Merchant: '',
        AccountID: body.accountId, PaymentMethod: '', SlipURL: '', SlipFileID: '',
        Source: 'dashboard', AIConfidence: 1, AIResponse: '{}',
        Status: 'confirmed', CreatedAt: nowStr_(), UpdatedAt: nowStr_()
      });
      applyTransactionEffects_(session.userId, { type: 'expense', amount: amount, category: 'ชำระหนี้' }, body.accountId, 1);
    }

    var paySh = getOrCreateSheet_(ss, SHEET_NAMES.DEBT_PAYMENTS);
    ensureHeaders_(paySh, SCHEMAS.DebtPayments);
    appendRowObject_(paySh, {
      PaymentID: 'PMT-' + Utilities.getUuid().slice(0, 8), DebtID: d.DebtID, UserID: session.userId,
      Amount: amount, TransactionID: txId, PaymentDate: today, Note: body.note || '', CreatedAt: nowStr_()
    });
    logAudit_(session.userId, 'DEBT_PAYMENT', d.DebtID, d.RemainingAmount, String(newRemaining), 'success', 'Paid ฿' + amount + ' toward ' + d.DebtName);
    return { success: true, data: { remainingAmount: newRemaining, paidOff: newRemaining <= 0, transactionId: txId } };
  } finally {
    lock.releaseLock();
  }
}

function apiDebtPayments_(session, params) {
  requireSession_(session);
  var ss = getUserSS_(session.userId);
  var sh = getOrCreateSheet_(ss, SHEET_NAMES.DEBT_PAYMENTS);
  ensureHeaders_(sh, SCHEMAS.DebtPayments);
  var rows = sheetToObjects_(sh).filter(function(r) { return r.UserID === session.userId && r.DebtID === params.debtId; });
  rows.sort(function(a, b) { return new Date(b.PaymentDate) - new Date(a.PaymentDate); });
  return { success: true, data: { items: rows.map(stripRowMeta_) } };
}

/* ============================================================
 * RECURRING TRANSACTIONS
 * Fixed monthly costs (rent, internet, subscriptions) — DayOfMonth is the day
 * it should post each month, same recurring-day-of-month model as debts.
 * processRecurringTransactions_ (wired to a daily time trigger, see
 * setupRecurringTrigger_) actually creates each month's transaction; the API
 * functions here only manage the templates themselves.
 * ============================================================ */
function recurringWithComputedFields_(r) {
  var next = nextDueDate_(r.DayOfMonth, new Date());
  return {
    id: r.RecurringID, name: r.Name, type: r.Type, amount: Number(r.Amount || 0),
    category: r.Category, accountId: r.AccountID, dayOfMonth: Number(r.DayOfMonth || 1),
    lastRunDate: r.LastRunDate || '', nextRunDate: next.date, daysUntilNextRun: next.daysUntil,
    status: r.Status
  };
}

function apiRecurringTransactions_(session) {
  requireSession_(session);
  var ss = getUserSS_(session.userId);
  var sh = getOrCreateSheet_(ss, SHEET_NAMES.RECURRING);
  ensureHeaders_(sh, SCHEMAS.RecurringTransactions);
  var rows = sheetToObjects_(sh).filter(function(r) { return r.UserID === session.userId; });
  var items = rows.map(recurringWithComputedFields_).sort(function(a, b) { return a.daysUntilNextRun - b.daysUntilNextRun; });
  return { success: true, data: { items: items } };
}

function apiCreateRecurring_(session, body) {
  requireSession_(session);
  var name = String(body.name || '').trim().slice(0, 80);
  if (!name) return { success: false, error: 'กรุณาใส่ชื่อรายการ' };
  var type = body.type === 'income' ? 'income' : 'expense';
  var amount = Number(body.amount || 0);
  if (!amount || amount <= 0) return { success: false, error: 'กรุณาระบุจำนวนเงินให้ถูกต้อง' };
  if (!body.accountId) return { success: false, error: 'กรุณาเลือกบัญชี' };

  });

}

/** Creates a pending transaction from a recurring template — 'pending' (not
 *  'confirmed') so the person still reviews/confirms it each month, same as

function createTransactionFromRecurring_(r) {
  var ss = getUserSS_(r.UserID);
  var today = Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd');
  var txId = generateTransactionId_(r.UserID);

    Description: r.Name + ' (รายการประจำ)', Merchant: '',
    AccountID: r.AccountID, PaymentMethod: '', SlipURL: '', SlipFileID: '',
    Source: 'recurring', AIConfidence: 1, AIResponse: '{}',
    Status: 'pending', CreatedAt: nowStr_(), UpdatedAt: nowStr_()
  });

}

/**
 * Runs daily (via the trigger installed by setupRecurringTrigger_) — for every
 * active recurring template across every user whose DayOfMonth has passed this
 * month and hasn't already run this month (LastRunDate check, same "has this
 * cycle already happened" pattern as the debt overdue check), creates this
 * month's transaction and notifies the person over LINE.
 */
/** Runs the check-and-create logic above for one user's own RECURRING sheet.
 *  Split out of processRecurringTransactions_ so that function can loop over
 *  every user now that RecurringTransactions lives per-user, not in one
 *  shared sheet. */
function processRecurringTransactionsForUser_(userId) {
  var ss = getUserSS_(userId);
  var sh = getOrCreateSheet_(ss, SHEET_NAMES.RECURRING);
  ensureHeaders_(sh, SCHEMAS.RecurringTransactions);
  // Filters by UserID too (not just Status) — on the fallback shared spreadsheet
  // a legacy user's iteration would otherwise also reprocess every other legacy
  // user's recurring rows in that same file.
  var rows = sheetToObjects_(sh).filter(function(r) { return r.Status === 'active' && r.UserID === userId; });
  var now = new Date();
  var startOfThisMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  var created = 0;
  rows.forEach(function(r) {
    var dueDay = Math.min(Math.max(Number(r.DayOfMonth) || 1, 1), 28);
    var thisMonthDue = new Date(now.getFullYear(), now.getMonth(), dueDay);
    var lastRun = r.LastRunDate ? new Date(r.LastRunDate) : null;
    var alreadyRanThisMonth = lastRun && lastRun >= startOfThisMonth;
    if (now < thisMonthDue || alreadyRanThisMonth) return;
    var txId = createTransactionFromRecurring_(r);
    updateRowObject_(sh, r.__row, { LastRunDate: Utilities.formatDate(now, TZ, 'yyyy-MM-dd'), UpdatedAt: nowStr_() });
    created++;
    try {
      replyLine_(null, r.UserID, buildTransactionFlex_(txId, { type: r.Type, amount: r.Amount, category: r.Category, description: r.Name + ' (รายการประจำ)' }, 'pending', r.UserID));
    } catch (e) {
      logError_('processRecurringTransactions_/notify', e);
    }
  });
  return { processed: rows.length, created: created };
}

/** Daily trigger entry point (installed by setupRecurringTrigger_). Loops
 *  every user in the central Users sheet — including ones still on the
 *  shared fallback spreadsheet, since getUserSS_ handles that automatically —
 *  and runs their recurring check independently so one user's data can never
 *  affect another's. */
function processRecurringTransactions_() {
  var mainSs = getSS_();
  var users = sheetToObjects_(mainSs.getSheetByName(SHEET_NAMES.USERS)).filter(function(u) { return u.Status !== 'archived'; });
  var totalProcessed = 0, totalCreated = 0;
  users.forEach(function(u) {
    try {
      var result = processRecurringTransactionsForUser_(u.UserID);
      totalProcessed += result.processed;
      totalCreated += result.created;
    } catch (e) {
      logError_('processRecurringTransactions_/' + u.UserID, e);
    }
  });
  return { processed: totalProcessed, created: totalCreated };
}

/** Run ONCE from the Apps Script editor (select this function, click Run) to
 *  install the daily trigger that calls processRecurringTransactions_. Safe to
 *  run again later — it removes any existing trigger for this function first,
 *  so it never ends up duplicated. */
function setupRecurringTrigger_() {
  ScriptApp.getProjectTriggers().forEach(function(t) {
    if (t.getHandlerFunction() === 'processRecurringTransactions_') ScriptApp.deleteTrigger(t);
  });
  ScriptApp.newTrigger('processRecurringTransactions_').timeBased().everyDays(1).atHour(8).create();
}

/**
 * Manual transaction entry from the web dashboard. Unlike saveTransactionFromAI_
 * (which the LINE bot uses for text/slip messages it isn't fully sure about,
 * hence Status='pending'), everything here was typed or reviewed by the user
 * directly in a form, so it's created as Status='confirmed' immediately.
 */
function apiCreateTransaction_(session, body) {
  requireSession_(session);
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    var type = body.type;
    if (['expense', 'income', 'transfer'].indexOf(type) === -1) return { success: false, error: 'ประเภทรายการไม่ถูกต้อง' };
    var amount = Number(body.amount || 0);
    if (!amount || amount <= 0) return { success: false, error: 'กรุณาระบุจำนวนเงินให้ถูกต้อง' };

    // Final safety net against the same slip being submitted twice — the person
    // may have ignored/not seen the warning apiParseSlip_ already surfaced.
    if (body.slipRefNumber) {
      var dup = findTransactionBySlipRef_(session.userId, body.slipRefNumber);
      if (dup) return { success: false, error: 'สลิปนี้เคยถูกบันทึกไปแล้ว (รายการ ' + dup.ID + ', ' + dup.TransactionDate + ', ฿' + dup.Amount + ')' };
    }

    var ss = getUserSS_(session.userId);
    var accRows = sheetToObjects_(ss.getSheetByName(SHEET_NAMES.ACCOUNTS)).filter(function(a) { return a.UserID === session.userId; });
    var date = body.date || Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd');
    var time = body.time || Utilities.formatDate(new Date(), TZ, 'HH:mm');
    var ai = { type: type, amount: amount, date: date, time: time };
    var accountId, category = '', aiResponseExtra = {};

    if (type === 'transfer') {
      var fromAcc = accRows.filter(function(a) { return a.AccountID === body.fromAccountId; })[0];
      var toAcc = accRows.filter(function(a) { return a.AccountID === body.toAccountId; })[0];
      if (!fromAcc || !toAcc) return { success: false, error: 'กรุณาเลือกบัญชีต้นทางและปลายทาง' };
      if (fromAcc.AccountID === toAcc.AccountID) return { success: false, error: 'บัญชีต้นทางและปลายทางต้องไม่ใช่บัญชีเดียวกัน' };
      ai.transferFromAccount = fromAcc.AccountName;
      ai.transferToAccount = toAcc.AccountName;
      category = 'โอนเงิน';
      accountId = fromAcc.AccountID;
      aiResponseExtra = { transferFromAccount: fromAcc.AccountName, transferToAccount: toAcc.AccountName };
    } else {
      var acc = accRows.filter(function(a) { return a.AccountID === body.accountId; })[0];
      if (!acc) return { success: false, error: 'กรุณาเลือกบัญชี' };
      if (!body.category) return { success: false, error: 'กรุณาเลือกหมวดหมู่' };
      accountId = acc.AccountID;
      category = body.category;
    }
    ai.category = category;

    var txId = generateTransactionId_(session.userId);
    var txSh = ss.getSheetByName(SHEET_NAMES.TX);
    appendRowObject_(txSh, {
      ID: txId, EventID: '', Timestamp: nowStr_(),
      TransactionDate: date, TransactionTime: time,
      UserID: session.userId, DisplayName: getUserDisplayName_(session.userId),
      Type: type, Amount: amount, Category: category, SubCategory: '',
      Description: body.description || '', Merchant: body.merchant || '',
      AccountID: accountId, PaymentMethod: body.paymentMethod || '',
      SlipURL: body.slipUrl || '', SlipFileID: body.slipFileId || '', SlipRefNumber: body.slipRefNumber || '',
      Source: 'dashboard', AIConfidence: 1, AIResponse: JSON.stringify(aiResponseExtra),
      Status: 'confirmed', CreatedAt: nowStr_(), UpdatedAt: nowStr_()
    });

    applyTransactionEffects_(session.userId, ai, accountId, 1);
    logAudit_(session.userId, 'CREATE', txId, '', '', 'success', 'Transaction created from dashboard');
    return { success: true, data: { id: txId } };
  } finally {
    lock.releaseLock();
  }
}

/**
 * Reuses the LINE bot's exact slip pipeline (saveSlipToDrive_ + parseSlipImage_
 * + the same AI vision prompt) so a slip photo uploaded from the web dashboard
 * gets identical auto-fill quality — just triggered by a form instead of a
 * chat message, and returned as JSON for the form to pre-fill instead of a
 * LINE flex message.
 */
function apiParseSlip_(session, body) {
  requireSession_(session);
  if (!body.image) return { success: false, error: 'ไม่พบรูปภาพ' };
  var bytes;
  try {
    bytes = Utilities.base64Decode(body.image);
  } catch (e) {
    return { success: false, error: 'รูปภาพไม่ถูกต้อง' };
  }
  var blob = Utilities.newBlob(bytes, body.mimeType || 'image/jpeg', 'slip.jpg');

  var driveInfo;
  try {
    driveInfo = saveSlipToDrive_(blob, session.userId);
  } catch (e) {
    logError_('apiParseSlip_/saveSlipToDrive_', e);
    return { success: false, error: 'ไม่สามารถบันทึกรูปสลิปได้' };
  }

  var aiResult = null;
  var aiError = '';
  try {
    aiResult = parseSlipImage_(session.userId, blob);
    if (!aiResult) aiError = 'AI ส่งข้อมูลกลับมาแต่ข้อมูลไม่ผ่านการตรวจสอบ';
  } catch (e) {
    aiError = e && e.message ? e.message : String(e);
    logError_('apiParseSlip_/parseSlipImage_', e);
  }

  // The slip is already saved. Return the exact AI failure reason so the UI can
  // distinguish an API/rate-limit error from a bad model response.
  if (!aiResult) {
    return {
      success: true,
      data: {
        parsed: false,
        slipUrl: driveInfo.url,
        slipFileId: driveInfo.fileId,
        aiError: aiError || 'AI อ่านข้อมูลไม่สำเร็จ'
      }
    };
  }

  // Same transaction history the LINE bot learns from — if this merchant name has
  // been categorized before, pre-fill that category here too instead of leaving
  // the review form with a fresh (possibly wrong) AI guess every time.
  applyMerchantMemory_(session.userId, aiResult);

  // Same slip already recorded through another channel (e.g. this exact photo
  // was sent to the LINE bot earlier) — flag it by the bank's own reference
  // number so the form can warn before the person re-submits it.
  var duplicateOf = aiResult.referenceNumber ? findTransactionBySlipRef_(session.userId, aiResult.referenceNumber) : null;

  return {
    success: true,
    data: {
      parsed: true, slipUrl: driveInfo.url, slipFileId: driveInfo.fileId, ai: aiResult,
      merchantMemory: aiResult._merchantMemory || null,
      duplicateWarning: duplicateOf ? {
        transactionId: duplicateOf.ID, date: duplicateOf.TransactionDate, amount: duplicateOf.Amount, status: duplicateOf.Status
      } : null
    }
  };
}

/* ============================================================
 * 14B. UNIVERSAL AI FINANCE COMMAND
 * ============================================================
 * The Dashboard AI uses the same command engine as LINE.
 * Exact finance commands are executed by Backend code so totals,
 * filters and deletes never depend on an LLM's arithmetic.
 *
 * Supported examples:
 *   รวมยอด
 *   รวมยอดวันนี้ / รวมยอดเดือนนี้ / รวมยอดทั้งหมด
 *   รายจ่ายวันนี้ / รายจ่ายเดือนนี้
 *   รายรับวันนี้ / รายรับเดือนนี้
 *   ยอดคงเหลือ
 *   กรองหมวดค่าใช้จ่าย
 *   กรองหมวดค่าใช้จ่าย อาหาร
 *   ดูรายการอาหาร
 *   รายการล่าสุด
 *   ค้นหา กาแฟ
 *   ลบรายการที่แล้ว
 *   ยืนยันลบรายการที่แล้ว
 *
 * If the text is a natural-language question rather than an exact
 * command, the backend prepares real transaction data and lets AI
 * explain it. AI is not allowed to invent or alter financial numbers.
 * ============================================================ */
function apiAiCommand_(session, params) {
  requireSession_(session);
  var question = String((params && (params.q || params.question || params.text)) || '').trim();
  if (!question) return { success: false, error: 'กรุณาระบุคำถาม' };

  // First: execute deterministic finance commands (exact, pre-written phrasings).
  var commandResult = handleFinanceCommand_(session.userId, question);
  if (commandResult !== null) {
    logAiCall_(session.userId, 'dashboard-command', question, commandResult, null, 1, 'success', '');
    return {
      success: true,
      data: {
        mode: 'command',
        question: question,
        answer: commandResult
      }
    };
  }

  // Second: same AI intent classifier the LINE bot already uses for casual/reworded
  // phrasings ("ความบันเทิงทั้งหมด", "เดือนนี้จ่ายอะไรไปบ้างนะ"). It maps loose wording
  // onto the same deterministic formatters as above, so the dashboard gets an exact
  // number/list instead of falling straight to the freeform narrator below, which
  // only describes the data in prose and can group things vaguely.
  var aiCommandResult = handleFinanceIntentAI_(session.userId, question);
  if (aiCommandResult !== null) {
    logAiCall_(session.userId, 'dashboard-command-ai', question, aiCommandResult, null, 1, 'success', '');
    return {
      success: true,
      data: {
        mode: 'command',
        question: question,
        answer: aiCommandResult
      }
    };
  }

  // Third: genuinely open-ended questions ("เงินพอไหม", "ทำไมใช้เยอะ") that don't
  // map to any exact command — answered from backend-computed data, in prose.
  var answer = answerNaturalFinanceQuestion_(session.userId, question);
  return {
    success: true,
    data: {
      mode: 'ai',
      question: question,
      answer: answer
    }
  };
}

/**
 * Computes all the finance context (today/month/all-time totals, category
 * breakdown, latest transactions) that gets handed to the AI as ground truth.
 * Shared by the plain-text answer path (web dashboard) and the Flex-card path
 * (LINE chat) so both are always looking at the exact same numbers.
 */
function buildFinanceContextData_(userId) {
  var txs = getActiveUserTransactions_(userId);
  var now = new Date();
  var today = Utilities.formatDate(now, TZ, 'yyyy-MM-dd');
  var month = Utilities.formatDate(now, TZ, 'yyyy-MM');

  var todayTx = periodFilter_(txs, 'today');
  var monthTx = periodFilter_(txs, 'month');

  var allIncome = sumBy_(txs, 'income');
  var allExpense = sumBy_(txs, 'expense');
  var monthIncome = sumBy_(monthTx, 'income');
  var monthExpense = sumBy_(monthTx, 'expense');
  var todayIncome = sumBy_(todayTx, 'income');
  var todayExpense = sumBy_(todayTx, 'expense');

  var categoryTotals = {};
  monthTx.filter(function(t) { return t.Type === 'expense'; }).forEach(function(t) {
    var c = t.Category || 'อื่นๆ';
    categoryTotals[c] = (categoryTotals[c] || 0) + Number(t.Amount || 0);
  });

  var latest = txs.slice().sort(function(a,b) {
    return String(b.CreatedAt || '').localeCompare(String(a.CreatedAt || ''));
  }).slice(0, 15).map(function(t) {
    return {
      date: t.TransactionDate,
      time: t.TransactionTime,
      type: t.Type,
      amount: Number(t.Amount || 0),
      category: t.Category || '',
      description: t.Description || '',
      merchant: t.Merchant || '',
      account: t.AccountID || ''
    };
  });

  return {
    today: {
      date: today,
      income: todayIncome,
      expense: todayExpense,
      net: todayIncome - todayExpense,
      count: todayTx.length
    },
    month: {
      month: month,
      income: monthIncome,
      expense: monthExpense,
      net: monthIncome - monthExpense,
      count: monthTx.length,
      categoryTotals: categoryTotals
    },
    allTime: {
      income: allIncome,
      expense: allExpense,
      net: allIncome - allExpense,
      count: txs.length
    },
    latest: latest
  };
}

function buildFinanceAiPrompt_(question, data) {

    question.replace(/"/g, '\"') + '"\n\n' +

    'และห้ามแก้ไข/ลบ/สร้างรายการใดๆ:\n' +

}

function answerNaturalFinanceQuestion_(userId, question) {
  var data = buildFinanceContextData_(userId);
  var prompt = buildFinanceAiPrompt_(question, data);

  var raw;
  try {
    // NOTE: switched from callGroqChat_ (strict-JSON system prompt, meant for
    // transaction parsing) to callGroqChatFree_ (plain-text system prompt) so
    // natural-language answers stop leaking as raw {"answer": "..."} JSON blobs.
    raw = callGroqChatFree_(prompt);
  } catch (e) {
    raw = 'ไม่สามารถวิเคราะห์คำถามนี้ได้ในขณะนี้: ' + e.message;
  }

  logAiCall_(userId, 'dashboard-ai', question, raw, null, 1, 'success', '');
  return raw;
}

/**
 * Same natural-language finance Q&A as answerNaturalFinanceQuestion_, but for
 * LINE: wraps the AI's plain-text answer plus the backend's own (guaranteed
 * accurate) category/month numbers into a styled Flex Message card instead of
 * a plain text bubble. Because the numeric breakdown comes straight from
 * buildFinanceContextData_ — not from asking the AI to also emit JSON — there's
 * nothing left for the model to truncate or malform into a leaked JSON blob.
 */
function answerNaturalFinanceQuestionFlex_(userId, question) {
  var data = buildFinanceContextData_(userId);
  var prompt = buildFinanceAiPrompt_(question, data);

  var answerText;
  try {
    answerText = callGroqChatFree_(prompt);
  } catch (e) {
    answerText = 'ไม่สามารถวิเคราะห์คำถามนี้ได้ในขณะนี้: ' + e.message;
  }

  logAiCall_(userId, 'line-ai', question, answerText, null, 1, 'success', '');
  return buildAiAnswerFlex_(answerText, data);
}

/**
 * Dark "terminal card" style Flex Message for AI chat answers — a titlebar with
 * traffic-light dots over a near-black body, mint-on-charcoal text. Purely
 * decorative styling on top of buildFinanceContextData_'s numbers; the AI never
 * supplies the category/month figures shown here, only the headline sentence.
 */
function buildAiAnswerFlex_(answerText, data) {
  var month = data && data.month;
  var catTotals = (month && month.categoryTotals) || {};
  var accentPalette = ['#4281ff', '#22ff00', '#ff4284', '#ffae00'];
  var topCats = Object.keys(catTotals)
    .map(function(k) { return { name: k, amount: catTotals[k] }; })
    .sort(function(a, b) { return b.amount - a.amount; })
    .slice(0, 4);

  var bodyContents = [
    { type: 'text', text: answerText || '-', size: 'sm', color: '#bafff8', wrap: true }
  ];

  if (topCats.length > 0) {
    bodyContents.push({ type: 'separator', margin: 'lg', color: '#3a1550' });
    bodyContents.push({ type: 'text', text: 'สรุปตามหมวด (เดือนนี้)', size: 'xxs', color: '#c042ff', weight: 'bold', margin: 'lg' });
    topCats.forEach(function(c, i) {
      bodyContents.push({
        type: 'box', layout: 'horizontal', margin: 'sm', contents: [
          { type: 'text', text: c.name, size: 'xs', color: accentPalette[i % accentPalette.length], flex: 3, wrap: true },
          { type: 'text', text: '฿' + Number(c.amount).toLocaleString(), size: 'xs', color: '#bafff8', flex: 2, align: 'end' }
        ]
      });
    });
  }

  if (month) {
    bodyContents.push({ type: 'separator', margin: 'lg', color: '#3a1550' });
    bodyContents.push({
      type: 'box', layout: 'horizontal', margin: 'lg', contents: [
        { type: 'text', text: 'รับ ฿' + Number(month.income).toLocaleString(), size: 'xxs', color: '#22ff00', flex: 1 },
        { type: 'text', text: 'จ่าย ฿' + Number(month.expense).toLocaleString(), size: 'xxs', color: '#ff4284', flex: 1, align: 'center' },
        { type: 'text', text: 'เหลือ ฿' + Number(month.net).toLocaleString(), size: 'xxs', color: '#ffae00', flex: 1, align: 'end' }
      ]
    });
  }

  return {
    type: 'flex',
    altText: answerText ? String(answerText).slice(0, 100) : 'คำตอบจาก AI',
    contents: {
      type: 'bubble',
      size: 'kilo',
      header: flexHeader_('🤖 ผู้ช่วยการเงิน AI'),
      body: {
        type: 'box', layout: 'vertical', backgroundColor: FLEX_THEME_.bodyBg, paddingAll: '16px',
        contents: bodyContents,
        borderColor: FLEX_THEME_.border, borderWidth: '1px'
      }
    }
  };
}

/* ============================================================
 * 15. AI ANALYSIS (Backend computes numbers, AI interprets)
 * ============================================================ */
function apiAiAnalysis_(session, params) {
  requireSession_(session);
  var month = params.month || Utilities.formatDate(new Date(), TZ, 'yyyy-MM');
  var txs = getUserTransactions_(session.userId).filter(function(t) {
    return t.Status !== 'cancelled' && String(t.TransactionDate).indexOf(month) === 0;
  });
  var income = sumBy_(txs, 'income');
  var expense = sumBy_(txs, 'expense');
  var byCategory = {};
  txs.filter(function(t) { return t.Type === 'expense'; }).forEach(function(t) {
    byCategory[t.Category] = (byCategory[t.Category] || 0) + Number(t.Amount || 0);
  });
  var byDay = {};
  txs.forEach(function(t) {
    var d = t.TransactionDate;
    byDay[d] = (byDay[d] || 0) + (t.Type === 'expense' ? Number(t.Amount || 0) : 0);
  });

  var budgets = apiBudget_(session, { month: month }).data;

  var summaryForAI = {
    month: month, totalIncome: income, totalExpense: expense, balance: income - expense,
    categoryTotals: byCategory, dailyTotals: byDay, budgetUsage: budgets
  };

  var prompt = 'ข้อมูลการเงินเดือน ' + month + ' (คำนวณแล้วจาก Backend ห้ามคำนวณใหม่):\n' +
    JSON.stringify(summaryForAI) + '\n\n' +
    'จงวิเคราะห์เป็นภาษาไทย ครอบคลุม: แนวโน้มการใช้จ่าย, หมวดที่ใช้จ่ายสูงสุด, ข้อสังเกตที่น่าสนใจ, ' +
    'พฤติกรรมการใช้เงิน และคำแนะนำสั้นๆ ห้ามแก้ไขหรือคำนวณยอดรวมใหม่ ใช้ตัวเลขที่ให้มาเท่านั้น ' +
    'ตอบเป็นข้อความธรรมดา ไม่ใช่ JSON';

  var analysis;
  try { analysis = callGroqChatFree_(prompt); }
  catch (e) { analysis = 'ไม่สามารถวิเคราะห์ได้ในขณะนี้: ' + e.message; }

  logAiCall_(session.userId, 'analysis', month, analysis, null, 1, 'success', '');

  return { success: true, data: { summary: summaryForAI, analysis: analysis } };
}

/* ============================================================
 * 16. DAILY SUMMARY REBUILD
 * ============================================================ */
function rebuildDailySummary_(ss) {
  var txSh = ss.getSheetByName(SHEET_NAMES.TX);
  var dsSh = ss.getSheetByName(SHEET_NAMES.DAILY);
  var txs = sheetToObjects_(txSh).filter(function(t) { return t.Status !== 'cancelled'; });

  var map = {}; // key = date|userId
  txs.forEach(function(t) {
    var key = t.TransactionDate + '|' + t.UserID;
    if (!map[key]) map[key] = { Date: t.TransactionDate, UserID: t.UserID, TotalIncome: 0, TotalExpense: 0, TransactionCount: 0, categories: {} };
    var e = map[key];
    if (t.Type === 'income') e.TotalIncome += Number(t.Amount || 0);
    if (t.Type === 'expense') {
      e.TotalExpense += Number(t.Amount || 0);
      e.categories[t.Category] = (e.categories[t.Category] || 0) + Number(t.Amount || 0);
    }
    e.TransactionCount += 1;
  });

  // clear existing data rows (keep header) then rewrite — safe because Daily_Summary is a derived cache
  var lastRow = dsSh.getLastRow();
  if (lastRow > 1) dsSh.getRange(2, 1, lastRow - 1, dsSh.getLastColumn()).clearContent();

  var rows = Object.keys(map).map(function(k) {
    var e = map[k];
    var top = Object.keys(e.categories).sort(function(a, b) { return e.categories[b] - e.categories[a]; })[0] || '';
    return [e.Date, e.UserID, e.TotalIncome, e.TotalExpense, e.TotalIncome - e.TotalExpense, e.TransactionCount, top, nowStr_()];
  });
  if (rows.length > 0) dsSh.getRange(2, 1, rows.length, rows[0].length).setValues(rows);
  return rows.length;
}

/* ============================================================
 * 17. BACKUP
 * ============================================================ */
/** NOT YET MULTI-TENANT (Phase 2): this scans the central spreadsheet only,
 *  so it won't see data for any user who has been migrated to their own
 *  per-user spreadsheet. It's an admin/maintenance-only tool, not part of
 *  everyday request handling, so it's left as-is for now — would need a
 *  per-user loop (like processRecurringTransactions_) to cover everyone. */
function createBackup() {
  var ss = getSS_();
  var root = ensureDriveFolders_();
  var backupsRoot = getOrCreateSubfolder_(root, 'Backups');
  var monthFolder = getOrCreateYearMonthFolder_(backupsRoot, new Date());
  var name = 'Backup_' + Utilities.formatDate(new Date(), TZ, 'yyyyMMdd_HHmmss');
  var file = DriveApp.getFileById(ss.getId()).makeCopy(name, monthFolder);
  logAudit_('SYSTEM', 'BACKUP', file.getId(), '', '', 'success', 'Backup created: ' + name);
  return file.getUrl();
}

/* ============================================================
 * 18. AUDIT LOG
 * ============================================================ */
function logAudit_(userId, action, targetId, oldValue, newValue, status, description) {
  try {
    var ss = getSS_();
    var sh = ss.getSheetByName(SHEET_NAMES.AUDIT);
    appendRowObject_(sh, {
      ID: 'AUD-' + Utilities.getUuid().slice(0, 8), Timestamp: nowStr_(), UserID: userId,
      Action: action, TargetID: targetId, OldValue: String(oldValue || '').slice(0, 5000),
      NewValue: String(newValue || '').slice(0, 5000), Status: status, Description: description
    });
  } catch (e) { /* never let audit logging break the caller */ }
}

<script>
/* ============================================================
 * TOAST + CONFIRM MODAL (replace alert()/confirm())
 * ============================================================
 * toast(message, type) — type is 'success' | 'error' | 'warn' | 'info' (default).
 * customConfirm(message) — returns a Promise<boolean>, resolves true on "ยืนยัน".
 * Every alert()/confirm() call in this file below has been replaced with these,
 * because native browser dialogs are unreliable inside LINE's in-app WebView
 * (they can silently no-op, making buttons that gate on confirm() look broken).
 */
const TOAST_ICONS = { success: '✅', error: '⚠️', warn: '⚠️', info: 'ℹ️' };

function toast(message, type) {
  type = type || 'info';
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<span class="toast-icon">${TOAST_ICONS[type] || TOAST_ICONS.info}</span><span class="toast-msg"></span>`;
  el.querySelector('.toast-msg').textContent = message; // textContent, not innerHTML — avoid HTML injection from error messages
  stack.appendChild(el);

  const remove = () => {
    if (!el.parentNode) return;
    el.classList.add('leaving');
    setTimeout(() => el.remove(), 200);
  };
  el.addEventListener('click', remove);
  setTimeout(remove, type === 'error' ? 6000 : 4000);
}

/* successPopup(message, onDone) — brief animated confirmation overlay.
 * Shows a checkmark + message, then fades/scales away on its own after
 * a moment and calls onDone(). Used for moments like a successful login
 * where a quiet, deliberate confirmation reads better than a stacked toast. */
function successPopup(message, onDone) {
  const overlay = document.getElementById('successOverlay');
  const msgEl = document.getElementById('successMsg');
  const path = overlay.querySelector('path');
  msgEl.textContent = message;
  overlay.classList.remove('leaving');
  overlay.classList.add('show');
  // restart the checkmark draw animation each time it's shown
  path.style.animation = 'none';
  void path.offsetWidth;
  path.style.animation = '';

  setTimeout(() => {
    overlay.classList.add('leaving');
    setTimeout(() => {
      overlay.classList.remove('show', 'leaving');
      if (onDone) onDone();
    }, 350);
  }, 950);
}

function customConfirm(message) {
  return new Promise(resolve => {
    const overlay = document.getElementById('confirmOverlay');
    const msgEl = document.getElementById('confirmMsg');
    const okBtn = document.getElementById('confirmOkBtn');
    const cancelBtn = document.getElementById('confirmCancelBtn');
    msgEl.textContent = message;
    overlay.classList.add('open');

    function cleanup(result) {
      overlay.classList.remove('open');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      overlay.removeEventListener('click', onOverlay);
      resolve(result);
    }
    function onOk() { cleanup(true); }
    function onCancel() { cleanup(false); }
    function onOverlay(e) { if (e.target === overlay) cleanup(false); }

    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
    overlay.addEventListener('click', onOverlay);
  });
}

function pickAccount() {
  return new Promise(async resolve => {
    if (!STATE.accounts || STATE.accounts.length === 0) {
      try { const r = await apiGet('accounts'); STATE.accounts = r.data || []; } catch (e) { /* fall through with empty list */ }
    }
    const overlay = document.getElementById('accountPickOverlay');
    const select = document.getElementById('accountPickSelect');
    const okBtn = document.getElementById('accountPickOkBtn');
    const cancelBtn = document.getElementById('accountPickCancelBtn');
    select.innerHTML = (STATE.accounts || []).map(a => `<option value="${a.AccountID}">${accountIcon(a.AccountType)} ${escapeHtml(a.AccountName)}</option>`).join('');
    overlay.classList.add('open');

    function cleanup(result) {
      overlay.classList.remove('open');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      overlay.removeEventListener('click', onOverlay);
      resolve(result);
    }
    function onOk() { cleanup(select.value || null); }
    function onCancel() { cleanup(null); }
    function onOverlay(e) { if (e.target === overlay) cleanup(null); }

    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
    overlay.addEventListener('click', onOverlay);
  });
}

/* ============================================================
 * API HELPERS
 * ============================================================ */
async function fetchJson(url, options) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 20000);
  try {
    const res = await fetch(url, Object.assign({}, options || {}, { signal: controller.signal }));
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch (_) { throw new Error('เซิร์ฟเวอร์ตอบกลับข้อมูลไม่ใช่ JSON'); }
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    return data;
  } catch (e) {
    if (e && e.name === 'AbortError') throw new Error('การเชื่อมต่อใช้เวลานานเกินไป กรุณาลองใหม่');
    throw e;
  } finally {
    clearTimeout(timeoutId);
  }
}

function ensureApiConfigured() {
  const url = String(APP_CONFIG.API_URL || '').trim();
  if (!url || url.includes('PASTE_YOUR_DEPLOYMENT_ID_HERE')) {
    throw new Error('ยังไม่ได้ตั้งค่า API_URL ของ Apps Script');
  }
  return url;
}

async function apiGet(action, params) {
  params = Object.assign({}, params || {}, { action: action });
  if (STATE.token) params.token = STATE.token;
  const qs = Object.keys(params).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k] == null ? '' : params[k])).join('&');
  return fetchJson(ensureApiConfigured() + '?' + qs);
}

async function apiPost(action, body) {
  body = Object.assign({}, body || {}, { action: action });
  if (STATE.token) body.token = STATE.token;
  return fetchJson(ensureApiConfigured(), {
    method: 'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(body)
  });
}

/** Renders Google's own "Sign in with Google" button and wires it up, if a
 *  real Client ID has been configured (see APP_CONFIG.GOOGLE_CLIENT_ID). Left
 *  hidden entirely when the placeholder is still in place, rather than
 *  showing a button that would just fail. */
function initGoogleSignIn() {
  const clientId = String(APP_CONFIG.GOOGLE_CLIENT_ID || '').trim();
  const wrap = document.getElementById('googleSignInWrap');
  const btnEl = document.getElementById('googleSignInBtn');
  if (!clientId || clientId.includes('PASTE_YOUR_GOOGLE_CLIENT_ID_HERE') || !wrap || !btnEl) return;
  if (typeof google === 'undefined' || !google.accounts || !google.accounts.id) return; // gsi/client script not loaded yet/blocked

  google.accounts.id.initialize({ client_id: clientId, callback: handleGoogleCredential });
  google.accounts.id.renderButton(btnEl, { theme: 'outline', size: 'large', width: 300, text: 'continue_with', locale: 'th' });
  wrap.style.display = 'block';
}

/** Google's callback after the person picks an account — response.credential
 *  is a signed ID token (JWT); the backend verifies it with Google directly
 *  (never trusts the token's contents on its own) before creating/logging
 *  into an account from it. One request handles both "new person" and
 *  "returning person" — the backend decides which based on whether that
 *  Google account's email already exists. */
async function handleGoogleCredential(response) {
  const errEl = document.getElementById('loginError');
  const loaderWrap = document.getElementById('loginLoaderWrap');
  if (!response || !response.credential) return;
  errEl.style.display = 'none'; errEl.textContent = '';
  loaderWrap.innerHTML = loadingHtml('กำลังเข้าสู่ระบบ', true);
  loaderWrap.style.display = 'flex';

  try {
    const resp = await apiPost('login-google', { credential: response.credential });
    if (!resp || !resp.success || !resp.data || !resp.data.token) {
      throw new Error((resp && resp.error) || 'เข้าสู่ระบบด้วย Google ไม่สำเร็จ');
    }
    applyLoginSuccess_(resp.data);
  } catch (e) {
    const msg = e && e.message ? e.message : 'เข้าสู่ระบบด้วย Google ไม่สำเร็จ';
    errEl.textContent = msg;
    errEl.style.display = 'block';
    toast(msg, 'error');
  } finally {
    loaderWrap.style.display = 'none';
  }
}

/* ============================================================
