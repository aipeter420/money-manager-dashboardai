/** Downscales + re-encodes the photo client-side before it goes over the wire —
 *  a raw phone-camera photo can be 5-10MB, which is slow to upload and slow for
 *  the backend's AI vision call; ~1280px/JPEG-0.82 is plenty for reading a slip. */
function compressImageToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('เปิดรูปไม่สำเร็จ'));
      img.onload = () => {
        const maxDim = 1280;
        let width = img.width, height = img.height;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
        resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handleSlipUpload(inputEl) {
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;
  const statusEl = document.getElementById('ctxSlipStatus');
  statusEl.textContent = 'กำลังอ่านสลิป...';
  try {
    const { base64, mimeType } = await compressImageToBase64(file);
    const resp = await apiPost('parse-slip', { image: base64, mimeType: mimeType });
    if (!resp.success) throw new Error(resp.error || 'อ่านสลิปไม่สำเร็จ');
    CREATE_TX_STATE.slipUrl = resp.data.slipUrl || '';
    CREATE_TX_STATE.slipFileId = resp.data.slipFileId || '';
    CREATE_TX_STATE.slipRefNumber = (resp.data.ai && resp.data.ai.referenceNumber) || '';
    if (resp.data.duplicateWarning) {
      // Same slip already recorded elsewhere (e.g. sent to the LINE bot earlier) —
      // warn loudly before the person re-submits it, but still let the form fill
      // in so they can review/decide for themselves rather than being blocked.
      const dup = resp.data.duplicateWarning;
      statusEl.innerHTML = `⚠️ <strong>สลิปนี้เคยถูกบันทึกไปแล้ว</strong> (รายการ ${escapeHtml(dup.transactionId)}, ${escapeHtml(dup.date)}, ฿${fmt(dup.amount)}, สถานะ: ${escapeHtml(statusLabel(dup.status))}) — ถ้ากดบันทึกต่อจะถูกปฏิเสธ`;
      statusEl.style.color = '#F2545B';
    } else if (resp.data.parsed && resp.data.ai) {
      applySlipAiToForm(resp.data.ai);
      statusEl.textContent = '✓ อ่านสลิปสำเร็จ — กรุณาตรวจสอบข้อมูลก่อนบันทึก';
      statusEl.style.color = '';
    } else {
      const reason = resp.data.aiError ? ' — ' + resp.data.aiError : '';
      statusEl.textContent = '⚠️ แนบรูปแล้ว แต่ AI อ่านข้อมูลอัตโนมัติไม่สำเร็จ' + reason + ' กรุณาตรวจสอบ/กรอกเอง';
      statusEl.style.color = '#F59E0B';
    }
  } catch (e) {
    statusEl.textContent = '';
    toast('อ่านสลิปไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  }
}

/** AI can only read what's on the slip — for a transfer it knows this side's
 *  account at best, never which of the user's other accounts received it, so
 *  only "จากบัญชี" gets a guess; "ไปบัญชี" is always left for the user to pick. */
function guessAccountId(accountHint) {
  if (!accountHint) return '';
  const accs = STATE.accounts || [];
  let m = accs.find(a => a.AccountName === accountHint);
  if (m) return m.AccountID;
  const typeMap = { 'เงินสด': 'cash', 'ธนาคาร': 'bank', 'บัตร': 'card', 'Wallet': 'wallet' };
  const t = typeMap[accountHint];
  if (t) { m = accs.find(a => a.AccountType === t); if (m) return m.AccountID; }
  return '';
}

function applySlipAiToForm(ai) {
  if (ai.type && ['expense', 'income', 'transfer'].indexOf(ai.type) !== -1) setCreateTxType(ai.type);
  if (ai.amount) document.getElementById('ctxAmount').value = ai.amount;
  if (ai.date) document.getElementById('ctxDate').value = ai.date;
  if (ai.time) document.getElementById('ctxTime').value = ai.time;
  if (ai.description) document.getElementById('ctxDescription').value = ai.description;
  else if (ai.merchant) document.getElementById('ctxDescription').value = ai.merchant;
  if (ai.merchant) document.getElementById('ctxMerchant').value = ai.merchant;
  const guess = guessAccountId(ai.account);
  if (CREATE_TX_STATE.type === 'transfer') {
    if (guess) document.getElementById('ctxFromAccount').value = guess;
  } else {
    if (ai.category) {
      const sel = document.getElementById('ctxCategory');
      if (Array.from(sel.options).some(o => o.value === ai.category)) sel.value = ai.category;
    }
    if (guess) document.getElementById('ctxAccount').value = guess;
  }
}

async function submitCreateTx() {
  const type = CREATE_TX_STATE.type;
  const amount = Number(document.getElementById('ctxAmount').value || 0);
  const date = document.getElementById('ctxDate').value;
  const time = document.getElementById('ctxTime').value;
  const description = document.getElementById('ctxDescription').value.trim();
  const merchant = document.getElementById('ctxMerchant').value.trim();
  if (!amount || amount <= 0) { toast('กรุณาระบุจำนวนเงินให้ถูกต้อง', 'warn'); return; }

  const body = { type: type, amount: amount, date: date, time: time, description: description, merchant: merchant, slipUrl: CREATE_TX_STATE.slipUrl, slipFileId: CREATE_TX_STATE.slipFileId, slipRefNumber: CREATE_TX_STATE.slipRefNumber };
  if (type === 'transfer') {
    body.fromAccountId = document.getElementById('ctxFromAccount').value;
    body.toAccountId = document.getElementById('ctxToAccount').value;
    if (!body.fromAccountId || !body.toAccountId) { toast('กรุณาเลือกบัญชีต้นทางและปลายทาง', 'warn'); return; }
    if (body.fromAccountId === body.toAccountId) { toast('บัญชีต้นทางและปลายทางต้องไม่ใช่บัญชีเดียวกัน', 'warn'); return; }
  } else {
    body.category = document.getElementById('ctxCategory').value;
    body.accountId = document.getElementById('ctxAccount').value;
    if (!body.category) { toast('กรุณาเลือกหมวดหมู่', 'warn'); return; }
    if (!body.accountId) { toast('กรุณาเลือกบัญชี', 'warn'); return; }
  }

  const btn = document.getElementById('ctxSaveBtn');
  const prevLabel = btn.textContent;
  btn.textContent = 'กำลังบันทึก...'; btn.disabled = true;
  try {
    const resp = await apiPost('create-transaction', body);
    if (!resp.success) throw new Error(resp.error || 'บันทึกไม่สำเร็จ');

    // If they checked "ตั้งเป็นรายการประจำ", also save a recurring template —
    // this is a best-effort second call: if it fails, the transaction they
    // actually asked to save is already safely recorded, so we warn rather
    // than treating the whole save as failed.
    const isRecurringEl = document.getElementById('ctxIsRecurring');
    if (isRecurringEl && isRecurringEl.checked && type !== 'transfer') {
      const dayOfMonth = Number(document.getElementById('ctxRecurringDay').value || 0);
      if (!dayOfMonth) {
        toast('บันทึกรายการแล้ว แต่ยังไม่ได้ตั้งเป็นรายการประจำ เพราะไม่ได้ระบุวันที่รัน', 'warn');
      } else {
        try {
          const recResp = await apiPost('create-recurring', {
            name: description || body.category, type: type, amount: amount,
            category: body.category, accountId: body.accountId, dayOfMonth: dayOfMonth
          });
          if (!recResp.success) throw new Error(recResp.error);
        } catch (recErr) {
          toast('บันทึกรายการแล้ว แต่ตั้งเป็นรายการประจำไม่สำเร็จ: ' + (recErr && recErr.message ? recErr.message : recErr), 'warn');
        }
      }
    }

    toast('เพิ่มรายการเรียบร้อยแล้ว', 'success');
    DASH_CACHE = null; TX_CACHE = {}; BUDGET_CACHE = {};
    closeCreateTxUI();
    refreshVisibleTab();
  } catch (e) {
    toast('เพิ่มรายการไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
    btn.textContent = prevLabel; btn.disabled = false;
  }
}

/** Re-renders whichever tab panel is currently on screen — used after an
 *  action (like adding a transaction) that could affect several tabs' data,
 *  without refreshing tabs the person isn't even looking at. */
function refreshVisibleTab() {
  const visible = id => { const e = document.getElementById(id); return e && e.style.display !== 'none'; };
  if (visible('tab-dashboard')) renderDashboard();
  else if (visible('tab-transactions')) loadTransactions();
  else if (visible('tab-accounts')) renderAccounts();
  else if (visible('tab-budget')) renderBudget();
}

  const name = document.getElementById('editAccName').value.trim();

  if (!name) { toast('ชื่อบัญชีห้ามว่าง', 'error'); return; }

let BUDGET_STATE = { items: [], month: '' };
/** Same stale-while-revalidate idea as TX_CACHE/DASH_CACHE, keyed by month.
 *  Caches the items array alongside the HTML so openBudgetDetailByIndex's
 *  index lookups stay correct even while showing a cached render. */
let BUDGET_CACHE = {};

async function loadBudgets(month) {
  const wrap = document.getElementById('budgetList');
  const cached = BUDGET_CACHE[month];
  if (cached) {
    wrap.innerHTML = cached.html;
    BUDGET_STATE.items = cached.items;
    BUDGET_STATE.month = month;
  } else {
    wrap.innerHTML = budgetSkeleton();
  }
  try {
    const resp = await apiGet('budget', { month: month });
    if (!resp.success) throw new Error(resp.error);
    BUDGET_STATE.items = resp.data;
    BUDGET_STATE.month = month;
    if (resp.data.length === 0) {
      BUDGET_CACHE[month] = { html: emptyStateBudget(), items: [] };
      wrap.innerHTML = BUDGET_CACHE[month].html;
      return;
    }
    const html = resp.data.map((b, idx) => {
      const cat = STATE.categories.find(c => (c.CategoryID===b.CategoryID || c.CategoryName===b.CategoryID)) || {};
      const pct = Number(b.PercentageUsed || 0);
      const meta = budgetStatusMeta(pct);
      const remaining = Number(b.BudgetAmount||0) - Number(b.UsedAmount||0);
      return `
        <div class="uiv-card" style="margin-bottom:12px;cursor:pointer;" onclick="openBudgetDetailByIndex(${idx})">
          <div class="uiv-title">
            <span class="uiv-icon ${budgetIconClass(meta.cls)}"><span class="uiv-emoji">${meta.emoji}</span></span>
            <span class="uiv-title-text">${cat.Icon||''} ${cat.CategoryName||b.CategoryID}</span>
            <div class="uiv-right-group">
              <span class="uiv-percent ${pct>=70?'down':'up'}">${pct}%</span>
              <button class="icon-btn" style="width:26px;height:26px;font-size:13px;" onclick="event.stopPropagation();deleteBudgetUI('${b.BudgetID}')" title="ลบงบนี้" aria-label="ลบงบนี้">🗑️</button>
              <span class="uiv-chevron">›</span>
            </div>
          </div>
          <p class="uiv-value">฿${fmt(b.UsedAmount)} <span class="uiv-sub">/ ฿${fmt(b.BudgetAmount)} · เหลือ ฿${fmt(remaining)}</span></p>
          <div class="uiv-range"><div class="uiv-fill ${meta.cls}" style="width:${Math.min(100,pct)}%;"></div></div>
        </div>`;
    }).join('');
    BUDGET_CACHE[month] = { html: html, items: resp.data };
    wrap.innerHTML = html;
  } catch (e) {
    if (!cached) {
      wrap.innerHTML = errorBlock();
      toast('โหลดงบประมาณไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
    }
    // Otherwise: stale cached cards are already on screen — leave them up.
  }
}

/** Skeleton budget cards, shown while the list (re)loads. */
function budgetSkeleton() {
  let out = '';
  for (let i = 0; i < 3; i++) {
    out += `
      <div class="uiv-card" style="margin-bottom:12px;">
        <div class="uiv-title">
          <div class="skel skel-block" style="width:28px;height:28px;border-radius:50%;"></div>
          <div class="skel skel-line" style="width:90px;height:13px;margin-left:8px;"></div>
        </div>
        <div class="skel skel-line" style="width:140px;height:16px;margin:10px 0;"></div>
        <div class="skel skel-block" style="height:8px;"></div>
      </div>`;
  }
  return out;
}

async function deleteBudgetUI(budgetId) {
  const ok = await customConfirm('ลบงบนี้ใช่หรือไม่? การลบไม่กระทบธุรกรรมที่บันทึกไว้แล้ว');
  if (!ok) return;
  try {
    const resp = await apiPost('delete-budget', { budgetId: budgetId });
    if (!resp.success) throw new Error(resp.error || 'ลบไม่สำเร็จ');
    toast('ลบงบเรียบร้อยแล้ว', 'success');
    DASH_CACHE = null;
    BUDGET_CACHE = {};

    // drill-down (which has replaced the whole tab) — rebuild whichever one
    // we're actually looking at.
    if (document.getElementById('budgetList')) {

function openBudgetDetailByIndex(idx) {
  const b = BUDGET_STATE.items[idx];

/** Budget category detail: set/used/remaining/%, transaction count, latest item,
 *  and which transactions this month pushed the category's spend up the most. */
async function openBudgetDetail(b, cat) {
  const el = document.getElementById('tab-budget');
  const catName = cat.CategoryName || b.CategoryID;
  const budgetAmt = Number(b.BudgetAmount || 0);
  const used = Number(b.UsedAmount || 0);
  const remaining = budgetAmt - used;
  const pct = Number(b.PercentageUsed || 0);
  const meta = budgetStatusMeta(pct);

  // Everything about the budget itself (amounts/%/status) is already known from
  // the list we drilled in from, so it renders instantly — only the "which
  // transactions" breakdown below needs a fetch, and only that part skeletons.
  el.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="icon-btn" onclick="renderBudget()" aria-label="กลับ">←</button>
        <div style="font-weight:700;font-size:15px;">${cat.Icon||''} ${escapeHtml(catName)}</div>
      </div>

      <div class="dash-balance">
        <div class="small">งบที่ตั้งไว้ ฿${fmt(budgetAmt)}</div>
        <div class="big">฿${fmt(used)}</div>
        <div class="balance-meta">
          <span class="dash-chip">${meta.emoji} เหลือ ฿${fmt(remaining)}</span>
          <span class="dash-chip">${pct}% ของงบ</span>
          <span class="dash-chip" id="budgetTxCountChip"><span class="skel skel-line" style="width:60px;height:11px;display:inline-block;vertical-align:middle;"></span></span>
        </div>
      </div>

      <div class="uiv-card">
        <div class="uiv-title">
          <span class="uiv-icon ${budgetIconClass(meta.cls)}"><span class="uiv-emoji">${meta.emoji}</span></span>
          <span class="uiv-title-text">สถานะ: ${meta.label}</span>
        </div>
        <div class="uiv-range" style="margin-top:10px;"><div class="uiv-fill ${meta.cls}" style="width:${Math.min(100,pct)}%;"></div></div>
      </div>

      <div class="dash-section" id="budgetLatestWrap" style="display:none;">
        <div class="dash-section-title"><h3>🕐 รายการล่าสุดในหมวดนี้</h3></div>
        <div id="budgetLatestList"></div>
      </div>

      <div class="dash-section">
        <div class="dash-section-title"><h3>🔥 รายการที่ทำให้งบเพิ่มขึ้นมากที่สุด</h3></div>
        <div id="budgetTopList">${txRowsSkeleton(3)}</div>
      </div>

      <button class="danger" onclick="deleteBudgetUI('${b.BudgetID}')">🗑️ ลบงบนี้</button>
    </div>
  `;

  try {
    const cur = monthRange(0);
    const monthItems = await fetchAllTransactions({ type: 'expense', dateFrom: cur.from, dateTo: cur.to });
    const catItems = monthItems.filter(t => t.Category === catName || t.Category === b.CategoryID);
    const byDate = catItems.slice().sort((x, y) => new Date(y.TransactionDate) - new Date(x.TransactionDate));
    const byAmount = catItems.slice().sort((x, y) => Number(y.Amount||0) - Number(x.Amount||0));
    const latest = byDate[0];

    const countChip = document.getElementById('budgetTxCountChip');
    if (countChip) countChip.innerHTML = `📋 ${catItems.length} รายการเดือนนี้`;

    if (latest) {
      const latestWrap = document.getElementById('budgetLatestWrap');
      const latestList = document.getElementById('budgetLatestList');
      if (latestWrap) latestWrap.style.display = '';
      if (latestList) latestList.innerHTML = renderTxRows([latest], { compact: true });
    }

    const topList = document.getElementById('budgetTopList');
    if (topList) topList.innerHTML = byAmount.length ? renderTxRows(byAmount.slice(0, 10), { compact: true }) : emptyState();
  } catch (e) {
    const topList = document.getElementById('budgetTopList');
    if (topList) topList.innerHTML = errorBlock();
    toast('โหลดรายละเอียดงบไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  }
}

async function saveBudget() {
  const category = document.getElementById('budgetCategory').value;
  const amount = document.getElementById('budgetAmount').value;
  if (!amount) { toast('กรุณากรอกจำนวนงบ', 'warn'); return; }
  const btn = document.getElementById('saveBudgetBtn');
  const prevLabel = btn ? btn.textContent : '';
  if (btn) { btn.textContent = 'กำลังบันทึก...'; btn.disabled = true; }
  try {
    const resp = await apiPost('set-budget', { category: category, amount: Number(amount) });
    if (!resp.success) throw new Error(resp.error || 'เกิดข้อผิดพลาด');
    toast('บันทึกงบประมาณเรียบร้อยแล้ว', 'success');
    DASH_CACHE = null; // budgets feed the "ต้องจัดการ" card — don't show stale alerts next visit
    BUDGET_CACHE = {}; // amounts/used/% changed for this category
    document.getElementById('budgetAmount').value = '';
    loadBudgets(new Date().toISOString().slice(0,7));
  } catch (e) {
    toast('บันทึกงบประมาณไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  } finally {
    if (btn) { btn.textContent = prevLabel; btn.disabled = false; }

let DEBT_ITEMS = [];

async function renderDebt() {
  const el = document.getElementById('tab-debt');
  el.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:14px;">
      <button class="secondary" style="align-self:flex-end;" onclick="openCreateDebtForm()">➕ เพิ่มหนี้สินใหม่</button>
      <div id="createDebtFormWrap"></div>
      <div id="debtListWrap">${budgetSkeleton()}</div>
    </div>`;
  await loadDebts();
}

async function loadDebts() {
  // NOTE: #debtListWrap only exists on the list page. Callers on the detail page
  // (pay/edit/postpone) reload DEBT_ITEMS just to re-open the detail view, so the
  // list render must be skipped when there's no wrapper (was: "null is not an object").
  const wrap = document.getElementById('debtListWrap');
  try {
    const resp = await apiGet('debts');
    if (!resp.success) throw new Error(resp.error);
    DEBT_ITEMS = resp.data.items || [];
    if (!wrap) return;
    if (DEBT_ITEMS.length === 0) { wrap.innerHTML = emptyState(); return; }
    const totalRemaining = DEBT_ITEMS.filter(d => d.status !== 'paid_off').reduce((s,d) => s + d.remainingAmount, 0);
    wrap.innerHTML = `
      <div class="dash-balance" style="margin-bottom:4px;">
        <div class="small">หนี้คงเหลือทั้งหมด</div>
        <div class="big">฿${fmt(totalRemaining)}</div>
      </div>
      ${DEBT_ITEMS.map((d, idx) => renderDebtCard(d, idx)).join('')}
    `;
  } catch (e) {
    if (wrap) wrap.innerHTML = errorBlock();
    toast('โหลดหนี้สินไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  }
}

function renderDebtCard(d, idx) {
  const isPaidOff = d.status === 'paid_off';
  let dueBadge = '';
  if (!isPaidOff) {
    if (d.isOverdue) dueBadge = `<span class="uiv-percent down">🔴 เลยกำหนด</span>`;
    else if (d.isDueSoon) dueBadge = `<span class="uiv-percent down">🟡 ครบใน ${d.daysUntilDue} วัน</span>`;
    else dueBadge = `<span class="uiv-percent up">ครบกำหนด ${d.nextDueDate}</span>`;
  }
  const fillClass = isPaidOff ? 'normal' : (d.isOverdue ? 'over' : (d.isDueSoon ? 'warning' : 'normal'));
  return `
    <div class="uiv-card" style="margin-bottom:12px;cursor:pointer;${isPaidOff?'opacity:.6;':''}" onclick="openDebtDetailByIndex(${idx})">
      <div class="uiv-title">
        <span class="uiv-icon neutral"><span class="uiv-emoji">${d.icon}</span></span>
        <span class="uiv-title-text">${escapeHtml(d.name)}</span>
        <div class="uiv-right-group">
          ${isPaidOff ? '<span class="uiv-percent up">✅ จ่ายครบแล้ว</span>' : dueBadge}
          <span class="uiv-chevron">›</span>
        </div>
      </div>
      <p class="uiv-value">฿${fmt(d.remainingAmount)} <span class="uiv-sub">/ ฿${fmt(d.totalAmount)}${d.interestRate>0?' · ดอกเบี้ย '+d.interestRate+'%/ปี':''}</span></p>
      <div class="uiv-range"><div class="uiv-fill ${fillClass}" style="width:${d.percentPaid}%;"></div></div>
    </div>`;
}

async function submitCreateDebt() {
  const debtName = document.getElementById('debtName').value.trim();
  const debtType = document.getElementById('debtType').value;
  const totalAmount = Number(document.getElementById('debtTotal').value || 0);
  const remainingInput = document.getElementById('debtRemaining').value;
  const interestRate = Number(document.getElementById('debtInterest').value || 0);

async function submitPayDebt(debtId) {
  const amount = Number(document.getElementById('payDebtAmount').value || 0);
  const accountId = document.getElementById('payDebtAccount').value;
  const note = document.getElementById('payDebtNote').value.trim();
  if (!amount || amount <= 0) { toast('กรุณาระบุจำนวนเงิน', 'warn'); return; }
  const btn = document.getElementById('payDebtBtn');
  const prevLabel = btn.textContent;
  btn.textContent = 'กำลังบันทึก...'; btn.disabled = true;
  try {
    const body = { debtId: debtId, amount: amount, note: note };
    if (accountId) body.accountId = accountId;
    const resp = await apiPost('pay-debt', body);
    if (!resp.success) throw new Error(resp.error);
    toast(resp.data.paidOff ? '🎉 ชำระหนี้ครบแล้ว!' : 'บันทึกการชำระเรียบร้อยแล้ว', 'success');
    DASH_CACHE = null; TX_CACHE = {}; BUDGET_CACHE = {};
    await loadDebts();
    const updated = DEBT_ITEMS.find(x => x.id === debtId);
    if (updated) openDebtDetail(updated); else renderDebt();
  } catch (e) {
    toast('บันทึกไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
    btn.textContent = prevLabel; btn.disabled = false;
  }
}

async function askAIQuestion(question) {
  const input = document.getElementById('aiQuestion');
  question = String(question || (input ? input.value : '') || '').trim();

  if (!question) {
    toast('กรุณาพิมพ์คำถามก่อน', 'warn');
    if (input) input.focus();
    return;
  }

  if (input) input.value = question;

  const wrap = document.getElementById('aiResult');
  if (!wrap) return;

  // Button-level feedback in addition to the result area's own loading state,
  // so a tap on any quick-command chip visibly registers even before the
  // (localized, not full-page) result box below updates.
  const askBtn = document.getElementById('aiAskBtn');
  const prevLabel = askBtn ? askBtn.textContent : '';
  if (askBtn) { askBtn.textContent = 'กำลังคิด...'; askBtn.disabled = true; }

  wrap.innerHTML = aiThinkingHtml('กำลังประมวลผล');

  try {
    const resp = await apiGet('ai-command', { q: question });
    if (!resp.success) throw new Error(resp.error || 'AI ไม่สามารถประมวลผลได้');

    const answer = resp.data && (resp.data.answer || resp.data.analysis)
      ? (resp.data.answer || resp.data.analysis)
      : 'ไม่พบคำตอบจากระบบ';

    wrap.innerHTML = `
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px;">
        คำถาม: ${escapeHtml(question)}
      </div>
      <div class="ai-box">${escapeHtml(answer)}</div>
    `;

    toast('AI ตอบเรียบร้อยแล้ว', 'success');
  } catch (e) {
    wrap.innerHTML = errorBlock();
    toast('ถาม AI ไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  } finally {
    if (askBtn) { askBtn.textContent = prevLabel; askBtn.disabled = false; }
  }
}

async function runAiAnalysis() {
  const wrap = document.getElementById('aiResult');
  if (!wrap) return;
  const btn = document.getElementById('aiAnalysisBtn');
  const prevLabel = btn ? btn.textContent : '';
  if (btn) { btn.textContent = 'กำลังวิเคราะห์...'; btn.disabled = true; }

  wrap.innerHTML = aiThinkingHtml('กำลังวิเคราะห์');

  try {
    const resp = await apiGet('ai-analysis');
    if (!resp.success) throw new Error(resp.error);

    wrap.innerHTML = `

    wrap.innerHTML = errorBlock();
    toast('วิเคราะห์ไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  } finally {
    if (btn) { btn.textContent = prevLabel; btn.disabled = false; }
  }
}

async function submitBulkReassign() {
  const reassignments = {};
  AUDIT_ITEMS.forEach((t, idx) => {
    const sel = document.getElementById('auditAcc' + idx);
    if (sel && sel.value) reassignments[t.id] = sel.value;
  });
  const count = Object.keys(reassignments).length;
  if (count === 0) { toast('ยังไม่ได้เลือกบัญชีใหม่ให้รายการไหนเลย', 'warn'); return; }
  const ok = await customConfirm(`ย้าย ${count} รายการไปบัญชีที่เลือกใช่หรือไม่? ยอดเงินของบัญชีที่เกี่ยวข้องจะถูกคำนวณใหม่ทั้งหมด`);
  if (!ok) return;
  const btn = document.getElementById('auditSubmitBtn');
  const prevLabel = btn.textContent;
  btn.textContent = 'กำลังย้าย...'; btn.disabled = true;
  try {
    const resp = await apiPost('bulk-reassign-account', { reassignments: reassignments });
    if (!resp.success) throw new Error(resp.error || 'ย้ายไม่สำเร็จ');
    const moved = resp.data.moved.filter(m => !m.error).length;
    toast(`ย้ายสำเร็จ ${moved} รายการ`, 'success');
    DASH_CACHE = null; TX_CACHE = {}; BUDGET_CACHE = {};
    runCashAudit(); // refresh — the moved items should no longer show up as suspects
  } catch (e) {
    toast('ย้ายไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
    btn.textContent = prevLabel; btn.disabled = false;
  }
}

async function loadCategoryList() {
  const wrap = document.getElementById('categoryListWrap');
  if (!wrap) return;
  try {
    await loadCategories(); // refresh STATE.categories in case this is stale
    const cats = STATE.categories || [];
    if (cats.length === 0) { wrap.innerHTML = emptyState(); return; }
    const expense = cats.filter(c => c.Type !== 'income');
    const income = cats.filter(c => c.Type === 'income');

      <div style="font-size:11px;color:var(--muted);margin:10px 0 4px;">${title}</div>

    wrap.innerHTML = errorBlock();

}

async function loadDupExclusions() {
  const wrap = document.getElementById('dupExclusionListWrap');
  if (!wrap) return;
  try {
    const [catResp, exclResp] = await Promise.all([
      STATE.categories && STATE.categories.length ? Promise.resolve({ success: true, data: STATE.categories }) : apiGet('categories'),
      apiGet('duplicate-exclusions')
    ]);
    if (catResp.success) STATE.categories = catResp.data;
    if (!exclResp.success) throw new Error(exclResp.error);
    const excluded = exclResp.data.excludedCategories || [];
    const cats = (STATE.categories || []).filter(c => c.Type !== 'income');
    if (cats.length === 0) { wrap.innerHTML = emptyState(); return; }
    wrap.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${cats.map(c => `
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;">
            <input type="checkbox" class="dup-excl-cb" value="${escapeHtml(c.CategoryName)}" style="width:auto;margin:0;" ${excluded.indexOf(c.CategoryName) !== -1 ? 'checked' : ''}>
            <span>${c.Icon||''} ${escapeHtml(c.CategoryName)}</span>
          </label>`).join('')}
      </div>`;
  } catch (e) {
    wrap.innerHTML = errorBlock();
    toast('โหลดรายการหมวดไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  }
}

async function saveDupExclusions() {
  const checked = Array.from(document.querySelectorAll('.dup-excl-cb:checked')).map(el => el.value);
  const btn = document.getElementById('saveDupExclusionsBtn');

  btn.textContent = 'กำลังบันทึก...'; btn.disabled = true;
  try {
    const resp = await apiPost('update-duplicate-exclusions', { excludedCategories: checked });
    if (!resp.success) throw new Error(resp.error);
    toast('บันทึกเรียบร้อยแล้ว', 'success');
    DASH_CACHE = null; // duplicate alerts on the dashboard are affected by this

    btn.textContent = prevLabel; btn.disabled = false;

async function submitCreateRecurring() {
  const formWrap = document.getElementById('createRecurringFormWrap');
  const type = formWrap.dataset.type || 'expense';
  const name = document.getElementById('recName').value.trim();
  const amount = Number(document.getElementById('recAmount').value || 0);
  const dayOfMonth = Number(document.getElementById('recDay').value || 0);
  const category = document.getElementById('recCategory').value;
  const accountId = document.getElementById('recAccount').value;
  if (!name) { toast('กรุณาใส่ชื่อรายการ', 'warn'); return; }
  if (!amount || amount <= 0) { toast('กรุณาระบุจำนวนเงินให้ถูกต้อง', 'warn'); return; }
  if (!dayOfMonth) { toast('กรุณาระบุวันที่รัน', 'warn'); return; }
  if (!accountId) { toast('กรุณาเลือกบัญชี', 'warn'); return; }
  const btn = document.getElementById('saveRecurringBtn');
  const prevLabel = btn.textContent;
  btn.textContent = 'กำลังบันทึก...'; btn.disabled = true;
  try {
    const resp = await apiPost('create-recurring', { name: name, type: type, amount: amount, dayOfMonth: dayOfMonth, category: category, accountId: accountId });
    if (!resp.success) throw new Error(resp.error);

}

  LINE_CHANNEL_ACCESS_TOKEN: { label: 'LINE Channel Access Token', type: 'password' },
  GROQ_API_KEY: { label: 'Groq API Key', type: 'password' },
  GEMINI_API_KEY: { label: 'Gemini API Key (อ่านสลิป, ใช้แทน/สำรอง Groq)', type: 'password' },
  API_SECRET: { label: 'API Secret (รหัสเข้าสู่ระบบ Dashboard)', type: 'password' },

  SPREADSHEET_ID: { label: 'Spreadsheet ID (สร้างโดยระบบ)', type: 'readonly' },

async function loadConfigStatus() {
  const statusWrap = document.getElementById('configStatusList');
  const fieldsWrap = document.getElementById('configEditFields');
  try {
    const resp = await apiGet('config-status');
    if (!resp.success) throw new Error(resp.error);
    const data = resp.data;
    const order = ['LINE_CHANNEL_ACCESS_TOKEN','GROQ_API_KEY','GEMINI_API_KEY','API_SECRET','TIMEZONE','SPREADSHEET_ID','DRIVE_FOLDER_ID'];

    statusWrap.innerHTML = `
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">
        <table style="min-width:420px;">
          <thead><tr><th>ค่า</th><th>สถานะ</th><th>ตัวอย่าง</th></tr></thead>
          <tbody>
            ${order.map(k => {
              const meta = CONFIG_FIELD_META[k];
              const d = data[k] || { set:false, preview:'' };
              return `<tr>
                <td>${meta.label}</td>
                <td><span class="badge ${d.set ? 'confirmed' : 'pending'}">${d.set ? 'ตั้งค่าแล้ว' : 'ยังไม่ได้ตั้งค่า'}</span></td>
                <td style="color:var(--muted);font-size:12px;">${escapeHtml(d.preview) || '-'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;

    fieldsWrap.innerHTML = order.filter(k => CONFIG_FIELD_META[k].type !== 'readonly').map(k => {
      const meta = CONFIG_FIELD_META[k];
      return `
        <label style="font-size:13px;color:var(--muted);display:block;">${meta.label}</label>
        <input id="cfg_${k}" type="${meta.type}" placeholder="เว้นว่างไว้ถ้าไม่ต้องการเปลี่ยน">
      `;
    }).join('');
  } catch (e) {
    statusWrap.innerHTML = errorBlock();
    toast('โหลดสถานะการตั้งค่าไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  }
}

async function saveConfig() {
  const errEl = document.getElementById('cfgError');
  const okEl = document.getElementById('cfgSuccess');
  errEl.style.display = 'none'; okEl.style.display = 'none';

  const currentSecret = document.getElementById('cfgCurrentSecret').value.trim();
  if (!currentSecret) {
    errEl.textContent = 'กรุณากรอกรหัสยืนยัน (API Secret ปัจจุบัน)';
    errEl.style.display = 'block';
    toast('กรุณากรอกรหัสยืนยัน (API Secret ปัจจุบัน)', 'warn');
    return;
  }

  const editableKeys = ['LINE_CHANNEL_ACCESS_TOKEN','GROQ_API_KEY','GEMINI_API_KEY','API_SECRET','TIMEZONE'];
  const updates = {};
  editableKeys.forEach(k => {
    const el = document.getElementById('cfg_' + k);
    if (el && el.value.trim() !== '') updates[k] = el.value.trim();
  });
  if (Object.keys(updates).length === 0) {
    errEl.textContent = 'กรุณากรอกค่าที่ต้องการเปลี่ยนอย่างน้อย 1 รายการ';
    errEl.style.display = 'block';
    toast('กรุณากรอกค่าที่ต้องการเปลี่ยนอย่างน้อย 1 รายการ', 'warn');
    return;
  }

  const ok = await customConfirm('ยืนยันการบันทึกการตั้งค่า? หากเปลี่ยน API Secret ทุกคนจะต้อง Login ใหม่');
  if (!ok) return;

  const btn = document.getElementById('saveConfigBtn');
  const prevLabel = btn ? btn.textContent : '';
  if (btn) { btn.textContent = 'กำลังบันทึก...'; btn.disabled = true; }

  try {
    const resp = await apiPost('update-config', { currentSecret: currentSecret, updates: updates });
    if (!resp.success) {
      errEl.textContent = resp.error || 'บันทึกไม่สำเร็จ';
      errEl.style.display = 'block';
      toast(resp.error || 'บันทึกไม่สำเร็จ', 'error');
      return;
    }

    // If API_SECRET was changed, the session is invalidated server-side — log the user out locally too.
    if (resp.data.updated.indexOf('API_SECRET') !== -1) {
      toast('เปลี่ยน API Secret สำเร็จ กรุณา Login ใหม่ด้วยรหัสใหม่', 'success');
      doLogout();
      return;
    }

    okEl.textContent = '✅ บันทึกสำเร็จ: ' + resp.data.updated.join(', ');
    okEl.style.display = 'block';
    toast('บันทึกการตั้งค่าสำเร็จ: ' + resp.data.updated.join(', '), 'success');
    editableKeys.forEach(k => { const el = document.getElementById('cfg_' + k); if (el) el.value = ''; });
    document.getElementById('cfgCurrentSecret').value = '';
    loadConfigStatus();
  } catch (e) {
    errEl.textContent = 'ไม่สามารถบันทึกได้ กรุณาลองใหม่อีกครั้ง';
    errEl.style.display = 'block';
    toast('บันทึกการตั้งค่าไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  } finally {
    if (btn) { btn.textContent = prevLabel; btn.disabled = false; }
  }
}

window.addEventListener('DOMContentLoaded', () => {
  const loginScreen = document.getElementById('loginScreen');
  const app = document.getElementById('app');
  const pinEl = document.getElementById('loginPin');
  const submitBtn = document.getElementById('loginSubmitBtn');

  if (pinEl && submitBtn) {
    pinEl.addEventListener('input', () => {
      pinEl.value = pinEl.value.replace(/\D/g, '').slice(0, 6);
    });
    pinEl.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); doLogin(); }
    });
  }

  if (STATE.token && STATE.userId) {
    loginScreen.style.display = 'none';
    app.style.display = 'block';
    showApp();
  } else {
    app.style.display = 'none';
    loginScreen.style.display = 'flex';
    initGoogleSignIn();
  }
});
