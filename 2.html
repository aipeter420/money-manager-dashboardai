<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Manager AI V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --navy:#0B1220;         /* hero / dark surfaces */
    --navy-soft:#161F36;
    --ink:#10142A;          /* primary text */
    --ink-soft:#454A63;
    --bg:#F1F3F9;           /* page background */
    --card:#FFFFFF;
    --card-line:#E7E9F3;
    --muted:#878CA3;
    --mint:#00C896;         /* primary accent — positive / CTA */
    --mint-dark:#00A97F;
    --mint-soft:#E1FAF1;
    --income:#00A97F;
    --income-soft:#E1FAF1;
    --expense:#F2545B;
    --expense-soft:#FDEAEB;
    --warn:#F2A93B;
    --warn-soft:#FEF3E2;
    --critical:#E24C3D;
    --radius-sm:14px;
    --radius:20px;
    --shadow:0 1px 2px rgba(16,20,42,.03), 0 10px 28px rgba(16,20,42,.06);
    --display:'Prompt', 'Sarabun', sans-serif;
    --sans:'Sarabun', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box;}
  html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;}
  html,body{overflow-x:hidden;width:100%;}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);}
  #app{max-width:520px;margin:0 auto;padding:0 16px 96px;}
  ::selection{background:rgba(0,200,150,.22);}

  /* ---------- Login (splash-style, like a bank app open screen) ---------- */
  #loginScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;
    padding:24px;position:relative;overflow:hidden;background:#000;
  }
  #loginScreen::before{
    content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(520px 320px at 50% -8%, rgba(0,200,150,.20), transparent 65%),
      rgba(11,18,32,.62);
  }
  #loginScreen .login-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;}
  #loginScreen .brandmark{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  #loginScreen .brandmark .mark{
    width:42px;height:42px;border-radius:13px;background:var(--mint);display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:0 8px 22px rgba(0,200,150,.35);
  }
  #loginScreen .brandmark svg{width:22px;height:22px;flex-shrink:0;}
  #loginScreen h1{
    font-family:var(--display);font-weight:600;font-size:21px;margin:0;color:#fff;letter-spacing:.2px;
  }
  #loginScreen .tagline{color:#9AA3C2;font-size:13.5px;margin:0 0 30px;text-align:center;max-width:280px;}
  #loginScreen .card{width:100%;max-width:340px;background:var(--navy-soft);border:1px solid rgba(255,255,255,.06);box-shadow:none;}
  #loginScreen .card > label{color:#9AA3C2;}
  #loginPin{
    font-family:var(--display);font-size:30px;letter-spacing:14px;text-align:center;
    padding:16px 10px 14px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);
    border-radius:var(--radius-sm);color:#fff;
  }
  #loginPin:focus{border-color:var(--mint);}
  #loginScreen button{width:100%;}
  #loginScreen .hint{font-size:12.5px;color:#8188A6;text-align:center;margin-top:16px;margin-bottom:0;line-height:1.6;}
  #loginScreen .hint strong{color:#C9CEE3;}
  #loginLoaderWrap{justify-content:center;}
  #loginLoaderWrap .liquid-loader{padding:4px 0;}
  #loginLoaderWrap .loading-text{color:#C9CEE3;}

  /* ---------- Matrix rain background (login screen) ---------- */
  #loginScreen .matrix-container{
    position:absolute;inset:0;z-index:0;background:#000;display:flex;flex-wrap:wrap;overflow:hidden;
  }
  #loginScreen .matrix-pattern{position:relative;width:1000px;height:100%;flex-shrink:0;}
  #loginScreen .matrix-column{
    position:absolute;top:-100%;width:20px;height:100%;font-size:16px;line-height:18px;font-weight:bold;
    animation:matrixFall linear infinite;white-space:nowrap;
  }
  #loginScreen .matrix-column::before{
    content:"アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    position:absolute;top:0;left:0;
    background:linear-gradient(0deg,
      rgba(185,79,255,1) 0%, rgba(255,69,69,1) 20%, rgba(252,176,69,1) 40%,
      rgba(252,237,69,1) 60%, rgba(69,252,90,1) 80%, rgba(69,206,252,1) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    writing-mode:vertical-lr;letter-spacing:1px;text-rendering:optimizeLegibility;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    animation:matrixRainbowShift 5s infinite;
  }
  #loginScreen .matrix-column:nth-child(1){left:0px;animation-delay:-2.5s;animation-duration:3s;}
  #loginScreen .matrix-column:nth-child(2){left:25px;animation-delay:-3.2s;animation-duration:4s;}
  #loginScreen .matrix-column:nth-child(3){left:50px;animation-delay:-1.8s;animation-duration:2.5s;}
  #loginScreen .matrix-column:nth-child(4){left:75px;animation-delay:-2.9s;animation-duration:3.5s;}
  #loginScreen .matrix-column:nth-child(5){left:100px;animation-delay:-1.5s;animation-duration:3s;}
  #loginScreen .matrix-column:nth-child(6){left:125px;animation-delay:-3.8s;animation-duration:4.5s;}
  #loginScreen .matrix-column:nth-child(7){left:150px;animation-delay:-2.1s;animation-duration:2.8s;}
  #loginScreen .matrix-column:nth-child(8){left:175px;animation-delay:-2.7s;animation-duration:3.2s;}
  #loginScreen .matrix-column:nth-child(9){left:200px;animation-delay:-3.4s;animation-duration:3.8s;}
  #loginScreen .matrix-column:nth-child(10){left:225px;animation-delay:-1.9s;animation-duration:2.7s;}
  #loginScreen .matrix-column:nth-child(11){left:250px;animation-delay:-3.6s;animation-duration:4.2s;}
  #loginScreen .matrix-column:nth-child(12){left:275px;animation-delay:-2.3s;animation-duration:3.1s;}
  #loginScreen .matrix-column:nth-child(13){left:300px;animation-delay:-3.1s;animation-duration:3.6s;}
  #loginScreen .matrix-column:nth-child(14){left:325px;animation-delay:-2.6s;animation-duration:2.9s;}
  #loginScreen .matrix-column:nth-child(15){left:350px;animation-delay:-3.7s;animation-duration:4.1s;}
  #loginScreen .matrix-column:nth-child(16){left:375px;animation-delay:-2.8s;animation-duration:3.3s;}
  #loginScreen .matrix-column:nth-child(17){left:400px;animation-delay:-3.3s;animation-duration:3.7s;}
  #loginScreen .matrix-column:nth-child(18){left:425px;animation-delay:-2.2s;animation-duration:2.6s;}
  #loginScreen .matrix-column:nth-child(19){left:450px;animation-delay:-3.9s;animation-duration:4.3s;}
  #loginScreen .matrix-column:nth-child(20){left:475px;animation-delay:-2.4s;animation-duration:3.4s;}
  #loginScreen .matrix-column:nth-child(21){left:500px;animation-delay:-1.7s;animation-duration:2.4s;}
  #loginScreen .matrix-column:nth-child(22){left:525px;animation-delay:-3.5s;animation-duration:3.9s;}
  #loginScreen .matrix-column:nth-child(23){left:550px;animation-delay:-2s;animation-duration:3s;}
  #loginScreen .matrix-column:nth-child(24){left:575px;animation-delay:-4s;animation-duration:4.4s;}
  #loginScreen .matrix-column:nth-child(25){left:600px;animation-delay:-1.6s;animation-duration:2.3s;}
  #loginScreen .matrix-column:nth-child(26){left:625px;animation-delay:-3s;animation-duration:3.5s;}
  #loginScreen .matrix-column:nth-child(27){left:650px;animation-delay:-3.8s;animation-duration:4s;}
  #loginScreen .matrix-column:nth-child(28){left:675px;animation-delay:-2.5s;animation-duration:2.8s;}
  #loginScreen .matrix-column:nth-child(29){left:700px;animation-delay:-3.2s;animation-duration:3.6s;}
  #loginScreen .matrix-column:nth-child(30){left:725px;animation-delay:-2.7s;animation-duration:3.2s;}
  #loginScreen .matrix-column:nth-child(31){left:750px;animation-delay:-1.8s;animation-duration:2.7s;}
  #loginScreen .matrix-column:nth-child(32){left:775px;animation-delay:-3.6s;animation-duration:4.1s;}
  #loginScreen .matrix-column:nth-child(33){left:800px;animation-delay:-2.1s;animation-duration:3.1s;}
  #loginScreen .matrix-column:nth-child(34){left:825px;animation-delay:-3.4s;animation-duration:3.7s;}
  #loginScreen .matrix-column:nth-child(35){left:850px;animation-delay:-2.8s;animation-duration:2.9s;}
  #loginScreen .matrix-column:nth-child(36){left:875px;animation-delay:-3.7s;animation-duration:4.2s;}
  #loginScreen .matrix-column:nth-child(37){left:900px;animation-delay:-2.3s;animation-duration:3.3s;}
  #loginScreen .matrix-column:nth-child(38){left:925px;animation-delay:-1.9s;animation-duration:2.5s;}
  #loginScreen .matrix-column:nth-child(39){left:950px;animation-delay:-3.5s;animation-duration:3.8s;}
  #loginScreen .matrix-column:nth-child(40){left:975px;animation-delay:-2.6s;animation-duration:3.4s;}
  #loginScreen .matrix-column:nth-child(odd)::before{
    content:"アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン123456789";
  }
  #loginScreen .matrix-column:nth-child(even)::before{
    content:"ガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポヴァィゥェォャュョッABCDEFGHIJKLMNOPQRSTUVWXYZ";
  }
  #loginScreen .matrix-column:nth-child(3n)::before{
    content:"アカサタナハマヤラワイキシチニヒミリウクスツヌフムユルエケセテネヘメレオコソトノホモヨロヲン0987654321";
  }
  #loginScreen .matrix-column:nth-child(4n)::before{
    content:"ンヲロヨモホノトソコオレメヘネテセケエルユムフヌツスクウリミヒニチシキイワラヤマハナタサカア";
  }
  #loginScreen .matrix-column:nth-child(5n)::before{
    content:"ガザダバパギジヂビピグズヅブプゲゼデベペゴゾドボポヴァィゥェォャュョッ!@#$%^&*()_+-=[]{}|;:,.<>?";
  }
  @keyframes matrixFall{
    0%{transform:translateY(-10%);opacity:1;}
    100%{transform:translateY(200%);opacity:0;}
  }
  @keyframes matrixRainbowShift{
    0%{filter:hue-rotate(0deg);}
    50%{filter:hue-rotate(180deg);}
    100%{filter:hue-rotate(360deg);}
  }
  @media (max-width:768px){
    #loginScreen .matrix-column{font-size:14px;line-height:16px;width:18px;}
  }
  @media (max-width:480px){
    #loginScreen .matrix-column{font-size:12px;line-height:14px;width:15px;}
  }

  /* ---------- Inputs / buttons ---------- */
  input,select{
    width:100%;padding:12px 14px;border:1.5px solid var(--card-line);
    border-radius:var(--radius-sm);font-size:14.5px;margin-bottom:12px;background:var(--card);color:var(--ink);
    font-family:var(--sans);transition:border-color .15s;
  }
  input:focus,select:focus{outline:none;border-color:var(--mint);}
  input::placeholder{color:#B0B4C6;}
  select{padding:12px 30px 12px 14px;appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23878CA3'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;}
  @media (max-width:600px){
    input,select{font-size:16px;} /* stops iOS Safari from auto-zooming the page on focus */
    #loginPin{font-size:26px;letter-spacing:11px;}
  }

  button{
    cursor:pointer;border:none;border-radius:999px;padding:13px 22px;font-size:14.5px;
    font-weight:600;background:var(--mint);color:#04231A;transition:.15s ease;font-family:var(--sans);
    letter-spacing:.1px;
  }
  button:hover{background:var(--mint-dark);}
  button:active{transform:translateY(1px);}
  button.secondary{background:var(--bg);color:var(--ink-soft);border:1.3px solid var(--card-line);}
  button.secondary:hover{background:#fff;border-color:var(--mint);color:var(--mint-dark);}
  button.danger{background:var(--expense-soft);color:var(--expense);border:1.3px solid transparent;}
  button.danger:hover{background:var(--expense);color:#fff;}
  .error{color:var(--expense);font-size:13px;margin-top:-4px;margin-bottom:10px;}

  /* ---------- Add-transaction form: type segmented control + slip attach ---------- */
  button.ctx-type-btn{
    background:var(--bg);color:var(--ink-soft);border:1.3px solid var(--card-line);
    padding:10px 4px;font-size:12.5px;border-radius:12px;font-weight:600;
  }
  button.ctx-type-btn.active{background:var(--mint);color:#04231A;border-color:var(--mint);}
  .ctx-slip-label{
    display:flex;align-items:center;justify-content:center;gap:8px;
    border:1.5px dashed var(--card-line);border-radius:var(--radius-sm);
    padding:14px;cursor:pointer;font-size:13px;color:var(--ink-soft);margin-bottom:4px;
  }
  .ctx-slip-label:active{background:var(--bg);}
  .ctx-slip-label input{display:none;}

  /* ---------- Cards / surfaces ---------- */
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:14px;border:1px solid var(--card-line);}
  .card h3{font-family:var(--display);font-weight:600;}

  header.top{
    display:flex;justify-content:space-between;align-items:center;
    margin:0 0 16px;padding:20px 2px 4px;background:transparent;color:var(--ink);
  }
  header.top .greet{display:flex;flex-direction:column;gap:2px;}
  header.top .greet .hi{font-size:12.5px;color:var(--muted);}
  header.top h2{margin:0;font-size:18px;font-family:var(--display);font-weight:600;color:var(--ink);}
  header.top .user{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);}
  header.top .user button.secondary{padding:8px 14px;font-size:12.5px;border-radius:999px;}

  /* ---------- Bottom nav (fixed, app-style) ---------- */
  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;align-items:stretch;
    background:#fff;border-top:1px solid var(--card-line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 20px rgba(16,20,42,.06);
  }
  nav.tabs button{
    background:transparent;color:var(--muted);white-space:nowrap;padding:6px 4px;font-size:10.5px;
    border-radius:12px;font-weight:500;flex:1;max-width:82px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  nav.tabs button svg{width:20px;height:20px;opacity:.7;flex-shrink:0;}
  nav.tabs button:hover{color:var(--ink);background:transparent;}
  nav.tabs button.active{color:var(--mint-dark);font-weight:600;}
  nav.tabs button.active svg{opacity:1;}

  /* ---------- Balance hero (dashboard) ---------- */
  .balance-hero{
    background:linear-gradient(155deg,var(--navy) 0%,var(--navy-soft) 100%);
    border-radius:var(--radius);padding:24px 22px;margin-bottom:14px;color:#fff;position:relative;overflow:hidden;
  }
  .balance-hero::after{
    content:'';position:absolute;top:-60px;right:-40px;width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle,rgba(0,200,150,.28),transparent 70%);
  }
  .balance-hero .label{font-size:12.5px;color:#9AA3C2;margin-bottom:6px;position:relative;}
  .balance-hero .value{font-family:var(--display);font-size:32px;font-weight:600;letter-spacing:.2px;font-variant-numeric:tabular-nums;position:relative;}
  .balance-hero .split{display:flex;gap:22px;margin-top:18px;position:relative;}
  .balance-hero .split div span{display:block;}
  .balance-hero .split .k{font-size:11.5px;color:#9AA3C2;margin-bottom:3px;}
  .balance-hero .split .v{font-family:var(--display);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;}
  .balance-hero .split .v.income{color:#4EE6B8;}
  .balance-hero .split .v.expense{color:#FF9990;}

  .quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
  .qa{background:var(--card);border:1px solid var(--card-line);border-radius:var(--radius-sm);padding:12px 6px;
    display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft);
    text-align:center;cursor:pointer;font-weight:500;}
  .qa .ic{width:34px;height:34px;border-radius:11px;background:var(--mint-soft);color:var(--mint-dark);
    display:flex;align-items:center;justify-content:center;}
  .qa .ic svg{width:17px;height:17px;}
  .qa:hover{border-color:var(--mint);}

  /* ---------- Stat cards ---------- */
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}

  /* ---------- Uiverse-style stat card (by Yaya12085, re-themed) ---------- */
  .uiv-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;border:1px solid var(--card-line);}
  .uiv-card .uiv-title{display:flex;align-items:center;}
  .uiv-card .uiv-icon{position:relative;flex-shrink:0;width:1.7rem;height:1.7rem;border-radius:9999px;background:var(--mint);}
  .uiv-card .uiv-icon svg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:1rem;height:1rem;color:#fff;}
  .uiv-card .uiv-icon .uiv-emoji{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:13px;line-height:1;}
  .uiv-card .uiv-icon.income{background:var(--income);}
  .uiv-card .uiv-icon.expense{background:var(--expense);}
  .uiv-card .uiv-icon.warn{background:var(--warn);}
  .uiv-card .uiv-icon.critical{background:var(--critical);}
  .uiv-card .uiv-icon.neutral{background:var(--navy);}
  .uiv-card .uiv-title-text{margin-left:.5rem;color:var(--ink-soft);font-size:13.5px;font-weight:500;}
  .uiv-card .uiv-right-group{margin-left:auto;display:flex;align-items:center;gap:6px;}
  .uiv-card .uiv-percent{font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:2px;white-space:nowrap;}
  .uiv-card .uiv-chevron{color:var(--muted);font-size:18px;line-height:1;}
  .uiv-card .uiv-percent.up{color:var(--income);}
  .uiv-card .uiv-percent.down{color:var(--expense);}
  .uiv-card .uiv-value{margin:12px 0 10px;color:var(--ink);font-size:1.6rem;line-height:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--display);}
  .uiv-card .uiv-value .uiv-sub{font-family:var(--sans);font-size:12.5px;color:var(--muted);font-weight:500;}
  .uiv-card .uiv-range{position:relative;background:var(--bg);width:100%;height:8px;border-radius:6px;overflow:hidden;}
  .uiv-card .uiv-fill{position:absolute;top:0;left:0;height:100%;border-radius:6px;transition:width .3s ease;}
  .uiv-card .uiv-fill.income{background:var(--income);}
  .uiv-card .uiv-fill.expense{background:var(--expense);}
  .uiv-card .uiv-fill.normal{background:var(--income);}
  .uiv-card .uiv-fill.warning{background:var(--warn);}
  .uiv-card .uiv-fill.critical{background:var(--critical);}
  .uiv-card .uiv-fill.over{background:var(--expense);}

  .chart-wrap{position:relative;height:250px;margin-bottom:10px;}

  /* ---------- Transaction list (replaces table) ---------- */
  .tx-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--card-line);
    position:relative; z-index:1; background:var(--card,#fff); transition:transform .18s ease;}
  .tx-row:last-child{border-bottom:none;}
  .tx-row[onclick]{cursor:pointer;}
  .tx-row[onclick]:active{background:var(--bg);}

  /* ---------- Transaction detail popup ---------- */
  .tx-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:4px;}
  .tx-detail-grid > div{display:flex;flex-direction:column;gap:2px;}
  .tx-detail-label{font-size:11px;color:var(--muted);}
  .tx-detail-value{font-size:13.5px;font-weight:600;color:var(--ink);}
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,15,25,.5); z-index:100;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-box{
    background:#fff; border-radius:18px 18px 0 0; padding:18px; width:100%; max-width:480px;
    box-shadow:0 -6px 24px rgba(0,0,0,.15);
    max-height:85vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  @media (min-width:520px){
    .modal-overlay{align-items:center;}
    .modal-box{border-radius:18px;}
  }
  .tx-row .tx-icon{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--bg);}
  .tx-row .tx-icon.income{background:#BEF2DC;}
  .tx-row .tx-icon.expense{background:#FAD1D4;}
  .tx-row .tx-mid{flex:1;min-width:0;}
  .tx-row .tx-desc{font-size:13.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tx-row .tx-cat{font-size:12px;color:var(--muted);margin-top:2px;}
  .tx-row .tx-right{text-align:right;flex-shrink:0;}
  .tx-row .tx-date{font-size:11px;color:var(--muted);margin-top:3px;}
  .tx-row .tx-actions{display:flex;gap:6px;margin-top:6px;justify-content:flex-end;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--card-line);}
  th{color:var(--muted);font-weight:600;font-size:12px;}
  .badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1.3px solid transparent;display:inline-block;}
  .badge.confirmed{background:var(--income-soft);color:var(--income);border-color:rgba(0,169,127,.2);}
  .badge.pending{background:var(--warn-soft);color:var(--warn);border-color:rgba(242,169,59,.25);}
  .badge.cancelled{background:var(--expense-soft);color:var(--expense);border-color:rgba(242,84,91,.2);}
  .amt{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:14.5px;}
  .amt.income{color:var(--income);font-weight:600;}
  .amt.expense{color:var(--expense);font-weight:600;}

  .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .filters input,.filters select{width:auto;flex:1;min-width:110px;margin-bottom:0;}
  .filters-compact{display:flex;gap:8px;margin-bottom:8px;}
  .filters-compact input{margin-bottom:0;}
  .icon-btn{
    position:relative;
    flex:0 0 auto; width:40px; height:40px; border-radius:12px; border:1px solid var(--border);
    background:#fff; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn.has-active::after{
    content:''; position:absolute; top:5px; right:5px; width:7px; height:7px; border-radius:50%; background:var(--expense);
  }
  .adv-filters{
    flex-direction:column; gap:8px; margin-bottom:14px; padding:10px; border-radius:12px;
    background:var(--bg-2,#f6f6f9); border:1px solid var(--border);
  }
  .adv-filters-row{display:flex;gap:8px;}
  .adv-filters select,.adv-filters input{margin-bottom:0;font-size:13px;padding:8px 10px;}
  .filter-date{ display:flex; flex-direction:column; gap:3px; flex:1; min-width:110px; }
  .filter-date span{ font-size:11px; color:var(--muted); }
  .filter-date input{ margin-bottom:0; }

  /* ---------- Account cards (bank-card style) ---------- */
  .acct-card{
    border-radius:18px;padding:18px 20px;color:#fff;position:relative;overflow:hidden;min-height:110px;
    display:flex;flex-direction:column;justify-content:space-between;
    background:linear-gradient(135deg,var(--navy) 0%,#22304F 100%);
  }
  .acct-card::after{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle,rgba(0,200,150,.25),transparent 70%);}
  .acct-card .top-row{display:flex;justify-content:space-between;align-items:flex-start;position:relative;}
  .acct-card .name{font-size:12.5px;color:#C4CAE0;}
  .acct-card .bal{font-family:var(--display);font-size:20px;font-weight:600;margin-top:14px;position:relative;font-variant-numeric:tabular-nums;}

  /* ---------- Budget ---------- */
  .budget-row{margin-bottom:16px;}
  .budget-row .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;}
  .bar-bg{background:var(--bg);border-radius:10px;height:9px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:10px;transition:width .3s ease;}
  .bar-fill.normal{background:var(--income);}
  .bar-fill.warning{background:var(--warn);}
  .bar-fill.critical{background:var(--critical);}
  .bar-fill.over{background:var(--expense);}

  /* ---------- Settings list ---------- */
  .settings-list{display:flex;flex-direction:column;}
  .settings-item{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid var(--card-line);font-size:13.5px;}
  .settings-item:last-child{border-bottom:none;}
  .settings-item .k{color:var(--muted);}
  .settings-item .v{font-weight:600;color:var(--ink);}

  /* ---------- Misc states ---------- */
  .empty{text-align:center;color:var(--muted);padding:44px 10px;}
  .empty .emoji{font-size:30px;margin-bottom:10px;opacity:.8;}
  .loading{text-align:center;color:var(--muted);padding:34px;font-size:13.5px;}
  .loading::before{content:'';display:block;width:18px;height:18px;margin:0 auto 10px;border-radius:50%;
    border:2px solid var(--card-line);border-top-color:var(--mint);animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Liquid loader (by ShaikhWahid99, re-themed) ---------- */
  .liquid-loader{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 10px;font-family:var(--sans);}
  .liquid-loader .loader-track{
    position:relative;width:180px;max-width:100%;height:28px;
    background:linear-gradient(135deg,#2a2a2a,#1a1a1a);border-radius:14px;overflow:hidden;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.6), 0 1px 3px rgba(255,255,255,.1);
  }
  .liquid-loader .liquid-fill{
    position:absolute;top:2px;left:2px;height:calc(100% - 4px);
    background:linear-gradient(90deg,#00C896,#4f46e5,#7c3aed,#ec4899);
    border-radius:12px;
    animation:liquidFill 4s ease-out infinite, liquidColorShift 3s linear infinite;
    box-shadow:0 0 12px rgba(124,58,237,.35), inset 0 1px 2px rgba(255,255,255,.2);
  }
  .liquid-loader .loading-text{
    color:var(--ink-soft);font-size:13.5px;font-weight:600;letter-spacing:.3px;
    animation:liquidTextGlow 1s ease-in-out infinite;
  }
  .liquid-loader .dot{margin-left:1px;animation:liquidBlink 1.5s infinite;}
  .liquid-loader .dot:nth-of-type(1){animation-delay:0s;}
  .liquid-loader .dot:nth-of-type(2){animation-delay:.3s;}
  .liquid-loader .dot:nth-of-type(3){animation-delay:.6s;}
  .liquid-loader.compact{padding:6px 0;gap:6px;}
  .liquid-loader.compact .loader-track{width:120px;height:20px;border-radius:10px;}
  .liquid-loader.compact .liquid-fill{border-radius:8px;}
  .liquid-loader.compact .loading-text{font-size:12.5px;}
  @keyframes liquidFill{
    0%{width:4px;} 25%{width:25%;} 50%{width:50%;} 75%{width:75%;} 100%{width:calc(100% - 4px);}
  }
  @keyframes liquidColorShift{
    0%{filter:hue-rotate(0deg) brightness(1);}
    33%{filter:hue-rotate(120deg) brightness(1.1);}
    66%{filter:hue-rotate(240deg) brightness(.9);}
    100%{filter:hue-rotate(360deg) brightness(1);}
  }
  @keyframes liquidTextGlow{
    0%,100%{opacity:.7;} 50%{opacity:1;}
  }
  @keyframes liquidBlink{
    0%,50%{opacity:1;} 51%,100%{opacity:0;}
  }
  .slip-link{color:var(--mint-dark);text-decoration:none;font-size:12.5px;font-weight:600;}
  .pagination{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:14px;}
  .pagination button{padding:8px 14px;font-size:13px;}
  .ai-box{white-space:pre-wrap;line-height:1.75;font-size:14.5px;padding:16px 18px;background:var(--bg);
    border-radius:var(--radius-sm);}
  #aiQuestion:focus{outline:none;border-color:var(--mint);}
  #aiQuestion::placeholder{color:#B0B4C6;}
  @media(max-width:600px){
    table{font-size:12px;} th,td{padding:9px 5px;}
  }

  /* ============================================================
   * TOAST NOTIFICATIONS — replaces window.alert() everywhere.
   * Stacks top-right (top-center on mobile), auto-dismisses, tap to close early.
   * Built because native alert()/confirm() are unreliable inside LINE's in-app
   * browser (WebView) — they can silently no-op instead of showing a dialog,
   * which made buttons that relied on confirm() look "broken".
   * ============================================================ */
  #toastStack{
    position:fixed;top:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:10px;
    max-width:340px;pointer-events:none;
  }
  .toast{
    pointer-events:auto;display:flex;align-items:flex-start;gap:10px;
    background:var(--ink);color:#fff;padding:14px 16px;border-radius:var(--radius-sm);
    box-shadow:0 6px 20px rgba(24,35,56,.28);font-size:13.5px;line-height:1.5;
    border-left:4px solid var(--mint);cursor:pointer;
    animation:toastIn .25s cubic-bezier(.34,1.56,.64,1);
  }
  .toast.success{border-left-color:var(--income);}
  .toast.error{border-left-color:var(--expense);}
  .toast.warn{border-left-color:var(--warn);}
  .toast .toast-icon{font-size:17px;line-height:1;flex-shrink:0;margin-top:1px;}
  .toast .toast-msg{flex:1;word-break:break-word;}
  .toast.leaving{animation:toastOut .2s ease forwards;}
  @keyframes toastIn{from{opacity:0;transform:translateX(24px) scale(.96);}to{opacity:1;transform:translateX(0) scale(1);}}
  @keyframes toastOut{to{opacity:0;transform:translateX(24px) scale(.96);}}
  @media(max-width:600px){
    #toastStack{left:12px;right:12px;top:12px;max-width:none;align-items:stretch;}
  }

  /* ============================================================
   * CONFIRM MODAL — replaces window.confirm() everywhere.
   * ============================================================ */
  #confirmOverlay{
    position:fixed;inset:0;background:rgba(24,35,56,.45);z-index:9998;
    display:none;align-items:center;justify-content:center;padding:20px;
    animation:overlayIn .15s ease;
  }
  #confirmOverlay.open{display:flex;}
  #accountPickOverlay{
    position:fixed;inset:0;background:rgba(24,35,56,.45);z-index:9998;
    display:none;align-items:center;justify-content:center;padding:20px;
    animation:overlayIn .15s ease;
  }
  #accountPickOverlay.open{display:flex;}
  @keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
  #confirmModal{
    background:var(--card);border-radius:var(--radius);box-shadow:0 20px 50px rgba(24,35,56,.3);
    padding:24px;max-width:360px;width:100%;border-top:3px solid var(--mint);
    animation:modalIn .2s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  #confirmModal .msg{font-size:14.5px;line-height:1.6;color:var(--ink);margin-bottom:20px;white-space:pre-wrap;}
  #confirmModal .actions{display:flex;gap:10px;justify-content:flex-end;}
  #confirmModal .actions button{padding:10px 18px;}

  /* ============================================================
   * SUCCESS POPUP — brief animated confirmation (e.g. after login),
   * fades/scales out gently on its own instead of stacking like toasts.
   * ============================================================ */
  #successOverlay{
    position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;
    background:rgba(11,18,32,.55);padding:20px;
  }
  #successOverlay.show{display:flex;animation:overlayFadeIn .2s ease;}
  #successOverlay.leaving{animation:overlayFadeOut .35s ease forwards;}
  #successOverlay .box{
    background:var(--navy-soft);border:1px solid rgba(255,255,255,.08);border-radius:24px;
    padding:34px 42px;display:flex;flex-direction:column;align-items:center;gap:14px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);animation:popIn .35s cubic-bezier(.34,1.56,.64,1);
  }
  #successOverlay.leaving .box{animation:popOut .35s ease forwards;}
  #successOverlay .checkmark{width:60px;height:60px;border-radius:50%;background:var(--mint);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  #successOverlay .checkmark svg{width:30px;height:30px;}
  #successOverlay .checkmark path{stroke-dasharray:26;stroke-dashoffset:26;animation:drawCheck .45s ease .12s forwards;}
  #successOverlay .msg{color:#fff;font-family:var(--display);font-size:15px;font-weight:600;text-align:center;}
  @keyframes overlayFadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes overlayFadeOut{to{opacity:0;}}
  @keyframes popIn{from{opacity:0;transform:scale(.82);}to{opacity:1;transform:scale(1);}}
  @keyframes popOut{to{opacity:0;transform:scale(.92);}}
  @keyframes drawCheck{to{stroke-dashoffset:0;}}

/* ============================================================
 * DASHBOARD V4 INTERACTIVE UI
 * ============================================================ */
.dash-v4 { display:flex; flex-direction:column; gap:14px; }
.dash-head { display:flex; justify-content:space-between; align-items:center; gap:10px; }
.dash-head .eyebrow { font-size:12px; color:var(--muted); margin-bottom:3px; }
.dash-head .eyebrow-lg { font-size:20px; font-weight:800; color:var(--text); letter-spacing:-.4px; margin-bottom:0; }
.dash-head h2 { margin:0; font-size:23px; letter-spacing:-.4px; }
.dash-period {
  border:1px solid var(--border); background:#fff; border-radius:14px;
  padding:9px 12px; font-size:12px; color:var(--text); outline:none;
}
.dash-balance {
  position:relative; overflow:hidden; border-radius:24px; padding:20px;
  background:linear-gradient(135deg,#0B1220,#17243A);
  color:#fff; box-shadow:0 12px 30px rgba(11,18,32,.14);
}
.dash-balance .small { color:rgba(255,255,255,.68); font-size:12px; }
.dash-balance .big { font-size:34px; font-weight:800; letter-spacing:-1px; margin:3px 0 12px; }
.dash-balance .balance-meta { display:flex; gap:8px; flex-wrap:wrap; }
.dash-chip { background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.10);
  padding:7px 10px; border-radius:999px; font-size:11px; color:rgba(255,255,255,.86); }
.dash-balance:after { content:""; position:absolute; width:150px; height:150px; border-radius:50%;
  right:-70px; top:-70px; background:rgba(0,200,150,.13); }
.dash-quick { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.dash-quick .dash-action {
  border:1px solid var(--border); background:#fff; border-radius:17px; padding:12px 7px;
  text-align:center; cursor:pointer; transition:.15s; box-shadow:0 3px 12px rgba(11,18,32,.035);
}
.dash-quick .dash-action:active { transform:scale(.97); }
.dash-action .emoji { font-size:20px; display:block; margin-bottom:4px; }
.dash-action span:last-child { font-size:11px; font-weight:700; color:var(--text); }
.dash-stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.dash-stat {
  background:#fff; border:1px solid var(--border); border-radius:20px; padding:15px;
  cursor:pointer; box-shadow:0 4px 15px rgba(11,18,32,.035); transition:.15s;
}
.dash-stat:active { transform:scale(.985); }
.dash-stat .top { display:flex; justify-content:space-between; gap:8px; color:var(--muted); font-size:11px; }
.dash-stat .amount { font-size:23px; font-weight:800; margin-top:5px; letter-spacing:-.4px; }
.dash-stat .sub { font-size:10px; color:var(--muted); margin-top:2px; }
.dash-progress { height:6px; background:#eef1f5; border-radius:999px; margin-top:10px; overflow:hidden; }
.dash-progress > div { height:100%; border-radius:999px; }
.dash-section { background:#fff; border:1px solid var(--border); border-radius:20px; padding:15px; }
.dash-section-title { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
.dash-section-title h3 { margin:0; font-size:14px; }
.dash-link { color:var(--mint-dark); font-size:11px; font-weight:800; cursor:pointer; }
.dash-insight {
  background:linear-gradient(135deg,#f1fffb,#fff); border:1px solid #d7f5ec;
  border-radius:20px; padding:15px;
}
.dash-insight-title { font-weight:800; font-size:14px; margin-bottom:7px; }
.dash-insight p { margin:0; color:#526078; font-size:12px; line-height:1.65; }
.dash-insight button { margin-top:11px; }
.dash-account-list { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.dash-account {
  border:1px solid var(--border); border-radius:17px; padding:12px; cursor:pointer; background:#fff;
}
.dash-account .name { font-size:11px; color:var(--muted); }
.dash-account .bal { font-size:18px; font-weight:800; margin-top:3px; }
.dash-account .share { font-size:9px; color:var(--mint-dark); margin-top:2px; }
.dash-click-hint { font-size:10px; color:var(--muted); text-align:center; margin-top:8px; }

/* ---------- "ต้องจัดการ" attention card ---------- */
.attn-card{border:1px solid rgba(242,84,91,.22);background:linear-gradient(180deg,rgba(242,84,91,.05),#fff 45%);}
.attn-list{display:flex;flex-direction:column;}
.attn-item{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--card-line);cursor:pointer;}
.attn-item:last-child{border-bottom:none;}
.attn-item:active{background:var(--bg);}
.attn-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center;}
.attn-text{flex:1;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}

/* ---------- Spending-by-category drill-down rows ---------- */
.spend-list{display:flex;flex-direction:column;margin-top:6px;}

/* ---------- Skeleton loading (first-load placeholders, no cache yet) ---------- */
.skel{position:relative;overflow:hidden;background:var(--bg);border-radius:var(--radius-sm);}
.skel::after{
  content:'';position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent);
  animation:skel-shimmer 1.3s infinite;
}
@keyframes skel-shimmer{100%{transform:translateX(100%);}}
.skel-line{border-radius:6px;}
.skel-block{border-radius:var(--radius);}
.skel-row{height:56px;border-radius:var(--radius-sm);margin-bottom:8px;}

/* ---------- Month-over-month comparison ---------- */
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.cmp-box{background:var(--bg);border-radius:var(--radius-sm);padding:12px;text-align:center;}
.cmp-label{font-size:11px;color:var(--muted);margin-bottom:4px;}
.cmp-amount{font-size:18px;font-weight:800;font-family:var(--display);}
.cmp-delta{text-align:center;font-size:13px;font-weight:700;padding:9px;border-radius:var(--radius-sm);background:var(--bg);}
.cmp-delta.up{color:var(--expense);}
.cmp-delta.down{color:var(--income);}

@media (max-width:420px){
  .dash-quick { gap:6px; }
  .dash-stat-grid { gap:8px; }
  .dash-balance .big { font-size:30px; }
}

</script>

<div id="toastStack"></div>

<div id="successOverlay">
  <div class="box">

      <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4 10-10" stroke="#04231A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>

<div id="loginScreen">
  <div class="matrix-container" aria-hidden="true">

      <div class="matrix-column"></div><div class="matrix-column"></div><div class="matrix-column"></div><div class="matrix-column"></div><div class="matrix-column"></div>
      <div class="matrix-column"></div><div class="matrix-column"></div><div class="matrix-column"></div><div class="matrix-column"></div><div class="matrix-column"></div>
      <div class="matrix-column"></div><div class="matrix-column"></div><div class="matrix-column"></div><div class="matrix-column"></div><div class="matrix-column"></div>
      <div class="matrix-column"></div><div class="matrix-column"></div><div class="matrix-column"></div><div class="matrix-column"></div><div class="matrix-column"></div>
      <div class="matrix-column"></div><div class="matrix-column"></div><div class="matrix-column"></div><div class="matrix-column"></div><div class="matrix-column"></div>
      <div class="matrix-column"></div><div class="matrix-column"></div><div class="matrix-column"></div><div class="matrix-column"></div><div class="matrix-column"></div>

<script>
/* ============================================================
 * TOAST + CONFIRM MODAL (replace alert()/confirm())
 * ============================================================
 * toast(message, type) — type is 'success' | 'error' | 'warn' | 'info' (default).
 * customConfirm(message) — returns a Promise<boolean>, resolves true on "ยืนยัน".
 * Every alert()/confirm() call in this file below has been replaced with these,
 * because native browser dialogs are unreliable inside LINE's in-app WebView
 * (they can silently no-op, making buttons that gate on confirm() look broken).
 */
const TOAST_ICONS = { success: '✅', error: '⚠️', warn: '⚠️', info: 'ℹ️' };

function toast(message, type) {
  type = type || 'info';
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<span class="toast-icon">${TOAST_ICONS[type] || TOAST_ICONS.info}</span><span class="toast-msg"></span>`;
  el.querySelector('.toast-msg').textContent = message; // textContent, not innerHTML — avoid HTML injection from error messages
  stack.appendChild(el);

  const remove = () => {
    if (!el.parentNode) return;
    el.classList.add('leaving');
    setTimeout(() => el.remove(), 200);
  };
  el.addEventListener('click', remove);
  setTimeout(remove, type === 'error' ? 6000 : 4000);
}

/* successPopup(message, onDone) — brief animated confirmation overlay.
 * Shows a checkmark + message, then fades/scales away on its own after
 * a moment and calls onDone(). Used for moments like a successful login
 * where a quiet, deliberate confirmation reads better than a stacked toast. */
function successPopup(message, onDone) {
  const overlay = document.getElementById('successOverlay');
  const msgEl = document.getElementById('successMsg');
  const path = overlay.querySelector('path');
  msgEl.textContent = message;
  overlay.classList.remove('leaving');
  overlay.classList.add('show');
  // restart the checkmark draw animation each time it's shown
  path.style.animation = 'none';
  void path.offsetWidth;
  path.style.animation = '';

  setTimeout(() => {
    overlay.classList.add('leaving');
    setTimeout(() => {
      overlay.classList.remove('show', 'leaving');
      if (onDone) onDone();
    }, 350);
  }, 950);
}

function customConfirm(message) {
  return new Promise(resolve => {
    const overlay = document.getElementById('confirmOverlay');
    const msgEl = document.getElementById('confirmMsg');
    const okBtn = document.getElementById('confirmOkBtn');
    const cancelBtn = document.getElementById('confirmCancelBtn');
    msgEl.textContent = message;
    overlay.classList.add('open');

    function cleanup(result) {
      overlay.classList.remove('open');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      overlay.removeEventListener('click', onOverlay);
      resolve(result);
    }
    function onOk() { cleanup(true); }
    function onCancel() { cleanup(false); }
    function onOverlay(e) { if (e.target === overlay) cleanup(false); }

    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
    overlay.addEventListener('click', onOverlay);
  });
}

function pickAccount() {
  return new Promise(async resolve => {
    if (!STATE.accounts || STATE.accounts.length === 0) {
      try { const r = await apiGet('accounts'); STATE.accounts = r.data || []; } catch (e) { /* fall through with empty list */ }
    }
    const overlay = document.getElementById('accountPickOverlay');
    const select = document.getElementById('accountPickSelect');
    const okBtn = document.getElementById('accountPickOkBtn');
    const cancelBtn = document.getElementById('accountPickCancelBtn');
    select.innerHTML = (STATE.accounts || []).map(a => `<option value="${a.AccountID}">${accountIcon(a.AccountType)} ${escapeHtml(a.AccountName)}</option>`).join('');
    overlay.classList.add('open');

    function cleanup(result) {
      overlay.classList.remove('open');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      overlay.removeEventListener('click', onOverlay);
      resolve(result);
    }
    function onOk() { cleanup(select.value || null); }
    function onCancel() { cleanup(null); }
    function onOverlay(e) { if (e.target === overlay) cleanup(null); }

    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
    overlay.addEventListener('click', onOverlay);
  });
}

/* ============================================================
 * GLOBAL ERROR SAFETY NET
 * If anything throws anywhere in the app, show it as a toast instead of
 * failing silently (this is what was happening with the login button).
 * ============================================================ */
window.addEventListener('error', function(e) {
  toast('เกิดข้อผิดพลาด (JS Error): ' + (e.message || e), 'error');
});
window.addEventListener('unhandledrejection', function(e) {
  toast('เกิดข้อผิดพลาด (Promise): ' + (e.reason && e.reason.message ? e.reason.message : e.reason), 'error');
});

/* ============================================================
 * STATE
 * ============================================================ */
let STATE = {
  token: localStorage_safe_get('mma_token'),
  userId: localStorage_safe_get('mma_userId'),
  displayName: localStorage_safe_get('mma_displayName'),
  categories: [],
  accounts: [],
  charts: {}
};

// NOTE: browser storage (localStorage) IS available on GitHub Pages (this is a static
// site, not a Claude.ai artifact) — but we still guard every call in case it's blocked
// (e.g. private browsing) so the app degrades to session-only auth instead of crashing.
function localStorage_safe_get(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
function localStorage_safe_set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function localStorage_safe_remove(k){ try{ localStorage.removeItem(k); }catch(e){} }

/* ============================================================
 * API HELPERS
 * ============================================================ */
async function apiGet(action, params) {
  params = params || {};
  params.action = action;
  if (STATE.token) params.token = STATE.token;
  const qs = Object.keys(params).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&');
  const res = await fetch(APP_CONFIG.API_URL + '?' + qs);
  return res.json();
}

async function apiPost(action, body) {
  body = body || {};
  body.action = action;
  if (STATE.token) body.token = STATE.token;
  const res = await fetch(APP_CONFIG.API_URL, {
    method: 'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(body)
  });
  return res.json();
}

/* ============================================================
 * AUTH
 * ============================================================ */
async function doLogin() {
  const pin = document.getElementById('loginPin').value.trim();
  const errEl = document.getElementById('loginError');
  const btnEl = document.getElementById('loginSubmitBtn');
  const loaderWrap = document.getElementById('loginLoaderWrap');
  errEl.style.display = 'none';
  if (!pin) {
    errEl.textContent = 'กรุณากรอกรหัส PIN';
    errEl.style.display = 'block';
    toast('กรุณากรอกรหัส PIN', 'warn');
    return;
  }
  btnEl.style.display = 'none';
  loaderWrap.innerHTML = loadingHtml('กำลังเข้าสู่ระบบ', true);
  loaderWrap.style.display = 'flex';
  try {
    const resp = await apiGet('login', { pin: pin });
    if (!resp.success) {
      errEl.textContent = resp.error || 'เข้าสู่ระบบไม่สำเร็จ';
      errEl.style.display = 'block';
      toast(resp.error || 'เข้าสู่ระบบไม่สำเร็จ', 'error');
      return;
    }
    STATE.token = resp.data.token; STATE.userId = resp.data.userId; STATE.displayName = resp.data.displayName;
    localStorage_safe_set('mma_token', STATE.token);
    localStorage_safe_set('mma_userId', STATE.userId);
    localStorage_safe_set('mma_displayName', STATE.displayName);
    successPopup('เข้าสู่ระบบสำเร็จ', showApp);
  } catch (e) {
    errEl.textContent = 'ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่อีกครั้ง';
    errEl.style.display = 'block';
    toast('เข้าสู่ระบบไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  } finally {
    loaderWrap.style.display = 'none';
    btnEl.style.display = 'block';
  }
}

async function doLogout() {
  try { await apiGet('logout', { token: STATE.token }); } catch(e) {}
  STATE = { token:'', userId:'', displayName:'', categories:[], accounts:[], charts:{} };
  localStorage_safe_remove('mma_token'); localStorage_safe_remove('mma_userId'); localStorage_safe_remove('mma_displayName');
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  toast('ออกจากระบบแล้ว', 'success');
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('userNameLabel').textContent = STATE.displayName || STATE.userId;
  initTabs();
  loadCategories();
  switchTab('dashboard');
}

/* ============================================================
 * TABS
 * ============================================================ */
function initTabs() {
  document.querySelectorAll('#tabs button').forEach(btn => {
    btn.onclick = () => switchTab(btn.dataset.tab);
  });
}
function switchTab(name) {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
  document.getElementById('tab-' + name).style.display = 'block';
  if (name === 'dashboard') renderDashboard();
  if (name === 'transactions') renderTransactions();
  if (name === 'accounts') renderAccounts();
  if (name === 'budget') renderBudget();
  if (name === 'ai') renderAI();
  if (name === 'settings') renderSettings();
}

async function loadCategories() {
  try {
    const resp = await apiGet('categories');
    if (resp.success) STATE.categories = resp.data;
    else toast(resp.error || 'โหลดหมวดหมู่ไม่สำเร็จ', 'error');
  } catch (e) {
    toast('โหลดหมวดหมู่ไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  }
}

/* ============================================================
 * DASHBOARD
 * ============================================================ */
/* ============================================================
 * DASHBOARD — one consolidated `dashboard-full` call (see apiDashboardFull_
 * in the .gs backend) instead of the 6 separate requests this used to make.
 *
 * Frontend cache (stale-while-revalidate): the last successful payload is
 * kept in DASH_CACHE. Re-opening the tab renders instantly from that cache
 * with no loading state at all, then quietly refetches in the background and
 * re-renders when the fresh data arrives — the person sees last-known numbers
 * immediately instead of a spinner every time they tap "ภาพรวม".
 * ============================================================ */
let DASH_CACHE = null;

async function renderDashboard() {
  const el = document.getElementById('tab-dashboard');
  if (DASH_CACHE) {
    renderDashboardFromData(DASH_CACHE);
  } else {
    el.innerHTML = dashboardSkeleton();
  }
  try {
    const resp = await apiGet('dashboard-full');
    if (!resp.success) throw new Error(resp.error);
    DASH_CACHE = resp.data;
    renderDashboardFromData(resp.data);
  } catch (e) {
    if (!DASH_CACHE) {
      el.innerHTML = errorBlock();
      toast('โหลดภาพรวมไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
    }
    // Otherwise: stale cached data is already on screen — leave it up rather
    // than replacing a working view with an error banner over a background
    // refresh hiccup (e.g. a flaky connection). The next tab visit retries.
  }
}

function renderDashboardFromData(data) {

  el.innerHTML = `

      <div class="dash-quick">
        <div class="dash-action" onclick="switchTab('transactions')">
          <span class="emoji">📋</span><span>รายการ</span>
        </div>
        <div class="dash-action" onclick="switchTab('accounts')">
          <span class="emoji">🏦</span><span>บัญชี</span>
        </div>
        <div class="dash-action" onclick="switchTab('budget')">
          <span class="emoji">🎯</span><span>งบประมาณ</span>
        </div>
        <div class="dash-action" onclick="switchTab('ai')">
          <span class="emoji">🤖</span><span>ถาม AI</span>
        </div>
      </div>

      ${renderNeedsAttentionCard(attentionItems)}

      <div class="dash-stat-grid">
        <div class="dash-stat" onclick="goDashboardFilter('income')">
          <div class="top"><span>💰 รายรับเดือนนี้</span><span>›</span></div>
          <div class="amount" style="color:var(--mint-dark);">฿${fmt(income)}</div>

          <div class="dash-progress"><div style="width:${incomeShare}%;background:var(--mint);"></div></div>
        </div>
        <div class="dash-stat" onclick="goDashboardFilter('expense')">
          <div class="top"><span>💸 รายจ่ายเดือนนี้</span><span>›</span></div>
          <div class="amount" style="color:#F2545B;">฿${fmt(expense)}</div>
          <div class="sub">แตะเพื่อดูรายการรายจ่าย</div>
          <div class="dash-progress"><div style="width:${expenseShare}%;background:#F2545B;"></div></div>
        </div>
      </div>

      ${renderMonthComparisonCard(cmp)}

      <div class="dash-section">
        <div class="dash-section-title">
          <h3>🔥 หมวดที่ใช้เงินมากที่สุด</h3>

        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
          <div>
            <div style="font-size:21px;font-weight:800;">${escapeHtml(topExpenseName)}</div>

/* ============================================================
 * MONTH RANGES + BULK TRANSACTION FETCH
 * (shared by the budget detail view, month comparison, and the
 * "needs attention" card — none of these have a dedicated backend
 * endpoint, so they're computed here from the existing transactions
 * API by pulling a date range and aggregating client-side.)
 * ============================================================ */
function monthRange(offset) {
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() + offset);
  const ym = d.toISOString().slice(0, 7);
  const from = ym + '-01';
  const endD = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  const to = endD.toISOString().slice(0, 10);
  const label = d.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
  return { ym, from, to, label };
}

/** Pages through the transactions endpoint until it has everything matching params (capped for safety). */
async function fetchAllTransactions(params, maxPages) {
  maxPages = maxPages || 20;
  const pageSize = 200;
  let page = 1, all = [], total = Infinity;
  while (all.length < total && page <= maxPages) {
    const resp = await apiGet('transactions', Object.assign({}, params, { page: page, pageSize: pageSize }));
    if (!resp.success) throw new Error(resp.error || 'โหลดรายการไม่สำเร็จ');
    const items = (resp.data && resp.data.items) || [];
    all = all.concat(items);
    total = Number((resp.data && resp.data.total) || all.length);
    if (items.length === 0) break;
    page++;
  }
  return all;
}

/* ============================================================
 * BUDGET ALERT STATUS
 * 🟢 <70% ปกติ · 🟡 70–89% ใกล้เต็ม · 🔴 90–99% ต้องระวัง · ⛔ 100%+ เกินงบ
 * ============================================================ */
function budgetStatusMeta(pct) {
  pct = Number(pct) || 0;
  if (pct >= 100) return { emoji: '⛔', label: 'เกินงบ', cls: 'over' };
  if (pct >= 90) return { emoji: '🔴', label: 'ต้องระวัง', cls: 'critical' };
  if (pct >= 70) return { emoji: '🟡', label: 'ใกล้เต็ม', cls: 'warning' };
  return { emoji: '🟢', label: 'ปกติ', cls: 'normal' };
}
function budgetIconClass(cls) {
  return cls === 'over' || cls === 'critical' ? 'expense' : (cls === 'warning' ? 'warn' : 'income');
}

/* ============================================================
 * MONTH-OVER-MONTH COMPARISON — pure transform, no network call.
 * Fed from `data.comparison` in the single `dashboard-full` response.
 * ============================================================ */
function monthComparisonToView(comparisonData) {
  const cur = comparisonData.current || {}, prev = comparisonData.previous || {};
  const curByCat = cur.byCategory || {}, prevByCat = prev.byCategory || {};
  const cats = Array.from(new Set([...Object.keys(curByCat), ...Object.keys(prevByCat)]));
  const deltas = cats.map(c => {
    const c1 = Number(curByCat[c] || 0), c0 = Number(prevByCat[c] || 0);
    return { category: c, cur: c1, prev: c0, delta: c1 - c0 };
  }).sort((a, b) => b.delta - a.delta);
  return { curTotal: Number(cur.total || 0), prevTotal: Number(prev.total || 0), deltas: deltas, curLabel: cur.label || '', prevLabel: prev.label || '' };
}

function renderMonthComparisonCard(cmp) {
  const delta = cmp.curTotal - cmp.prevTotal;
  const pct = cmp.prevTotal > 0 ? Math.round(Math.abs(delta) / cmp.prevTotal * 100) : (cmp.curTotal > 0 ? 100 : 0);
  const up = delta > 0;
  const movers = cmp.deltas.filter(d => Math.abs(d.delta) > 0).slice(0, 3);
  return `
    <div class="dash-section">
      <div class="dash-section-title"><h3>📅 เปรียบเทียบเดือน</h3></div>
      <div class="cmp-grid">
        <div class="cmp-box">
          <div class="cmp-label">${escapeHtml(cmp.curLabel)}</div>
          <div class="cmp-amount">฿${fmt(cmp.curTotal)}</div>
        </div>
        <div class="cmp-box">
          <div class="cmp-label">${escapeHtml(cmp.prevLabel)}</div>
          <div class="cmp-amount" style="color:var(--muted);">฿${fmt(cmp.prevTotal)}</div>
        </div>
      </div>
      ${delta === 0 ? '' : `
      <div class="cmp-delta ${up ? 'up' : 'down'}">
        ${up ? '🔴 เพิ่มขึ้น' : '🟢 ลดลง'} ${pct}% (฿${fmt(Math.abs(delta))})
      </div>`}
      ${movers.length ? `
        <div class="dash-click-hint" style="margin:10px 0 2px;">หมวดที่เปลี่ยนแปลงมากที่สุด — แตะเพื่อดูรายการเดือนนี้</div>
        <div class="spend-list">
          ${movers.map(m => `
            <div class="attn-item" onclick="goDashboardFilter('expense','${escapeJs(m.category)}')">
              <span class="attn-icon">${m.delta > 0 ? '📈' : '📉'}</span>
              <span class="attn-text">${escapeHtml(m.category)}</span>
              <span style="font-weight:700;white-space:nowrap;color:${m.delta > 0 ? '#F2545B' : 'var(--income)'};">${m.delta > 0 ? '+' : ''}฿${fmt(m.delta)}</span>
            </div>`).join('')}
        </div>` : ''}
    </div>`;
}

let LAST_DUPLICATE_GROUPS = [];

function attentionItemToUi(it) {
  let onClick = "switchTab('dashboard')";
  if (it.type === 'budget') onClick = "switchTab('budget')";
  else if (it.type === 'pending') onClick = "goDashboardFilter('','',{status:'pending'})";
  else if (it.type === 'lowBalance') onClick = "switchTab('accounts')";
  else if (it.type === 'highSpendToday') onClick = `goDashboardFilter('expense','',{dateFrom:'${escapeJs(it.date||'')}',dateTo:'${escapeJs(it.date||'')}'})`;
  else if (it.type === 'duplicate') {
    // Stash the actual groups (not JSON-embeddable in an inline onclick string)
    // so the click opens a view of exactly these transactions, instead of
    // dumping the person into the full, unfiltered transaction history.
    LAST_DUPLICATE_GROUPS = it.groups || [];
    onClick = "openDuplicatesUI()";

  return { icon: it.icon || 'ℹ️', text: escapeHtml(it.text || ''), onClick: onClick };
}

  extra = extra || {};

    dateFrom: extra.dateFrom || '',

    const s = document.getElementById('fSearch');

    const st = document.getElementById('fStatus');

function drawPieChartInteractive(canvasId, dataObj, type) {
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  const labels = Object.keys(dataObj || {});
  if (labels.length === 0) {
    ctx.parentElement.innerHTML = '<div class="empty" style="padding:20px;">ยังไม่มีข้อมูล</div>';
    return;
  }
  const values = labels.map(l => Number(dataObj[l]) || 0);
  const palette = ['#00C896','#0B1220','#F2545B','#F2A93B','#4C6EF5','#22304F','#B0587E','#3E7C8C'];
  STATE.charts[canvasId] = new Chart(ctx, {
    type: 'doughnut',
    data: { labels: labels, datasets: [{ data: values, backgroundColor: palette }] },
    options: {
      responsive:true,
      maintainAspectRatio:false,
      plugins:{ legend:{position:'bottom', labels:{boxWidth:10,font:{size:10}}} },
      onClick: function(evt, elements) {
        if (!elements || !elements.length) return;
        const idx = elements[0].index;
        const label = labels[idx];
        goDashboardFilter(type || '', label);
      }
    }
  });
}

async function submitEditTx(txId) {
  const category = document.getElementById('editTxCategory').value;
  const description = document.getElementById('editTxDescription').value.trim();
  const btn = document.getElementById('editTxSaveBtn');
  const prevLabel = btn ? btn.textContent : '';
  if (btn) { btn.textContent = 'กำลังบันทึก...'; btn.disabled = true; }
  try {
    const resp = await apiPost('edit-transaction', { id: txId, changes: { Category: category, Description: description } });
    if (!resp.success) throw new Error(resp.error);
    toast('บันทึกการแก้ไขแล้ว', 'success');
    DASH_CACHE = null; // category/description feed dashboard breakdowns
    TX_CACHE = {}; // cached list HTML would still show the old category/description
    closeEditTxUI();
    // Patch the row in place instead of re-skeletoning the whole list — only
    // category/description changed, so nothing else on screen needs to move.
    const rowEl = txRowEl(txId);
    if (rowEl) {
      const cat = STATE.categories.find(c => c.CategoryName === category);
      const catEl = rowEl.querySelector('.tx-cat');
      const descEl = rowEl.querySelector('.tx-desc');
      if (catEl) catEl.textContent = category;
      if (descEl) descEl.textContent = description || typeLabel((TX_STATE.itemsById[txId] || {}).Type);
      if (TX_STATE.itemsById[txId]) {
        TX_STATE.itemsById[txId].Category = category;
        TX_STATE.itemsById[txId].Description = description;
      }
    } else {
      loadTransactions();
    }
  } catch (e) {
    toast('แก้ไขไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
    if (btn) { btn.textContent = prevLabel; btn.disabled = false; }
  }
}

 * ============================================================ */
let TX_STATE = { page: 1, pageSize: 15, filters: {} };
/** Rendered-list cache keyed by the exact query (filters+page), so returning
 *  to a filter/page you've already seen shows it instantly while a fresh
 *  fetch runs quietly behind it (stale-while-revalidate, same idea as
 *  DASH_CACHE). Cleared whenever a transaction is confirmed/cancelled/edited,
 *  since a cached list could otherwise show a stale status badge. */
let TX_CACHE = {};
function txCacheKey(params) {
  return JSON.stringify({ search: params.search||'', type: params.type||'', status: params.status||'', dateFrom: params.dateFrom||'', dateTo: params.dateTo||'', page: params.page });
}

async function renderTransactions() {

      </div>

function toggleAdvancedFilters() {

function applyTxFilters() {

async function loadTransactions() {
  const wrap = document.getElementById('txTableWrap');
  const params = Object.assign({}, TX_STATE.filters, { page: TX_STATE.page, pageSize: TX_STATE.pageSize });
  const key = txCacheKey(params);
  if (TX_CACHE[key]) {
    // Seen this exact filter+page before — show it immediately, no skeleton,
    // while the fetch below quietly confirms/refreshes it.
    wrap.innerHTML = TX_CACHE[key];
  } else {
    // Skeleton rows instead of wiping the whole panel with a spinner — every
    // filter change and page click used to trigger a full-panel loading state;
    // this only replaces the rows themselves, so the filter/search bar above
    // stays interactive and nothing else on the tab flickers.
    wrap.innerHTML = txRowsSkeleton(TX_STATE.pageSize > 6 ? 6 : TX_STATE.pageSize);
  }
  try {
    const resp = await apiGet('transactions', params);
    if (!resp.success) throw new Error(resp.error);
    const items = resp.data.items;
    TX_STATE.itemsById = {};
    items.forEach(t => { TX_STATE.itemsById[t.ID] = t; });
    if (items.length === 0) { TX_CACHE[key] = emptyState(); wrap.innerHTML = TX_CACHE[key]; return; }
    let rows = renderTxRows(items);
    const totalPages = Math.max(1, Math.ceil(resp.data.total / resp.data.pageSize));
    const html = `
      <div>${rows}</div>
      <div class="pagination">
        <button class="secondary" onclick="txPrevPage()" ${TX_STATE.page<=1?'disabled':''}>← ก่อนหน้า</button>
        <span style="align-self:center;font-size:13px;color:var(--muted);">หน้า ${TX_STATE.page} / ${totalPages}</span>
        <button class="secondary" onclick="txNextPage()" ${TX_STATE.page>=totalPages?'disabled':''}>ถัดไป →</button>
      </div>
    `;
    TX_CACHE[key] = html;
    wrap.innerHTML = html;
  } catch (e) {
    if (!TX_CACHE[key]) {
      wrap.innerHTML = errorBlock();
      toast('โหลดรายการไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
    }
    // Otherwise: stale cached rows are already on screen — leave them rather
    // than replacing a working list with an error banner over one failed refresh.
  }
}
function txPrevPage(){ if(TX_STATE.page>1){TX_STATE.page--; loadTransactions();} }
function txNextPage(){ TX_STATE.page++; loadTransactions(); }

/** Skeleton rows mirroring a real tx-row's shape, shown while a list (re)loads. */
function txRowsSkeleton(n) {
  let out = '';
  for (let i = 0; i < n; i++) {
    out += `
      <div class="tx-row" style="pointer-events:none;">
        <div class="skel skel-block" style="width:38px;height:38px;border-radius:12px;flex-shrink:0;"></div>
        <div class="tx-mid" style="gap:6px;display:flex;flex-direction:column;">
          <div class="skel skel-line" style="width:${100 + (i % 3) * 30}px;height:13px;"></div>
          <div class="skel skel-line" style="width:70px;height:11px;"></div>
        </div>
        <div class="tx-right" style="gap:6px;display:flex;flex-direction:column;align-items:flex-end;">
          <div class="skel skel-line" style="width:60px;height:13px;"></div>
          <div class="skel skel-line" style="width:80px;height:11px;"></div>
        </div>
      </div>`;
  }
  return out;
}

/** Finds a rendered row by transaction ID for in-place (optimistic) updates. */
function txRowEl(id) {
  const safe = (window.CSS && CSS.escape) ? CSS.escape(id) : id;
  return document.querySelector(`.tx-row[data-tx-id="${safe}"]`);
}

/** Fades a row out and removes it — used when an action makes a row no longer
 *  match the active filter (e.g. confirming a transaction while filtered to
 *  "รอยืนยัน"), so the list updates in place instead of a full reload. */
function removeTxRowFromView(id) {
  const rowEl = txRowEl(id);
  if (!rowEl) return;
  rowEl.style.transition = 'opacity .18s ease, max-height .18s ease .1s';
  rowEl.style.maxHeight = rowEl.offsetHeight + 'px';
  rowEl.style.overflow = 'hidden';
  requestAnimationFrame(() => { rowEl.style.opacity = '0'; rowEl.style.maxHeight = '0px'; });
  setTimeout(() => {
    rowEl.remove();
    const wrap = document.getElementById('txTableWrap');
    if (wrap && !wrap.querySelector('.tx-row')) wrap.innerHTML = emptyState();
  }, 300);
}

async function confirmTx(id) {
  const rowEl = txRowEl(id);
  // The confirm button now lives in the detail popup (openTxDetail), not on the
  // list row itself — grab it there if that's where this was triggered from.
  const btn = document.getElementById('txDetailConfirmBtn');
  if (btn) { btn.textContent = 'กำลังยืนยัน...'; btn.disabled = true; }
  try {
    let resp = await apiPost('confirm-transaction', { id: id });
    if (!resp.success && resp.error === 'กรุณาเลือกบัญชีก่อนยืนยันรายการนี้') {
      // The AI never matched a real account for this one — ask the person which
      // account it actually came out of, instead of guessing.
      if (btn) { btn.textContent = 'ยืนยัน'; btn.disabled = false; }
      const accountId = await pickAccount();
      if (!accountId) return; // they cancelled the picker
      if (btn) { btn.textContent = 'กำลังยืนยัน...'; btn.disabled = true; }
      resp = await apiPost('confirm-transaction', { id: id, accountId: accountId });
    }
    if (!resp.success) throw new Error(resp.error || 'เกิดข้อผิดพลาด');
    toast('ยืนยันรายการเรียบร้อยแล้ว', 'success');
    DASH_CACHE = null; // balances changed — don't show the dashboard's stale cached numbers next visit
    TX_CACHE = {}; // this transaction's status/badge changed — drop cached list renders
    BUDGET_CACHE = {}; // confirming/cancelling changes a category's UsedAmount/%
    if (TX_STATE.itemsById && TX_STATE.itemsById[id]) {
      TX_STATE.itemsById[id].Status = 'confirmed';
      if (resp.data && resp.data.AccountID) TX_STATE.itemsById[id].AccountID = resp.data.AccountID;
    }
    closeTxDetail();
    if (TX_STATE.filters.status === 'pending') {
      removeTxRowFromView(id);
    } else if (rowEl) {
      const badge = rowEl.querySelector('.badge');
      if (badge) { badge.className = 'badge confirmed'; badge.textContent = statusLabel('confirmed'); }
    }
  } catch (e) {
    if (btn) { btn.textContent = 'ยืนยัน'; btn.disabled = false; }
    toast('ยืนยันรายการไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  }
}

/** Downscales + re-encodes the photo client-side before it goes over the wire —
 *  a raw phone-camera photo can be 5-10MB, which is slow to upload and slow for
 *  the backend's AI vision call; ~1280px/JPEG-0.82 is plenty for reading a slip. */
function compressImageToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('เปิดรูปไม่สำเร็จ'));
      img.onload = () => {
        const maxDim = 1280;
        let width = img.width, height = img.height;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
        resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handleSlipUpload(inputEl) {
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;
  const statusEl = document.getElementById('ctxSlipStatus');
  statusEl.textContent = 'กำลังอ่านสลิป...';
  try {
    const { base64, mimeType } = await compressImageToBase64(file);
    const resp = await apiPost('parse-slip', { image: base64, mimeType: mimeType });
    if (!resp.success) throw new Error(resp.error || 'อ่านสลิปไม่สำเร็จ');
    CREATE_TX_STATE.slipUrl = resp.data.slipUrl || '';
    CREATE_TX_STATE.slipFileId = resp.data.slipFileId || '';
    if (resp.data.parsed && resp.data.ai) {
      applySlipAiToForm(resp.data.ai);
      statusEl.textContent = '✓ อ่านสลิปสำเร็จ — กรุณาตรวจสอบข้อมูลก่อนบันทึก';
    } else {
      statusEl.textContent = '⚠️ แนบรูปแล้ว แต่อ่านข้อมูลอัตโนมัติไม่สำเร็จ กรุณากรอกเอง';
    }
  } catch (e) {
    statusEl.textContent = '';
    toast('อ่านสลิปไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  }
}

/** AI can only read what's on the slip — for a transfer it knows this side's
 *  account at best, never which of the user's other accounts received it, so
 *  only "จากบัญชี" gets a guess; "ไปบัญชี" is always left for the user to pick. */
function guessAccountId(accountHint) {
  if (!accountHint) return '';
  const accs = STATE.accounts || [];
  let m = accs.find(a => a.AccountName === accountHint);
  if (m) return m.AccountID;
  const typeMap = { 'เงินสด': 'cash', 'ธนาคาร': 'bank', 'บัตร': 'card', 'Wallet': 'wallet' };
  const t = typeMap[accountHint];
  if (t) { m = accs.find(a => a.AccountType === t); if (m) return m.AccountID; }
  return '';
}

function applySlipAiToForm(ai) {
  if (ai.type && ['expense', 'income', 'transfer'].indexOf(ai.type) !== -1) setCreateTxType(ai.type);
  if (ai.amount) document.getElementById('ctxAmount').value = ai.amount;
  if (ai.date) document.getElementById('ctxDate').value = ai.date;
  if (ai.time) document.getElementById('ctxTime').value = ai.time;
  if (ai.description || ai.merchant) document.getElementById('ctxDescription').value = ai.description || ai.merchant;
  const guess = guessAccountId(ai.account);
  if (CREATE_TX_STATE.type === 'transfer') {
    if (guess) document.getElementById('ctxFromAccount').value = guess;
  } else {
    if (ai.category) {
      const sel = document.getElementById('ctxCategory');
      if (Array.from(sel.options).some(o => o.value === ai.category)) sel.value = ai.category;
    }
    if (guess) document.getElementById('ctxAccount').value = guess;
  }
}

async function submitCreateTx() {
  const type = CREATE_TX_STATE.type;
  const amount = Number(document.getElementById('ctxAmount').value || 0);
  const date = document.getElementById('ctxDate').value;
  const time = document.getElementById('ctxTime').value;
  const description = document.getElementById('ctxDescription').value.trim();
  if (!amount || amount <= 0) { toast('กรุณาระบุจำนวนเงินให้ถูกต้อง', 'warn'); return; }

  const body = { type: type, amount: amount, date: date, time: time, description: description, slipUrl: CREATE_TX_STATE.slipUrl, slipFileId: CREATE_TX_STATE.slipFileId };
  if (type === 'transfer') {
    body.fromAccountId = document.getElementById('ctxFromAccount').value;
    body.toAccountId = document.getElementById('ctxToAccount').value;
    if (!body.fromAccountId || !body.toAccountId) { toast('กรุณาเลือกบัญชีต้นทางและปลายทาง', 'warn'); return; }
    if (body.fromAccountId === body.toAccountId) { toast('บัญชีต้นทางและปลายทางต้องไม่ใช่บัญชีเดียวกัน', 'warn'); return; }
  } else {
    body.category = document.getElementById('ctxCategory').value;
    body.accountId = document.getElementById('ctxAccount').value;
    if (!body.category) { toast('กรุณาเลือกหมวดหมู่', 'warn'); return; }
    if (!body.accountId) { toast('กรุณาเลือกบัญชี', 'warn'); return; }
  }

  const btn = document.getElementById('ctxSaveBtn');
  const prevLabel = btn.textContent;
  btn.textContent = 'กำลังบันทึก...'; btn.disabled = true;
  try {
    const resp = await apiPost('create-transaction', body);
    if (!resp.success) throw new Error(resp.error || 'บันทึกไม่สำเร็จ');
    toast('เพิ่มรายการเรียบร้อยแล้ว', 'success');
    DASH_CACHE = null; TX_CACHE = {}; BUDGET_CACHE = {};
    closeCreateTxUI();
    refreshVisibleTab();
  } catch (e) {
    toast('เพิ่มรายการไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
    btn.textContent = prevLabel; btn.disabled = false;
  }
}

/** Re-renders whichever tab panel is currently on screen — used after an
 *  action (like adding a transaction) that could affect several tabs' data,
 *  without refreshing tabs the person isn't even looking at. */
function refreshVisibleTab() {
  const visible = id => { const e = document.getElementById(id); return e && e.style.display !== 'none'; };
  if (visible('tab-dashboard')) renderDashboard();
  else if (visible('tab-transactions')) loadTransactions();
  else if (visible('tab-accounts')) renderAccounts();
  else if (visible('tab-budget')) renderBudget();
}

async function renderAccounts() {
  const el = document.getElementById('tab-accounts');
  el.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:14px;">
      <button class="secondary" style="align-self:flex-end;" onclick="openCreateAccountForm()">➕ เพิ่มบัญชีใหม่</button>

  const listWrap = document.getElementById('accountListWrap');
  try {
    const resp = await apiGet('accounts');

    STATE.accounts = resp.data;

      <div style="display:flex;flex-direction:column;gap:12px;">
        ${resp.data.map(a => {

            </div>

let BUDGET_STATE = { items: [], month: '' };
/** Same stale-while-revalidate idea as TX_CACHE/DASH_CACHE, keyed by month.
 *  Caches the items array alongside the HTML so openBudgetDetailByIndex's
 *  index lookups stay correct even while showing a cached render. */
let BUDGET_CACHE = {};

async function loadBudgets(month) {
  const wrap = document.getElementById('budgetList');
  const cached = BUDGET_CACHE[month];
  if (cached) {
    wrap.innerHTML = cached.html;
    BUDGET_STATE.items = cached.items;
    BUDGET_STATE.month = month;
  } else {
    wrap.innerHTML = budgetSkeleton();
  }
  try {
    const resp = await apiGet('budget', { month: month });
    if (!resp.success) throw new Error(resp.error);
    BUDGET_STATE.items = resp.data;
    BUDGET_STATE.month = month;
    if (resp.data.length === 0) {
      BUDGET_CACHE[month] = { html: emptyStateBudget(), items: [] };
      wrap.innerHTML = BUDGET_CACHE[month].html;
      return;
    }
    const html = resp.data.map((b, idx) => {
      const cat = STATE.categories.find(c => (c.CategoryID===b.CategoryID || c.CategoryName===b.CategoryID)) || {};
      const pct = Number(b.PercentageUsed || 0);
      const meta = budgetStatusMeta(pct);
      const remaining = Number(b.BudgetAmount||0) - Number(b.UsedAmount||0);
      return `
        <div class="uiv-card" style="margin-bottom:12px;cursor:pointer;" onclick="openBudgetDetailByIndex(${idx})">
          <div class="uiv-title">
            <span class="uiv-icon ${budgetIconClass(meta.cls)}"><span class="uiv-emoji">${meta.emoji}</span></span>
            <span class="uiv-title-text">${cat.Icon||''} ${cat.CategoryName||b.CategoryID}</span>
            <div class="uiv-right-group">
              <span class="uiv-percent ${pct>=70?'down':'up'}">${pct}%</span>
              <button class="icon-btn" style="width:26px;height:26px;font-size:13px;" onclick="event.stopPropagation();deleteBudgetUI('${b.BudgetID}')" title="ลบงบนี้" aria-label="ลบงบนี้">🗑️</button>
              <span class="uiv-chevron">›</span>
            </div>
          </div>
          <p class="uiv-value">฿${fmt(b.UsedAmount)} <span class="uiv-sub">/ ฿${fmt(b.BudgetAmount)} · เหลือ ฿${fmt(remaining)}</span></p>
          <div class="uiv-range"><div class="uiv-fill ${meta.cls}" style="width:${Math.min(100,pct)}%;"></div></div>
        </div>`;
    }).join('');
    BUDGET_CACHE[month] = { html: html, items: resp.data };
    wrap.innerHTML = html;
  } catch (e) {
    if (!cached) {
      wrap.innerHTML = errorBlock();
      toast('โหลดงบประมาณไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
    }
    // Otherwise: stale cached cards are already on screen — leave them up.
  }
}

        <div id="budgetTopList">${txRowsSkeleton(3)}</div>
      </div>

      <button class="danger" onclick="deleteBudgetUI('${b.BudgetID}')">🗑️ ลบงบนี้</button>
    </div>
  `;

  try {
    const cur = monthRange(0);
    const monthItems = await fetchAllTransactions({ type: 'expense', dateFrom: cur.from, dateTo: cur.to });
    const catItems = monthItems.filter(t => t.Category === catName || t.Category === b.CategoryID);
    const byDate = catItems.slice().sort((x, y) => new Date(y.TransactionDate) - new Date(x.TransactionDate));
    const byAmount = catItems.slice().sort((x, y) => Number(y.Amount||0) - Number(x.Amount||0));
    const latest = byDate[0];

    const countChip = document.getElementById('budgetTxCountChip');
    if (countChip) countChip.innerHTML = `📋 ${catItems.length} รายการเดือนนี้`;

    if (latest) {
      const latestWrap = document.getElementById('budgetLatestWrap');
      const latestList = document.getElementById('budgetLatestList');
      if (latestWrap) latestWrap.style.display = '';
      if (latestList) latestList.innerHTML = renderTxRows([latest], { compact: true });
    }

    const topList = document.getElementById('budgetTopList');
    if (topList) topList.innerHTML = byAmount.length ? renderTxRows(byAmount.slice(0, 10), { compact: true }) : emptyState();
  } catch (e) {
    const topList = document.getElementById('budgetTopList');
    if (topList) topList.innerHTML = errorBlock();
    toast('โหลดรายละเอียดงบไม่สำเร็จ: ' + (e && e.message ? e.message : e), 'error');
  }
}
